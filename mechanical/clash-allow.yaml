# Interference the design INTENDS. tools/cad.py's clash check reports every
# pair of solids that overlap; a pair listed here is reported as ALLOWED,
# with its reason, instead of as a CLASH. Globs (fnmatch) on solid ids; the
# order of a and b does not matter.
#
# The rule for adding one: the overlap must be physical and deliberate - one
# part going INTO another by design - and `why` must say so. "It is only a
# placeholder" is not a reason; fix the placeholder. A rule that stops
# matching anything is reported as UNUSED: delete it.
#
# `near:` (issue #34) does the same for a pair UNDER its class's minimum gap
# (config/clearance.yaml): reported as ACCEPTED NEAR-MISSES instead of failing
# `cad.py check`. Its `why` must say what answers the tolerances the minimum
# adds up - an assembly order, a part that is soft, a rule enforced elsewhere.
# "The envelope is tbd" is not a reason; decide the envelope.

allow:
  - a: "switch *"
    b: "key plate"
    why: "the KS-33 clips into the plate: its latch arms (14.70) grip the 14.00 cutout edges - Gateron sheet 3"
  - a: "main board stud *"
    b: "bottom plate"
    why: "the PEM FHL stud is pressed into the bottom plate from its underside: its head flush there, its clinch displacing the sheet round its shank (ADR 0025)"
  - a: "switch *"
    b: "bottom plate"
    why: "as the key plate - the thumb switches clip into the bottom plate"
  - a: "switch *"
    b: "board *"
    why: "the switch's pins and centre pole pass through holes in its cluster board; the holes are not modelled"
  - a: "U-bolt"
    b: "U-bolt nut *"
    why: "the nuts thread onto the legs"
  - a: "travel *"
    b: "cap *"
    why: "a cap's travel (the volume its shell sweeps pressing down) includes where that cap sits at rest; subtracting it leaves coincident faces no mesh check can intersect. Caps move straight down, so a travel meeting a NEIGHBOUR's cap would mean the two overlap in plan, which drc.echo's cap-to-cap gap rule holds"
  - a: "cap socket *"
    b: "cap *"
    why: "the socket boss is moulded into the cap's top: one part, drawn as two solids so the socket alone may meet the stem"
  - a: "cap socket *"
    b: "switch *"
    why: "the MX stem enters the cap's cross socket, modelled as its solid boss. ONLY the socket: the cap's shell and its travel must clear the switch (owner, 2026-09-28), so they have no rule"
  - a: "MIDI lead"
    b: "MIDI jack"
    why: "CBL-MIDI is soldered to the jack's tabs"
  - a: "MIDI lead"
    b: "J-MIDI"
    why: "CBL-MIDI's housing is the mated plug drawn as J-MIDI's top"
  - a: "MIDI jack"
    b: "oak bottom"
    why: "the jack's thread and nut pass the oak bottom's through-hole, and its collar sits in the counterbore"
  - a: "breath tube"
    b: "breath sensor"
    why: "the clear tube pushes onto the sensor's P1 barb"
  - a: "breath inlet insert"
    b: "mouth cap"
    why: "the insert's M8x1.25 thread is drawn at its major diameter in the cap's 6.9 mm tap-drill hole (config/body.yaml inlet): it cuts its thread into the oak and is bedded in epoxy"
  - a: "breath inlet barb"
    b: "breath inlet insert"
    why: "the outer barb's #10-32 thread screws into the insert, drawn at the thread's major diameter in the insert's bore"
  - a: "breath inner barb"
    b: "breath inlet insert"
    why: "the inner barb's #10-32 thread screws into the insert from inside"
  - a: "breath tube"
    b: "breath inner barb"
    why: "the clear breath tube pushes onto the inner barb"
  - a: "switch *"
    b: "parts *"
    why: "the switch pins and centre pole stand proud of the key board, by the pole's and pins' reach below the seat less switch.pcb_below_seat and boards.key_board_t, between its parts; a layer envelope cannot follow the placement"
  - a: "switch *"
    b: "main board"
    why: "the thumb switches solder into the main board (ADR 0017): pins and centre pole pass through its holes, which are not modelled"
  - a: "ribbon *"
    b: "IDC plug *"
    why: "each ribbon's end is crimped into its IDC plug (ADR 0017)"
  - a: "IDC plug *"
    b: "J-CHAIN *"
    why: "each plug sits in its header's shroud (ADR 0017)"
  - a: "IDC plug Matrix main board"
    b: "J-MCU"
    why: "the socket sits in its header's shroud"
  - a: "IDC plug Matrix carrier"
    b: "J-MCU-C"
    why: "the socket sits in its header's shroud"
  - a: "Matrix carrier screw *"
    b: "Matrix carrier*"
    why: "each mount's screw passes up through its washer, the carrier's hole and its spacer into its insert, and threads into the insert (config/body.yaml hardware.mx_*)"
  - a: "Matrix carrier screw *"
    b: "oak top"
    why: "the screw's tip runs inside its insert's hole in the oak, which the insert lines"

near:
  - a: "travel <same>"
    b: "switch <same>"
    why: "0.18-0.20 against cap-over-switch's 0.3 (issue #34): the 0.18 is the switch's STEM, drawn at rest, beside the socket's cut-out in the swept shell - the stem moves down with the cap, so it is no gap at all; the housing itself clears the swept shell by 0.20, against switch.keycap_wall (tbd, scaled off a photo). Accepted on the parts: the owner fitted a real MT165 on a real KS-33 and pressed it fully, 2026-10-02 (config/body.yaml switch.keycap_top_above_seat), and it did not bind. Calipers on a cap (M1, switch.keycap_wall decided_by) settle the number"
  - a: "breath inlet barb"
    b: "breath inner barb"
    why: "issue #36: the two Clippard 12842 barbs' #10-32 threads meet end to end inside the E-Z LOK insert's bore, and the gap between their ends is set by inlet.inner_gap so that the two threads do not touch (config/body.yaml inlet). It is a gap along one bore, not a clearance between parts that move or are placed independently, so default's 0.5 does not apply"
