# Flat parts as they go to the cutter (ADR 0009: "CAD produces DXF as the
# primary export"), plus the design-rule report.
exports:
  - {name: drc, src: mechanical/cad/woody_body.scad, out: mechanical/drc.echo, defines: {part: "drc"}}
  - {name: dxf-plate-top, src: mechanical/cad/woody_body.scad, out: mechanical/export/plate-top.dxf, defines: {part: "plate_top"}}
  - {name: dxf-oak-top, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-top.dxf, defines: {part: "oak_top"}}
  - {name: dxf-oak-bottom, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-bottom.dxf, defines: {part: "oak_bottom"}}
  - {name: dxf-tail-cap-jack, src: mechanical/cad/woody_body.scad, out: mechanical/export/tail-cap-jack.dxf, defines: {part: "tail_cap_jack"}}
  - {name: dxf-plate-bottom, src: mechanical/cad/woody_body.scad, out: mechanical/export/plate-bottom.dxf, defines: {part: "plate_bottom"}}
  - {name: dxf-side, src: mechanical/cad/woody_body.scad, out: mechanical/export/side.dxf, defines: {part: "side"}}
  - {name: dxf-oak-grooves, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-grooves.dxf, defines: {part: "oak_grooves"}}
  - {name: dxf-mouth-cap, src: mechanical/cad/woody_body.scad, out: mechanical/export/mouth-cap.dxf, defines: {part: "mouth_cap"}}
  - {name: dxf-tail-cap, src: mechanical/cad/woody_body.scad, out: mechanical/export/tail-cap.dxf, defines: {part: "tail_cap"}}
  - {name: dxf-matrix-window, src: mechanical/cad/woody_body.scad, out: mechanical/export/matrix-window.dxf, defines: {part: "matrix_window"}}
  - {name: dxf-oak-rebates, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-rebates.dxf, defines: {part: "oak_rebates"}}
  - {name: dxf-oak-pockets, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-pockets.dxf, defines: {part: "oak_pockets"}}
  - {name: dxf-oak-inserts, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-inserts.dxf, defines: {part: "oak_inserts"}}
  - {name: dxf-oak-relief, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-relief.dxf, defines: {part: "oak_relief"}}
  - {name: dxf-oak-logo, src: mechanical/cad/woody_body.scad, out: mechanical/export/oak-logo.dxf, defines: {part: "oak_logo"}}
  - {name: dxf-key-board-lh, src: mechanical/cad/woody_body.scad, out: mechanical/export/key-board-lh.dxf, defines: {part: "key_board_left_hand"}}
  - {name: dxf-main-board, src: mechanical/cad/woody_body.scad, out: mechanical/export/main-board.dxf, defines: {part: "main_board"}}
  - {name: dxf-key-board-rh, src: mechanical/cad/woody_body.scad, out: mechanical/export/key-board-rh.dxf, defines: {part: "key_board_right_hand"}}
  - {name: dxf-matrix-carrier, src: mechanical/cad/woody_body.scad, out: mechanical/export/matrix-carrier.dxf, defines: {part: "matrix_carrier"}}
  - {name: pcb-geometry, src: mechanical/cad/woody_body.scad, out: mechanical/export/pcb-geometry.echo, defines: {part: "pcb_geom"}}
# THE FABRICATION FILES (issue #42; mechanical/fab/README.md), one folder per
# material so each goes to one shop as it is: each oak part's own solid, from
# mechanical/cad/fab_parts.scad, in its part frame; the tail cap's router pass,
# which tail-cap.dxf (through-cuts only) does not carry; and the numbers every
# drawing prints, echoed from the model.
  - {name: fab-geometry, src: mechanical/cad/fab_parts.scad, out: mechanical/export/fab-geometry.echo, defines: {fab: "geom"}}
  - {name: fab-tail-cap-recess, src: mechanical/cad/fab_parts.scad, out: mechanical/export/tail-cap-recess.dxf, defines: {fab: "tail_cap_recess"}}
  - {name: fab-stl-oak-top, src: mechanical/cad/fab_parts.scad, out: mechanical/fab/oak/oak-top.stl, defines: {fab: "oak_top", only: "oak top"}}
  - {name: fab-stl-oak-bottom, src: mechanical/cad/fab_parts.scad, out: mechanical/fab/oak/oak-bottom.stl, defines: {fab: "oak_bottom", only: "oak bottom"}}
  - {name: fab-stl-mouth-cap, src: mechanical/cad/fab_parts.scad, out: mechanical/fab/oak/mouth-cap.stl, defines: {fab: "mouth_cap", only: "mouth cap"}}
  - {name: fab-stl-tail-cap, src: mechanical/cad/fab_parts.scad, out: mechanical/fab/oak/tail-cap.stl, defines: {fab: "tail_cap", only: "tail cap"}}

# The interference check: every named solid against every other, and its
# and clearance check (issue #34): `check` fails on an unexcused clash or a pair
# under its class's minimum gap (config/clearance.yaml).
clashes:
  - name: clash
    src: mechanical/cad/woody_body.scad
    out: mechanical/clash.txt
    allow: mechanical/clash-allow.yaml
    clearance: config/clearance.yaml
    clearance_set: body

# THE PHOTOGRAPHS (owner, 2026-10-01): tools/render-instrument.py, Blender
# Cycles on the CPU, as the module's are (mechanical/module/outputs.yaml). The
# shell and cassette are the body CAD's own solids, one STL per named solid;
# the main board and the key boards are their .kicad_pcb, exported with every
# part's 3D model and the copper, placed in the CAD's frame and checked
# against its outline. Slow - tens of minutes each - so they rebuild only when
# what they show moved. config/render.yaml holds the explode distances.
scripts:
  - name: photo-hero
    title: The instrument, assembled, three-quarter view
    cmd: [tools/render-instrument.py, --view, hero]
    inputs: &photo_inputs [config/render.yaml, mechanical/cad/woody_body.scad, mechanical/cad/generated/params.scad, mechanical/cad/vendor/ks33.stl,
                           hardware/boards/main-board/main-board.kicad_pcb, hardware/boards/main-board/layout.yaml,
                           hardware/boards/key-board-lh/key-board-lh.kicad_pcb, hardware/boards/key-board-lh/layout.yaml,
                           hardware/boards/key-board-rh/key-board-rh.kicad_pcb, hardware/boards/key-board-rh/layout.yaml,
                           datasheets/led/WS2815B-5050-3D.step, datasheets/mechanical/GATERON-KS-33-3D.step,
                           hardware/lib/woody.3dshapes/Hanxia_HX_PZ2.54-1x8P_WZ.step, hardware/lib/woody.3dshapes/NXP_Case1351-01_MPXV4006DP.step,
                           hardware/lib/woody.3dshapes/Samtec_SHF-106-01-L-D-RA.step, hardware/lib/woody.3dshapes/XKB_X1270WR-2x12A-9TV01.step,
                           mechanical/module/blender/studio_small_08_1k.hdr,
                           branding/export/scs-orbit-wave-mark.dxf, branding/export/spec.json, branding/build.py, tools/lib-models.py]
    out: mechanical/renders/photo-hero.png
    stamp: Woody body
    note: "Sides rendered clear (config/render.yaml side_glass) to show the inside; the instrument's sides are frosted (ADR 0009)."
    layout_sensitive: true
  - name: photo-logo
    title: The maker's mark on the oak top, between the mouth cap and the first key - etched and filled in branding/'s colour-fill scheme
    cmd: [tools/render-instrument.py, --view, logo]
    inputs: *photo_inputs
    out: mechanical/renders/photo-logo.png
    stamp: Woody body
    layout_sensitive: true
  - name: photo-open
    title: Oak top, key plate and the near side off - the cassette and its boards in the shell
    cmd: [tools/render-instrument.py, --view, open]
    inputs: *photo_inputs
    out: mechanical/renders/photo-open.png
    stamp: Woody body
    note: "Sides rendered clear (config/render.yaml side_glass) to show the inside; the instrument's sides are frosted (ADR 0009)."
    layout_sensitive: true
  - name: photo-exploded
    title: The whole instrument pulled apart along its stack - shell, cassette, boards, plates, keys, lid
    cmd: [tools/render-instrument.py, --view, exploded]
    inputs: *photo_inputs
    out: mechanical/renders/photo-exploded.png
    stamp: Woody body
    note: "Sides rendered clear (config/render.yaml side_glass) to show the inside; the instrument's sides are frosted (ADR 0009)."
    layout_sensitive: true
  - name: photo-cassette
    title: The cassette alone, pulled apart in its build order - bottom plate, spacers, main board, standoffs, key boards, spacers, key plate, screws
    cmd: [tools/render-instrument.py, --view, cassette]
    inputs: *photo_inputs
    out: mechanical/renders/photo-cassette.png
    stamp: Woody body
    layout_sensitive: true
  - name: photo-board-mouth
    title: The main board in the cassette at the mouth end - breath sensor, the LED row lit under the left key board, the U-bolt
    cmd: [tools/render-instrument.py, --view, board-mouth]
    inputs: *photo_inputs
    out: mechanical/renders/photo-board-mouth.png
    stamp: Woody body
    note: "Sides rendered clear (config/render.yaml side_glass) to show the inside; the instrument's sides are frosted (ADR 0009)."
    layout_sensitive: true
  - name: photo-board-tail
    title: The main board's tail end, key boards off - J-MCU, the regulator, J-UMB on the tongue, the etherCON on its adapter
    cmd: [tools/render-instrument.py, --view, board-tail]
    inputs: *photo_inputs
    out: mechanical/renders/photo-board-tail.png
    stamp: Woody body
    note: "Sides rendered clear (config/render.yaml side_glass) to show the inside; the instrument's sides are frosted (ADR 0009)."
    layout_sensitive: true
  - name: photo-underside
    title: From below, the oak bottom off - the bottom plate, its windows under the through-hole tails, the thumb keys
    cmd: [tools/render-instrument.py, --view, underside]
    inputs: *photo_inputs
    out: mechanical/renders/photo-underside.png
    stamp: Woody body
    note: "Sides rendered clear (config/render.yaml side_glass) to show the inside; the instrument's sides are frosted (ADR 0009)."
    layout_sensitive: true

# THE FABRICATION FILES, continued (issue #42): tools/fab.py makes each folder's
# cut files (the model's DXFs, headed with the part, material, thickness and
# quantity), each oak part's STEP from its STL (OpenCASCADE: sewn, made a
# solid, coplanar faces merged), the list of tbd and nominal config/body.yaml
# figures each part depends on (a walk of the model's source), and a one-page
# drawing per part, stamped with its fingerprint.
  - name: fab-open
    title: Every tbd and nominal config/body.yaml figure each part to be ordered depends on, and whether it blocks the order
    cmd: [tools/fab.py, open, --name, fab-open]
    inputs: [tools/cad.py, mechanical/outputs.yaml, mechanical/cad/woody_body.scad, mechanical/cad/fab_parts.scad, mechanical/cad/generated/params.scad, config/body.yaml]
    out: mechanical/fab/open-figures.csv
  - name: fab-dxf-plate-top
    cmd: [tools/fab.py, dxf, --from, mechanical/export/plate-top.dxf, --part, plate_top, --name, fab-dxf-plate-top]
    inputs: [mechanical/export/plate-top.dxf, mechanical/export/fab-geometry.echo, config/body.yaml, config/key-layout.yaml]
    out: mechanical/fab/aluminium/plate-top.dxf
  - name: fab-dxf-plate-bottom
    cmd: [tools/fab.py, dxf, --from, mechanical/export/plate-bottom.dxf, --part, plate_bottom, --name, fab-dxf-plate-bottom]
    inputs: [mechanical/export/plate-bottom.dxf, mechanical/export/fab-geometry.echo, config/body.yaml, config/key-layout.yaml]
    out: mechanical/fab/aluminium/plate-bottom.dxf
  - name: fab-dxf-oak-top
    cmd: [tools/fab.py, dxf, --from, mechanical/export/oak-top.dxf, --part, oak_top, --name, fab-dxf-oak-top]
    inputs: [mechanical/export/oak-top.dxf, mechanical/export/fab-geometry.echo, config/body.yaml, config/key-layout.yaml]
    out: mechanical/fab/oak/oak-top.dxf
