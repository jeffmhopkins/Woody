  - name: section-key
    title: Cross-section through RH3, seen from the tail
    src: mechanical/cad/fig_section_key.scad
    out: mechanical/renders/section-key.png
    imgsize: [1200, 900]
    projection: o
    camera: [16, 18, 0, 0, 0, 0, 190]
  - name: section-keycap
    title: The MT165 cap on its switch at LH1, at rest and fully pressed (red) - does the skirt land on the switch?
    src: mechanical/cad/fig_section_keycap.scad
