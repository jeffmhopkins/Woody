    projection: o
    camera: [60, 41, 0, 0, 0, 0, 105]
  - name: section-kb-mount
    title: Cross-section through a column at a key board's corner - bottom plate, stud, spacer, main board, standoff, key board, spacer, key plate, screw in its pocket
