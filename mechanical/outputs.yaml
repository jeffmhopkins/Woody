    imgsize: [1600, 900]
    camera: [0, 28, 16, 58, 0, 335, 640]
    defines: {origin: "centre", explode: 36, ghost_shell: true}
  - name: breakdown-electronics
    title: "Breakdown: the electronics - main board, key boards, switches, sensor, strip, Matrix, connectors"
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/breakdown-electronics.png
    imgsize: [1600, 800]
    camera: [0, 28, 10, 50, 0, 340, 440]
    defines: {origin: "centre", show_lid: false, show_caps: false,
              highlight: ["main board*", "parts *", "tall parts*", "breath sensor", "LED row", "ribbon *", "J-CHAIN *", "IDC plug *", "board *",
                          "switch *", "Matrix*", "etherCON", "USB-C*", "umbilical adapter", "J-UMB", "J-MCU"]}
  - name: breakdown-breath
    title: "Breakdown: the breath path - mouth cap, tube, trap, sensor, at the mouth end"
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/breakdown-breath.png
    imgsize: [1400, 900]
    camera: [28, 28, 12, 38, 0, 330, 150]
    defines: {origin: "mouth", show_lid: false, show_caps: false, highlight: ["breath*", "mouth cap"]}
  - name: breakdown-structure
    title: "Breakdown: the structure, pulled apart - oak, both plates and their columns, sides, end caps, U-bolt"
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/breakdown-structure.png
    imgsize: [1600, 900]
