# Every file tools/cad.py builds. Nothing under mechanical/renders/,
# mechanical/export/ or mechanical/cad/vendor/ may exist unless it is named here.
# `python3 tools/cad.py build` rebuilds what is stale; `check` proves the rest.
#
# A render's fingerprint covers its recipe (every field below except title
# and caption) and the git blob id of every file its source reads. Change a
# camera and that render is stale; change config/body.yaml and all of them are.

meshes:
  # The banked vendor solids, meshed so OpenSCAD can import them. Datum is
  # the vendor's: KS-33 z = 0 at the collar underside (ks33-geometry.md).
  - name: ks33-mesh
    from: datasheets/mechanical/GATERON-KS-33-3D.step
    out: mechanical/cad/vendor/ks33.stl

# Cameras: [tx, ty, tz, rx, ry, rz, distance]. The LENGTH IS DERIVED, so no
# camera aims at a fixed X: each render sets `origin` (centre or tail) and
# its camera aims at X = 0. A whole-body view wants ~1.5 x the length.
renders:
  - name: hero
    title: The instrument, key face up
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/hero.png
    imgsize: [1600, 700]
    camera: [0, 28, 12, 60, 0, 335, 470]
    defines: {origin: "centre"}
  - name: detail-mouth-end
    title: The mouth end close up - oak cap, sanded edges, the breath tube's pass-through
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/detail-mouth-end.png
    imgsize: [1400, 800]
    camera: [15, 28, 20, 55, 0, 320, 110]
    defines: {origin: "mouth"}
  - name: underside
    title: The underside - thumb keys and the U-bolt
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/underside.png
    imgsize: [1600, 700]
    camera: [0, 28, 12, 125, 0, 335, 470]
    defines: {origin: "centre"}
  - name: exploded
    title: The laminated stack, pulled apart
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/exploded.png
    imgsize: [1600, 900]
    camera: [0, 28, 28, 62, 0, 330, 520]
    defines: {origin: "centre", explode: 22}
  - name: internals
