    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/section-ribbon.png
    imgsize: [1600, 700]
    projection: o
    camera: [88, 20, 0, 0, 0, 0, 90]
    defines: {origin: "mouth", cut: "y2d", cut_key: "ribbon"}
  - name: breakdown-ribbons
    title: "Breakdown: the key boards' ribbons and their connectors - oak top, key plate, sides and oak bottom off"
    src: mechanical/cad/woody_body.scad
    out: mechanical/renders/breakdown-ribbons.png
    imgsize: [1600, 800]
    camera: [0, 40, 14, 50, 0, 150, 360]
    defines: {origin: "centre", show_lid: false, show_caps: false, show_u: false,
              highlight: ["ribbon *", "J-CHAIN *", "IDC plug *", "board left_hand", "board right_hand"]}
  - name: breakdown-tail-wiring
