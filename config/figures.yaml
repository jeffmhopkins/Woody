  - id: ks33-contact-bounce
    quantity: Gateron KS-33 published contact bounce
    value: "5 ms max at 16 in/sec actuation"
    status: settled
    owner: docs/reference/ks33-geometry.md
    derivation: "Verbatim from Gateron's own drawing for the exact part, sheet 6 item 5: 'Bounce Time: 5msec Max.(at 16 in/sec. actuation speed).' Banked at datasheets/mechanical/GATERON-KS-33-VENDOR-SPEC-DRAWING.pdf and in the EXTRACTABLE text layer - no render needed."
    forbidden: ["does not publish contact bounce", "bounce duration and the reset point", "bounce is not published", "no published bounce figure", "bounce, which Gateron does not"]
    false_positive_note: >
      TWO patterns had to be removed from this entry within twenty minutes of
      writing it, both because they fired on CORRECT sentences. A bare
      "20 ms" fired on THREE - ADR 0001's "a conventional symmetric 20 ms
      window would silently absorb it", and two descriptions of the 2021
      firmware's guess in latency-budget.md and firmware/README.md. All
      three are comparisons against this figure, which is the right way to
      write them. And "Gateron does not publish" fired on ADR 0002's
      "the actuation/reset hysteresis gap, which Gateron does not publish" -
      which is TRUE; the hysteresis gap really is unpublished, and only the
      bounce half of that sentence was ever wrong.
      THE RULE BOTH BREAK: every pattern here must be specific to BOUNCE.
      Match the words that assert THIS figure is unknown - never the number,
      and never a phrase about the vendor in general.
    companion: "latency-budget.md books the release path against it; firmware/README.md sets the release window from measured bounce at M1, and this is the number M1 must come in under."
    note: |
      TRACKED 2026-09-21. Three documents asserted that Gateron does not
      publish this - ks33-geometry.md, ADR 0002 and latency-budget.md - while
      the figure sat in the banked drawing's extractable text layer. The
      assertion was downstream of a wrong belief about the FILE: the corpus
      recorded that drawing as having no text layer at all, which is true of
      its dimension callouts and false of its prose, and nobody separated the
      two.
      WHY IT MATTERS RATHER THAN BEING A CURIOSITY: fingerings are
      combinational, so a bouncing RELEASE walks the fingering table through
      different notes for up to this long - not a retrigger, a wrong note.
      And ADR 0001's note-on gate is two agreeing samples 250 us apart, which
      is TWENTY TIMES shorter than this window: the gate cannot reject
      bounce, and nothing in the corpus said so until the latency budget was
      made to close.

