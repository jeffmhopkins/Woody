  - id: panel-height-budget
    quantity: Module panel height used
    value: "110 mm of content against 115.5 mm of clear panel"
    status: settled
    owner: docs/decisions/0004-cv-interface-module.md
    derivation: "CLEAR HEIGHT FIRST, because the corpus never derived it. Panel 128.5 mm with M3 clearance holes centred 3.0 mm from the top and bottom edges - two independent banked artefacts agree (a FABRICATED 3HP panel, mechanical/EURORACK-3U-3HP-PANEL-apfaudio-pmod-r3.1.kicad_pcb, Edge.Cuts measured 15.000 x 128.500; and mechanical/EURORACK-3U-PANEL-HP-TABLE-make_blanks.py, HEIGHT=128.5, HOLE_Y=(3.0,125.5), HOLE_DIA=3.2, 10HP width 50.50 with holes at x 7.50/43.06). What blocks panel-front components is the SCREW HARDWARE, so the clear full-width height is 128.5 - 2*(3.0 + r): 116.9 mm on a bare ISO 7045 pan head (dk max 5.6), 115.5 mm with a DIN 125 M3 washer (OD 7.0, the assumed case), 112.5 mm with a knurled thumbscrew (OD ~10). CONTENT: label band 5 + three pots across at 14 mm knobs 22 + jacks 3 rows x 2 columns at 13 mm pitch 39 + etherCON flange 31 + toggle row 13 = 110 mm. 5.5 mm spare, i.e. 1.4 mm per row boundary; 2.5 mm even on the thumbscrew assumption. IT FITS ON EVERY HARDWARE ASSUMPTION."
    toggle_row: "THE TOGGLE NEEDS ITS OWN ROW, and this is what the dispute turned on. Beside the etherCON flange (26 mm wide, centred on 50.50) there are two 12.25 mm strips of aluminium. A D6.5 hole centred in one leaves 2.88 mm to the flange and 2.88 mm to the panel edge; the 6.00 mm alternative's D6.2 leaves 3.02 mm. BOTH ARE UNDER THE 3.09 mm THIS ADR ALREADY REJECTED when it went 6HP -> 8HP ('a fit the panel passes and a stiffness test it does not'), on a hole a player flips repeatedly in 2 mm aluminium. So the toggle gets a row and the choice of toggle does not affect this figure. THE LED DOES FIT BESIDE THE FLANGE: a D3.2 bezel leaves 4.52 mm each side. Row height 13 mm: the lever is 10.5 mm at a 25 deg throw, sweeping +/-4.44 mm in the panel plane; the body is 7.9 mm across and 13.0 along its terminal field, which lies along the throw. The lever throws across the panel (ADR 0024 point 12), so the row's height carries the nut and the body's 7.9, not the sweep - it holds either way. SINCE ADR 0023 THE ETHERCON IS AN NE8FAV: a 25 mm flange leaves 12.75 mm strips and the toggle's webs are still about 3.1 mm, so this conclusion stands; the budget keeps the D-series flange's height as a conservative allowance until the panel is laid out. THE LAYOUT (ADR 0024 point 11): the etherCON is the bottom row, so the umbilical's cable drops below every control, and the toggle's row is above it with the LED in it, left of the toggle - the same rows at the same heights in a different order, so the sum is unchanged. SINCE ADR 0024 POINT 16 the LED is a panel-mount indicator in its own D5.2 hole (config/module.yaml led.hole_d), not a D3.2 lens: centred in the 12.75 mm strip beside the NE8FAV it leaves 3.8 mm each side, above rules.web_min, and the module DRC holds it (mechanical/module/drc.echo 'panel web from a cut to the panel's edge'). The row's height is unchanged."
    forbidden: ["107 mm of ~110 mm usable", "Roughly 107 mm of", "97 mm against ~110 mm", "97 mm against ~110", "~115 mm against ~110 mm usable", "115 mm against ~110 mm", "already at 107 mm of ~110 mm usable", "13 mm spare", "13mm spare", "= 97mm", "107mm of ~110mm", "115mm against ~110mm"]
    false_positive_note_narration: >
      panel.md:20 and 0004:736 both NARRATE the review that produced these
      numbers - "a reviewer rebuilt the panel bottom-up and got ~115 mm
      against a '~110 mm usable' that was itself never derived". That is
      history and it is correctly framed as history. The defect was only
      ever the BOM row restating the retired budget as live.
    escape_note: |
      FOUR RETIRED VALUES, FOUR MISSES, EACH BY ONE REMOVED SPACE, 2026-09-21.
      The PANEL row in hardware/bom.csv and its fragment spelled the budget
      "97mm", "13mm spare", "115mm against ~110mm usable", "107mm of ~110mm".
      Every pattern in the list above spells "NN mm". The BOM does not put a
      space before the unit and never has.
      This is the most-cited file in the repository, and the same stale text
      was in it twice - master and fragment - because the master is
      generated.
    false_positive_note: "The candidates 107 / 97 / 112 / 124 may be quoted in text that explains why they were superseded; such lines carry refutation wording and the checker allows them. docs/review/** is excluded by design and keeps all four as the record of what was believed."
    note: |
      RETIRED FROM DISPUTED 2026-09-21, once wave R8 banked the last control
      type. It had four candidates - 107, 97, 112, 124 - and the answer is none
      of them, because THE FOUR CANDIDATES WERE NOT ALL THE SAME QUANTITY.
      THE ASSERTED "~110 mm usable" WAS NEVER DERIVED, and the coincidence that
      it equals the derived CONTENT height (110 mm) rather than the derived
      USABLE height (115.5 mm) is exactly the kind of false agreement that kept
      the dispute alive. Two numbers that looked like one.
      The other thing that split the candidates: the screw hardware blocks only
      x in [4.0, 11.0] and [39.6, 46.6], so the central 28.6 mm of panel width
      is clear over the full 128.5 mm. A figure derived for a full-width row and
      a figure derived for a centred component are different numbers, and the
      corpus had been comparing them.
      WHAT IS STILL WORTH DOING, and ADR 0004 already asks for it: print at 1:1
