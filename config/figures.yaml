  - id: dac-rail
    quantity: DAC AVDD rail, U-REG-DAC (LT3042) set by R-SET-DAC - no adjustment
    value: "5.23 V"
    status: settled
    owner: hardware/module/power-entry/power-entry.md
    derivation: "Owner, 2026-10-01: a precision-set LDO that needs no adjustment, replacing the LM317L and its trimmer. DAC_AVDD = I_SET x R-SET-DAC + V_OS = 100 uA x 52.3 kohm = 5.230 V nominal [calc]. Across the LT3042's guaranteed limits over line, load and temperature - I_SET 98-102 uA, V_OS (OUT - SET) +-2 mV [ds ADI-LT3042.pdf p.3] - with R-SET-DAC +-0.1 % and +-25 ppm/C over 40 C (+-0.2 %) [ds VIKING-ARG-THIN-FILM-RESISTOR.pdf p.3], 100 nA of SET leakage either way, the input 10.8-12.6 V and the load 2-9 mA: 5.11-5.35 V at every corner [calc: 98 uA x 52.3k x 0.998 - 0.1 uA x 52.2k - 2 mV = 5.108 V; 102 uA x 52.3k x 1.002 + 0.1 uA x 52.4k + 2 mV = 5.353 V; sim hardware/module/power-entry/sim dac-rail-spread], inside the floor's window with more than 50 mV to spare at both ends. R-SET-DAC aged to its +-0.5 % endurance limit as well [VIKING p.4]: still inside (dac-rail-aged)."
    forbidden: ["0.66 V worst-case spread", "worst case spans 0.66V", "5.25V]", "local 5.25 V regulator", "own 5.25 V regulator", "LM317's own 5.25 V", "5.25V DAC regulator", "set to 5.25V", "LDO set to 5.25", "5.21 V", "5.21V", "475R 0.1%", "0.66V worst-case spread", "5.20 V", "5.20V", "5.20 / 10k", "trims `DAC AVDD` to", "trims `DAC_AVDD` to", "trim `DAC_AVDD` to `dac-rail`", "E7 trims", "as E7 trims it", "trimmed to `dac-rail`", "trimmed to dac-rail", "TRIM-DAC-RAIL 50R", "Selected on the bench, per the figure's floor", "TNPW0603", "TNPW 0603", "TNPW e3", "C4241066", "ASTM B 809"]
    false_positive_note: "The MPXV4006DP's supply spec is legitimately 4.75-5.25 V. Match the regulator, not the numeral. '5.21' and '5.20' as bare numbers also appear in unrelated derivations; the patterns carry the unit or the operator."
    floor: "5.00 V, HARD, and 5.50 V; 6.0 V absolute. WHY THE FLOOR: the DAC8568 C grade runs its internal 2.5 V reference at gain 2 for a 0-5 V output, and TI specifies that range only for AVDD >= 5 V ('AVDD >= 5V; grades C and D: maximum output voltage 5V when using internal reference', and the reference-input row 'Grades C/D, AVDD = 5.0V to 5.5V') [datasheets/analog/DAC8568CIPW.pdf p.3, p.4]: below 5 V the output buffer cannot reach full scale and the top calibration point lands in its compression (ADR 0004). The top is the part's operating maximum, 5.5 V; the absolute maximum is 6 V [p.2]. The LT3042's spread sits inside both with no trim; the one failure that drives the rail up is an open R-SET-DAC (power-entry/sim dac-rail-open-rset), accepted by the owner 2026-10-01 without a clamp (power-entry.md, 'Its failures')."
    note: "The 5.25 V patterns: bom.csv's U-REG-DAC description said 'set to 5.25V' until 2026-09-21. The 5.21 V and 475R patterns are the LM317L's fixed divider; 5.20 V and the trim patterns are the trimmer that replaced it on 2026-10-01 and was itself replaced the same day by the LT3042 (owner: no adjustment). The fixed divider's 4.99-5.47 V spread is not a pattern, because ADR 0004 narrates it. The TNPW / C4241066 / ASTM B 809 patterns are the Vishay anti-sulfur R-SET-DAC (TNPW060352K3BEEA, 0603) that replaced the Viking ARG05 for a few hours on 2026-10-01 and was reverted by the owner the same day ('no need for these specialized parts bifurcation'); its banked datasheet and manifest row under datasheets/ are records and stay."

