  - id: dig-gnd-topology
    quantity: Where DIG_GND (and AGND_MOD, and PWR_GND) meet at the module
    value: "One star, at the power header's ground pins (BUS_GND): AGND_MOD (its own region) and DIG_GND (its own plane) each tie there through their own net tie, and nothing else ties to it. PWR_GND is the isolated return of the instrument's supply: its own layer-4 copper from the etherCON's pin 6, joined to DIG_GND at the etherCON, so it reaches the star only through DIG_GND. Four-layer main board."
    layers: "PCB-MODULE, four layers, 1.6 mm: layer 2 carries the DIG_GND plane (under the etherCON, the level shifter, the logic regulator and the SPI traces) and, separately, the AGND_MOD region (under the analog block); layer 4 carries PWR_GND from the etherCON's pin 6 to U-ISO and the load switch, and does not reach the header (ADR 0027). Ties: NT-DIG-MOD and NT-AGND-MOD at the header's ground pins; NT-UMB-MOD at the etherCON."
    status: settled
    owner: hardware/module/power-entry/power-entry.md
    decided: "Owner, 2026-09-30: 'Four layer in the module board is fine.' The topology on it adopts the four-layer proposal recorded here (DIG_GND plane on layer 2, analog region, PWR_GND on layer 4) with ONE correction: no AGND_MOD-to-DIG_GND bridge under the DAC8568. SBAS430E p.49 asks for the DAC's ground on an analog plane 'separate from the ground connection for the digital components until they were connected at the power-entry point of the system', and J-UMB pins 6 and 8 are tied at the instrument (ADR 0018), so about half the instrument's return comes back on pin 8 - a bridge under the DAC would route it across the analog region; tied at the star it crosses only the DIG_GND plane. ADR 0004's 'DIG_GND likewise - its own path to the star' is what this is."
