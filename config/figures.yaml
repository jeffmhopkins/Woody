    supersedes_the_constraint: "THE 1 A R-78E5.0 IS NOT WHAT STOPS THE MATRIX FIRST. All 64 LEDs draw through one B5819WS Schottky in SOD-323 on the dev board, P_D 200 mW and R-thJA 500 degC/W (datasheets/discrete-and-power/B5819WS.pdf), which is ~435 mA at 25 degC and ~283 mA at a 60 degC interior [calc at V_F ~0.46 V]. Behind it the ME6217C33M5G LDO's printed 800 mA is 'guaranteed by design' and not production-tested, derating to ~250-500 mA on SOT-23-5. ADR 0014's brightness cap is RIGHT and its JUSTIFICATION IS WRONG."
    forbidden: []
    note: "THIS NUMBER IS LOAD-BEARING. ADR 0014 uses it to argue the matrix alone nearly exhausts the 1 A R-78E5.0, and that argument drives a hard brightness cap that the ADR deliberately makes non-configurable. The argument may well survive - 12 mA/ch would make it far worse, not better - but the figure behind it does not currently have a document. What the schematic DOES settle: the 64 LEDs run from 5 V, not 3V3 - every VDD on net VCC_5V with no regulator or switch between - which was a strong inference and is now read off a schematic. But VCC_5V is USB VBUS through a B5819WS Schottky, so it is a diode drop below 5 V, and there is NO decoupling anywhere inside the array."

  - id: ferrite-bias-impedance
    quantity: FB-IN impedance at 100 MHz under real DC bias
    value: "~580-614 ohm on FB1/FB3/FB4; ~280-310 ohm on FB2"
    status: settled
    owner: hardware/bom.csv
    derivation: "Laird MI1206K601R-10, drawing rev E, banked at datasheets/discrete-and-power/MI1206K601R-10-ferrite-bead.pdf. Read off the drawing's impedance-under-DC-bias curve family (0 / 250 / 500 / 1000 / 1500 mA traces) at 100 MHz: 0 A ~614 ohm, 250 mA ~431, 500 mA ~157, 1000 mA ~72, 1500 mA ~51. FB2 carries umbilical-current (359 mA) and interpolates to ~280-310 ohm; the module +12V total of 392 mA gives ~245-275."
    forbidden: ["Rated >=1A - the common 0805 600R part is ~300mA and a saturated bead is a wire"]
    note: "THE '>=1 A' RULE DOES NOT DO WHAT THE BOM ROW SAID IT DID. A bead's current rating is THERMAL, not magnetic, so it says nothing about saturation. A 3000 mA part in the same package with the same 600 ohm nominal (HI1206N601R-10, banked alongside) reads ~145 ohm at 500 mA - SLIGHTLY WORSE than the 1500 mA part. FB2 gets roughly half the 600 ohm its row specifies and no 1206 600R bead of any rating fixes it: DC bias shifts the impedance peak UP IN FREQUENCY, so the bead does not die, its useful band slides off 100 MHz. Either the FB2 requirement is restated at its real operating current or FB2 becomes a physically larger part. SELECTION CONSTRAINT WORTH PRESERVING: this part was chosen because its datasheet PUBLISHES the bias curve. Murata BLM's PDF does not (that data is in SimSurfing only) and neither does Wurth WE-CBF - an earlier researcher declined to bank a Wurth part for exactly this reason and that judgement is upheld."

