  - id: opa2197-output-impedance
    quantity: OPA2197 open-loop output impedance
    value: "375 ohm"
    status: settled
    owner: hardware/carrier/breath-excitation-reference/breath-excitation-reference.md
    derivation: "SPECIFIED, not derived: SBOS737C EC table p.8 and p.10, 'ZO Open-loop output impedance | f = 1 MHz, IO = 0 A, See Figure 26 | 375 | ohm'. Figure 26 reads ~3.26k at 0.1 Hz, 482 at 10 Hz, a 375 plateau from 100 Hz to 300 kHz, 301 at 1 MHz and ~73 at 10 MHz. Banked at datasheets/analog/OPA2197.pdf."
    provenance_note: "The corpus BACK-SOLVED 75.8 ohm from its own stated 21 kHz pole and carried it through three review waves because ti.com was unreachable. ti.com is reachable now and the BLOCKED manifest row was a proxy artefact. 75.8 ohm is about the 10 MHz value, so it is defensible as a crossover-region number and was not a wild guess - it is simply not TI's specified figure."
    forbidden: ["Ro ≈ 75.8 Ω**. The actual load", "gives **Ro ≈ 75.8"]
    false_positive_note: "75.8 appears legitimately in the text that records the correction. Match the assertion, not the numeral."
    note: "EVERY POLE DERIVED FROM 75.8 OHM MOVES BY ~5x IN THE WRONG DIRECTION: 21 kHz -> 4.24 kHz against 100 nF, 200 Hz -> 42 Hz against 10.1 uF. The case for R-ISO-REF is STRENGTHENED, not weakened. The compensation that follows from 375 ohm is cref-out-node and riso-ref-topology (TI's SBOS737C section 8.2.3 p.30, Figure 56), and its loop is proven against TI's macromodel in riso-ref-phase-margin - read the poles there, not here."

  - id: matrix-led-current
    quantity: ESP32-S3-Matrix LED current, full white, 64 LEDs
    value: "BLOCKED"
    status: blocked
    owner: docs/decisions/0014-lighting.md
    candidates: ["960 mA at 5 mA/ch - DERIVED FROM THE WRONG PART (WS2812C-2020) and optimistic by at least 2.4x", "2304 mA at 12 mA/ch, which is the WS2812B FAMILY figure from the banked WS2812B-2020 p.4 and from the XINGLIGHT 0807 surrogate's 2022 revision", "3648 mA at 19 mA/ch, the XINGLIGHT surrogate's 2024 revision default"]
    decided_by: "A BENCH MEASUREMENT AT E1, not another document. Worldsemi does not publish a WS2812B-0807 datasheet at all - their site's own machine-readable datasheet index enumerates 68 keys covering every published part and has no 0807 key in either language, while the control URL for ws2812b-2020-v6 returns a real 1.26 MB PDF. The two XINGLIGHT XL-0807RGBC-WS2812B revisions banked as SURROGATES disagree with each other 12 vs 19 mA and 7x on quiescent current, and which one matches the fitted board is unknowable from documents."
    blocked_on: "datasheets/MANIFEST.csv - WS2812B-0807. Unblocking needs a current probe, not a fetch."
    power_path: "WHICH LIMIT BINDS DEPENDS ON WHICH INPUT FEEDS THE BOARD. Read off datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-SCHEMATIC.pdf: pad-row P1 pin 1 IS net VCC_5V, D1 B5819WS runs VBUS -> VCC_5V, and all 64 LED VDDs and the ME6217C33M5G LDO input are on VCC_5V. IN THE INSTRUMENT the Matrix is fed from its 5V pad (U-BUCK through J-MCU and CBL-MCU-RIBBON, ADR 0017), so D1 is BYPASSED and carries nothing: the limits are ADR 0014's firmware brightness clamp and U-BUCK's 1 A rating (R-78E5.0-1.0), shared with the rest of the 5V load. ON USB POWER ONLY (a Matrix on the bench, or USB with no umbilical) all 64 LEDs draw through that one Schottky in SOD-323, P_D 200 mW and R-thJA 500 degC/W (datasheets/discrete-and-power/B5819WS.pdf): ~435 mA at 25 degC and ~283 mA at a 60 degC interior [calc at V_F ~0.46 V]. The ME6217C33M5G LDO's printed 800 mA is 'guaranteed by design' and not production-tested, derating to ~250-500 mA on SOT-23-5 - that bounds the 3V3 load on either input, not the LEDs. ADR 0014's brightness cap stands on both inputs."
    forbidden: []
    note: "THIS NUMBER IS LOAD-BEARING. ADR 0014 uses it to argue the matrix alone nearly exhausts the 1 A R-78E5.0, and that argument drives a hard brightness cap that the ADR deliberately makes non-configurable. The argument may well survive - 12 mA/ch would make it far worse, not better - but the figure behind it does not currently have a document. What the schematic DOES settle: the 64 LEDs run from 5 V, not 3V3 - every VDD on net VCC_5V with no regulator or switch between - which was a strong inference and is now read off a schematic. On USB, VCC_5V is VBUS through the B5819WS, a diode drop below 5 V; from the 5V pad it is the pad itself (see power_path). Either way there is NO decoupling anywhere inside the array."

  - id: ferrite-bias-impedance
    quantity: FB-IN impedance at 100 MHz under real DC bias
    value: "~580-614 ohm on FB1/FB3; ~440-480 ohm on FB2 and FB4 at the isolated supply's typical input current (~310 ohm at the clamp-legal worst)"
    status: settled
    owner: hardware/module/power-entry/power-entry.md
    derivation: "Laird MI1206K601R-10, drawing rev E, banked at datasheets/discrete-and-power/MI1206K601R-10-ferrite-bead.pdf. Read off the drawing's impedance-under-DC-bias curve family (0 / 250 / 500 / 1000 / 1500 mA traces) at 100 MHz: 0 A ~614 ohm, 250 mA ~431, 500 mA ~157, 1000 mA ~72, 1500 mA ~51. Since ADR 0027 FB2 and FB4 carry U-ISO's input current, ~0.22 A in typical play (power-entry.md), not umbilical-current: between the 0 and 250 mA traces, ~440-480 ohm [interpolated]; ~0.37 A at the clamp-legal worst reads ~310 [interpolated between 250 and 500 mA]."
    forbidden: ["Rated >=1A - the common 0805 600R part is ~300mA and a saturated bead is a wire", "FB4 (+5V, mA)", "~280-310 ohm on FB2", "| `FB2` | `umbilical-current` |", "`FB2` carries the umbilical at 359 mA", "FB2 CARRIES THE UMBILICAL"]
    false_positive_note: "FB4 EXISTS AGAIN since ADR 0027 - the -12 V leg of U-ISO's input, partner of FB2 - so the old patterns that caught the retired +5 V bead by its refdes alone ('FB1/FB3/FB4', '`FB1`, `FB3`, `FB4`', '`FB1`-`FB4`' with an en dash) were withdrawn 2026-09-30: they would fire on correct sentences. 'FB4 (+5V, mA)' still names the retired one."
    note: "THE '>=1 A' RULE DOES NOT DO WHAT THE BOM ROW SAID IT DID. A bead's current rating is THERMAL, not magnetic, so it says nothing about saturation. A 3000 mA part in the same package with the same 600 ohm nominal (HI1206N601R-10, banked alongside) reads ~145 ohm at 500 mA - SLIGHTLY WORSE than the 1500 mA part. FB2 gets roughly half the 600 ohm its row specifies and no 1206 600R bead of any rating fixes it: DC bias shifts the impedance peak UP IN FREQUENCY, so the bead does not die, its useful band slides off 100 MHz. Either the FB2 requirement is restated at its real operating current or FB2 becomes a physically larger part. SELECTION CONSTRAINT WORTH PRESERVING: this part was chosen because its datasheet PUBLISHES the bias curve. Murata BLM's PDF does not (that data is in SimSurfing only) and neither does Wurth WE-CBF - an earlier researcher declined to bank a Wurth part for exactly this reason and that judgement is upheld."

  - id: ref5050-grade
    quantity: REF5050 grade, initial accuracy and tempco
    value: "REF5050IDR, the High grade: ±0.05 % initial, 3 ppm/°C"
    status: settled
    owner: hardware/carrier/breath-excitation-reference/breath-excitation-reference.md
    source: "datasheets/analog/REF5050.pdf (SBOS410O) Table 4-2 p.3: REF50xxI = High = 3 ppm/degC, +/-0.05 %; REF50xxAI = Standard = 8 ppm/degC, +/-0.1 %. Same SOIC-8 pins, Table 5-1 p.4. Selected 2026-09-30: LCSC C24696, 4401 in stock at USD 1.92 against the Standard grade's USD 1.05 [web jlcpcb.com parts search 2026-09-30]"
    derivation: "The reference exists only for scale-factor stability (the sensor is ratiometric), so the grade is chosen for it: the Standard grade doubles the initial error and multiplies the drift by 8/3 = 2.7 for USD 0.87 on one part [calc]."
    forbidden: ["+-0.05%, 3ppm/degC, ~5ppm/V", "against a reference specified to 0.05%", "5.000 V out at \u00b10.05 % and 3 ppm/\u00b0C", "SOIC-8, 7\u201318 V in", "REF5050AID"]
    false_positive_note: "The 'A' order code is the Standard grade; the grade family names REF50xxI and REF50xxAI are legitimate in text explaining the difference and are not matched. The first four strings predate the part change and are kept to catch a regression of the old assertion."
    note: "*** THE 'A' SUFFIX IS THE WORSE GRADE. *** A substitution or an assembler's 'equivalent' that adds the A is a silent downgrade of the breath scale factor. FETCH NOTE: ti.com/lit/ds/symlink/ref5050.pdf is a 404 since rev O; use ti.com/lit/ds/sbos410/sbos410.pdf."
