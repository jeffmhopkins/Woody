  - id: diode-split-rationale
    quantity: What the D1/D2 split actually buys
    value: "fault isolation and HF isolation (r_d ~0.55 ohm in D2 at the isolated supply's ~0.22 A input, ~3.2 ohm in D1 at the analog rails' ~32 mA)"
    status: settled
    owner: hardware/module/power-entry/power-entry.md
    derivation: "Vf modulation is 120 mV: 0.24 V at 245 mA -> 0.36 V at 612 mA, digitised off Fig. 2 of Diodes Inc DS23001 Rev.8 (datasheets/discrete-and-power/1N5817.pdf). Reaches the jack as 120 mV -> the DAC rail regulator's line regulation -> AVDD -> OPA2197 PSRR 110.5 dB worst case -> 0.00044 cents, computed with the LM317L's 0.52 mV/V (62 uV on AVDD); U-REG-DAC is the LT3042 since 2026-10-01, at most 2 nA/V x 52.3 kohm + 3 uV/V = 0.108 mV/V [ds ADI-LT3042.pdf p.3; calc] (13 uV), so 0.00044 cents is now an upper bound. Pitch references the DAC's INTERNAL reference, not this rail. r_d [calc]: V = a ln(I) + b + Rs I fitted by least squares to the four points digitised off the same Fig. 2 (0.245 A 0.24 V, 0.612 A 0.36 V, 1.0 A 0.454 V, 3.0 A 0.746 V; residuals under 5 mV) gives a = 0.100 V and Rs = 0.093 ohm, so r_d = a/I + Rs = 0.100/0.22 + 0.093 = 0.55 ohm in D2 and 0.100/0.032 + 0.093 = 3.2 ohm in D1. Since ADR 0027 no diode carries the module's whole +12 V draw: D2 carries U-ISO's input (~0.22 A typical, power-entry.md) and D1 the analog rails (~32 mA, module-own-draw). The bulk term matters - a/I alone, with a = n V_T for n = 1, understates r_d several-fold. Either way HF isolation improves with r_d, so the conclusion stands."
    provenance_note: "This was 75-80 mV from a review agent's estimate until 2026-09-21. The 120 mV is read off the actual curve, and the digitisation is calibrated: the same extraction gives 0.454 V at 1.0 A and 0.746 V at 3.0 A against the datasheet's guaranteed maxima of 0.450 V and 0.750 V, so it is good to about +/-0.01 V - and the plotted curve sits essentially ON the max spec, so read these as typical-to-max. The conclusion is unchanged: 0.00044 cents is still five orders of magnitude below every other term in the table. SEPARATELY, 2026-09-21: the PSRR in this chain was 114 dB and that figure is NOT IN THE OPA2197 DATASHEET - SBOS737C p.8 specifies +-1 uV/V typ and +-3 uV/V max, i.e. 120 dB typ and 110.5 dB worst case. Using the guaranteed maximum scales the result by 1.50x, from 0.00029 to 0.00044 cents, and changes nothing. SBOS737C is banked at datasheets/analog/OPA2197.pdf."
