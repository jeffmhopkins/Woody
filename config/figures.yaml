# Shared figures — the single source of truth.
#
# WHY THIS FILE EXISTS
# Three review waves found the same defect ~90 times: a value changes, and the
# numbers derived from it in other documents do not follow. The corpus contains
# exactly one fact with zero staleness findings against it (USB MIDI opt-in),
# and what makes it different is that it is stated ONCE and cited by name from
# everywhere else. This file generalises that.
#
# RULES
#   1. A figure listed here is stated ONCE, in its `owner` document.
#   2. Every other document CITES it. It does not restate the number.
#   3. `forbidden` lists values this quantity USED to have. tools/check-staleness.py
#      fails if any of them appear in the design corpus.
#   4. When a figure changes: update it here, move the old value into `forbidden`,
#      and run the checker. The checker then tells you every place to fix.
#
# STATUS
#   settled  - derived, agreed, safe to cite
#   disputed - the corpus disagrees; `candidates` lists what, `decided_by` says how
#   blocked  - needs a datasheet or a bench measurement

figures:

  - id: inamp-full-scale
    quantity: In-amp output at full sensor range
    value: "-9.94 V"
    status: settled
    owner: hardware/module/breath-receive-stage/breath-receive-stage.md
    derivation: "G = 1 + 50k/42.2k = 2.18483; x 1M/(1M+11k) = 2.16106 effective; x 4.6 V sensor span = 9.941 V"
    forbidden: ["-9.6 V", "−9.6 V", "-10.05 V", "−10.05 V"]
    note: "-10.05 V is the same gain with the 1M bias divider omitted. -9.6 V is derived from nothing and matches no configuration."

  - id: sensor-full-scale
    quantity: MPXV4006DP output at full scale
    value: "4.86 V"
    status: settled
    owner: docs/decisions/0003-breath-sensing-path.md
    derivation: "Vout = VS*[(0.1533*P) + 0.053], verbatim from the datasheet. At VS = 5.0 V and P = 6 kPa: 5*(0.9198 + 0.053) = 4.864 V. The PEDESTAL IS 0.265 V, not 0.200 V."
    forbidden: ["4.7 V output", "0.2-4.7 V", "0.2 – 4.7 V", "0.2 V + 0.766", "0.200 V at rest", "0.2 V at rest", "(0.1533*P) + 0.04", "0.1533 x P) + 0.04", "rest | 0.200 V", "0.2 + 0.766", "0.2-4.80 V", "0.2 – 4.80 V", "0.2–4.80 V", "0.2 → 4.8 V", "0.2 to 4.8 V out", "| 0.200 V |", "| 4.800 V |", "+0.2V pedestal", "+0.200 V pedestal", "typical +0.200 V", "4.7 V × 0.6", "full scale = 4.7 V", "0.1533·P + 0.04", "0.1533 · P + 0.04", "0.7665 V/kPa with 0.20 V", "reach 0.2 V at the bottom", "against the 0.2 V floor"]
    escape_note_2: |
      THE FIFTH RECORDED INSTANCE, 2026-09-21, AND IT WAS IN THE OWNER DOCUMENT.
      The four patterns above were added after a cold agent found that ADR 0003
      - the document this register names as this figure's OWNER - stated the
      REFUTED transfer function twice as live fact, and computed a buffer
      headroom margin off the refuted 0.2 V pedestal twice more.
      The escape was one character. Every pattern in the original list spells
      the multiply as "*" or "x"; ADR 0003 spells it with a MIDDLE DOT (U+00B7),
      once tight and once spaced. Both missed.
      Note what this means: the escape_note below describes the fourth instance
      and says the corpus spelled one number seven ways. It did - and two of
      those seven ways were in the owner document, and stayed live through the
      very commit that wrote the warning. A forbidden list written from the
      document in front of you cannot catch the document in front of you.
    false_positive_note: "0.2-4.80 V is the datasheet's OWN COVER-PAGE line and may be quoted as such - the ADR 0003 GP-vs-DP comparison row does exactly that, labelled 'cover page, both parts', and carries refutation wording. 4.80 V also appears legitimately in docs/decisions/0005-power-architecture.md about an LM317 rail, which is a different quantity entirely; match the surrounding words, not the number."
    escape_note: |
      THESE PATTERNS WERE ADDED 2026-09-21, THE SAME DAY THE FIGURE MOVED, AFTER
      TWO COLD REVIEWERS INDEPENDENTLY FOUND ELEVEN DERIVED STATEMENTS STILL
      CARRYING THE OLD VALUE WHILE THE CHECKER SCORED ZERO HITS.
      This is the project's named failure mode, inside the commit that fixed the
      figure - the fourth recorded instance. The mechanism was mechanical and
      worth writing down: the original forbidden list was written by looking at
      the ONE document being edited, so it matched that document's spelling and
      no other. The corpus spelled the same number seven other ways - an en dash
      with no spaces, a table cell with pipes, "0.2 + 0.766" without the " V",
      "0.2 - 4.80" where the register had "0.2 - 4.7". Each missed by one or two
      characters against a case-sensitive literal find.
      THE RULE THAT FOLLOWS: when a figure moves, grep the corpus for the OLD
      value first and add a pattern per spelling found, rather than writing the
      forbidden list from the document in front of you.
    note: |
      CORRECTED 2026-09-21 against datasheets/analog/MPXV4006DP.pdf, which
      refutes a figure this register had marked SETTLED.
      The old derivation used a 0.200 V pedestal. That number is the
      datasheet's own COVER-PAGE line - "0 to 6 kPa, 0.2 to 4.8 V Output" -
      and it CONTRADICTS the transfer function printed inside the same
      document. Table/transfer function wins over the marketing blurb.
      The 0.766 V/kPa sensitivity was always right (5 x 0.1533 = 0.7665).
      Only the offset coefficient was wrong: 0.053, not 0.04. 0.04 is the
      MPXV5004 family's.
      WHAT SURVIVES: inamp-full-scale (-9.94 V) is derived from the SPAN,
      and the span is unchanged - 4.864 - 0.265 = 4.599, the datasheet's
      4.6 V VFSS typ. The one sensor number the corpus had right is the one
      everything downstream was built on.
      WHAT MOVES: V_REF for TRIM-BREATH-ZERO nulls the pedestal, so it
      follows the pedestal. This note said to recompute it and that it was
      "not a tracked figure yet and probably should be" - correct on both
      counts, and neither happened for months. IT IS NOW TRACKED, as
      breath-zero-ref, after a split agent found three values for it in five
      places. This note's own ~0.573 V was the only right one of the three.

  - id: breath-zero-ref
    quantity: V_REF the breath trimmer must produce to null a typical pedestal
    value: "0.573 V"
    status: settled
    owner: hardware/module/breath-receive-stage/breath-receive-stage.md
    derivation: "0.265 V typical pedestal x 2.16106 EFFECTIVE in-amp gain = 0.5727 V. The effective gain is the one inamp-full-scale uses: G = 1 + 50k/42.2k = 2.18483, times the 1M/(1M+11k) bias divider = 2.16106."
    forbidden: ["+0.437 V", "~0.437 V", "0.437 V nulls", "to ~0.579 V", "+0.579 V", "0.579 V"]
    companion: "sensor-full-scale sets the 0.265 V pedestal; inamp-full-scale uses the same 2.16106 effective gain."
    escape_note: |
      THREE VALUES FOR ONE QUANTITY, IN FIVE PLACES, FOUND 2026-09-21 BY A
      PHASE B SPLIT AGENT - AND THIS REGISTER WAS ONE OF THE FIVE.
        0.437 V  the drawing in breath-receive-stage.md, and ADR 0006
        0.579 V  the prose on the same page, and bom.csv
        0.573 V  this file's own note on sensor-full-scale
      The note said "it is not a tracked figure yet and probably should be",
      which was correct and is why this entry now exists. An untracked
      quantity derived from a tracked one has no protection at all: when
      sensor-full-scale's pedestal moved from 0.200 to 0.265 V, this followed
      it in two files, half-followed in a third and did not move in two more.
      WHICH IS RIGHT, AND WHY THE OTHER TWO ARE THE SHAPE THEY ARE:
        0.573 = 0.265 x 2.16106  effective gain, WITH the 1M bias divider
        0.579 = 0.265 x 2.18483  same pedestal, divider OMITTED
        0.437 = 0.200 x 2.18483  OLD pedestal, divider also omitted
      The 0.579 spelling is the exact error this register already documents
      for inamp-full-scale, whose own note says "-10.05 V is the same gain
      with the 1M bias divider omitted". The same omission, on the same page,
      for a second quantity - which is what an untracked derived figure buys
      you.
      The agent that found it saw three of the five. THE FOURTH AND FIFTH -
      ADR 0006 and bom.csv - CAME OUT OF THE GREP-FIRST RULE IN CLAUDE.md 2,
      because the agent was reading only its own page.

  - id: key-release-time
    quantity: Key network release, crossing V_IH
    value: "119.9 us"
    status: settled
    owner: hardware/cluster/key-switch-network/key-switch-network.md
    derivation: "Pressed node sits at 3.3 x 100/(2200+100) = 0.1435 V, NOT 0 V. Charging through 2.2k (tau = 103.40 us): t = -103.40 x ln((3.3-2.31)/(3.3-0.1435)) = 119.9 us"
    threshold_note: "V_IH = 2.31 V = 0.70 x VCC. THIS FIGURE MOVED TWICE ON 2026-09-21 AND THE SECOND MOVE PUT IT BACK. First move: TI's SCLS116E (datasheets/logic/74HC165-ti-scls116e.pdf) has NO 3.3 V row - it tabulates 2 V (1.5/0.5 = 0.75/0.25), 4.5 V and 6 V (both 0.70/0.30) - so the 0.75/0.25 bound was taken on the reasoning that 0.70/0.30 'breaks' at 2 V. Second move: onsemi's MC74HC165A/D Rev. 13 p.4 PUBLISHES A 3.0 V ROW, V_IH 2.1 V / V_IL 0.9 V, which is exactly 0.70/0.30. 3.3 V is therefore bracketed on BOTH sides by published 0.70/0.30 rows and needs no extrapolation through the 2 V point; 2 V is the single exception at the bottom of the family range, not a trend. TI, Nexperia (Rev. 8) and Toshiba agree with onsemi digit for digit at every shared rail, so the 3.0 V row is the family's, not one vendor's. All four PDFs are banked."
    conservative_bound: "If a TI SN74HC165 is the part fitted, its own datasheet guarantees nothing at 3.3 V and the pessimistic bound is V_IH = 2.475 V, giving 138.7 us. Nothing in the design depends on which is used - the release is absorbed by the asymmetric debounce either way. Design margin against 138.7 us if it ever gets tight."
    forbidden: ["`V_IH` at **125", "release ~93 us", "~93 µs hardware", "93.2 us", "at **138.7", "crosses `V_IH` at **138.7", "0.75 x VCC = 2.475", "0.75 × VCC = 2.475"]
    false_positive_note: "A bare 125 us also legitimately means the MEAN SAMPLING PERIOD (0-250 us at 4 kHz) and the 8 kHz LOOP PERIOD. Match the phrase, not the numeral. 138.7 us appears legitimately as the stated conservative bound and in the text recording the two moves - those lines carry refutation wording."
    note: "Starting from 0 V instead of the divider voltage gives 124.5 us, which is the error the 125 us figure came from."

  - id: key-press-time
    quantity: Key network press, crossing V_IL
    value: "5.92 us"
    status: settled
    owner: hardware/cluster/key-switch-network/key-switch-network.md
    derivation: "tau = (2200||100) x 47nF = 4.4957 us; t = -4.4957 x ln((0.99-0.1435)/(3.3-0.1435)) = 5.92 us"
    threshold_note: "V_IL = 0.99 V = 0.30 x VCC, from onsemi MC74HC165A/D Rev. 13 p.4's published 3.0 V row. Same two-move history as key-release-time - see its threshold_note. SEPARATELY AND STILL CORRECT: tau is the PARALLEL combination, 4.4957 us, not 100 ohm x 47 nF = 4.7 us; the page stated 4.7 us beside a crossing time computed from 4.496. That correction is independent of the threshold question and stands."
    conservative_bound: "The TI-only pessimistic bound is V_IL = 0.825 V, giving 6.89 us. Margin inside the 250 us scan is 42x at 5.92 us and 36x at 6.89 us - the same answer."
    forbidden: ["`V_IL` at **5.7", "~1.4 µs / 176", "176× margin", "176x margin against", "at **6.89", "crosses `V_IL` at **6.89", "0.25 x VCC = 0.825", "0.25 × VCC = 0.825"]

