  - id: riso-ref-topology
    quantity: R-ISO-REF and the reference buffer's compensation network
    value: "Dual feedback per SBOS737C Figure 56: R_ISO 37.4 ohm, R_F 10 kohm taken at VS, R_Fx 100 ohm + C_F 1 nF at the op-amp output"
    status: settled
    owner: hardware/carrier/carrier.md
    derivation: "TI's Figure 56 (SBOS737C section 8.2.3 p.30, 'Precision Reference Buffer') is the worked answer for this exact circuit: R_ISO 37.4 ohm, R_F 1 Mohm at VOUT, R_Fx 10 kohm + C_F 39 nF at the op-amp output, 89 deg phase margin. IT TRANSFERS TO OUR 100 nF LOAD BECAUSE R_ISO IS SET BY Zo, NOT BY C_L: with feedback taken at the amplifier output above the handover, V_A/V_i = (1 + s.R_ISO.C_L)/(1 + s.(Zo+R_ISO).C_L), so both the attenuation R_ISO/(Zo+R_ISO) and the pole-zero ratio depend only on R_ISO/Zo - C_L moves both corners together and cancels. 37.4 ohm is Zo/10 against the specified Zo = 375 ohm (SBOS737C p.8). Simulated phase margin 85.9 deg at 896 kHz."
    adaptation: "R_F is 10 kohm, NOT TI's 1 Mohm, and R_Fx scales with it to preserve the 100:1 ratio. Two reasons, both absent from TI's circuit. (1) DC error: the guaranteed-over-temperature I_B of 5 nA through 1 Mohm is 5 mV = 1000 ppm = 3.4 LSB on a rail that IS the ratiometric scale factor; through 10 kohm it is 50 uV = 0.034 LSB. (2) Handover: R_F.C_F sets the frequency above which the loop closes on the amplifier's own output rather than on VS. TI's load is a pure capacitor, ours draws 10 mA, so above the handover any load-current change appears at VS across R_ISO. TI's 4.08 Hz would be a disaster; 10 kohm + 1 nF puts it at 15.9 kHz, well above the 500 Hz breath channel. |Z_out| at VS is then 1.20 ohm at 500 Hz against 27.7 ohm at TI's scaling."
    dc_error: "ZERO ACROSS R_ISO, BY TOPOLOGY. C_F blocks at DC so no current flows in R_Fx; input current is pA so none flows in R_F; the summing node therefore sits at V(VS) and the amplifier forces V(VS) = 5.000 V. R-ISO-REF's value and tolerance stop mattering. The 2% ratiometric objection that drove the old in-loop-vs-out-of-loop argument is ANSWERED, not traded away. Total buffer contribution is 0.19 LSB worst case (I_B.R_F 50 uV, V_OS 100 uV, V_OS drift 125 uV over 50 K)."
    robustness: "Phase margin stays above 76 deg across TI's entire published Zo range (73 ohm at 10 MHz to 3.26 kohm at 0.1 Hz, Figure 26) and across a 200x range of C_L (47 nF to 10 uF). So X7R DC-bias derating cannot destabilise it, and bulk capacitance may be added at VS later without recompensating - a 10 uF there costs 2.5 deg."
    forbidden: ["INSIDE THE LOOP, with feedback taken at the SENSOR", "R-ISO-REF` goes inside the loop", "2.6° of phase margin", "oscillation near 458 kHz", "R-ISO-REF,controller,10R", "R_F . C_F  >  R-ISO-REF . C_LOAD", "series R–C snubber from `VS`", "8.4 deg", "75.2 deg"]
    note: |
      DECIDED by preflight agent A4 2026-09-21
      (docs/review/2026-09-21-preflight/A4-carrier.md section 2), after
      cref-out-node unblocked it. The entry's original in-loop-vs-out-of-loop
      framing was a FALSE DICHOTOMY: Figure 56 takes R_F at VOUT, so it IS the
      in-loop topology with an AC path added, and the real question was never which
      side but whether the AC path exists.
      TWO PRIOR RESULTS CONFIRMED FROM AN INDEPENDENT MODEL, and one generalised.
      A4's behavioural model reproduces the no-resistor hazard (206 kHz / 1.5 deg
      against the corpus's 215 kHz / 8.8 deg) and the out-of-loop case (75.8 deg
      against 75.2). NEW: in-loop R_ISO buys nothing AT ANY VALUE - 1.5 deg at
      10 ohm and 1.5 deg at 37.4 ohm. The corpus's finding that in-loop is no
      better than no resistor is confirmed and generalised.
      MODEL VALIDATION: the same model run on Figure 56 as printed gives 87.4 deg
      against TI's published 89 deg - 1.6 deg apart. That is the strongest check
      available without a bench. STILL WORTH DOING before copper: rerun against
      TI's own OPA2197 macromodel, which models Zo explicitly. Note SPICE needs a
      leak resistor at the summing node for convergence and a real board does not -
      the amplifier's input leakage provides it.
