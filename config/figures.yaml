  - id: loadswitch-timer
    quantity: C-TIMER-LOADSW
    value: "10 uF"
    status: settled
    owner: hardware/module/power-entry.md
    derivation: "C = I_TIMER x t / 1.233 V. The 77 uA net ramp is CONFIRMED VERBATIM in the banked datasheet (164112fc p.8, datasheets/discrete-and-power/LT1641.pdf): TIMER is pulled to GND by a 3 uA source when the current-limit circuit is idle, and an 80 uA pull-up is connected while it is active, giving 77 uA/C_TIMER. ADI's own shorthand C(nF) = 62 x t(ms) gives 9.30 uF for 150 ms; the exact form gives 9.37 uF. SET TO 10 uF, the nearest stock value: 9.4 uF is not orderable, and the pull-up's bounds (-24/-80/-132 uA, p.2) make the fault time 587/160/95.6 ms at 10 uF, so the worst case is 95.6 ms against a 47.5 ms hot-plug start - 2.01x, where 9.4 uF gives 1.89x."
    provenance_note: "BLOCKED for four review waves and one dedicated researcher because analog.com was unreachable. Resolved 2026-09-21 from the Internet Archive's 2019-02-02 capture of analog.com; web.archive.org is reachable from this sandbox and was not in earlier waves. analog.com itself is still unreachable. Corroborated by the DC1354A demo quick-start guide, banked beside it."
    companion: "loadswitch-gate-cap and loadswitch-fb-divider come off the same document and were blocked on it."
    forbidden: ["C-TIMER-LOADSW at 10nF", "10 nF timer", "12x to 300x", "the reviewers disagree and the datasheet decides", "= 9.4 uF        provisional", "9.4 uF at the net", "2.4x the 62 ms", "2.4x the ~62ms"]
    false_positive_note: "10nF is also C-KEY's superseded value and appears in other rows. Match the refdes. 9.4 uF and 9.37 uF appear legitimately in text that explains why 10 uF was chosen instead - those lines carry refutation wording and the checker allows them."
    note: "The '12x to 300x' ratio is itself wrong - the page's own equation gives 37x to 925x, and bom.csv repeats the bad ratio so cross-checking finds false agreement. The '150 ms = 2.4x the 62 ms start' justification is ALSO retired: the 62 ms was integrated across the whole ramp, which is only true while FB is unconnected. With the divider fitted the sizing case is the 47.5 ms hot-plug."

  - id: loadswitch-gate-cap
    quantity: C-GATE-LOADSW and the ramp it programs
    value: "82 nF, ramp 49-197 ms (98 ms typ)"
    status: settled
    owner: hardware/module/power-entry.md
    derivation: "C = I_GATE / (dV/dt). I_GATEUP is -5 / -10 / -20 uA (164112fc p.2), corroborated independently by the DC1354A demo quick-start guide p.1 - the min/max this figure lacked. 82 nF (E24; 83 nF is not orderable) gives dV/dt = 61 / 122 / 244 V/s and a ramp to 12 V of 197 / 98 / 49 ms."
    forbidden: ["= 83 nF         provisional", "so ~83nF", "a ramp spec with an unbounded tolerance", "No min/max established"]
    note: "ADR 0005 specifies a 50-100 ms ramp and THAT SPEC IS NOT ACHIEVABLE with this part: I_GATE is a 4:1 window and no single capacitor holds it inside a 2:1 time window. 82 nF centres the typical inside ADR 0005; the guaranteed envelope is 49-197 ms. Raised against ADR 0005 2026-09-21, not decided."

  - id: loadswitch-fb-divider
    quantity: LT1641 FB divider, R-FB-HI / R-FB-LO
    value: "35.7 kohm / 5.11 kohm, both 1%"
    status: settled
    owner: hardware/module/power-entry.md
    derivation: "V_FB = 0.5 V (full 47 mV sense threshold) and V_FBH = 1.313 V (PWRGD release) are set by the SAME divider, so V_OUT(full limit) = 0.381 x V_OUT(PWRGD) always - the ratio is fixed by the part, not by the divider. Sized at the PWRGD end: PWRGD must release below the worst-case delivered output of ~11.36 V, so the nominal target is 10.5 V, giving R-FB-HI/R-FB-LO = 1.313/10.5 inverted = 7.00. 35.7k/5.11k is 6.986. PWRGD releases at 10.49 V (10.05-10.93 V worst case over 1% resistors and the 1.280-1.345 V V_FBH window); V_FB reaches 0.5 V at 3.99 V of output."
    provenance_note: "The foldback law is CONFIRMED VERBATIM against the banked 164112fc.pdf p.5 and Figure 7 p.9: 47 mV when V_FB is 0.5 V or higher, decreasing linearly to 12 mV at V_FB = 0 V. It was [web, search-index] until 2026-09-21."
    forbidden: ["R-FB-HI,module,TBD", "R-FB-LO,module,TBD", "VALUES NOT SET"]
    note: "FB was connected to NOTHING, which held the limit at 12 mV / 50 mohm = 240 mA forever and latched the -1 off on every start. ADI describes exactly this as the Figure 9 caption story (p.9). An unconnected FB is indistinguishable, to this part, from a permanently shorted output."

