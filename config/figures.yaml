  - id: cref-out-node
    quantity: Which side of the reference buffer C-REF-OUT sits on
    value: "REF5050 VOUT, i.e. the buffer's INPUT. The buffer drives 100 nF and nothing else."
    status: settled
    owner: hardware/carrier/breath-excitation-reference/breath-excitation-reference.md
    derivation: "The REF5050 cannot be built without a capacitor on its own VOUT, so one of the qty-2 parts is forced there and the other is the VIN bypass - which leaves nothing for the buffer's output. SBOS410O p.26 section 8.4.1, verbatim and re-verified against the banked PDF 2026-09-21: 'Confirm that a output capacitor (CL) is connected from VOUT to GND. For output stability, verify that the equivalent series resistance (ESR) value of CL less than or equal to 1.5 ohm.' Figure 8-6 annotates CL = 1uF to 50uF for REF50xxI, REF50xxAI. Independently: 10 uF on the buffer's output is 10000x the OPA2197's specified 1 nF capacitive-load limit (SBOS737C p.1 and section 7.3.5 p.22), which no document in the corpus ever intended."
    consequence: "The REF5050's only load is now the OPA2197's input bias current - +-5 pA typ, +-20 pA max at 25 C (SBOS737C p.7). Its load regulation (20 ppm/mA typ, 30 max, 50 over temperature, SBOS410O p.7) therefore contributes ZERO to the breath scale factor. On the other topology 10 mA of sensor current through 30 ppm/mA would have been 300 ppm = 1.0 LSB. Settling the node this way deletes an error term rather than budgeting it."
    forbidden: ["100nF + 10uF directly", "a 100 nF decoupler and `C-REF-OUT`'s 10 µF", "100 nF decoupler and C-REF-OUT's 10 µF", "plus C-REF-OUT's 10uF", "settle the node before", "Settle the node, then adopt"]
    note: |
