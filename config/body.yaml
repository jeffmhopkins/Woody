# ------------------------------------------------------------- hardware ----
hardware:
  # THE CASSETTE (owner, 2026-09-29; ADR 0025): the key plate and ONE bottom
  # plate, tied by a column at each of the key boards' eight corners, with the
  # two key boards and the main board between them. It is built and tested on
  # the bench with its ribbons plugged, dropped into the shell and bonded to the
  # oak top and bottom with silicone. Nothing screws into the wood but the
  # U-bolt. A COLUMN, from the bottom up:
  #   a PEM FHL-M2.5 stud pressed into the bottom plate, its head flush in the
  #   plate's underside (stud_*); a spacer (kb_spacer_*); the main board;
  #   an M2.5 female-female hex standoff threaded onto the stud, clamping the
  #   main board, faced to the gap up to the key board (col_standoff_*);
  #   the key board; a spacer (kb_spacer_*); the key plate; an M2.5 low-head
  #   screw down through the key plate into the standoff (col_screw_*), its head
  #   in a blind pocket in the oak top's underside (col_pocket_*).
  # The main board's END MOUNTS, at the mouth and a pair on the tongue: the
  # same stud, spacer and board, and a nut (mb_nut_*). An end mount with a
  # column within end_mount_merge_d is dropped; drc.echo gives the count.
  stud_hole:
    value: 2.5
    status: settled
    source: "the bottom plate's hole for a PEM FHL-M2.5 stud, 2.50 +0.08, punched or drilled, NOT deburred [datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf; installation, datasheets/mechanical/PEM-FH-SELF-CLINCHING-STUDS.pdf p.FH-18]"
  stud_head_d:
    value: 3.15
    status: settled
    source: "the FHL-M2.5 stud's head, 3.15 +/-0.40, flush in the bottom plate's underside, so the plate still lies flat on the oak [datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf]"
  stud_edge:
    value: 2.8
    status: settled
    source: "the FHL-M2.5 stud's least distance from its hole's centre to an edge of the sheet [datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf, 'min centerline-to-edge']. A thumb switch's cutout, a U-bolt leg's hole and the plate's outline are all edges (drc.echo 'bottom-plate studs clear of the plate's edges and cutouts')"
  stud_s:
    value: 2.1
    status: settled
    source: "the FHL-M2.5 stud's unthreaded length, max, from the head's face [datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf]. Below a 1.2 plate it ends inside the spacer, so the main board and the standoff meet thread (drc.echo 'bottom-plate studs: unthreaded shank ends inside the spacer')"
  stud_attached_hole:
    value: 2.9
    status: settled
    source: "the largest hole PEM allows in the part that bears on the sheet round an FHL-M2.5 stud - here the spacer's bore [datasheets/mechanical/PEM-FH-SELF-CLINCHING-STUDS.pdf p.FH-7]"
  stud_l:
    value: 10
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): the stud chosen is the FHL-M2.5-10ZI, length code 10 from the head's face (stocked 6, 8, 10, 12, 15, 18 [datasheets/mechanical/PEM-FH-SELF-CLINCHING-STUDS.pdf p.FH-7]): the bottom plate + spacer + main board, and thread_engage_min diameters into the column standoff, at the stud's shortest [calc: 1.2 + 1.3 + 1.6 + 1.5 x 2.5 + 0.4 = 8.25, so 10; 8 gives 3.5 of the 3.75 wanted]. One length for every mount: at an end mount it leaves thread past the nut. drc.echo 'column: stud thread in the standoff', 'end mounts: stud thread past the nut'. The part is datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf"
  stud_l_tol:
    value: [-0.4, 0.4]
    status: settled
    source: "the FHL stud's length tolerance, 10.00 +/-0.40 [datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf]"
  m25_pitch:
    value: 0.45
    status: settled
    source: "M2.5 coarse thread pitch [datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf, 'M2.5 x 0.45']"
  stud_torque:
    value: 0.32
    status: settled
    source: "the most torque to put on a nut, or on a standoff threaded onto it, on an FHL-M2.5 stud in 1.2 mm aluminium, N.m; PEM tested push-out 285 N, torque-out 0.55 N.m in that sheet (HRB 33) [datasheets/mechanical/PEM-FH-SELF-CLINCHING-STUDS.pdf p.FH-31, metric table]. FHL is rated for aluminium to HRB 80 / HB 150 [p.FH-7], which takes 5052 and 6061 alike"
  thread_engage_min:
    value: 1.5
    status: tbd
    source: "the least thread engagement in the column standoff, in diameters of the M2.5 thread, for the stud from below and the screw from above [from memory: 1.5 x d, the owner's brief of 2026-09-29 gives it as a reasonable minimum] (drc.echo 'column: stud thread in the standoff', 'column: screw thread in the standoff')"
    decided_by: "M4, with the standoff's material known: a soft aluminium thread wants more than brass or steel"
  kb_plate_t_tol:
    value: [-0.05, 0.05]
    status: nominal
    source: "a plate's thickness tolerance, key plate and bottom plate: the switch's own plate-slot tolerance (`plate-thickness`, config/figures.yaml), which a plate bought to that register must meet. It enters each board's depth because the spacer bears on the plate's inside face while the switch seats on its outside one"
  kb_board_hole:
    value: 2.7
    status: nominal
    source: "M2.5 clearance through the key boards and the main board, ISO 273 fine [from memory]: each board locates on its columns and studs, so the fine fit"
  kb_spacer_l:
    value: 1.3
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): a plain metal spacer for M2.5, flat both ends, faced to this length, the only thing between a plate and its board at a mount: the switches' housing below the plate, which the board is pressed against [calc: 2.50 - 1.20]. The switches hold the gap only where they are; at a mount there is no switch, and without the spacer the clamp would pull the board up into the plate (owner, 2026-09-29). The same part, faced alike, stands under the key plate on every column (MECH-KB-SPACER) and on the bottom plate under the main board at every mount (MECH-MB-SPACER); its bore, at most stud_attached_hole, matters on the bottom plate, where it bears on the stud's sheet. NOT STOCKED at this length: face Ettinger 5.52.015 (M2.5, 1.5 long, bore 2.6 [datasheets/mechanical/ETTINGER-CATALOG-2024-P79-DISTANZHUELSEN-MESSING.html]) down to it within kb_spacer_l_tol, in metal, not printed, which would creep under the clamp; measure each one faced"
  kb_spacer_l_tol:
    value: [-0.05, 0.05]
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): the faced spacer's length tolerance, held when it is faced (kb_spacer_l) and checked with calipers on each one"
  kb_spacer_od:
    value: 4.5
    status: nominal
    source: "the Ettinger 5.52 spacer's outside diameter, 4.5; its bore is 2.6, inside stud_attached_hole [datasheets/mechanical/ETTINGER-CATALOG-2024-P79-DISTANZHUELSEN-MESSING.html]. On a key board it bears on the board's top copper, which keeps copper out from under it; on the main board it bears on a PWR_GND pad on the underside, which grounds the bottom plate (ADR 0022 point 6, ADR 0025)"
  # THE COLUMN STANDOFF: not a stock length, so bought at the next stock
  # length and faced, as ADR 0023 does for the module's MECH-STANDOFF-MOD. Its
  # length is the gap from the main board's top face to a key board's underside
  # (drc.echo 'column standoff length (derived)'), and because it is the one
  # part in the cassette's height that is made to length, it is also where the
  # cassette is fitted to the shell (drc.echo 'cassette height at the hardware's
  # tolerance limits').
  col_standoff_af:
    value: 5.0
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): an M2.5 female-female hex standoff, 5 mm across its flats, the common M2.5 hex and the same as the ISO 4032 nut (mb_nut_e). Its across-corners, af / cos 30, stands on the main board's top face and under the key board, and both boards keep copper and parts out from under it. Buy to it (MECH-COL-STANDOFF)"
  col_standoff_stock_l:
    value: 20
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): the stocked M2.5 female-female length it is faced down from, the next one above the gap (drc.echo 'column standoff length (derived)'; the common series steps 15, 18, 20). drc.echo 'column standoff faced from its stock length'"
  col_standoff_l_tol:
    value: [-0.05, 0.05]
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): the faced standoff's length tolerance, held as the spacers' is (kb_spacer_l_tol) and checked with calipers on each one"
  col_screw_head_d:
    value: 4.5
    status: tbd
    source: "an M2.5 low-head cap screw's head, DIN 7984 [from memory; ISO 7380 is 4.7]. It bears on the key plate's top face round col_plate_hole and sits in col_pocket_d"
    decided_by: "M4, with the screw bought (MECH-COL-SCREW)"
  col_screw_head_h:
    value: 1.5
    status: tbd
    source: "the same head's height [from memory: DIN 7984 M2.5, 1.5]. It sets the pocket's depth in the oak top (drc.echo 'column screw pockets leave wood over them')"
    decided_by: "as col_screw_head_d"
  col_screw_l:
    value: 10
    status: settled
    source: "owner, 2026-10-05: 'I think our standoffs are solidified' (ADR 0025, Amendment 2026-10-05): the column screw's length under its head, M2.5 x 10 (MECH-COL-SCREW): the key plate + spacer + key board, and thread_engage_min diameters into the standoff, at the screw's shortest [calc: 1.2 + 1.3 + 1.6 + 1.5 x 2.5 + 0.3 = 8.15, so 10; 8 gives 3.6 of the 3.75 wanted]. drc.echo 'column: screw thread in the standoff', and 'column: stud and screw ends apart in the standoff'"
  col_screw_l_tol:
    value: [-0.3, 0.3]
    status: tbd
    source: "a 10 mm screw's length tolerance, js15 [from memory: ISO 4759-1, +/-0.29 over 6-10 mm]"
    decided_by: "as col_screw_head_d"
  col_plate_hole:
    value: 2.9
    status: nominal
    source: "M2.5 clearance through the key plate, ISO 273 medium [from memory]: the key plate and the key boards are one part once the switches are soldered, and each board locates on its columns by the fine hole (kb_board_hole), so the plate takes the medium one; the screw's head (col_screw_head_d) bears on the plate round it"
  col_web_min:
    value: 4.0
    status: settled
    source: "the least aluminium between a column's hole and the nearest switch cutout, in both plates: the key plate's screw hole (col_plate_hole) and the bottom plate's stud holes (stud_hole), against the cutout as cut, its corners rounded (switch.cutout_r). Owner, 2026-10-05, on the plates' rigidity at the columns, approving 4.0: 'Go through recommendations. That sounds fine' (issue #43; ADR 0025, Amendment 2026-10-05 (2)). A third of a plate thickness over 3 (`plate-thickness`, config/figures.yaml), twice the usual sheet-metal rule of a hole at least two thicknesses from an edge [from memory - no banked figure]; on the bottom plate it keeps the spacer's bearing circle (kb_spacer_od, off its axis by kb_mount_float) more than two plate thicknesses inside the metal [calc: stud_hole / 2 + 4.0 - (kb_spacer_od / 2 + kb_mount_float) = 1.25 + 4.0 - 2.45 = 2.8]. drc.echo 'column holes: plate web to the switch cutouts'; boards.kb_end_margin is set by it"
  col_pocket_d:
    value: 6.35
    status: nominal
    source: "the blind pocket in the oak top's underside over each column screw's head: 1/4 in, a stock Forstner size, which leaves a flat floor (the size ADR 0020 Amendment 3 chose for the same job). Clears the head (col_screw_head_d) with room to spare; the pocket only houses the head, which bears on the plate"
  col_pocket_clear:
    value: 0.5
    status: nominal
    source: "the pocket's depth past the screw head's top [drawing convention]"
  col_pocket_skin:
    value: 2.0
    status: tbd
    source: "the least wood left over a pocket, between its floor and the playing face: enough not to telegraph or crack through in hardwood [from memory - no banked figure] (drc.echo 'column screw pockets leave wood over them')"
    decided_by: "M2 - pocket a scrap of the chosen wood and sand its face"
  col_pocket_wall:
    value: 1.5
    status: tbd
    source: "the least wood left between a pocket and a cap slot, a side groove or the window's rebate [from memory - no banked figure] (drc.echo 'column screw pockets clear of the wood top's cuts'; the tail corners set boards.kb_tail_margin, 'key-board tail margin, least')"
    decided_by: "M2 - pocket a scrap of the chosen wood beside a slot"
  # THE MATRIX CARRIER HANGS FROM THE OAK TOP (owner, 2026-10-03: "Hang from the
  # lid"; ADR 0021 amendment 2026-10-03). At each of its three mounts, from the
  # top: a threaded insert set in the oak's underside; a spacer; the carrier; a
  # washer; and a low-head screw up through them into the insert. The stack
  # sets the Matrix's height (boards.matrix_hdr_h above the carrier), so the
  # carrier lifts off with the lid and unplugs at J-MCU. drc.echo 'Matrix
  # carrier hangs from the oak' holds the thread, the wood and the height.
  mx_insert_l:
    value: 4.0
    status: nominal
    source: "MECH-MX-INSERT, CNC Kitchen M2.5 x 4.0 brass threaded insert: L 4.0, D1 4.6, D2 3.9 [web: datasheets/mechanical/CNCKITCHEN-M2.5x4-THREADED-INSERT-3DJAKE.html]. The shortest stocked M2.5 insert: the 5.7 mm ruthex one would leave 0.3 of the 6 mm oak over it. Set flush with the oak's underside"
    decided_by: "an insert set in a scrap of the chosen oak and pulled"
  mx_insert_od:
    value: 4.6
    status: nominal
    source: "the same insert's knurl, D1 4.6 [web: datasheets/mechanical/CNCKITCHEN-M2.5x4-THREADED-INSERT-3DJAKE.html]. Its hole in the oak is the maker's D3, 4.0, the knurl pressed or epoxied into the wood"
  mx_insert_hole:
    value: 4.0
    status: nominal
    source: "the insert's hole in the oak, the maker's recommended D3, 4.0, drilled mx_insert_l deep from the underside (oak-inserts.dxf) [web: datasheets/mechanical/CNCKITCHEN-M2.5x4-THREADED-INSERT-3DJAKE.html]"
    decided_by: "an insert set in a scrap of the chosen oak"
  mx_spacer_l:
    value: 4.0
    status: settled
    source: "MECH-MX-SPACER, Ettinger 5.52.043, brass spacer for M2.5, D 4.5, d 2.6, L 4.0 [ds mechanical/ETTINGER-CATALOG-2024-P79-DISTANZHUELSEN-MESSING.html] - the series MECH-KB-SPACER is from, bought at length, not faced"
  mx_spacer_od:
    value: 4.5
    status: settled
    source: "the same spacer's D [ds mechanical/ETTINGER-CATALOG-2024-P79-DISTANZHUELSEN-MESSING.html]"
  mx_washer_t:
    value: 0.5
    status: nominal
    source: "MECH-MX-WASHER, DIN 433 M2.5 washer, h 0.5, d2 5.0 [from memory: DIN 433 table] - under the screw's head, on the carrier's underside; with it the screw's thread in the insert lands between thread_engage_min and the insert's length (drc.echo 'Matrix carrier hangs from the oak'). Under the head, not above the carrier, so the carrier stands as high as it can and the Matrix ribbon's folds have room under it"
    decided_by: "the washer bought, measured"
  mx_washer_od:
    value: 5.0
    status: nominal
    source: "the same washer's d2 [from memory: DIN 433 M2.5]; it bears on the carrier's underside, which keeps that circle clear of other copper (the mounts' underside bearing; the spacer's is the top's)"
    decided_by: "as mx_washer_t"
  mx_screw_l:
    value: 10
    status: settled
    source: "MECH-MX-SCREW, the column's M2.5 x 10 low-head screw (col_screw_l, MECH-COL-SCREW's part), up through the washer, the carrier and the spacer into the insert: 10 - 0.5 - 1.6 - 4.0 = 3.9 of thread in the insert's 4.0 [calc]"
  mb_nut_e:
    value: 5.77
    status: nominal
    source: "ISO 4032 M2.5 hex nut across its corners, at its largest: s max 5.0 / cos 30 = 5.77 [calc from datasheets/mechanical/ASPEN-ISO4032-DIN934-HEX-NUT-DIMENSION-TABLE.pdf, whose e is the minimum, 5.5]. On the main board's end mounts; it bears on a PWR_GND pad on the top face (ADR 0022 point 6)"
  mb_nut_m:
    value: 2.0
    status: nominal
    source: "the same nut's height, m max 2.0 [datasheets/mechanical/ASPEN-ISO4032-DIN934-HEX-NUT-DIMENSION-TABLE.pdf]"
  kb_mount_float:
    value: 0.2
    status: nominal
    source: "how far a spacer or a standoff can sit off its axis: (the bore - the thread) / 2 - the spacer's 2.6 (+0.1) on an M2.5 gives at most 0.1 [calc from the catalogue under kb_spacer_od]; held at 0.2, and every PCB keep-out grows by it on every side"
  end_mount_merge_d:
    value: 12
    status: settled
    source: "an end mount is dropped when a column's mount stands within this distance of it: the column already holds the board there, and two studs side by side add a part and a hole for no support (owner, 2026-09-30: \"there's one spot where we have double standoffs right next to each other ... Good to reduce it to the one standoff there\"). The mouth end mount at (32.5, 45.5) stood 7.5 from the column at (40, 45.9); the nearest any other end mount comes to a column is 28.5 [calc from mechanical/export/pcb-geometry.echo at 064c49f: hypot(40 - 32.5, 45.9 - 45.5) = 7.51; hypot(40 - 11.5, 11.1 - 11.5) = 28.50]. 12 is about two mount keep-outs (mb_keep_d, 6.57 [calc: 6.17 + 2 x 0.2]) and sits well between the two; drc.echo reports each end mount dropped"
  kb_mount_inset:
    value: 3.6
    status: tbd
    source: "a column's centre in from both edges of its key board: the standoff across its corners (col_standoff_af / cos 30) and kb_mount_float, with 0.5 of board outside the keep-out [calc: 5.77 / 2 + 0.2 + 0.5 = 3.585]"
    decided_by: "M4, with the board's first fit"
  # THE U-BOLT IS M3 until the strap hardware is chosen. Its nuts stand on
  # the main board's top face and keep boards.board_clear round their corners.
  # The LED strip that held it to M3 is gone (ADR 0028): the LED row is shifted
  # so the station falls midway between two LEDs, so a bigger nut's keep-out
  # reaches nothing on the centreline (drc.echo 'LED row off the U-bolt
  # station'). What bounds it now is the neck of board between the legs
  # ('main board neck at the U-bolt station') and the thumb recesses.
  # Load: ADR 0009's mass table puts the body at ~825 g, ~8 N on the strap;
  # a factor of 10 for a jerk is 80 N. An M3 leg of 4.6 steel proofs at
  # ~1.1 kN [from memory: 5.03 mm2 stress area x 225 MPa], and there are two.
  # Up each leg: the oak bottom, the bottom plate, a spacer, the main board, a
  # washer, the nyloc. The bottom plate spreads the pull over the oak.
  ubolt_rod_d:
    value: 3.0
    status: tbd
    source: "M3 [calc above]; ADR 0009 gives no U-bolt size. No longer bounded by the lights (ADR 0028); M4 or M5 must still leave the neck ('main board neck at the U-bolt station') and clear the thumb recesses"
    decided_by: "M4, from the strap hardware chosen - small M3 U-bolts are sold for model and tube clamps [from memory]; a bent M3 rod or a stainless M3 threaded rod does the same job"
  ubolt_hole_clear:
    value: 0.5
    status: tbd
    source: "clearance on the leg's diameter, in the oak bottom and the bottom plate"
    decided_by: "M4, with the U-bolt bought"
  ubolt_span:
    value: 20.0
    status: tbd
    source: "leg centre to leg centre, legs across the body. Narrower pulls the nuts toward the centreline and shrinks the neck between the legs; wider takes the legs toward the thumb recesses (drc 'U-bolt legs clear of the thumb recesses') and the main board's edge"
    decided_by: "M4"
  ubolt_drop:
    value: 18.0
    status: tbd
    source: "placeholder - how far the loop stands below the bottom face"
    decided_by: "M4"
  ubolt_nut_af:
    value: 5.5
    status: tbd
    source: "hex nut across flats for the U-bolt legs - an M3 nut is 5.5 mm [from memory, ISO 4032]; follows ubolt_rod_d"
    decided_by: "M4, with the U-bolt bought"
  ubolt_nut_h:
    value: 4.0
    status: tbd
    source: "M3 nyloc (DIN 985) height, ~4.0 [from memory] - hardware/unplaced.csv MECH-UBOLT orders nylocs; a plain ISO 4032 nut is 2.4"
    decided_by: "M4"
  ubolt_spacer_od:
    value: 6.0
    status: nominal
    source: "the spacer on each U-bolt leg between the bottom plate and the main board's underside: Ettinger 5.53.015, brass for M3, outside 6.0, bore 3.2, 1.5 long [datasheets/mechanical/ETTINGER-CATALOG-2024-P79-DISTANZHUELSEN-MESSING.html], faced to kb_spacer_l like every other spacer on the plates, so the board is not pulled down by the nyloc (drc 'main board in the U-bolt's clamp')"
  ubolt_washer_t:
    value: 0.5
    status: tbd
    source: "DIN 433 M3 washer, 0.5 thick [from memory], one per leg between the main board's top face and the nyloc"
    decided_by: "M4, with the washers bought"
  ubolt_washer_od:
    value: 6.0
    status: tbd
    source: "DIN 433 M3 washer, outside diameter 6.0 [from memory] - the small-OD series, so it bears on the board inside the nut's keep-out"
    decided_by: "M4, with the washers bought"
  ubolt_board_hole_clear:
    value: 1.0
    status: tbd
    source: "clearance on the rod's diameter in the main board's hole. The board is located by its own mounts and the legs by the oak's and the bottom plate's holes, so the hole takes both tolerances; the washer above and the spacer below cover it (bore 3.2, outside 6.0)"
    decided_by: "M4, with the oak drilled and the board in hand"

# -------------------------------------------------------------- routing ----
# THINGS THAT RUN THROUGH THE CAVITY (modelled 2026-09-26 for the clash
# check). Where they run is a MODEL CHOICE, not a document's - each is a
# lane the design must keep free, and the clash check reports what is in it.
routing:
  # THE BREATH TUBE (owner, 2026-10-05; ADR 0003 amendment of that date): ONE
  # clear silicone tube from the inlet's inner barb to U-BREATH's P1, no trap.
  # It runs from the barb along the inlet's axis, swings toward the near side
  # and turns back onto P1 (which faces the tail) in one U at tube_bend_r; it
  # may cross the LED row, because it is clear.
  tube_id:
    value: 2.38
    status: settled
    source: "3/32 in ID [calc: x 25.4]: grips both the inner barb (inlet.inner_barb_a, a 3/32 in 12843) and P1's barb, 2.79-3.30 OD [ds MPXV4006DP p.7, boards.sensor_port_d] (BOM TUBE)"
  tube_od:
    value: 5.56
    status: nominal
    source: "3/32 x 7/32 in clear silicone, a common size [from memory: 7/32 in x 25.4] - the tube bought sets it"
    decided_by: "the tube bought (BOM TUBE)"
  tube_bend_r:
    value: 9.5
    status: tbd
    source: "the least centreline bend radius the clear tube takes without kinking - about 1.7 x its OD for soft silicone [from memory]; the model bends it at exactly this, and drc.echo 'breath tube bends no tighter than routing.tube_bend_r' says so"
    decided_by: "bending the tube bought around a mandrel until it kinks, at M4"
  tube_lane:
    value: "left"
    status: tbd
    source: "the side of the mouth band the sensor is NOT on (ADR 0017: sensor on the far side from the tube); there are no looms since ADR 0017. Since issue #36 the breath tube leaves the inlet on its axis, the mouth cap's centre, and swings toward this side before turning back onto P1 (routing.tube_*)"
    decided_by: "M4"
  # STANDARD FLAT RIBBON (owner, 2026-09-26), lying FLAT down the centreline
  # (on edge it does not fit between the boards' part layers - clash check).
  mcu_ribbon_w:
    value: 15.24
    status: tbd
    source: "24-way 0.635 mm ribbon for a 1.27 mm dual-row header [calc: 24 x 0.635]: allocation in hardware/carrier/bom.csv CBL-MCU-RIBBON (ADR 0018)"
    decided_by: "M4"
  mcu_ribbon_t:
    value: 0.64
    status: settled
    source: "CBL-MCU-RIBBON's flat cable, 3M 3754 (0.025 in pitch, 30 AWG): .025 +/- .003 in thick [ds connectors/3M-3754-FLAT-CABLE-0.025IN-30AWG-PVC.pdf, sheet 2]"
  chain_ribbon_w:
    value: 7.62
    status: nominal
    source: "[calc] 12 conductors at 0.635 mm, the FFSD cable's 1.27 mm IDC pitch over two rows"
    decided_by: "M4, with the cable"
  chain_ribbon_t:
    value: 0.8
    status: tbd
    source: "30 AWG flat cable's thickness [from memory]"
    decided_by: "M4, with the cable"
  chain_bend_r:
    value: 1.0
    status: tbd
    source: "the tightest turn the flat cable takes where it leaves a socket and turns along the body, and the least the fold may be (drc.echo 'key-chain ribbon fold no tighter than its bend radius') [drawing convention; 30 AWG PVC flat cable folds flatter than this]"
    decided_by: "M4, on the first cable"
  chain_service:
    value: "raised"
    status: nominal
    source: "owner, 2026-09-27: long enough 'to have the top off and still connect the ribbon before tightening down'. With the cassette (ADR 0025), 'tightening down' is screwing the key plate onto its columns, on the bench or, in service, with the oak top cut off. The key plate, with both key boards on it, is held raised straight up off the columns by routing.chain_raise while the main board's sockets are plugged or unplugged, then lowered and screwed down; the ribbon folds itself into the hairpin. A ribbon long enough to lay the plate beside the body would close into a hairpin that reaches the left-hand board's tail column (drc.echo 'key-chain ribbon hairpin clear of the columns')"
    decided_by: "owner"
  chain_raise:
    value: 30.0
    status: tbd
    source: "how far the key plate is held above its columns for a hand to reach the main board's sockets under the key boards and plug or unplug them [drawing convention: two fingers and an IDC socket]. With routing.chain_slack it sets the ribbon's length (drc.echo 'key-chain ribbon length (derived)')"
    decided_by: "M4, on the first assembly"
  chain_slack:
    value: 10.0
    status: tbd
    source: "length added to the service path for the turns at the sockets and the hand [drawing convention]"
    decided_by: "M4, on the first assembly"
  chain_fold:
    value: [1, 1]
    status: nominal
    source: "which way each ribbon's spare length folds closed, along the body (+1 toward the tail), for left_hand and right_hand: the left hand's mouth side has the breath tube's crossing; on the right hand, chain_clear keeps the tail side off the regulator block, and each hairpin must stop short of its board's columns (drc.echo 'key-chain ribbon hairpin clear of the columns', clash.txt)"
    decided_by: "the clash check"
  ribbon_t:
    value: 1.0
    status: nominal
    source: "flat ribbon thickness, 1.27 mm pitch PVC ribbon [from memory]"

# ------------------------------------------------------------ lighting ----
lighting:
  # THE LEDS (ADR 0028, amended 2026-10-03): WS2815B-V1 reflowed on the main board's top
  # face, LEDs up, lighting both acrylic sides through the cavity. ONE ROW down the
  # centreline at one pitch, with EQUAL MARGINS to the main board's two ends (the owner,
  # 2026-10-03: "all the 14 LEDs equidistant from board extents, and rework all components
  # around them"). The pitch is DERIVED, not set here: woody_body.scad spreads led_slots
  # places over the board with half a pitch at each end where it can, and the breath sensor
  # holds the mouth-end place further in, so both margins take that (drc.echo 'LED row on
  # the main board' prints the pitch and the margins). led_count LEDs fill the places from
  # the mouth end; the tail-end place is empty (the owner, the same day: "Keep current
  # layout, remove bottom one"). Numbered along the data line: LED 1 at the tail end, where
  # the data arrives; LED led_count at the mouth end.
  led_count:
    value: 13
    status: settled
    source: "owner: thirteen, 2026-09-30 (ADR 0028), the count the 60/m strip gave over the same run; a fourteenth, 2026-10-02 ('Add it', ADR 0028 amendment), in the row 2026-10-03; thirteen again later that day, the tail-end one removed: 'remove that bottom led again' / 'Keep current layout, remove bottom one' (ADR 0028 amendment, second of 2026-10-03)"
    decided_by: "the side-light diffusion test (ROADMAP): the count, and through the board's length the pitch it gives"
  led_slots:
    value: 14
    status: settled
    source: "the places the row's pitch and margins are set by (woody_body.scad led_pitch): fourteen, the row as laid out with equal margins on 2026-10-03, when the owner then removed its tail-end LED and kept the rest where they stood ('Keep current layout, remove bottom one', ADR 0028 amendment, second of 2026-10-03). led_count LEDs fill them from the mouth end"
    decided_by: "the side-light diffusion test (ADR 0028): with led_count, the pitch and where the row ends at the tail"
  led_view_angle:
    value: 120
    status: tbd
    source: "degrees, the full angle of the WS2815B-V1's emission cone, for the shading NOTE in drc.echo ('tall parts in the LEDs' cone'): a 5050 PLCC's typical viewing angle [from memory - the banked datasheets/led/WS2815B-V1.pdf publishes none]"
    decided_by: "the side-light diffusion test (ADR 0028)"
  led_body:
    value: [5.4, 5.0]
    status: settled
    source: "the WS2815B-V1's body along the body and across it, 5.40 +/-0.05 x 5.00 +/-0.05 [ds datasheets/led/WS2815B-V1.pdf p.2]"
  led_h:
    value: 1.65
    status: settled
    source: "the WS2815B-V1's height above the board, 1.65 +/-0.05 [ds datasheets/led/WS2815B-V1.pdf p.2]"
  led_court:
    value: [7.6, 6.1]
    status: settled
    source: "a centred rectangle round the footprint's courtyard, woody:LED_WS2815B-V1_PLCC6_5.4x5.0mm_P1.6mm [repo hardware/lib/woody.pretty]: the courtyard is x -3.45..3.80 and y -2.75..3.05 (7.25 x 5.80), off centre where it takes in the silk chamfer mark, so this is twice its larger half each way [calc: 2 x 3.80, 2 x 3.05], which covers it at either rotation"

# --------------------------------------------------------- fabrication ----
# WHAT THE SHOPS ARE TOLD (issue #42; mechanical/fab/README.md). Read by
# tools/fab.py into each part's drawing (mechanical/fab/*.pdf). The plate
# thickness is not here: it is config/key-layout.yaml's, the register's
# `plate-thickness`. The oak parts' thickness is the model's (the flush rule,
# stack above; ends.*_cap_t).
fabrication:
  revision:
    value: "A"
    status: settled
    source: "owner 2026-10-04: the layout is final for rev A (ADR 0010, Amendment 2026-10-04; ROADMAP M3: 'Rev A goes ahead on the current layout'). A change the rev A parts in hand find is rev B"
  plate_alloy:
    value: "aluminium, 5052 or 6061"
    status: nominal
    source: "PLATE-TOP and PLATE-BOTTOM are '1.20mm aluminium' and name no alloy. Either takes the PEM FHL studs, which are rated for aluminium to HRB 80 / HB 150 [datasheets/mechanical/PEM-FH-SELF-CLINCHING-STUDS.pdf p.FH-7] (hardware.stud_torque). Whichever the vendor stocks at the plate thickness"
  plate_finish:
    value: "un-anodised (mill finish)"
    status: settled
    source: "PLATE-TOP and PLATE-BOTTOM: both plates carry PWR_GND through bare metal - the column screws' heads on the key plate's top face, the studs' clinch and the spacers' faces on the bottom plate (ADR 0025) - so they are ordered un-anodised"
  plate_profile_tol:
    value: [-0.13, 0.13]
    status: nominal
    source: "the plates' profile and hole tolerance: a laser or waterjet shop's usual figure in thin aluminium [from memory], the one stack.plate_side_clear allows for"
  cutout_tol:
    value: [-0.02, 0.05]
    status: settled
    source: "[ds] the switch cutout, 14.00 +0.05/-0.02 square, off Gateron's own drawing for the KS-33 (datasheets/mechanical/GATERON-KS-33-VENDOR-SPEC-DRAWING.pdf; the register's `plate-thickness` note; PLATE-TOP). Tighter than plate_profile_tol: config/key-layout.yaml says the cutter's kerf decides it, on a coupon"
  stud_hole_tol:
    value: [0, 0.08]
    status: settled
    source: "[ds] the PEM FHL-M2.5 stud's mounting hole, hardware.stud_hole +0.08 (datasheets/mechanical/PEM-FHL-M2.5-10ZI-SALES-DRAWING.pdf)"
  wood_species:
    value: "hardwood, the owner's choice (the parts are named oak)"
    status: tbd
    source: "ADR 0009, 'The species is open' - the owner: 'I'll probably use a harder wood, but it really doesn't matter for the design aspect'. The cross-grain movement the cap clearance (stack.cap_clear) is argued from assumes oak"
    decided_by: "the owner, before the wood is ordered"
  wood_finish:
    value: "stained a very dark ebony, the grain still showing, under a satin oil finish"
    status: settled
    source: "owner, 2026-09-28 (ADR 0009, 'Finishes'; BODY-OAK)"
  wood_profile_tol:
    value: [-0.2, 0.2]
    status: nominal
    source: "the oak parts' profile tolerance on a CNC router in hardwood [drawing convention]; the cap slots' clearance (stack.cap_clear) is several times it"
  wood_depth_tol:
    value: [-0.1, 0.1]
    status: nominal
    source: "the oak parts' pocket, groove and rebate depths from the face named [drawing convention]; drc.echo 'column screw pockets leave wood over them' has margin over it"

  # THE ACRYLIC (owner, 2026-10-05: "acrylic needs to have its own files when
  # cut"): the two sides (SIDE-ACRYLIC) and the Matrix window (MECH-WINDOW).
  # Their thicknesses are stack.side_t and openings.matrix_acrylic_t.
  acrylic_material:
    value: "acrylic (PMMA) sheet"
    status: nominal
    source: "SIDE-ACRYLIC and MECH-WINDOW are 'frosted acrylic' and name no grade; cast or extruded both laser-cut cleanly [from memory]"
  side_tint:
    value: "dark grey"
    status: settled
    source: "owner, 2026-09-28 (ADR 0009, 'Finishes'; SIDE-ACRYLIC). How much of the side LEDs' light it passes sets their drive (ADR 0014)"
  side_surface:
    value: "frosted"
    status: settled
    source: "ADR 0009: the sides are frosted, edge-lit by the LED row (ADR 0014); SIDE-ACRYLIC"
  side_frosted_face:
    value: "outside face"
    status: tbd
    source: "which face of a sheet frosted on one face goes outward; no document chooses [from memory: matte outward hides handling marks, matte inward diffuses the same]"
    decided_by: "the tint sample under the chosen LEDs, before the sheet is ordered (SIDE-ACRYLIC; ADR 0009 'Finishes')"
  window_tint:
    value: "colourless"
    status: tbd
    source: "MECH-WINDOW is 'frosted acrylic' and names no tint; the sides' dark grey would dim the Matrix [from memory]"
    decided_by: "M6, the diffusion prototype (MECH-WINDOW)"
  window_surface:
    value: "frosted"
    status: settled
    source: "owner, 2026-09-26: frosted, knowing it softens the pixels at this distance from the LEDs (ADR 0009; MECH-WINDOW)"
  window_frosted_face:
    value: "top face"
    status: tbd
    source: "which face of a sheet frosted on one face is up, flush with the oak; no document chooses"
    decided_by: "M6, the diffusion prototype (MECH-WINDOW)"
  acrylic_edge:
    value: "as laser cut"
    status: nominal
    source: "[drawing convention] no acrylic edge is seen: the sides' long edges stand in the oak grooves and their ends against the caps, and the window's edges sit in its rebate"
  acrylic_profile_tol:
    value: [-0.1, 0.1]
    status: nominal
    source: "a laser cut in acrylic [from memory]; inside stack.groove_clear for the sides and the window's clearance in its rebate"
  # ROUNDED CORNERS (owner, 2026-10-05, issue #43: "round all corners that we
  # can, not drastically but enough to enable them to not be a hazard and to be
  # more structurally sound"). Every cut part's outline and through-cut, except
  # where a corner mates with something; ADR 0025, Amendment 2026-10-05 (2),
  # lists which.
  corner_r_outer:
    value: 1.0
    status: nominal
    source: "the radius on every outside corner of a cut part - the plates' outlines and the corners where a window opens to a plate's edge, the acrylic sides, the points of oak between a cap slot's holes - owner, 2026-10-05: 'round all corners that we can, not drastically but enough to enable them to not be a hazard and to be more structurally sound' (issue #43). 1 mm takes the point off a sheet's corner [from memory: the usual deburr-and-break-corners note on a sheet-metal drawing is 0.5 to 1], is the key boards' own corner (kb_corner_r in woody_body.scad)"
    decided_by: "M4, on the first parts cut"
  corner_r_inner:
    value: 1.6
    status: nominal
    source: "the radius in every inside corner of a through-cut or a cut a part fits into - the bottom plate's windows and notches, the oak top's cap slots and window opening, the oak bottom's thumb recesses, the window's rebate - owner, 2026-10-05, as fabrication.corner_r_outer (issue #43). The oak is cut on a CNC router (wood_profile_tol), which cannot cut an inside corner tighter than its bit's radius: 1.6 takes a 1/8 in (3.175 mm) end mill, the usual small bit for hardwood profiles [from memory]. The laser or waterjet that cuts the aluminium and the acrylic does any radius over its kerf, so one figure serves every material. The switch cutouts are the exception: their radius is switch.cutout_r, which the switch's fit sets"
    decided_by: "M4, the oak shop's smallest bit"
# ---------------------------------------------------------------- logo ----
logo:
  # THE MAKER'S MARK ON THE OAK TOP (owner, 2026-10-01: "Logo should be here,
  # scale as appropriate", pointing at the plain oak between the mouth cap's
  # seam and LH1's cap slot; earlier, "use main's newest branding for the logo
  # on the top of the controller, above the LH keys, between the keys and the
  # end of the instrument"). The mark is branding/'s, which owns its artwork,
  # its size at 100 % and its clearances (branding/export/spec.json), its etch
  # practice and its colour-fill scheme (branding/README.md; the colours are
  # `EPOXY` in branding/build.py). tools/cad.py reads those into params.scad;
  # nothing of the mark is restated here. The band it sits in is DERIVED - the
  # mouth cap's inside face to the first top cap slot - so it follows the
  # layout; drc.echo prints the band, the mark's size and every margin.
  artwork:
    value: "scs-orbit-wave-mark"
    status: settled
    source: "owner, 2026-10-01 ('use main's newest branding'): branding/export/scs-orbit-wave-mark.dxf, the Space Coast Synthesizers orbit-wave mark - five closed outlines, black = etched. woody_body.scad imports that file by a literal path (cad.py's dependency walk reads literals) and asserts it is this one"
  scale:
    value: 0.509
    status: settled
    source: "owner, 2026-10-01: 'The circle diameter of the instrument needs to match the key size in diameter' and 'the smallest possible without having that issue... I'm okay with the diameter being slightly bigger than the key... particularly if we're talking about just the inside of the circle diameter'. So the ring's INSIDE diameter equals the keycap (switch.keycap, 16.5): branding/README gives the ring a 36.0 centreline and 3.6 band, inside 32.4 at 100 %, so 16.5 / 32.4 = 0.509 [calc]; outside 20.2. The mark's own 2.0 clearances then scale to 1.02, just over logo.laser_min_gap, which is what 'without having that issue' asks - any smaller and the etch's parts run together [drc.echo 'logo: smallest gap in the etch']"
    decided_by: "the etch test on an offcut of the top's own board (ROADMAP open item): it confirms the 1.02 mm gaps hold the two pours apart"
  rotation:
    value: 90
    status: nominal
    source: "degrees, the artwork turned so its top faces the mouth end: the mark reads upright in the plan drawings (mouthpiece at the top) and to an audience facing a player holding the instrument mouth-up, which is how a maker's mark on a played instrument is read; the player sees it inverted. Turned this way its wide axis (the wave) runs across the body, the only way it fits the band at a readable size - along the body its wave, not its ring, would have to fit the band's length, about three quarters of this scale [calc: the mark's height over its width, branding/export/spec.json]"
  offset:
    value: [0.0, 0.0]
    status: nominal
    source: "mm from the band's centre (along the body) and the centreline (across): centred, so the margins to the seam and the slot are equal"
  margin_min:
    value: 3.0
    status: nominal
    source: "owner's brief, 2026-10-01: at least ~3 mm of plain oak between the mark's extent and the mouth cap's seam, the first cap slot, and the long edges' roundover flat - less and the mark reads as crowded against a joint or a moving cap [drawing convention]"
  depth:
    value: 1.0
    status: nominal
    source: "etch depth into the oak top: branding/README.md 'Colour fill (dark woods)' - etched deeper than a plain burn (its 'Etching notes' range) so the epoxy has something to key into. drc.echo 'logo etch leaves wood over the column screw pockets' checks the oak left under it"
    decided_by: "the etch test on an offcut (ROADMAP open item), which sets the depth the shop's laser gives"
  fill:
    value: "epoxy"
    status: nominal
    source: "branding/README.md 'Colour fill (dark woods)': the etch filled with pigmented epoxy and sanded flush, in its scheme (wave and moon one colour, ring another; `EPOXY` in branding/build.py), because the top is dark-stained oak (ADR 0009 'Finishes'). 'plain' = a bare etch, no fill solids drawn"
  laser_min_gap:
    value: 1.0
    status: tbd
    source: "the narrowest wall of oak a raster etch leaves standing between two etched areas without burning through or chipping out in oak [from memory - no banked figure]. drc.echo 'logo: smallest gap in the etch' fails under it, and notes the gap if it is under the mark's own clearance at 100 % (branding/README.md 'Geometry', the laser guideline)"
    decided_by: "the etch test on an offcut (ROADMAP open item)"
