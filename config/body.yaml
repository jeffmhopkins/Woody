# Body geometry - the CAD's inputs (ADR 0009, ADR 0010)
#
# Consumed by tools/cad.py, which writes mechanical/cad/generated/params.scad
# from this file and config/key-layout.yaml. Every render and cut file built
# from the model is fingerprinted against both, so a change here marks every
# picture of the old value STALE until `python3 tools/cad.py build` runs.
#
# WHAT IS NOT HERE, ON PURPOSE. The envelope, the plate thickness and the
# switch cutout live in config/key-layout.yaml `meta` (the plate thickness is
# the register's `plate-thickness`); key positions live there too. Do not
# restate them here - params.scad takes them from there.
#
# EVERY LEAF CARRIES A STATUS, and the status is the point of this file:
#   settled  - read off a banked document or decided in an ADR; cite it
#   nominal  - an ADR's working estimate; the CAD uses it until measured
#   tbd      - NO document gives a number. The value is a placeholder so the
#              model can be drawn, and `decided_by` says what replaces it.
#              A tbd value in a render is a question, not an answer.
# Provenance tags follow the review convention: [ds] banked datasheet,
# [adr] decision record, [calc] arithmetic shown, [from memory] unverified.
#
# COORDINATES (the model's, not the key plate's):
#   X along the body, 0 at the mouthpiece end's outer face, + toward the tail
#   Y across, 0 at the left edge seen from above with the mouthpiece at the top
#   Z up, 0 at the bottom face, the key plate's top face at the envelope thickness
# config/key-layout.yaml's key-plate frame (+x right, +y down, mouthpiece up)
# maps as X = plate origin + y, Y = plate origin + x.

meta:
  owner: docs/decisions/0009-enclosure-construction.md
  model: mechanical/cad/woody_body.scad

# ---------------------------------------------------------------- stack ----
stack:
  # THE OAK TOP HAS NO THICKNESS OF ITS OWN. Decided 2026-09-26: a key fully
  # pressed is FLUSH with the top face, so the key plate sits UNDER the oak
  # top and the oak is exactly as thick as the cap stands above the seat at
  # full travel - `switch.keycap_top_above_seat - switch.total_travel`. The
  # model derives it and drc.echo prints it; a sheet that is not that
  # thickness is shimmed or laminated up to it. The ADR 0009 stack sketch's
  # "oak top ~6 mm" is superseded by this rule, not by a number.
  cap_clear:
    value: 0.75
    status: tbd
    source: "keycap to oak-top hole, per side. Must beat oak's cross-grain movement across one hole, which ADR 0009 puts at 1-1.5 % [calc: 1.5 % of 18 mm = 0.27 mm]"
    decided_by: "M2 - the mule, with a real cap in a real oak hole"
  cap_holes:
    value: "slot"
    status: tbd
    source: "individual = one hole per cap in the oak top; slot = one slot per hand (and in the oak bottom one per thumb group either side of a rest), so pitch is limited by cap-to-cap clearance rather than by an oak web between holes"
    decided_by: "the pitch chosen - at 18 mm an individual-hole web is zero, so the tightened layout needs slots (drc.echo); revisit if M2 widens it"
  # THE OAK BOTTOM HAS NO THICKNESS OF ITS OWN EITHER. Decided 2026-09-26:
  # thumb keys are flush with the bottom face at full travel too. The thumb
  # plate is on the oak bottom's inside face, so the oak is the same
  # `keycap_top_above_seat - total_travel` as the oak top. ADR 0009's
  # "~8 mm <- sets thumb key inset depth" is superseded by this rule.
  side_t:
    value: 4.0
    status: nominal
    source: "[adr] ADR 0009 mass table - 'Acrylic sides, 2 x 4 mm'. Now a single sheet standing in the oak grooves"
  # THE SIDES SIT BETWEEN THE OAK PANELS, IN GROOVES (decided 2026-09-26).
  # Oak top and oak bottom run the full width; each acrylic side stands in a
  # groove in both, set in from the edge by an oak lip. Glued into the bottom
  # grooves (the U is still one glued sub-assembly), a sliding fit in the top
  # grooves - which now locate the lid, the job ADR 0009's notch did.
  # SANDED EDGES (owner, 2026-09-26: "the outer edges of all wood should be
  # rounded like I sanded it"): every outer edge of the oak - the top and
  # bottom panels' long edges, including the lips beside the acrylic, and the
  # end caps' outer faces and corners. A roundover after assembly, not a cut:
  # the DXFs carry the outlines, this radius goes on by hand or router.
  edge_r:
    value: 1.5
    status: tbd
    source: "a sanded roundover [owner]; under the 2 mm lip outside each groove (side_inset), so the lip keeps a flat beside the acrylic"
    decided_by: "M5, on the first cut parts"
  side_inset:
    value: 2.0
    status: tbd
    source: "oak lip outside each groove. Every mm here comes off the interior width twice"
    decided_by: "M4 - the thinnest lip the oak and the saw will hold"
  groove_depth:
    value: 3.0
    status: tbd
    source: "placeholder - half the oak panel, leaving half under the groove"
    decided_by: "M4, with the oak panel thickness (which the flush rule sets)"
  groove_clear:
    value: 0.2
    status: tbd
    source: "per side of the acrylic, so the lid lifts off; acrylic sheet thickness varies [from memory]"
    decided_by: "M4, against the sheet actually bought"
  plate_side_clear:
    value: 0.8
    status: nominal
    source: "the key plate's and the bottom plate's long edges, in from each acrylic side's inside face (issue #34 C6; it was groove_clear, 0.2): the side floats groove_clear in its groove, the oak that holds the grooves moves 1.5 % across the grain [adr 0009] of the body's width, ~0.43 a side, and the plate's cut +/-0.13 [from memory] - config/clearance.yaml body.plate-to-side, which mechanical/clash.txt holds"
    decided_by: "M4, with the oak's grain direction and the plates as cut"
# ----------------------------------------------------------------- ends ----
ends:
  mouth_cap_t:
    value: 6.0
    status: tbd
    source: "OAK since 2026-09-26 (owner: replace the acrylic mouth cap with the wood; ADR 0009 kept that open - 'same cut, same fixings, different sheet') - the oak top's stock, as the tail cap"
    decided_by: "M4"
  tail_cap_t:
    value: 6.0
    status: tbd
    source: "ADR 0009 end-cap table: oak - so the oak top's stock"
    decided_by: "M4, together with the etherCON panel-thickness question in mechanical/DESIGN.md"

# -------------------------------------------------------------- inlet ----
# THE BREATH INLET (issue #36; ADR 0003 amendment of 2026-10-04, "The
# mouthpiece, and the inlet"). The owner chose "B2: 1/8" barb": a short metal
# barb at the mouth cap, an external tube from it to a mouthpiece elsewhere.
# A Clippard 12842 #10-32 male FLUSH fitting to 1/8" barb screws into an
# E-Z LOK 550-1032 brass insert (10-32 inside, M8x1.25 outside) tapped and
# epoxied through the oak mouth cap on today's axis (the cap's centre); a
# Clippard 12843 (the same flush fitting at 3/32") from the inside takes the
# clear tube to U-BREATH. There is no trap in the body (owner, 2026-10-05;
# ADR 0003 amendment of that date). It replaces the plain pass-through hole
# (ends.tube_hole_d, deleted).
inlet:
  tap_drill_d:
    value: 6.9
    status: settled
    source: "[ds] datasheets/mechanical/EZLOK-THREADED-INSERTS-CATALOG-2023.pdf p.6, 550-1032: tap drill 6.9 mm, tap M8-1.25. The hole in mechanical/export/mouth-cap.dxf; the M8x1.25 thread is tapped in it by hand, and the insert bedded in epoxy (BOM ADH-INLET)"
  insert_d:
    value: 8.0
    status: settled
    source: "[ds] 550-1032 external thread M8-1.25 (EZLOK-THREADED-INSERTS-CATALOG-2023.pdf p.6): the major diameter, which the model draws"
  insert_l:
    value: 7.49
    status: settled
    source: "[ds] 550-1032 length .295 in (EZLOK-THREADED-INSERTS-CATALOG-2023.pdf p.6) [calc: .295 x 25.4]. Longer than ends.mouth_cap_t: set flush with the cap's outer face, it stands the difference into the cavity, toward U-BREATH (drc.echo 'breath inlet insert clear of U-BREATH')"
  insert_bore:
    value: 4.83
    status: settled
    source: "[calc] #10-32 UNF major diameter .190 in x 25.4: the insert's internal thread, which both barbs fill"
  barb_a:
    value: 8.26
    status: settled
    source: "[ds] datasheets/mechanical/CLIPPARD-2012-CATALOG-FITTINGS-HOSE-P288-327.pdf p.300, 12842 (1/8 in barb): A .325 in [calc: x 25.4], the barb and its 3/16 in collar above the thread. Screwed home on the flush insert this is how far the barb stands proud of the oak"
  barb_thread_l:
    value: 3.96
    status: settled
    source: "[ds] CLIPPARD-2012-CATALOG-FITTINGS-HOSE-P288-327.pdf p.300: thread .156 in [calc: x 25.4]"
  barb_collar_d:
    value: 4.76
    status: settled
    source: "[ds] CLIPPARD-2012-CATALOG-FITTINGS-HOSE-P288-327.pdf p.300: 3/16 in dia. collar"
  barb_bore:
    value: 2.64
    status: settled
    source: "[ds] CLIPPARD-2012-CATALOG-FITTINGS-HOSE-P288-327.pdf p.300: D .104 in thru [calc: x 25.4] "
  barb_ridge_d:
    value: 4.0
    status: tbd
    source: "the barb's ridge diameter for 1/8 in ID tube - Clippard does not dimension it [from memory]"
    decided_by: "calipers on a 12842"
  inner_gap:
    value: 0.5
    status: nominal
    source: "[calc] the inner barb's collar stands this far off the insert's inner end, so the two barbs' threads (barb_thread_l each - the 12843's is the 12842's .156 in, the same page - 7.92 together) share the insert's insert_l 7.49 without meeting: the outer one fills 3.96 from the outer face and the inner one the remaining 3.53, its last 0.43 outside the insert"
  barb_proud_max:
    value: 10.0
    status: settled
    source: "owner, in the working chat 2026-10-04, of the luer bulkheads that stood 20-35 mm proud: 'These all look way too long. I was thinking more of maybe just a Barb or something at the top'; the target relayed with it was 'well under 10 mm'. drc.echo 'breath inlet barb proud of the oak' holds barb_a under it"
  inner_barb_a:
    value: 6.15
    status: settled
    source: "[ds] CLIPPARD-2012-CATALOG-FITTINGS-HOSE-P288-327.pdf p.300, 12843 (3/32 in barb), the INSIDE barb: A .242 in [calc: x 25.4]. 3/32 in so one clear tube (routing.tube_*) grips both it and U-BREATH's P1 barb"
  inner_barb_bore:
    value: 1.85
    status: settled
    source: "[ds] CLIPPARD-2012-CATALOG-FITTINGS-HOSE-P288-327.pdf p.300: 12843 D .073 in thru [calc: x 25.4] - the narrowest bore on the path to the sensor"
  inner_ridge_d:
    value: 3.3
    status: tbd
    source: "the 12843's ridge diameter for 3/32 in ID tube - Clippard does not dimension it [from memory]"
    decided_by: "calipers on a 12843"

# ------------------------------------------------------ provisional layout --
# USED ONLY WHILE config/key-layout.yaml HAS null POSITIONS. The first key
# with a real x/y overrides this for that key. Every render made while any
# key is still provisional is stamped PROVISIONAL LAYOUT by tools/cad.py.
layout:
  # THE LENGTH IS DERIVED (owner, 2026-09-26: "minimize total length ...
  # a little extra near the mouth and a little after the keys for the
  # connector"). The model computes it from the keys, the underside and the
  # connector; drc.echo prints it and says what sets each end. These are the
  # only allowances left:
  mouth_extra:
    value: 10.0
    status: tbd
    source: "owner: 'a little extra near the mouth' - oak between the mouth cap's inside face and the first cap"
    decided_by: "M2 - where the lips and the mouthpiece mount land"
  tail_clear:
    value: 3.0
    status: tbd
    source: "clearance from the last key board to the etherCON body - the connector space the owner asked for is its depth plus this"
    decided_by: "M4, with the connector's real rear envelope"
  underside_clear:
    value: 3.0
    status: tbd
    source: "clearance between the mouth cap and the first thumb recess, and from the last thumb recess to the tail cap"
    decided_by: "M4"
  # KEY SPACING. Each hand is a LIST OF
  # GAPS, key centre to key centre from the mouthpiece end, so spacing can be
  # non-uniform as ADR 0010 expects; the run length is their sum and there is
  # deliberately no separate run or pitch value - two numbers for one
  # quantity is the defect this repository keeps finding. Real x/y positions
  # in config/key-layout.yaml replace this block key by key at M2.
  # 2026-09-26: tightened from 24 mm, which the finger-spacing research
  # (docs/research/2026-09-26-finger-spacing/) puts at the wide end. Graded
  # as real instruments are: comfortable pitch under index-middle-ring,
  # tighter to and between the little-finger keys, because a single straight
  # line cannot offset the little-finger hole sideways the way a recorder
  # does. Finger assignment is still M2's (ADR 0010); these gaps assume the
  # first three keys of each hand are index, middle, ring.
  lh_gaps:
    value: [20.0, 20.0, 18.0, 0.0]
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). [research] soprano recorder L1-L2-L3 21.0/22.3, D whistle 20/20; pad widths put touching fingers 15-22 apart (P5 F - P95 M). 18 to the little-finger keys (soprano R3-R4 18.0; 1.5 mm between MT165 caps). The final 0 is the side-by-side pair LH4 / LH5 (owner, 2026-09-26)"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  # SIDEWAYS OFFSETS, per key, mm from the centreline (owner, 2026-09-26):
  # each little finger's first position is a side-by-side PAIR (a 0 in the
  # gaps list); the right little finger then has a single key below it, off
  # centre as a recorder offsets its little-finger hole.
  # SIGN: + is toward the model's Y = W edge. Seen from the key face with the
  # mouthpiece up - the audience's view - that edge is on the viewer's right,
  # so the PLAYER's left. The assumption below is that each little finger is
  # offset toward the side its hand wraps from: left hand +, right hand -.
  # A recorder offsets only its right-hand holes, and toward the player's
  # right, which agrees. Only RH6 depends on it now - the pairs are centred.
  # Confirm on the mule.
  lh_offsets:
    value: [0.0, 0.0, 0.0, -9.0, 9.0]
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). LH1-3 on the centreline; LH4 / LH5 the little finger's side-by-side pair, one cap pitch apart across the body, centred so both switch bodies stay inside the plate"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  rh_offsets:
    value: [0.0, 0.0, 0.0, -9.0, 9.0, -9.0]
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). RH1-3 on the centreline; RH4 / RH5 the little finger's side-by-side pair, centred as LH4 / LH5; RH6 the single key below it, IN LINE with RH4 - the pair key on the player's right, the recorder's direction (owner, 2026-09-26)"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  # EQUAL BANDS (owner, 2026-09-26): the space before the left hand and
  # between the hands are made the same - the larger that either needs.
  # The TAIL is sized on its own since the LED
  # matrix is centred in it (matrix_centred). drc.echo prints the band and
  # which set it. `gap` is then only a minimum for the space between the hands.
  equal_bands:
    value: true
    status: settled
    source: "owner, 2026-09-26: 'copy the same space above the left keys to between the hands and at the bottom'. Since the matrix was centred (same day) it equalizes the mouth end and the space between the hands only; the tail is sized by its own contents"
  gap_matches_matrix:
    value: true
    status: settled
    source: "owner, 2026-09-26: the gap between the key groups is the same as the gap from the last keys to the LED matrix - clear space, cap edge to cap edge and cap edge to window edge. Overrides equal_bands for the gap; equal_bands then only sets the mouth end, and gap stays a minimum"
  matrix_centred:
    value: true
    status: settled
    source: "owner, 2026-09-26: centre the LED matrix in the space after the keys, and let only the tail grow for it"
  gap:
    value: 50.0
    status: nominal
    source: "[adr] ADR 0009 length table - the U-bolt band. A MINIMUM while equal_bands is on"
  rh_gaps:
    value: [20.0, 20.0, 18.0, 0.0, 18.0]
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). [research] as lh_gaps; soprano R1-R2-R3 20.8/20.1, R3-R4 18.0. A 0 GAP IS A SIDE-BY-SIDE PAIR: RH4 / RH5 share the first little-finger position, RH6 is the single key one step further down (owner, 2026-09-26)"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  # THE LEFT THUMB IS TWO ROWS ACROSS THE BODY with the rest between them,
  # like the right thumb's pair (owner, 2026-09-26: "dual horizontal rows
  # too, with gap still in the middle"): LT1 LT2, the rest, LT3 LT4.
  lt_rest_under:
    value: "LH2"
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). the left thumb rest is directly under the middle-finger key (owner, 2026-09-26); LH2 is the middle finger on the index-middle-ring order key-layout.yaml assumes until M2 assigns fingers"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  lt_rest:
    value: 40.0
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). the LT1/LT2 row to the LT3/LT4 row, centre to centre, across the thumb rest: about a thumb pad clear between the cap holes. Each row's two keys are at the top keys' pitch (owner, 2026-09-26)"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  rt_rest_under:
    value: "RH2"
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). the right thumb rest is directly under the middle-finger key (owner, 2026-09-26); RH2 on the same assumption as lt_rest_under"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"
  # THE RIGHT THUMB: two rows across the body with the rest between them,
  # like the left (owner, 2026-09-26: "four keys right thumb too").
  rt_rest:
    value: 40.0
    status: settled
    source: "owner 2026-10-04, chat: final for rev A ('I think we're good to mark them final for rev-A. We won't know again until they are actually in my hands and we can double check'); re-checked on the rev A boards in hand (ADR 0010, Amendment 2026-10-04). the RT1/RT2 row to the RT3/RT4 row, centre to centre, across the thumb rest - the same as the left thumb's. Each row's two keys are at the top keys' pitch (owner, 2026-09-26)"
    decided_by: "the rev A boards in hand: a change there is a rev B layout"

# -------------------------------------------------------------- switches ----
switch:
  # z = 0 at the underside of the 15 x 15 collar = the plate's top face
  # (docs/reference/ks33-geometry.md). The model imports the real solid
  # (mechanical/cad/vendor/ks33.stl, meshed from the banked STEP); these are
  # for the arithmetic and the clearance checks.
  stem_top_above_seat:
    value: 6.4
    status: nominal
    source: "the MX cross stem's top at rest, above the seat: 6.38 in the front elevation and 6.38 in the side one (3.35 to the housing top, the stem ~3.03 over it), SCALED off Gateron KS-33H10B050NN-Y24 sheet 6 - both views to scale within 0.03 on their dimensioned 13.75, 14.00 and 5.85 [scaled, datasheets/mechanical/GATERON-KS-33-VENDOR-SPEC-DRAWING.pdf, 2026-09-28]. The third-party STEP's is higher (docs/reference/ks33-geometry.md); the vendor wins"
  cover_w:
    value: 13.75
    status: settled
    source: "[ds] Gateron KS-33H10B050NN-Y24 sheet 6, front elevation: the switch's widest part above the collar, tapering upward. The 14.70 latch span is BELOW the collar, in the plate slot - the third-party STEP draws its latches above it, so the model trims the switch's mesh to this above the collar"
  cover_straight_h:
    value: 1.5
    status: nominal
    source: "how far above the seat the cover stays switch.cover_w wide before it tapers [scaled, Gateron KS-33H10B050NN-Y24 sheet 6 front elevation rendered at 400 dpi, 40 px/mm on its 13.75, 2026-09-28]"
  cover_top_w:
    value: 12.8
    status: nominal
    source: "the cover's width at its top (switch.housing_top_above_seat), where it steps in to the 11.0 actuator [scaled, as switch.cover_straight_h]"
  collar_t:
    value: 0.45
    status: settled
    source: "[ds] Gateron KS-33H10B050NN-Y24 sheet 6, side elevation: the 15.0 x 15.0 collar's thickness, from the seat"
  cutout_r:
    value: 0.5
    status: nominal
    source: "the switch cutouts' inside corner radius, in both plates (owner, 2026-10-05: 'down for having a clean rounded corner as long as it doesn't interfere with the keys'; issue #43). Gateron's drawing gives no radius (datasheets/mechanical/GATERON-KS-33-VENDOR-SPEC-DRAWING.pdf, sheet 6, the cutout only as the 14.00 body). The banked footprint draws the cutout with R0.5 corners (datasheets/mechanical/GATERON-KS-33-SW_KS33_1u.kicad_mod, Eco2.User arcs); and the banked STEP solid (datasheets/mechanical/GATERON-KS-33-3D.step, meshed to mechanical/cad/vendor/ks33.stl), cut across through the plate's thickness below the seat, stands 0.5 back from each corner of the 14 mm square and overlaps nothing an R0.5 corner leaves, where an R0.75 corner meets it [calc: the housing's section at 0.1 to 2.0 below the seat against the square less the rounded square, 0.000 mm2 at R0.5, 0.007 at R0.75, 0.043 at R1.0]. Two third-party sources and no vendor figure, so nominal"
    decided_by: "M1, the kerf coupon that settles the cutout (config/key-layout.yaml): a switch clipped into it"
  housing_top_above_seat:
    value: 3.35
    status: settled
    source: "[ds] Gateron KS-33H10B050NN-Y24 sheet 6, side elevation: the housing's top face above the seat; only the stem and its actuator stand above it"
  pole_tip_below_seat:
    value: 5.75
    status: settled
    source: "[ds] Gateron KS-33H10B050NN-Y24 sheet 6, 5.75 +/-0.05 (the STEP says 5.70; the vendor wins)"
  thumb_pcb_below_seat:
    value: 2.5
    status: nominal
    source: "the main board's face nearest the thumb switches' seat, below it: against the thumb switches' housing bottom, as the key boards are (ADR 0022, ADR 0020 Amendment 6), held there by its mount on the bottom plate (ADR 0025) - the plate + hardware.kb_spacer_l [calc: 1.2 + 1.3], inside switch.pcb_below_seat_window; drc.echo 'main board mount sets its depth'"
  pcb_below_seat:
    value: 2.5
    status: nominal
    source: "THE KEY BOARDS' (the thumb switches' main board is switch.thumb_pcb_below_seat): the board top is pressed against the switches' housing bottom (owner, 2026-09-29; ADR 0020 Amendment 6), 2.50 +/-0.05 below the seat [ds GATERON-KS-33-VENDOR-SPEC-DRAWING.pdf sheet 6]. The mount holds it there: the stud's head is flush in the plate's top face and the spacer bears on its underside, so the board top sits the plate + hardware.kb_spacer_l below the seat [calc: 1.2 + 1.3]; drc.echo 'key-board mount sets the board depth' fails if this and the hardware disagree. Inside switch.pcb_below_seat_window"
  keycap_top_above_seat:
    value: 9.0
    status: nominal
    source: "the cap's top above the seat = switch.stem_top_above_seat + switch.keycap_boss_below_top - how deep the stem enters the socket, which nothing published gives. CONFIRMED BY THE PARTS IN HAND, by eye at scale: the owner, 2026-10-02, holding a KS-33 with its MT165 cap at rest and fully pressed against mechanical/renders/section-keycap.png and section-key.png - 'when I visually matched up your renders to my keycaps they fit. So if they were rendered to the 9 mm, then that is correct'"
    decided_by: "calipers on a cap on its switch (M1) would make it settled; a visual match at scale cannot resolve a few tenths, which is the oak top's thickness tolerance. It SETS BOTH oak panel thicknesses (flush rule, stack above)"
