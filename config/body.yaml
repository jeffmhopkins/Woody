  # (datasheets/connectors/NEUTRIK-NE8FAV-DRAWING.pdf), its data sheet
  # (-DATASHEET.pdf) and, where the drawing gives no number, its 3D model
  # (-3D.stp). It is soldered to its own small board, the umbilical adapter,
  # which stands behind it parallel to the tail cap; a right-angle header
  # joins that board to the main board (boards.umb_joint_*).
  bore_d:
    value: 22.0
    status: settled
    source: "[ds] ST-NE8FAV - panel cut out (rear side), bore 22 min"
  flange_w:
    value: 25.0
    status: settled
    source: "[ds] ST-NE8FAV front view - flange 25 x 25"
  flange_h:
    value: 25.0
    status: settled
    source: "[ds] ST-NE8FAV side view - 25, the axis at 12.5 from its lower edge"
  hole_dx:
    value: 19.8
    status: settled
    source: "[ds] ST-NE8FAV panel cut out - two diagonal 3.2 min holes at 19.8 +/-0.1 x 19.8 +/-0.1, upper left and lower right seen from the front"
  hole_dy:
    value: 19.8
    status: settled
    source: "[ds] ST-NE8FAV"
  hole_d:
    value: 3.2
    status: settled
    source: "[ds] ST-NE8FAV"
  panel_max:
    value: 3.0
    status: settled
    source: "[ds] NEUTRIK-NE8FAV-DATASHEET.pdf - 'Panel thickness max. 3 mm'. The oak tail cap is thicker, so a recess from outside leaves this much oak where the connector mounts"
  pcb_setback:
    value: 18.3
    status: settled
    source: "[ds] ST-NE8FAV side view - flange front face to the PCB's front face"
  nose_l:
    value: 2.7
    status: settled
    source: "[ds] ST-NE8FAV side view - 21 from the PCB face to the nose's front, less the 18.3 to the flange face [calc]; it stays inside a 3 mm panel's bore"
