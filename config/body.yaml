    status: settled
    source: "[ds] NE8FDP"
  hole_dx:
    value: 19.0
    status: settled
    source: "[ds] NE8FDP - two diagonal 3.2 holes at 19 x 24"
  hole_dy:
    value: 24.0
    status: settled
    source: "[ds] NE8FDP"
  hole_d:
