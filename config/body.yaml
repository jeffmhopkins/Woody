# Body geometry - the CAD's inputs (ADR 0009, ADR 0010)
#
# Consumed by tools/cad.py, which writes mechanical/cad/generated/params.scad
# from this file and config/key-layout.yaml. Every render and cut file built
# from the model is fingerprinted against both, so a change here marks every
# picture of the old value STALE until `python3 tools/cad.py build` runs.
#
# WHAT IS NOT HERE, ON PURPOSE. The envelope, the plate thickness and the
# switch cutout live in config/key-layout.yaml `meta` (the plate thickness is
# the register's `plate-thickness`); key positions live there too. Do not
# restate them here - params.scad takes them from there.
#
# EVERY LEAF CARRIES A STATUS, and the status is the point of this file:
#   settled  - read off a banked document or decided in an ADR; cite it
#   nominal  - an ADR's working estimate; the CAD uses it until measured
#   tbd      - NO document gives a number. The value is a placeholder so the
#              model can be drawn, and `decided_by` says what replaces it.
#              A tbd value in a render is a question, not an answer.
# Provenance tags follow the review convention: [ds] banked datasheet,
# [adr] decision record, [calc] arithmetic shown, [from memory] unverified.
#
# COORDINATES (the model's, not the key plate's):
#   X along the body, 0 at the mouthpiece end's outer face, + toward the tail
#   Y across, 0 at the left edge seen from above with the mouthpiece at the top
#   Z up, 0 at the bottom face, the key plate's top face at the envelope thickness
# config/key-layout.yaml's key-plate frame (+x right, +y down, mouthpiece up)
# maps as X = plate origin + y, Y = plate origin + x.

meta:
  owner: docs/decisions/0009-enclosure-construction.md
  model: mechanical/cad/woody_body.scad

# ---------------------------------------------------------------- stack ----
stack:
  # THE OAK TOP HAS NO THICKNESS OF ITS OWN. Decided 2026-09-26: a key fully
  # pressed is FLUSH with the top face, so the key plate sits UNDER the oak
  # top and the oak is exactly as thick as the cap stands above the seat at
  # full travel - `switch.keycap_top_above_seat - switch.total_travel`. The
  # model derives it and drc.echo prints it; a sheet that is not that
  # thickness is shimmed or laminated up to it. The ADR 0009 stack sketch's
  # "oak top ~6 mm" is superseded by this rule, not by a number.
  cap_clear:
    value: 0.75
    status: tbd
    source: "keycap to oak-top hole, per side. Must beat oak's cross-grain movement across one hole, which ADR 0009 puts at 1-1.5 % [calc: 1.5 % of 18 mm = 0.27 mm]"
    decided_by: "M2 - the mule, with a real cap in a real oak hole"
  cap_holes:
    value: "slot"
    status: tbd
    source: "individual = one hole per cap in the oak top; slot = one slot per hand (and in the oak bottom one per thumb group either side of a rest), so pitch is limited by cap-to-cap clearance rather than by an oak web between holes"
    decided_by: "the pitch chosen - at 18 mm an individual-hole web is zero, so the tightened layout needs slots (drc.echo); revisit if M2 widens it"
  # THE OAK BOTTOM HAS NO THICKNESS OF ITS OWN EITHER. Decided 2026-09-26:
  # thumb keys are flush with the bottom face at full travel too. The thumb
  # plate is on the oak bottom's inside face, so the oak is the same
  # `keycap_top_above_seat - total_travel` as the oak top. ADR 0009's
  # "~8 mm <- sets thumb key inset depth" is superseded by this rule.
  side_t:
    value: 4.0
    status: nominal
    source: "[adr] ADR 0009 mass table - 'Acrylic sides, 2 x 4 mm'. Now a single sheet standing in the oak grooves"
  # THE SIDES SIT BETWEEN THE OAK PANELS, IN GROOVES (decided 2026-09-26).
  # Oak top and oak bottom run the full width; each acrylic side stands in a
  # groove in both, set in from the edge by an oak lip. Glued into the bottom
  # grooves (the U is still one glued sub-assembly), a sliding fit in the top
  # grooves - which now locate the lid, the job ADR 0009's notch did.
  # SANDED EDGES (owner, 2026-09-26: "the outer edges of all wood should be
  # rounded like I sanded it"): every outer edge of the oak - the top and
  # bottom panels' long edges, including the lips beside the acrylic, and the
  # end caps' outer faces and corners. A roundover after assembly, not a cut:
  # the DXFs carry the outlines, this radius goes on by hand or router.
  edge_r:
    value: 1.5
    status: tbd
    source: "a sanded roundover [owner]; under the 2 mm lip outside each groove (side_inset), so the lip keeps a flat beside the acrylic"
    decided_by: "M5, on the first cut parts"
  side_inset:
    value: 2.0
    status: tbd
    source: "oak lip outside each groove. Every mm here comes off the interior width twice"
    decided_by: "M4 - the thinnest lip the oak and the saw will hold"
  groove_depth:
    value: 3.0
    status: tbd
    source: "placeholder - half the oak panel, leaving half under the groove"
    decided_by: "M4, with the oak panel thickness (which the flush rule sets)"
  groove_clear:
    value: 0.2
    status: tbd
    source: "per side of the acrylic, so the lid lifts off; acrylic sheet thickness varies [from memory]"
    decided_by: "M4, against the sheet actually bought"
# ----------------------------------------------------------------- ends ----
ends:
  mouth_cap_t:
    value: 6.0
    status: tbd
    source: "OAK since 2026-09-26 (owner: replace the acrylic mouth cap with the wood; ADR 0009 kept that open - 'same cut, same fixings, different sheet') - the oak top's stock, as the tail cap"
    decided_by: "M4"
  tail_cap_t:
    value: 6.0
    status: tbd
    source: "ADR 0009 end-cap table: oak - so the oak top's stock"
    decided_by: "M4, together with the etherCON panel-thickness question in mechanical/DESIGN.md"
  tube_hole_d:
    value: 6.0
    status: tbd
    source: "ADR 0003: tube bore and OD are settled at E2"
    decided_by: "E2 (tube bore by playing), then the tube's OD plus clearance"

# ------------------------------------------------------ provisional layout --
# USED ONLY WHILE config/key-layout.yaml HAS null POSITIONS. The first key
# with a real x/y overrides this for that key. Every render made while any
# key is still provisional is stamped PROVISIONAL LAYOUT by tools/cad.py.
layout:
  # THE LENGTH IS DERIVED (owner, 2026-09-26: "minimize total length ...
  # a little extra near the mouth and a little after the keys for the
  # connector"). The model computes it from the keys, the underside and the
  # connector; drc.echo prints it and says what sets each end. These are the
  # only allowances left:
  mouth_extra:
    value: 10.0
    status: tbd
    source: "owner: 'a little extra near the mouth' - oak between the mouth cap's inside face and the first cap"
    decided_by: "M2 - where the lips and the mouthpiece mount land"
  tail_clear:
    value: 3.0
    status: tbd
    source: "clearance from the last key board to the etherCON body - the connector space the owner asked for is its depth plus this"
    decided_by: "M4, with the connector's real rear envelope"
  underside_clear:
    value: 3.0
    status: tbd
    source: "clearance between the mouth cap and the first thumb recess, and from the last thumb recess to the tail cap"
    decided_by: "M4"
  # KEY SPACING. Each hand is a LIST OF
  # GAPS, key centre to key centre from the mouthpiece end, so spacing can be
  # non-uniform as ADR 0010 expects; the run length is their sum and there is
  # deliberately no separate run or pitch value - two numbers for one
  # quantity is the defect this repository keeps finding. Real x/y positions
  # in config/key-layout.yaml replace this block key by key at M2.
  # 2026-09-26: tightened from 24 mm, which the finger-spacing research
  # (docs/research/2026-09-26-finger-spacing/) puts at the wide end. Graded
  # as real instruments are: comfortable pitch under index-middle-ring,
  # tighter to and between the little-finger keys, because a single straight
  # line cannot offset the little-finger hole sideways the way a recorder
  # does. Finger assignment is still M2's (ADR 0010); these gaps assume the
  # first three keys of each hand are index, middle, ring.
  lh_gaps:
    value: [20.0, 20.0, 18.0, 0.0]
    status: nominal
    source: "[research] soprano recorder L1-L2-L3 21.0/22.3, D whistle 20/20; pad widths put touching fingers 15-22 apart (P5 F - P95 M). 18 to the little-finger keys (soprano R3-R4 18.0; 1.5 mm between MT165 caps). The final 0 is the side-by-side pair LH4 / LH5 (owner, 2026-09-26)"
    decided_by: "M2 - replaced key by key by x/y in config/key-layout.yaml"
  # SIDEWAYS OFFSETS, per key, mm from the centreline (owner, 2026-09-26):
  # each little finger's first position is a side-by-side PAIR (a 0 in the
  # gaps list); the right little finger then has a single key below it, off
  # centre as a recorder offsets its little-finger hole.
  # SIGN: + is toward the model's Y = W edge. Seen from the key face with the
  # mouthpiece up - the audience's view - that edge is on the viewer's right,
  # so the PLAYER's left. The assumption below is that each little finger is
  # offset toward the side its hand wraps from: left hand +, right hand -.
  # A recorder offsets only its right-hand holes, and toward the player's
  # right, which agrees. Only RH6 depends on it now - the pairs are centred.
  # Confirm on the mule.
  lh_offsets:
    value: [0.0, 0.0, 0.0, -9.0, 9.0]
    status: tbd
    source: "LH1-3 on the centreline; LH4 / LH5 the little finger's side-by-side pair, one cap pitch apart across the body, centred so both switch bodies stay inside the plate"
    decided_by: "M2 - hands on the mule; the sign too"
  rh_offsets:
    value: [0.0, 0.0, 0.0, -9.0, 9.0, -9.0]
    status: tbd
    source: "RH1-3 on the centreline; RH4 / RH5 the little finger's side-by-side pair, centred as LH4 / LH5; RH6 the single key below it, IN LINE with RH4 - the pair key on the player's right, the recorder's direction (owner, 2026-09-26)"
    decided_by: "M2 - hands on the mule; the sign too"
  # EQUAL BANDS (owner, 2026-09-26): the space before the left hand and
  # between the hands are made the same - the larger that either needs.
  # The TAIL is sized on its own since the LED
  # matrix is centred in it (matrix_centred). drc.echo prints the band and
  # which set it. `gap` is then only a minimum for the space between the hands.
  equal_bands:
    value: true
    status: settled
    source: "owner, 2026-09-26: 'copy the same space above the left keys to between the hands and at the bottom'. Since the matrix was centred (same day) it equalizes the mouth end and the space between the hands only; the tail is sized by its own contents"
  gap_matches_matrix:
    value: true
    status: settled
    source: "owner, 2026-09-26: the gap between the key groups is the same as the gap from the last keys to the LED matrix - clear space, cap edge to cap edge and cap edge to window edge. Overrides equal_bands for the gap; equal_bands then only sets the mouth end, and gap stays a minimum"
  matrix_centred:
    value: true
    status: settled
    source: "owner, 2026-09-26: centre the LED matrix in the space after the keys, and let only the tail grow for it"
  gap:
    value: 50.0
    status: nominal
    source: "[adr] ADR 0009 length table - the U-bolt band. A MINIMUM while equal_bands is on"
  rh_gaps:
    value: [20.0, 20.0, 18.0, 0.0, 18.0]
    status: nominal
    source: "[research] as lh_gaps; soprano R1-R2-R3 20.8/20.1, R3-R4 18.0. A 0 GAP IS A SIDE-BY-SIDE PAIR: RH4 / RH5 share the first little-finger position, RH6 is the single key one step further down (owner, 2026-09-26)"
    decided_by: "M2 - replaced key by key by x/y in config/key-layout.yaml"
  # THE LEFT THUMB IS TWO ROWS ACROSS THE BODY with the rest between them,
  # like the right thumb's pair (owner, 2026-09-26: "dual horizontal rows
  # too, with gap still in the middle"): LT1 LT2, the rest, LT3 LT4.
  lt_rest_under:
    value: "LH2"
    status: tbd
    source: "the left thumb rest is directly under the middle-finger key (owner, 2026-09-26); LH2 is the middle finger on the index-middle-ring order key-layout.yaml assumes until M2 assigns fingers"
    decided_by: "M2 - finger assignment"
  lt_rest:
    value: 40.0
    status: tbd
    source: "the LT1/LT2 row to the LT3/LT4 row, centre to centre, across the thumb rest: about a thumb pad clear between the cap holes. Each row's two keys are at the top keys' pitch (owner, 2026-09-26)"
    decided_by: "M2"
  rt_rest_under:
    value: "RH2"
    status: tbd
    source: "the right thumb rest is directly under the middle-finger key (owner, 2026-09-26); RH2 on the same assumption as lt_rest_under"
    decided_by: "M2 - finger assignment"
  # THE RIGHT THUMB: two rows across the body with the rest between them,
  # like the left (owner, 2026-09-26: "four keys right thumb too").
  rt_rest:
    value: 40.0
    status: tbd
    source: "the RT1/RT2 row to the RT3/RT4 row, centre to centre, across the thumb rest - the same as the left thumb's. Each row's two keys are at the top keys' pitch (owner, 2026-09-26)"
    decided_by: "M2"

# -------------------------------------------------------------- switches ----
switch:
  # z = 0 at the underside of the 15 x 15 collar = the plate's top face
  # (docs/reference/ks33-geometry.md). The model imports the real solid
  # (mechanical/cad/vendor/ks33.stl, meshed from the banked STEP); these are
  # for the arithmetic and the clearance checks.
  pole_tip_below_seat:
    value: 5.75
    status: settled
    source: "[ds] Gateron KS-33H10B050NN-Y24 sheet 6, 5.75 +/-0.05 (the STEP says 5.70; the vendor wins)"
  pcb_below_seat:
    value: 3.4
    status: settled
    source: "[calc] docs/reference/ks33-geometry.md: PCB top 3.2-3.6 below the seat; the middle"
  keycap_top_above_seat:
    value: 9.0
    status: tbd
    source: "MT165 height is unpublished (hardware/bom.csv MT165 row). Stem top is +7.05 [ds STEP]; the cap adds a guess"
    decided_by: "M1 - measure a cap on a switch with calipers. It now SETS BOTH oak panel thicknesses (flush rule, stack above)"
  total_travel:
    value: 3.0
    status: settled
    source: "[ds] Gateron KS-33H10B050NN-Y24 sheet 6 - total travel 3.0 +/-0.2 mm"
  keycap:
    value: 16.5
    status: settled
    source: "[adr] ADR 0002 - MT165 16.5 x 16.5"
  cluster_pcb_w:
    value: 22.0
    status: tbd
    source: "hardware/cluster/cluster-boards.md: outlines are undrawable until M3"
    decided_by: "M3"
  pcb_t:
    value: 1.6
    status: settled
    source: "[adr] hardware/bom.csv PCB-CLUSTER and PCB-CARRIER, 1.6 mm"

# ---------------------------------------------------------------- boards ----
boards:
  matrix_board:
    value: 25.0
    status: settled
    source: "[ds] datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-dimensions.jpg - 25.00 x 25.00, R1.0"
  matrix_emitters:
    value: 20.8
    status: nominal
    source: "ADR 0014 / carrier.md - 8 x 2.6 mm pitch [from memory there]"
  # Part envelopes on the boards (datasheet read 2026-09-26). Heights are
  # above the board face they sit on.
  smt_h:
    value: 2.3
    status: nominal
    source: "tallest SMT part on the main board: SMA/SMC diodes 2.29-2.62 [ds SMAJ15A p.3, SS34 p.3]; SOIC 1.75"
  cluster_smt_h:
    value: 1.8
    status: nominal
    source: "cluster boards: SOIC-16 74HC165 1.75 [from memory, JEDEC MS-012] and 0805 passives"
  tall_l:
    value: 15.0
    status: tbd
    source: "ONE regulator block, the long side across the body - an R-78E5.0 SIP-3 (11.6 x 8.5 x 10.4 [ds R-78E5.0-1.0 p.4]), its C-BUCK-IN 6.3 x 11 and a C-STRIP-BULK 8-10 x 12.5-20 [from memory]; one block, on the main board (ADR 0017)"
    decided_by: "M4 main board layout"
  tall_w:
    value: 10.0
    status: tbd
    source: "the regulator block's other side: an R-78E5.0 SIP-3 (11.6 x 8.5 on the board), capacitors beside it [ds R-78E5.0-1.0 p.4; caps from memory]"
    decided_by: "M4 main board layout"
  tall_h:
    value: 12.5
    status: tbd
    source: "the shortest the bulk electrolytics come, upright [from memory]; lay them down or use SMD polymer where drc.echo says they do not fit"
    decided_by: "part selection and layout at M4"
  sensor_body:
    value: 12.3
    status: settled
    source: "[ds] MPXV4006DP p.7, case 1351-01 - body 11.81-12.32 square. SURFACE MOUNT (p.1 ordering table), not THT"
  sensor_h:
    value: 9.9
    status: settled
    source: "[ds] MPXV4006DP p.20 case 1351-01 table, dim A - overall height 9.39-9.91"
  sensor_leads:
    value: 17.8
    status: settled
    source: "[ds] MPXV4006DP p.7 - across the lead tips 17.27-17.78"
  sensor_port_l:
    value: 6.6
    status: settled
    source: "[ds] MPXV4006DP p.7 - ports protrude 6.10-6.60 from one face"
  sensor_port_d:
    value: 3.3
    status: settled
    source: "[ds] MPXV4006DP p.7 - barb OD 2.79-3.30"
  sensor_port_z:
    value: [8.5, 1.4]
    status: nominal
    source: "port centres above the seating plane, upper (P1, marked side - p.6 Table 3) and lower; scaled off the p.7 drawing"
  sensor_port_offset:
    value: 2.1
    status: tbd
    source: "[ds] MPXV4006DP p.7 end view, case 1351-01 dim N (p.20 table) 4.06-4.57 - the two ports' centres are offset across the body by N, so each sits N/2 = 2.03-2.29 either side of the body's centre [calc]; 2.1 is a pick inside that range"
    decided_by: "the part in hand at M4"
  sensor_lead_row:
    value: 10.2
    status: tbd
    source: "length along the body of the block standing in for the leads. NOT a datasheet dimension: the p.20 table gives e 2.54 BSC and b 0.96-1.07, so 4 leads per side span 3 x 2.54 + 1.07 = 8.69 max [calc]; 10.2 is a modelling envelope over that [from memory]"
    decided_by: "M4 footprint"
  sensor_lead_h:
    value: 1.2
    status: tbd
    source: "height of the block standing in for the lead forms. NOT a datasheet dimension: the p.20 table gives only A1 0.05-0.25 (standoff) and L 1.02-1.52 (foot length); the lead's rise to the body is drawn (p.7 Detail G) but not dimensioned [from memory]"
    decided_by: "M4 footprint"
  # THE KEY CHAIN'S CONNECTORS (owner, 2026-09-27, ADR 0017 amended): a
  # through-hole 1.27 mm shrouded IDC header, right-angle, on each board -
  # stacked, the key board's hanging from its underside over the main
  # board's - and a flat IDC ribbon between them. Samtec SHF-106-01-L-D-RA
  # and an FFSD-06-D cable are the stand-ins; both catalogue pages are banked
  # (datasheets/connectors/SAMTEC-*.pdf), their full prints are not (403).
  chain_hdr_l:
    value: 13.97
    status: nominal
    source: "SHF header length A = pins per row x 1.27 + 6.35, 6 per row [datasheets/connectors/SAMTEC-SHF-1.27MM-SHROUDED-IDC-HEADER.pdf]"
    decided_by: "M4, with J-CHAIN's part and its full print"
  chain_hdr_h:
    value: 5.59
    status: nominal
    source: "the right-angle header's height off the board, .220 REF, standing on 0.51 ribs [datasheets/connectors/SAMTEC-SHF-1XX-01-X-D-XX-PRINT.pdf, sheet 1 fig 1]"
    decided_by: "M4, with the full print"
  chain_hdr_d:
    value: 5.33
    status: nominal
    source: "the right-angle shroud's depth, mouth to back, .210 REF [datasheets/connectors/SAMTEC-SHF-1XX-01-X-D-XX-PRINT.pdf, sheet 1]"
    decided_by: "M4, with the full print"
  chain_hdr_pin_back:
    value: 7.86
    status: nominal
    source: "from the mouth back to the far (odd) pin row: the depth 5.33 plus the odd row's bend 1.26 + 1.27 behind the back face, measured at the bend (note 7) [datasheets/connectors/SAMTEC-SHF-1XX-01-X-D-XX-PRINT.pdf, sheet 2 section C-C; calc]"
    decided_by: "M4, with the full print"
  chain_plug_proud:
    value: 1.4
    status: tbd
    source: "how far the FFSD socket stands out of the header's mouth: its 5.08 height less the header's mouth-to-floor, about 3.67, which the print does not dimension (scaled) [calc from datasheets/connectors/SAMTEC-FFSD-XX-X-XX.XX-01-PRINT.pdf sheet 1 and datasheets/connectors/SAMTEC-SHF-1XX-01-X-D-XX-PRINT.pdf sheet 2]"
    decided_by: "M4, on the first mated pair"
  chain_hdr_mouth_z:
    value: 3.05
    status: nominal
    source: "the mouth's centre above the board: the 0.51 ribs plus half the 5.08 body [calc, datasheets/connectors/SAMTEC-SHF-1XX-01-X-D-XX-PRINT.pdf sheet 1 fig 1]"
    decided_by: "M4"
  chain_plug_h:
    value: 5.08
    status: nominal
    source: "the FFSD socket's height along its insertion, 5.08 +0.15/-0.08 [datasheets/connectors/SAMTEC-FFSD-XX-X-XX.XX-01-PRINT.pdf, sheet 1 fig 1]"
    decided_by: "M4"
  chain_plug_t:
    value: 3.05
    status: nominal
    source: "the FFSD socket's thickness [datasheets/connectors/SAMTEC-FFSD-1.27MM-IDC-CABLE.pdf]"
    decided_by: "M4"
  chain_plug_l:
    value: 11.81
    status: nominal
    source: "the FFSD socket's length, positions x 1.27 + 4.19 for 6 per row [datasheets/connectors/SAMTEC-FFSD-1.27MM-IDC-CABLE.pdf]"
    decided_by: "M4"
  # THE MATRIX AND THE UMBILICAL, onto the main board's tail end (owner,
  # 2026-09-26: "what about matrix led esp32 and ethercon wire connections?").
  # The Matrix: a flat ribbon soldered to its two pad rows (the board is on
  # the lid, so it unplugs at the main board like the key boards). The
  # umbilical: a slim patch lead from the etherCON's rear socket to a latching
  # connector, far enough in that the cable's bend is legal.
  mcu_conn_l:
    value: 18.5
    status: tbd
    source: "a 2 x 12 1.27 mm box header, side entry, across the body: 11 x 1.27 = 13.97 between end pins [calc] plus the shroud's end walls [from memory] (ADR 0018)"
    decided_by: "M4, with the part"
  mcu_conn_w:
    value: 6.0
    status: tbd
    source: "the same header along the body, with its latch [from memory]"
    decided_by: "M4, with the part"
  mcu_conn_h:
    value: 5.0
    status: tbd
    source: "the same header's height [from memory]"
    decided_by: "M4, with the part"
  umb_conn_l:
    value: 12.0
    status: tbd
    source: "an 8-way latching wire-to-board header, side entry, across the body [from memory]"
    decided_by: "M4, with the part"
  umb_conn_w:
    value: 7.0
    status: tbd
    source: "the same header along the body [from memory]"
    decided_by: "M4, with the part"
  umb_conn_h:
    value: 6.0
    status: tbd
    source: "the same header's height [from memory]"
    decided_by: "M4, with the part"
  # ONE MAIN BOARD (ADR 0017): the thumb switches, their registers and the
  # carrier's circuits on one board at the thumb level, mouth cap to the end
  # of the right hand. Its size and the height its parts have are derived;
  # drc.echo prints them.
  # THE KEY BOARDS (ADR 0020, amended 2026-09-27): 1.2 mm, and a rectangle
  # across the cavity with a standoff in each corner.
  key_board_t:
    value: 1.2
    status: nominal
    source: "[calc] docs/reference/ks33-geometry.md: the pins end 5.10 below the seat and the board top is switch.pcb_below_seat below it, so a 1.6 mm board leaves ~0.1 mm of pin to solder and 1.2 mm ~0.5 mm. 1.2 mm is a standard thickness at every board house [from memory]"
    decided_by: "owner, 2026-09-27 (ADR 0020); confirmed with the first board order"
  kb_end_margin:
    value: 6.0
    status: tbd
    source: "a key board's end past its outermost switch cutout, along the body: room for a corner standoff clear of that cutout (drc.echo 'key-board standoffs in the plate's web') [drawing convention]"
    decided_by: "M4, with the boards laid out"
  board_clear:
    value: 1.5
    status: tbd
    source: "clearance between a board and the parts on the board facing it, and between parts: board flex, solder fillets and height tolerance, hand assembly [drawing convention]. 0.5 was a drawing clearance and the owner rejected it (2026-09-26: 'once components are installed you'd have issues')"
    decided_by: "M4, with the boards laid out"
  # THE MAIN BOARD'S NECK at the U-bolt station (2026-09-26): the notches at
  # the middle screws and the holes over the U-bolt's nuts leave one strip of
  # board that every trace from the mouth half to the tail half must pass.
  main_neck_min:
    value: 8.0
    status: tbd
    source: "[calc] ~20 nets cross the station (the key chain's 12 conductors, the breath sensor's lines, the strip's data, power) at 0.25 track / 0.25 gap is 10 mm on one layer, 5 mm on two; plus 0.5 mm copper keep-out from each cut edge is 6; 8 leaves room for a ground return beside them"
    decided_by: "M4 main board layout - the real net count and track widths"
  standoff_d:
    value: 5.5
    status: tbd
    source: "M3 hex standoff across flats, 5.5 [from memory]"
    decided_by: "M4, with the standoff bought"
  # THE LED MATRIX IS ON THE TOP FACE, just past the last key (owner,
  # 2026-09-26), face up against the oak top under its window, the key plate
  # ending short of it; the connectors pass beneath it. A 24-way ribbon soldered to
  # its pads runs to J-MCU on the main board (hardware/carrier/bom.csv
  # CBL-MCU-RIBBON).
  matrix_harness_h:
    value: 2.5
    status: tbd
    source: "below the Matrix: the ribbon soldered straight to its pads, wires bent flat [from memory]. Crimp housings on a pin header stood ~16.5 and put a row across the patch plug"
    decided_by: "M4, with the harness built"
  matrix_under_h:
    value: 3.2
    status: tbd
    source: "the Matrix's back-side parts (ESP32-S3, USB-C, IMU) below its board [from memory]"
    decided_by: "calipers on the board"
  matrix_led_h:
    value: 1.0
    status: tbd
    source: "WS2812B-0807 package height above the board [from memory]"
    decided_by: "the banked WS2812B-0807 datasheet, if one is found"

# ------------------------------------------------------------- openings ----
openings:
  matrix_window:
    value: 22.0
    status: nominal
    source: "[adr] ADR 0009 - 'Roughly 22 mm square'; the clear opening through the plate and the oak LIP under the acrylic window"
  # THE MATRIX WINDOW IS FROSTED ACRYLIC, FLUSH WITH THE OAK TOP, SITTING ON
  # A LIP OF OAK (owner, 2026-09-26). The oak top has a rebate from its top
  # face as deep as the acrylic, a lip wider than the opening below; the
  # acrylic drops in flush. Frosted was chosen knowingly: it softens pixels
  # at this distance from the LEDs (drc.echo prints the distance).
  matrix_lip:
    value: 2.0
    status: tbd
    source: "oak lip the acrylic rests on, per side - the rebate is the opening plus twice this"
    decided_by: "M4, with the acrylic's cut size"
  matrix_acrylic_t:
    value: 3.0
    status: tbd
    source: "frosted acrylic window thickness [from memory: common sheet]; must leave an oak lip under it"
    decided_by: "M6, with the diffusion prototype"
  # USB-C REACHES THE TAIL THROUGH A PANEL-MOUNT EXTENSION (owner,
  # 2026-09-26): the Matrix board sits under the top window, a few cm inboard
  # of the tail face, and a short USB-C extension brings its port to a
  # receptacle in the tail cap. The slot is the receptacle's panel cutout.
  usb_slot_w:
    value: 12.5
    status: tbd
    source: "panel cutout for a panel-mount USB-C extension receptacle [from memory]"
    decided_by: "M4, against the extension bought"
  usb_slot_h:
    value: 7.0
    status: tbd
    source: "as usb_slot_w [from memory]"
    decided_by: "M4"
  # THE RECEPTACLE STANDS ON END (2026-09-26). Landscape, the tail face
  # could not hold it: the rotated etherCON's flange already sits against
  # one side, and flange + web + a landscape slot is wider than the interior,
  # so the slot was pinned to the other side short of its web (drc.echo,
  # "tail cap web between the USB-C cutout and the etherCON flange"). USB-C
  # is reversible, so the receptacle's orientation costs the user nothing.
  usb_slot_portrait:
    value: true
    status: tbd
    source: "[calc] portrait takes usb_slot_h across instead of usb_slot_w: landscape was flange 31 + web 2 + slot 12.5 = 45.5 in a 45 interior; portrait is 31 + 2 + 7 = 40, and 12.5 tall in the cavity's height. Chosen over moving the etherCON (already against the side), widening the body, or a backing plate. Un-rotating the etherCON would give 5 mm back across, but its flange would then stand 31 tall in a cavity 27 tall behind the cap (drc 'etherCON body inside the cavity height')"
    decided_by: "M4, against the extension bought - its screw ears, if any, would run up and down the tail face, which is why it is earless (usb_mount)"
  usb_plug_l:
    value: 15.0
    status: tbd
    source: "RIGHT-ANGLE USB-C plug on the extension (2026-09-26): the Matrix's edge to the far side of the moulding, where the lead turns across the body [from memory]. A straight plug is 25-30 and, doubled by the centred Matrix, added ~24 mm of body"
    decided_by: "M4, against the extension bought"
  matrix_usb_to_tail:
    value: false
    status: tbd
    source: "false = the Matrix's USB-C edge faces the MOUTH, so its plug runs under the key boards instead of into the connector's housing; datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-dimensions.jpg shows the port overhanging one edge"
    decided_by: "M4, the Matrix's orientation under its window"
  usb_ext_depth:
    value: 20.0
    status: tbd
    source: "the extension receptacle's body behind the panel [from memory]"
    decided_by: "M4, against the extension bought"
  # THE PLUG HAS TO REACH THE RECEPTACLE (2026-09-26). The tail cap is 6 mm
  # of oak, thicker than the 1-2 mm panel a panel-mount receptacle is made
  # for [from memory], and a plug's overmould is bigger than the receptacle's
  # cutout, so behind a plain slot the plug would stop short. The cap is
  # POCKETED from the tail face, overmould-sized, down to a thin panel; the
  # receptacle's nose passes that panel's slot (usb_slot_w x usb_slot_h), its
  # face level with the pocket floor. drc 'USB-C plug overmould reaches the
  # receptacle'. The alternative, a receptacle mounted from the front, would
  # put its flange on the tail face, where the lane has no room for one.
  usb_overmold:
    value: [15.0, 9.0]
    status: tbd
    source: "the plug's overmould, [wide, thick], plus clearance: common USB-C cables are ~12-14.5 x 6.5-8.5 [from memory]. Stood on end the thick side is across the body, and the lane beside the etherCON flange takes up to 10 with a 2 mm web (drc 'tail cap web between the USB-C cutout and the etherCON flange') - a cable fatter than that does not fit this face"
    decided_by: "M4, calipers on the cables the instrument will actually be used with"
  usb_panel_t:
    value: 1.5
    status: tbd
    source: "oak left under the overmould pocket, the panel the receptacle clamps to [from memory: panel-mount USB-C is made for ~1-2 mm panels]"
    decided_by: "M4, against the receptacle bought - it must not exceed usb_nose_l"
  usb_nose_l:
    value: 2.0
    status: tbd
    source: "how far the receptacle's shell stands proud of its clamping shoulder, i.e. the thickest panel it can sit flush in [from memory]"
    decided_by: "M4, against the receptacle bought"
  # EARLESS (2026-09-26). Stood on end, a receptacle's two screw ears run up
  # and down the tail face, and at the usual pitch they land outside the
  # cavity behind the cap (drc 'USB-C receptacle mount inside the cavity'
  # prints where). So the receptacle is an earless one, held against the
  # panel by a clamp plate across its body, screwed to the cap's inside face
  # in the lane above and below it - or bonded, if the part has no shoulder.
  usb_mount:
    value: "earless"
    status: tbd
    source: "earless | ears. 'ears' is checked against usb_ear_pitch and fails at this cavity height; see the note above"
    decided_by: "M4, against the extension bought"
  usb_ear_pitch:
    value: 29.0
    status: tbd
    source: "screw-ear pitch of a typical panel-mount USB-C extension, ~28-30 [from memory]; used only to show why the ears do not fit on end"
    decided_by: "M4, against the extension bought"

ethercon:
  # Neutrik NE8FDP, read off the banked drawing (datasheets/connectors/NE8FDP.*)
  bore_d:
    value: 24.0
    status: settled
    source: "[ds] Neutrik ST-NE8FDP - chassis bore 24.0 min (ADR 0009)"
  flange_w:
    value: 26.0
    status: settled
    source: "[ds] NE8FDP flange 26 x 31"
  flange_h:
    value: 31.0
    status: settled
    source: "[ds] NE8FDP"
  hole_dx:
    value: 19.0
    status: settled
    source: "[ds] NE8FDP - two diagonal 3.2 holes at 19 x 24"
  hole_dy:
    value: 24.0
    status: settled
    source: "[ds] NE8FDP"
  hole_d:
    value: 3.2
    status: settled
    source: "[ds] NE8FDP"
  # MOUNTING IS FREE (owner, 2026-09-26: "don't care if the etherCON is
  # panel mounted"). So the flange-on-backplate mount and its 4 mm maximum
  # panel are gone; the connector sits with flange AND chassis behind the
  # tail cap, its front through the cap's bore - the drawing's second set of
  # depths. Screws through the cap into the flange; hardware is M4's.
  depth:
    value: 36.3
    status: settled
    source: "[ds] NE8FDP.dxf - cap's inside face to the back of the rear RJ45 socket, flange and chassis both behind"
  # The rear envelope, read off the banked drawing's own labels (NE8FDP.dxf;
  # assignment from the dimension defpoints, 2026-09-26 datasheet read):
  # a main housing, then the rear RJ45 socket, which sits off-axis.
  housing_w:
    value: 25.5
    status: settled
    source: "[ds] NE8FDP.dxf - main housing width (drawn portrait)"
  housing_h:
    value: 27.64
    status: settled
    source: "[ds] NE8FDP.dxf - main housing height (drawn portrait)"
  housing_d:
    value: 19.8
    status: settled
    source: "[ds] NE8FDP.dxf - cap's inside face to the back of the main housing, flange and chassis both behind"
  socket_w:
    value: 15.9
    status: settled
    source: "[ds] NE8FDP.dxf - rear RJ45 socket width"
  socket_h:
    value: 13.2
    status: settled
    source: "[ds] NE8FDP.dxf - rear RJ45 socket height; it runs from 0.35 off the axis to the housing's face, on the side away from the latch"
  socket_toward_centre:
    value: false
    status: tbd
    source: "with the 90-degree rotation the socket's offset lies across the body; AWAY from the centre, so the patch plug runs beside the Matrix's USB-C plug, not under it - the two cannot stack in the height under the Matrix"
    decided_by: "M4, with the latch direction chosen on the tail face"
  # THE NE8FDP IS A FEEDTHROUGH: its back is an RJ45 socket, so inside the
  # instrument a short patch lead plugs into it (hardware/bom.csv
  # CBL-UMB-PATCH). The mated plug and boot stand inboard of the body,
  # and the lead runs on to the main board.
  rj45_plug_l:
    value: 30.0
    status: tbd
    source: "mated RJ45 plug + strain-relief boot, beyond the etherCON's rear face [from memory: plug ~21, boot ~10-15]"
    decided_by: "M4 - calipers on the patch lead actually used"
  rj45_plug_w:
    value: 14.0
    status: tbd
    source: "RJ45 boot envelope across [from memory]"
    decided_by: "M4"
  rj45_plug_h:
    value: 12.0
    status: tbd
    source: "RJ45 boot envelope, height [from memory]"
    decided_by: "M4"
  rotated:
    value: true
    status: settled
    source: "[adr] ADR 0009 - 'Rotate it 90 degrees. Settled off the drawing.'"
  # STACKED UNDER THE MATRIX (owner, 2026-09-26: "the matrix can be up
  # higher out of the way and still allow the connectors"). The rear socket
  # and the patch plug pass UNDER the Matrix; only the housing, the full
  # cavity's height, has to stay behind it. The connector stands on the
  # floor - its height is derived, not set - and the body is thick enough
  # for the socket to clear the Matrix (owner, same day: "increase distance
  # between top and bottom" rather than pocket the oak).
  offset_y:
    value: -7.0
    status: tbd
    source: "placeholder - off-centre so the USB-C slot fits beside it"
    decided_by: "M4 tail-face paper check (ADR 0009)"

# ------------------------------------------------------------- hardware ----
hardware:
  fastener_count:
    value: 6
    status: settled
    source: "[adr] ADR 0009 - six M3 from the bottom into the plate"
  fastener_clear_d:
    value: 3.4
    status: nominal
    source: "M3 clearance, medium fit [from memory]"
  # LOW-HEAD SCREWS (2026-09-26): the counterbore comes up from the bottom
  # face beside the side groove, which comes down from the inside face. An
  # ISO 4762 socket head (3.0 high [from memory]) needs a 3.5 counterbore,
  # which shares 0.5 mm of depth with the groove across a web of about half a
  # millimetre - inside drill and router tolerance beside a glued side. A
  # DIN 7984 low head needs 2.5, which shares none.
  fastener_head_d:
    value: 5.5
    status: tbd
    source: "DIN 7984 M3 low-head cap screw, head diameter 5.5 [from memory]"
    decided_by: "M4, with the screws bought"
  fastener_head_h:
    value: 2.0
    status: tbd
    source: "DIN 7984 M3 low-head cap screw, head height 2.0 [from memory] (ISO 4762 is 3.0, and would share the groove's depth)"
    decided_by: "M4, with the screws bought"
  fastener_cbore_d:
    value: 6.0
    status: nominal
    source: "fastener_head_d plus clearance"
  fastener_cbore_depth:
    value: 2.5
    status: nominal
    source: "fastener_head_h + 0.5 below flush. Must stay at or under the oak left under the side groove (oak bottom - stack.groove_depth), so the counterbore and the groove share no depth (drc 'fastener counterbores clear of the side grooves')"
  # THE KEY BOARDS ARE SCREWED TO THE KEY PLATE (owner, 2026-09-27, ADR 0020):
  # an M2 self-clinching standoff pressed into the plate between each pair of
  # neighbouring switches, and an M2 screw up through the board into it. The
  # standoff's length is not a parameter: it is the plate-to-board gap the
  # switch pins set (switch.pcb_below_seat less the plate), in drc.echo.
  kb_standoff_od:
    value: 4.0
    status: tbd
    source: "an M2 self-clinching (PEM-type) standoff's barrel below the plate [from memory]"
    decided_by: "M4, with the standoff chosen with the plate vendor"
  kb_standoff_hole:
    value: 3.2
    status: tbd
    source: "the plate's mounting hole for that standoff [from memory - the vendor's install spec decides]"
    decided_by: "M4, with the plate vendor"
  kb_screw_hole:
    value: 2.2
    status: tbd
    source: "M2 clearance through the key board [from memory, ISO 273 medium]"
    decided_by: "M4"
  kb_screw_head_d:
    value: 3.8
    status: tbd
    source: "M2 low-head cap screw head, under the key board [from memory]"
    decided_by: "M4, with the screw bought"
  kb_screw_head_h:
    value: 1.6
    status: tbd
    source: "the same head's height [from memory]"
    decided_by: "M4, with the screw bought"
  kb_standoff_inset:
    value: 3.5
    status: tbd
    source: "[calc] a corner standoff's centre in from both board edges: the barrel's radius (kb_standoff_od / 2) and 1.5 mm of board past it"
    decided_by: "M4, with the standoff chosen"
  fastener_inset:
    value: 4.3
    status: tbd
    source: "distance from the inside face of each acrylic side to the fastener centre. A window, not a placeholder [calc]: at least stack.groove_clear + fastener_clear_d / 2 + 2 = 0.2 + 1.7 + 2 = 3.9, for 2 mm of oak between the clearance hole and the groove wall - the oak ends there, not at the acrylic (drc 'oak-bottom cuts inside the U'); at most half the interior width - ubolt_span / 2 - (the leg's clearance hole + fastener_cbore_d) / 2 - 3 = 22.5 - 10 - (3.5 + 6) / 2 - 3 = 4.75, for the gap pair's counterbores to stay 3 mm from the U-bolt leg holes (drc 'oak-bottom cuts at least 3 mm apart'). 4.3 is the middle of 3.9-4.75. The U-bolt backplate stops short of the fasteners' clearance circle, so its width follows this too"
    decided_by: "M4, with the U-bolt and the fasteners bought - the window moves with ubolt_span, ubolt_rod_d, fastener_clear_d and fastener_cbore_d"
  # THE U-BOLT IS M3 (2026-09-26), sized by the main board, not by the load.
  # Its nuts stand up through holes in the main board (nut corner +
  # boards.board_clear), beside the LED strip on the centreline. Measured
  # [calc], interior 45, strip 10 wide on the centreline, span 20:
  #   M5 (nut 8 AF):   hole edge 1.12 mm UNDER the strip; board neck 7.76
  #   M4 (nut 7 AF):   hole edge 0.54 under the strip. Clearing it needs a
  #                    span of 21.1+, and that closes the fastener_inset
  #                    window (upper bound 3.65 < lower bound 3.9)
  #   M3 (nut 5.5 AF): hole edge 0.33 clear of the strip; neck 10.65
  # Load: ADR 0009's mass table puts the body at ~825 g, ~8 N on the strap;
  # a factor of 10 for a jerk is 80 N. An M3 leg of 4.6 steel proofs at
  # ~1.1 kN [from memory: 5.03 mm2 stress area x 225 MPa], and there are two.
  # The oak under the backplate is the weak link, not the rod (ADR 0009).
  ubolt_rod_d:
    value: 3.0
    status: tbd
    source: "M3 [calc above]. ADR 0009 gives no U-bolt size; M4/M5 put the nut holes under the LED strip (drc 'LED strip clear of the U-bolt nut holes')"
    decided_by: "M4, from the strap hardware chosen - small M3 U-bolts are sold for model and tube clamps [from memory]; a bent M3 rod or a stainless M3 threaded rod does the same job"
  ubolt_hole_clear:
    value: 0.5
    status: tbd
    source: "clearance on the leg's diameter, in the oak bottom and the backplate: the plate floats +/- half this on the legs"
    decided_by: "M4, with the U-bolt bought"
  ubolt_span:
    value: 20.0
    status: tbd
    source: "leg centre to leg centre, legs across the body. Bounded both ways [calc]: wider closes the fastener_inset window, narrower pulls the nut holes toward the LED strip"
    decided_by: "M4"
  ubolt_drop:
    value: 18.0
    status: tbd
    source: "placeholder - how far the loop stands below the bottom face"
    decided_by: "M4"
  ubolt_nut_af:
    value: 5.5
    status: tbd
    source: "hex nut across flats for the U-bolt legs - an M3 nut is 5.5 mm [from memory, ISO 4032]; follows ubolt_rod_d"
    decided_by: "M4, with the U-bolt bought"
  ubolt_nut_h:
    value: 4.0
    status: tbd
    source: "M3 nyloc (DIN 985) height, ~4.0 [from memory] - hardware/unplaced.csv MECH-UBOLT orders nylocs; a plain ISO 4032 nut is 2.4"
    decided_by: "M4"
  backplate_t:
    value: 3.0
    status: tbd
    source: "hardware/bom.csv MECH-BACKPLATE - aluminium or ply, thickness open"
    decided_by: "M4, with the U-bolt bought: the plate spreads its nuts' clamp (mechanical/drc.echo, U-bolt nuts bear on the backplate)"
  backplate_clear:
    value: 0.5
    status: tbd
    source: "the backplate's edge short of the gap fasteners' clearance circle, across the body. The plate floats on its legs by ubolt_hole_clear / 2 each way, so at zero it would touch the screws"
    decided_by: "M4, with the plate cut"

# -------------------------------------------------------------- routing ----
# THINGS THAT RUN THROUGH THE CAVITY (modelled 2026-09-26 for the clash
# check). Where they run is a MODEL CHOICE, not a document's - each is a
# lane the design must keep free, and the clash check reports what is in it.
routing:
  tube_od:
    value: 5.0
    status: tbd
    source: "breath tube outside diameter; ADR 0003 assumes a 3 mm bore, the wall is a guess [from memory]"
    decided_by: "E2 - tube bore by playing (ADR 0003), then the tube bought"
  trap_d:
    value: 10.0
    status: tbd
    source: "dead-volume trap diameter; ADR 0003 caps the trap at 1 mL"
    decided_by: "E2"
  trap_l:
    value: 12.0
    status: tbd
    source: "trap length: 10 mm bore x 12 mm = 0.94 mL, inside ADR 0003's 1 mL [calc]"
    decided_by: "E2"
  tube_lane:
    value: "left"
    status: tbd
    source: "which side the tube and trap run on inside the mouth band (ADR 0017: sensor on the far side from the tube); there are no looms since ADR 0017"
    decided_by: "M4"
  # STANDARD FLAT RIBBON (owner, 2026-09-26), lying FLAT down the centreline
  # (on edge it does not fit between the boards' part layers - clash check).
  mcu_ribbon_w:
    value: 15.24
    status: tbd
    source: "24-way 0.635 mm ribbon for a 1.27 mm dual-row header [calc: 24 x 0.635]: allocation in hardware/carrier/bom.csv CBL-MCU-RIBBON (ADR 0018)"
    decided_by: "M4"
  mcu_ribbon_t:
    value: 0.8
    status: tbd
    source: "fine-pitch ribbon thickness [from memory]"
    decided_by: "M4"
  umb_cable_od:
    value: 4.0
    status: tbd
    source: "a slim Cat6 patch lead [from memory]; the patch plug is CBL-UMB-PATCH's plug in the etherCON's rear socket"
    decided_by: "M4, with the lead bought"
  umb_bend_r_per_od:
    value: 4.0
    status: tbd
    source: "minimum bend radius as a multiple of the cable's diameter, the usual rule for twisted-pair patch cable [from memory]"
    decided_by: "M4, with the lead's datasheet"
  chain_ribbon_w:
    value: 7.62
    status: nominal
    source: "[calc] 12 conductors at 0.635 mm, the FFSD cable's 1.27 mm IDC pitch over two rows"
    decided_by: "M4, with the cable"
  chain_ribbon_t:
    value: 0.8
    status: tbd
    source: "30 AWG flat cable's thickness [from memory]"
    decided_by: "M4, with the cable"
  chain_service:
    value: "beside"
    status: nominal
    source: "owner, 2026-09-27: long enough 'to have the top off and still connect the ribbon before tightening down'. The lid lies face down beside the body off its far edge, and the ribbon runs up from the main board, over the far side's top edge and down to the key board"
    decided_by: "owner"
  chain_slack:
    value: 10.0
    status: tbd
    source: "length added to the service path for the twist and the hand [drawing convention]"
    decided_by: "M4, on the first assembly"
  chain_fold:
    value: [1, -1]
    status: nominal
    source: "which way each ribbon's spare length folds closed, along the body (+1 toward the tail), for left_hand and right_hand: the left hand's mouth side has the breath tube's crossing and the right hand's tail side the regulator block (clash.txt)"
    decided_by: "the clash check"
  ribbon_t:
    value: 1.0
    status: nominal
    source: "flat ribbon thickness, 1.27 mm pitch PVC ribbon [from memory]"

# ------------------------------------------------------------ lighting ----
lighting:
  strip_w:
    value: 10.0
    status: tbd
    source: "hardware/carrier/carrier.md '~10 mm' [from memory there]; the strip geometry row is BLOCKED in datasheets/MANIFEST.csv"
    decided_by: "the strip in hand"
  strip_t:
    value: 2.5
    status: tbd
    source: "WS2815 strip thickness, bare IP30 [from memory]; the MANIFEST strip-geometry row is BLOCKED"
    decided_by: "the strip in hand"
  # ONE STRIP, ON THE MAIN BOARD (ADR 0016, ADR 0017): LEDs up, down the
  # centreline, lighting both acrylic sides through the cavity.
  strip_inset:
    value: 1.0
    status: nominal
    source: "the strip's tail end in from the main board's end - a model choice"
  strip_per_m:
    value: 60
    status: tbd
    source: "LEDs per metre; hardware/unplaced.csv LED-STRIP orders 60/m"
    decided_by: "M6 prototype - how evenly the cavity diffuses decides whether 30/m is enough"
