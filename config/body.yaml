    source: "the least strip of bottom plate left between a window and the plate's edge; a thinner one opens the window to the edge instead [drawing convention: a narrower strip of 1.2 mm aluminium bends when handled]"
  # ONE MAIN BOARD (ADR 0017): the thumb switches, their registers and the
  # carrier's circuits on one board at the thumb level, mouth cap to the end
  # of the right hand. Its size and the height its parts have are derived;
  # drc.echo prints them.
  # THE KEY BOARDS (ADR 0020, amended 2026-09-27): 1.2 mm, and a rectangle
  # across the cavity with a standoff in each corner.
  key_board_t:
    value: 1.6
    status: nominal
    source: "[calc] docs/reference/ks33-geometry.md: the pins end 5.10 below the seat and the board top is against the housing bottom at switch.pcb_below_seat, so a standard 1.6 mm board shows 1.0 mm of pin to solder. 1.6 mm is every board house's standard thickness"
    decided_by: "owner, 2026-09-29 (ADR 0020 Amendment 6); confirmed with the first board order"
  pcb_t_tol:
    value: [-0.16, 0.16]
    status: settled
    source: "a finished 1.6 mm board's thickness tolerance, key boards and main board: +/-10 % at 1.0 mm and over [datasheets/fab/JLCPCB-PCB-CAPABILITIES.pdf, 'Thickness Tolerance']. A board's top face is set by its spacer, so this moves only its other face - and so the gap the column standoff fills (drc.echo 'cassette height at the hardware's tolerance limits')"
  kb_end_margin:
    value: 8.8
    status: tbd
    source: "a key board's MOUTH end past its first switch cutout, along the body. The mouth corners' columns stand over the first thumb row, and a column cannot lean (ADR 0025), so its stud hole in the bottom plate must keep hardware.col_web_min of metal from that thumb switch's cutout (owner, 2026-10-05, issue #43: 'make the keyboards longer so that the standoffs are further away') [calc: the column is hardware.kb_mount_inset in from the board's end and 0.4 outside the cutout's side across the body, so the web is hypot(m - 3.6 + 0.5, 0.4 + 0.5) - 0.5 - 1.25 for the cutout's R0.5 corner (switch.cutout_r) and the stud hole's radius: 8.8 gives hypot(5.7, 0.9) - 1.75 = 4.02]. The mouth margin claims none of the body's length (drc.echo 'overall length (derived)'). drc.echo 'column holes: plate web to the switch cutouts', 'columns vertical: the main board's mounts under the key boards'', 'bottom-plate studs clear of the plate's edges and cutouts'"
    decided_by: "M4, with the boards laid out"
  kb_tail_margin:
    value: 10.3
    status: nominal
    source: "a key board's TAIL end past its last switch cutout, longer than the mouth end: the last keys (LH4/LH5, RH6) reach the board's corners across the body, and each tail corner's screw pocket in the oak top must keep hardware.col_pocket_wall from that key's cap slot [calc: half the slot 9.0 + half the pocket 3.175 + the wall 1.5 + the inset 3.6 - half the cutout 7.0 = 10.275, rounded up]. drc.echo 'key-board tail margin, least' prints how short it may be"
    decided_by: "M3, with the key positions; hardware.col_pocket_wall, which sets it"
  board_clear:
    value: 1.5
    status: tbd
    source: "clearance between a board and the parts on the board facing it, and between parts: board flex, solder fillets and height tolerance, hand assembly [drawing convention]. 0.5 was a drawing clearance and the owner rejected it (2026-09-26: 'once components are installed you'd have issues')"
    decided_by: "M4, with the boards laid out"
  # THE MAIN BOARD'S NECK at the U-bolt station (2026-09-26): the notches at
  # the middle screws and the holes over the U-bolt's nuts leave one strip of
  # board that every trace from the mouth half to the tail half must pass.
  main_neck_min:
    value: 8.0
    status: tbd
    source: "[calc] ~20 nets cross the station (the key chain's 12 conductors, the breath sensor's lines, the LED row's data and backup lines, power) at 0.25 track / 0.25 gap is 10 mm on one layer, 5 mm on two; plus 0.5 mm copper keep-out from each cut edge is 6; 8 leaves room for a ground return beside them"
    decided_by: "M4 main board layout - the real net count and track widths"
  matrix_t:
    value: 1.6
    status: settled
    source: "[ds 3D] datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-3D.stp - the board spans z -0.8 to 0.8"
  # THE LED MATRIX IS ON THE TOP FACE, just past the last key (owner,
  # 2026-09-26), face up under its window in the oak top, the key plate
  # ending short of it. SINCE 2026-10-03 IT IS ON A CARRIER BOARD OF ITS OWN
  # (owner: "So now the rh top board should not be extended, but back to
  # original length I think", then option (c), a separate small carrier, and
  # "Hang from the lid"; ADR 0021 amendment 2026-10-03): two 1x10 headers join
  # its pad rows to the carrier, which hangs from the oak top on four spacers
  # and carries J-MCU-C straight above J-MCU. hardware/boards/matrix-carrier/.
  matrix_mount:
    value: "carrier"
    status: settled
    source: "owner, 2026-10-03: option (c), 'SEPARATE SMALL MATRIX CARRIER', and 'Hang from the lid' (ADR 0021 amendment 2026-10-03). It replaces 'key_board_rh' (2026-10-02, option d), dropped because the owner wants the right-hand key board back at its original length"
  matrix_hdr_h:
    value: 2.5
    status: settled
    source: "HDR-MATRIX's plastic, which the Matrix sits on and so sets the gap between the carrier's top face and the Matrix's underside: insulation height 2.5 [ds connectors/HANXIA-HX-PZ2.54-1x10P-TP-YQ.pdf]"
  matrix_under_rest_h:
    value: 1.75
    status: nominal
    source: "the deepest of the Matrix's back-side parts OVER the carrier, its two buttons beside the USB-C receptacle (the receptacle, boards.matrix_under_h, is over the carrier's notch); everything else is 1.12 or less (the ESP32-S3 module 0.92) [3D, datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-3D.stp, per-solid bounding boxes, 2026-10-03]. drc.echo 'Matrix's back-side parts clear the carrier'"
    decided_by: "calipers on the Matrix in hand"
  matrix_notch_clear:
    value: 0.5
    status: nominal
    source: "how far the carrier's slot under the Matrix's USB-C receptacle stands off the receptacle's shell, each side and at its end - its corners rounded about the shell's corners, so the clearance holds there too (issue #34 C8: the outline's own rounding used to fillet them back to 0.29): and how far the carrier's mouth edge stands off the extension's plug: the least drc.echo 'Matrix's back-side parts clear the carrier' accepts, and config/clearance.yaml body.slot-round-smd. The slot is for the shell only (owner, 2026-10-03, option A): the plug is in front of the carrier, not over it"
  matrix_hdr_reach:
    value: 3.0
    status: settled
    source: "how far HDR-MATRIX's pads reach from its pin row, across the row: its staggered surface-mount feet 5.00 +/- 0.25 across [ds connectors/HANXIA-HX-PZ2.54-1x10P-TP-YQ.pdf], and the pads of hardware/lib/woody.pretty/PinHeader_1x10_P2.54mm_Vertical_SMD_Hanxia_PZ2.54-TP-YQ.kicad_mod, 1.6 + 2.8 / 2. drc.echo 'Matrix's back-side parts clear the carrier' holds them inside the notch's edges"
  matrix_carrier_past:
    value: 0.5
    status: nominal
    source: "how far the carrier runs past the Matrix's tail edge (its mouth edge is flush with the Matrix's, where the extension's plug stands in front of it; owner, 2026-10-03, option A), and the arm past J-MCU-C's insulator: HDR-MATRIX's end pads stand 1.07 in from the Matrix's edge, and the carrier keeps its edge clearance from them [drawing convention]"
  matrix_mount_dxy:
    value: [7.3, 17.5]
    status: nominal
    source: "the carrier's hanging mounts (matrix_mount_corners says which), at the Matrix's centre +/- these along and across the body: across, past the Matrix's edge (12.5) by a spacer's radius and a little, and inside the carrier's own edge; along, the mouth-end pair clear of J-MCU-C's insulator under the arm (its tail end at J-MCU's x1) by the washer's radius and board_clear. Across 17.5, not 17.0: HDR-MATRIX's surface-mount feet (boards.matrix_hdr_reach) reach toward the mounts, and at 17.0 three of them came within 0.1 of the mount pads' copper (5.4 across, MountingHole_2.7mm_M2.5_Pad); at 17.5 they keep 0.4 (pcb.py check). drc.echo 'Matrix carrier's mounts clear' prints every gap"
  matrix_mount_corners:
    value: [[1, -1], [-1, 1], [1, 1]]
    status: nominal
    source: "which of the four places matrix_mount_dxy gives carry a mount, as [along, across] signs (+1 the tail and the far side): THREE, not four. The near mouth-end corner has none: every one of J-MCU-C's lines to HDR-MATRIX runs along the carrier's near strip past it, between J-MCU-C and the near header row, and a mount there left room for six of the fifteen a face (pcb.py layout, 2026-10-03). Three mounts hold the carrier; J-MCU-C's arm is held at its root"
  mcu_plug_proud:
    value: 1.5
    status: nominal
    source: "how far a mated IDC socket stands past its header's mouth, where the ribbon leaves the socket's back: the socket's height with its cover, 5.00 [ds YXCON-IDC3-24232A1AUC1-1.27MM-IDC-SOCKET.pdf], less the header shroud's inner depth, 3.50 [ds XKB-X1270WR-2x12A-9TV01.pdf; the drawing gives 3.70 and 3.50 inner without saying which is which, so the larger proud] [calc]"
    decided_by: "the first pair mated"
  # THE MATRIX'S USB-C RECEPTACLE, on its underside at the mouth edge (review
  # #19 F1, 2026-10-02: the plug was modelled below it, too low to meet the key
  # plate it in fact runs into).
  matrix_usb:
    value: [0.76, 7.5, 9.5, 1.6]
    status: nominal
    source: "[overhang past the board's edge, reach in from it, width across, its axis below the Matrix's underside], measured off the vendor STEP [3D, datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-3D.stp, mesh extents, review #19 F1]; its depth below the board is boards.matrix_under_h. The plug's overmould (openings.usb_overmold) is centred on that axis"
    decided_by: "calipers on the Matrix in hand"
  # CBL-MCU-RIBBON's IDC socket, at each end (the same part both ends).
  mcu_plug_t:
    value: 3.05
    status: settled
    source: "the IDC socket's thickness across its two rows [ds YXCON-IDC3-24232A1AUC1-1.27MM-IDC-SOCKET.pdf]"
  mcu_plug_l:
    value: 19.44
    status: settled
    source: "the same socket's length, 1.27 x 12 positions + 4.2 [calc, ds YXCON-IDC3-24232A1AUC1-1.27MM-IDC-SOCKET.pdf]"
  mcu_plug_h:
    value: 5.0
    status: settled
    source: "the same socket's height along its pins, with its cover [ds YXCON-IDC3-24232A1AUC1-1.27MM-IDC-SOCKET.pdf]"
  matrix_under_h:
    value: 3.36
    status: nominal
    source: "the deepest of the Matrix's back-side parts below its board, its USB-C receptacle's shell, measured off the vendor STEP [3D, datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-3D.stp, per-solid bounding boxes, 2026-10-03]. The rest are shallower: the two buttons beside the receptacle 1.75, everything else 1.12 or less (the ESP32-S3 module 0.92). The model draws them all at this depth"
    decided_by: "calipers on the Matrix in hand"
  matrix_led_h:
    value: 0.89
    status: nominal
    source: "the Matrix's LED packages' height above its board, measured off the vendor STEP [3D, datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-3D.stp, per-solid bounding boxes, 2026-10-03]"
    decided_by: "calipers on the Matrix in hand"

# ------------------------------------------------------------- openings ----
openings:
  matrix_window:
    value: 22.0
    status: nominal
    source: "[adr] ADR 0009 - 'Roughly 22 mm square'; the clear opening through the plate and the oak LIP under the acrylic window"
  # THE MATRIX WINDOW IS FROSTED ACRYLIC, FLUSH WITH THE OAK TOP, SITTING ON
  # A LIP OF OAK (owner, 2026-09-26). The oak top has a rebate from its top
  # face as deep as the acrylic, a lip wider than the opening below; the
  # acrylic drops in flush. Frosted was chosen knowingly: it softens pixels
  # at this distance from the LEDs (drc.echo prints the distance).
  matrix_lip:
    value: 2.0
    status: tbd
    source: "oak lip the acrylic rests on, per side - the rebate is the opening plus twice this"
    decided_by: "M4, with the acrylic's cut size"
  matrix_relief_d:
    value: 0.6
    status: nominal
    source: "a shallow pocket routed into the oak top's underside over the Matrix (its square and 0.5 round it), which its top face rises into: the Matrix carrier's stack (hardware.mx_spacer_l under the oak, boards.matrix_hdr_h) puts the Matrix's top just above the oak's underside, and the relief leaves it the air config/clearance.yaml body.against-oak asks (issue #34 C11) - drc.echo 'Matrix carrier hangs from the oak' gives the air, 'LED tops under the frosted window' the LEDs' room (drc.echo 'Matrix carrier hangs from the oak', 'LED tops under the frosted window'). It thins the window's lip by as much (drc.echo 'oak lip under the frosted window') [drawing convention]"
  matrix_acrylic_t:
    value: 3.0
    status: tbd
    source: "frosted acrylic window thickness [from memory: common sheet]; must leave an oak lip under it"
    decided_by: "M6, with the diffusion prototype"
  # THE MATRIX'S OWN USB-C IS A LID-OFF RECOVERY PORT (issue #37, ADR 0015
  # amendment 2026-10-04). The tail-face extension (CBL-USB-EXT), its
  # receptacle, the tail cap's slot and pocket and the lead are gone: the
  # instrument is configured and updated over Wi-Fi in configuration mode,
  # and its MIDI leaves on a TRS jack (midi, below). Nothing is plugged into
  # the Matrix with the lid on. These keys now describe the recovery cable's
  # plug, a right-angle USB-C turned down, plugged with the lid lifted off
  # (the Matrix hangs from the oak top on its carrier): the oak pocket over it
  # stays (drc.echo 'recovery USB-C plug clear of the oak top'), and so does
  # the carrier's slot under the receptacle.
  usb_plug_l:
    value: 15.0
    status: tbd
    source: "a RIGHT-ANGLE USB-C plug, turned down: its length below the Matrix's receptacle [from memory: common right-angle plugs are 12-16]. Used only for the recovery fit"
    decided_by: "the recovery cable kept with the instrument"
  usb_plug_turn:
    value: "down"
    status: nominal
    source: "down = a right-angle plug whose lead leaves toward the main board: its overmould (openings.usb_overmold) centred on the Matrix's receptacle (boards.matrix_usb), its thickness along the body in front of the receptacle's face and openings.usb_plug_l from its top down; across = the lead leaves across the body at the plug's height (usb_plug_l along the body), which the far rail now stands in. Right-angle USB-C plugs are sold both ways [from memory]"
    decided_by: "the recovery cable kept with the instrument"
  matrix_usb_to_tail:
    value: false
    status: tbd
    source: "false = the Matrix's USB-C edge faces the MOUTH, so its plug runs under the key boards instead of into the connector's housing; datasheets/mechanical/WAVESHARE-ESP32-S3-MATRIX-dimensions.jpg shows the port overhanging one edge"
    decided_by: "M4, the Matrix's orientation under its window"
  usb_ext_overmold_w:
    value: 13.0
    status: tbd
    source: "the recovery cable's plug, its overmould across the body, at most: centred on the Matrix's receptacle it must pass the carrier's arm and J-MCU-C (the carrier's outline was drawn for it, owner 2026-10-03 option A). Common cables are ~12-14.5 wide [from memory]. The key keeps its name from CBL-USB-EXT's plug, which it was until issue #37"
    decided_by: "calipers on the recovery cable"
  usb_pocket_clear:
    value: 0.55
    status: nominal
    source: "the air the oak top's pocket over the Matrix's USB-C plug (since issue #37 the lid-off recovery plug) leaves round the plug's overmould - over its top, and past its tail-side face where the pocket ends unless the window's rebate ends it first (issue #34 C9; it was 0.3): config/clearance.yaml body.against-oak's 0.5 and a little. The rebate DOES end it first: the pocket may not run under the acrylic's rebate (drc.echo 'recovery USB-C plug clear of the oak top'), so the end wall still stands under 0.5 off the plug (mechanical/clash.txt, UNDER MINIMUM) - open. The overmould's own size is openings.usb_overmold, tbd: it settles with the cable in hand, and this clearance is re-measured then"
  usb_overmold:
    value: [15.0, 9.0]
    status: tbd
    source: "the recovery plug's overmould, [wide, thick], plus clearance: common USB-C cables are ~12-14.5 x 6.5-8.5 [from memory]. Its thickness, centred on the receptacle's axis, is what rises past the Matrix into the oak's pocket"
    decided_by: "calipers on the recovery cable"
    decided_by: "M4, against the extension bought"


# THE MIDI OUT JACK (issue #37; owner, 2026-10-04: "on the bottom face, and
# then just do a connector to the main board instead of actually mounting it
# to PCB"). A panel-mount 3.5 mm jack (J-MIDI-OUT, Same Sky SJ5-43502PM)
# through the oak bottom, in the lane beside the etherCON that the tail-face
# USB-C receptacle stood in: centred in the lane across, and between the
# adapter's front face and the tail cap along. It is fitted from inside: a
# counterbore takes its collar and leaves the oak the thread can clamp, and
# its nut goes on from outside. Its tabs are soldered to CBL-MIDI, which plugs
# into J-MIDI on the main board's freed tail corner
# (hardware/carrier/midi-out/midi-out.md). drc.echo 'MIDI jack in the oak
# bottom', 'MIDI jack clear of the etherCON and its adapter', 'MIDI jack lead
# to J-MIDI', 'J-MIDI and its plug under the Matrix carrier'.
midi:
  jack_thread:
    value: [7.0, 4.5]
    status: nominal
    source: "M7 x 0.75, [diameter, length past the collar] [ds datasheets/connectors/SAMESKY-SJ5-43502PM.pdf p.2]"
  jack_nut_t:
    value: 2.0
    status: nominal
    source: "the nut's thickness, the 2.00 on the drawing [ds datasheets/connectors/SAMESKY-SJ5-43502PM.pdf p.2]"
  jack_collar:
    value: [10.0, 1.5]
    status: nominal
    source: "the collar behind the thread, [across its corners, thick]: hex 10.0 as drawn, 1.5 [ds datasheets/connectors/SAMESKY-SJ5-43502PM.pdf p.2]"
  jack_body:
    value: [9.0, 10.2, 4.0]
    status: nominal
    source: "[diameter, length behind the collar, the solder tabs past it] [ds datasheets/connectors/SAMESKY-SJ5-43502PM.pdf p.2]"
  hole_d:
    value: 7.3
    status: tbd
    source: "the through-hole for the M7 thread, 0.3 over [drawing convention]"
    decided_by: "a test hole in an offcut of the chosen oak, with the part in hand"
  cbore_clear:
    value: 1.0
    status: tbd
    source: "the counterbore's radius past the collar's corners, for the hex to turn in as the nut is tightened [drawing convention]"
    decided_by: "the part in hand"
  # Where the lead plugs in on the main board: the freed tail corner, outside
  # both key boards' outlines, toward the lane (midi-out.md, Placement). The
  # layout places it; this is the body CAD's nominal, for the clash and the
  # lead's run.
  hdr_at:
    value: [293.5, 43.0]
    status: nominal
    source: "J-MIDI's centre, [along the body, across], body frame: in the corner the USB-C receptacle's keep-out held (pcb-geometry.echo), past HDR-SERVICE's plate window and the carrier's mounts"
    decided_by: "the main board's layout after #35"
  hdr_sz:
    value: [8.0, 4.8, 6.0]
    status: tbd
    source: "JST B3B-PH-SM4-TB, surface mount, top entry, [along its row with the fixing tabs, across, height over the board] [from memory]. Surface mount so that no tails stand over the bottom plate"
    decided_by: "JST's drawing, banked with the part"
  hdr_mated_h:
    value: 10.0
    status: tbd
    source: "J-MIDI with CBL-MIDI's PHR-3 housing mated, over the board, and the wires' turn [from memory]"
    decided_by: "JST's drawing"
  lead_slack:
    value: 15.0
    status: nominal
    source: "CBL-MIDI's length past the straight run from the jack's tabs to J-MIDI, for plugging it with the lid off after the cassette drops in [drawing convention]"

ethercon:
  # Neutrik NE8FAV: etherCON A-series, VERTICAL PCB mount, rear mounting
