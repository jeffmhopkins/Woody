    status: nominal
    source: "M3 clearance, medium fit [from memory]"
  fastener_cbore_d:
    value: 6.0
    status: nominal
    source: "M3 socket head is 5.5 [from memory]; counterbore with clearance"
  fastener_cbore_depth:
