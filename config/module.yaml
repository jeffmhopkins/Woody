      status: settled
      source: "[ds] Inter 4.1 Medium, SIL OFL 1.1 (datasheets/.manifest-R33.csv): a Helvetica-class neo-grotesque with a tall x-height; control, row and small text"
    semibold:
      value: "datasheets/fonts/Inter-SemiBold.ttf"
      status: settled
      source: "[ds] Inter 4.1 SemiBold, as medium: the name, the header, the jack pills"
  lowercase:
    value: true
    status: settled
    source: "[adr 0026] every word on the panel is set lowercase, the Lifeforms rule; the text leaves below may be written in any case"
  # Font sizes (the em, mm) per text class.
  size:
    title:
      value: 4.0
      status: nominal
      source: "[adr 0026] ~1.7 x the label size; the SV-1b's title is 1.3-1.4 x its labels [obs]"
    header:
      value: 2.2
      status: nominal
      source: "[adr 0026] section headers, knocked out of BAR"
    label:
      value: 2.4
      status: nominal
      source: "[adr 0026] knob and jack labels: an x-height of ~1.31 [calc 0.546 em x 2.4], the SV-1b's ~1.3 [obs]"
    row:
      value: 2.2
      status: nominal
      source: "[adr 0026] the toggle row's words, whose zones are rules.legend_h high"
    small:
      value: 2.0
      status: nominal
      source: "[adr 0026] annotations: the floor, art.min.text"
    maker:
      value: 2.2
      status: nominal
      source: "[adr 0026] the maker line under the title: subdued against the title's 4.0 SemiBold WHITE by size, weight (Medium) and ink (BAR's light grey), above art.min.text"
  tracking:
    value: 0.02
    status: nominal
    source: "[adr 0026] +2 % of the em between letters, every class but the title"
  # Surfaces.
  frame:
    value: 1.0
    status: nominal
    source: "[adr 0026] the black frame left at the panel's side edges and above the bottom washers' reach - the title band's and the jack legends' own 1 mm edge"
  island_r:
    value: 2.0
