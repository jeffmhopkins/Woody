  pot_pitch:
    value: 17.0
    status: settled
    source: "[adr 0004] three 14 mm knobs with 3 mm gaps across 10HP [calc 14 + 3]"
  jack_y0:
    value: 88.5
    status: nominal
    source: "[adr 0024] the first jack row"
  jack_pitch_y:
    value: 13.0
    status: settled
    source: "[adr 0004] panel table: jacks at 13 mm pitch"
  jack_pitch_x:
    value: 19.0
    status: nominal
    source: "[adr 0024] the jacks lie on their sides, pins across, sleeve outward (a PJ398SM's footprint is 13.85 along its pin line [calc from its pads], so pins down a 13 mm column collide); 19 leaves J-B2B-MOD's pads between the columns with the DRC's clearance"
  ec_y:
    value: 25.0
    status: nominal
    source: "[adr 0024 point 11] the NE8FAV on the BOTTOM row, centred, so the NE8MX's cable drops below every control: its locating pegs 1.0 clear of the rail band (DRC 'parts behind the panel clear of the rail band')"
  led_side:
    value: "left"
    status: nominal
    source: "[adr 0024 point 11] the LED in the toggle's row, in the strip left of the toggle; a panel-mount indicator on its own nut, its lead to J-LED-PANEL on the main board (point 16)"
  toggle_y:
    value: 49.5
    status: nominal
    source: "[adr 0024 point 11] the toggle's row, centred, ABOVE the NE8FAV: its lever's sweep clear of the PUSH tab below and of the last jack row's plug grips above, its body below the jack board's bottom edge (boards.jack_y0)"
  toggle_on:
    value: "right"
    status: settled
    source: "[adr 0024 point 12] the owner, 2026-09-30: the lever throws LEFT-RIGHT, across the panel, 'to avoid inadvertent triggering'. ON is thrown RIGHT, toward its 'on' legend; OFF left, toward the LED. The M2011 is ON in NKK's 'Down' position, the lever away from the bushing's keyway [ds NKK-SERIES-M-TOGGLE.pdf p.5 (A56), the circuit table's position icons], and the D4 flat sits where S4's keyway does, across from the drawn lever [ds p.7 (A58), the D4 and S4 front views] - so the flat is on the LEFT. The model derives the flat, the sweep, the body's and lugs' orientation from this one leaf"
  pots:
    value: ["POT-GAIN", "POT-OFFSET", "POT-RESP"]
    status: nominal
    source: "[adr 0004] 'three knobs across (gain, offset, response)', left to right"
  jacks:
    value: [["J-CV-BREATH", "J-CV-PITCH"], ["J-CV-MOD1", "J-CV-MOD3"], ["J-CV-MOD2", "J-CV-MOD4"]]
    status: settled
    source: "[adr 0024 point 13] rows top to bottom, left then right: BREATH and PITCH on the row under the knobs that shape breath, BREATH on the left; MOD 1 and 2 down the left column, MOD 3 and 4 down the right. The owner, 2026-10-01: 'swap the breath and pitch Jack locations' and 'swap mod 2 and 3 position'"

