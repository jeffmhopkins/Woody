# Eurorack module geometry - the module CAD's inputs (ADR 0004, ADR 0023, ADR 0024)
#
# Consumed by tools/cad.py, which writes mechanical/cad/generated/module-params.scad
# from this file. Every render, cut file and echo built from
# mechanical/cad/module.scad is fingerprinted against that file, so a change
# here marks every picture of the old value STALE until the build runs.
#
# A SEPARATE FILE FROM config/body.yaml, on purpose: the body and the module
# are separate models, and a change to one must not mark the other's
# pictures stale. Where the module uses a number the body already owns - the
# NE8FAV is the same part at both ends - a leaf says `ref:` and cad.py copies
# the value, status and source from there. It is never restated here.
# Where a number is a register figure (config/figures.yaml), the leaf says
# `figure:` and cad.py fails unless the figure's value text still contains it.
#
# EVERY LEAF CARRIES A STATUS, as in body.yaml:
#   settled  - read off a banked document or decided in an ADR; cite it
#   nominal  - a working choice; the CAD uses it until the first fit says otherwise
#   tbd      - NO document gives a number. `decided_by` says what replaces it.
# Provenance: [ds] banked datasheet, [ds 3D] banked 3D model measured,
# [adr] decision record, [calc] arithmetic shown, [repo] another corpus file,
# [web] a web source not banked, [from memory] unverified.
#
# COORDINATES - the PANEL FRAME, seen from the front:
#   x across, 0 at the panel's left edge, + to the right
#   y up, 0 at the panel's bottom edge
#   depth into the case, 0 at the panel's FRONT face (the model draws it as -z)
# KiCad's top view of either board, looking from the panel, is this view with
# y negated; parts on a board's "front" face the panel.

meta:
  owner: docs/decisions/0024-module-panel-layout-and-stack.md
  model: mechanical/cad/module.scad

# ---------------------------------------------------------------- panel ----
panel:
  w:
    value: 50.5
    figure: panel-width
    status: settled
    source: "[ds] DOEPFER-A100-CONSTRUCTION-DETAILS-a100m_e.html, Table 1: 10 HP actual module width"
  h:
    value: 128.5
    status: settled
    source: "[ds] DOEPFER-A100-CONSTRUCTION-DETAILS-a100m_e.html: 'the final height is 128.5 mm for all A-100 front panels'"
  t:
    value: 2.0
    status: settled
    source: "[ds] DOEPFER-A100-CONSTRUCTION-DETAILS-a100m_e.html: 'The front panels are made of 2 mm anodized aluminium'; PANEL row"
  hp:
    value: 5.08
    status: settled
    source: "[ds] DOEPFER-A100-CONSTRUCTION-DETAILS-a100m_e.html: 1 HP = 5.08 mm; hole spacing must be a multiple of it"
  hole_d:
    value: 3.2
    status: settled
    source: "[ds] DOEPFER-A100-FRONT-PANEL-HOLE-SKETCH-A100FP.gif: d = 3.2 mm"
  hole_x0:
    value: 7.5
    status: settled
    source: "[ds] A100FP.gif: the left holes 7.5 from the panel's left edge"
  hole_n_hp:
    value: 7
    status: settled
    source: "[adr 0024] the widest whole-HP spread that keeps the right holes inside 10HP: 7.5 + 7 x 5.08 = 43.06 [calc], as mechanical/EURORACK-3U-PANEL-HP-TABLE-make_blanks.py has for 10HP [ds]"
  hole_y:
    value: [3.0, 125.5]
    status: settled
    source: "[ds] A100FP.gif: 3.0 from the bottom edge, 125.5 (3.0 from the top)"
  slot_travel:
    value: 3.0
    status: settled
    source: "[ds] EURORACK-3U-3HP-PANEL-apfaudio-pmod-r3.1.kicad_pcb Edge.Cuts: a FABRICATED panel's mounting cut is a slot, arcs of r 1.6 whose centres run 1.5 either side of the Doepfer hole centre [calc 6.0..9.0 from the left edge], so the panel takes the rail's nut strip wherever it sits in the HP grid. Doepfer's own sketch draws a round d3.2; the slot contains it"
  four_screws:
    value: true
    status: settled
    source: "[adr 0023] point 4 - four M3 screws; Doepfer: 'From 10/12 HP usually four mounting holes are used'"
  washer_t:
    value: 0.5
    status: tbd
    source: "[from memory] DIN 125 M3 washer thickness"
    decided_by: "a DIN 125 table banked (the bank has DIN 433 / ISO 7092, the small washer)"
  washer_od:
    value: 7.0
    status: settled
    source: "[repo] MECH-PANEL-SCREW-MOD: DIN 125 M3 washer; OD 7.0 is the assumption panel-height-budget's clear height is derived on"

# The rail behind the panel's top and bottom edges. Doepfer publishes no
# board height limit: the banked pages give the panel, not the rail.
rail:
  band:
    value: 10.0
    status: tbd
    source: "[web] 108-110 mm is the usual maximum board height between the rails (modwiggler 'Max PCB height for Eurorack?', t=203897; sdiy.info wiki 'Eurorack'), i.e. ~10 mm at each edge; NOT banked - both pages refused a fetch (403) on 2026-09-29. Community rail profiles (github.com/rahji/eurorack-ears) exist but their orientation to the panel is not stated"
    decided_by: "a rail maker's drawing banked (Vector, Tiptop Z-rail, or the case vendor's), or the target case measured"
  depth:
    value: 10.0
    status: tbd
    source: "[from memory] how far behind the panel's rear face a Eurorack rail's profile reaches; drawn so the clash check sees parts in the rail band near the panel"
    decided_by: "as rail.band"

# The case the depth is checked against.
case:
  depth_max:
    value: 45.5
    status: settled
    source: "[ds] INTELLIJEL-PALETTE-CASE-MANUAL-2020-11-30.pdf p.6: '3U modules, up to a depth of 45.5mm' (middle HP; 37.42 at each 1 HP edge). Taken as behind the panel's REAR face - the manual does not say which face; the DRC also reports the depth from the front face, which is 2 mm worse"

# --------------------------------------------------------------- boards ----
boards:
  t:
    value: 1.6
    status: settled
    source: "[repo] PCB-MODULE, PCB-MODULE-JACK rows: 1.6 mm"
  side_margin:
    value: 1.0
    status: nominal
    source: "[adr 0024] each board's side edge this far inside the panel's side edge, so a neighbour module's board cannot touch it"
  toggle_clear:
    value: 1.0
    status: nominal
    source: "[adr 0024] the jack board's bottom edge at least this far above SW-POWER's body - the body is deeper than the jack board's depth, so the board must end above it"
  # The jack board is a plain rectangle (ADR 0024 point 15, the owner,
  # 2026-10-01): its bottom edge is the only number its outline adds to the
  # boards' shared one, and it ends above the toggle's row.
  jack_y0:
    value: 57.5
    status: nominal
    source: "[calc] just below the bottom jack row's footprints: layout.jack_y0 - 2 x layout.jack_pitch_y = 62.5, less the footprint's half-width across the pin line, max(jack.body_w 9.0, the pads 2.6 / 3.1) / 2 = 4.5, gives 58.0; less boards.copper_edge 0.5 = 57.5. mechanical/module/drc.echo 'jack board bottom edge' checks both that and SW-POWER's body below it (boards.toggle_clear)"
  copper_edge:
    value: 0.5
    status: nominal
    source: "[adr 0024] a pad's edge this far inside a board edge or cut-out (a fab-house edge clearance; the layout's own rules may be stricter)"
  part_clear:
    value: 0.5
    status: nominal
    source: "[adr 0024] the least air between two parts' envelopes that the DRC accepts"

# The board-to-board spacer. Its LENGTH is derived in module.scad (the
# NE8FAV's setback less the jack board's depth and thickness), never set here.
standoff:
  stock_l:
    value: 8.0
    status: settled
    source: "[ds] WURTH-WA-SPAII-970080365-SPACER-M3-8MM-POLYAMIDE.pdf: 8.0 +/-0.1, M3 internal both ends"
  tol:
    value: 0.1
    status: settled
    source: "[ds] as stock_l: +/-0.1"
  af:
    value: 6.0
    status: settled
    source: "[ds] as stock_l: SW 6 (hex across flats)"
  hole_d:
    value: 3.2
    status: nominal
    source: "[calc] M3 clearance, the panel's own hole size"
  # Where the two between the boards sit (x, y), panel frame: above the pots,
  # between them. The main board's two low mounting points are panel_standoff.
  at:
    value: [[16.75, 114.8], [33.75, 114.8]]
    status: nominal
    source: "[adr 0024] placed by hand against the pots and the rail band; module.scad DRCs every one"

# The main board's two LOW mounting points (ADR 0024 point 15): the jack board
# no longer reaches below the jacks, and the main board's rear face has no
# room for a screw head between the NE8FAV's tails and the jacks (U-ISO, its
# filter, L-CM-ISO and J-B2B-MOD's tails fill it), so these two go from the
# panel's rear face straight to the main board, where the two in the jack
# board's legs used to. A self-clinching stud in the panel, a metal M3
# female-female spacer threaded onto it, a screw from the main board's rear.
# The spacer's LENGTH is derived (the NE8FAV's setback: panel rear face to
# main board front face), never set here.
panel_standoff:
  at:
    value: [[6.375, 15.0], [44.125, 15.0]]
    status: nominal
    source: "[adr 0024] the old legs' standoffs' x, 2 lower (2026-10-01) so the right stud's flush head clears the J-UMBILICAL legend zone; module.scad DRCs the rail band, the main board's rear-face parts, the NE8FAV and the panel's face"
  stock_l:
    value: 20.0
    status: tbd
    source: "[from memory] M3 female-female hex spacers are stocked at 18 and 20 mm; the next stocked length over the derived one, faced to it (as standoff.stock_l)"
    decided_by: "the metal spacer bought for MECH-PANEL-STANDOFF-MOD"
  stud_l:
    value: 8.0
    status: settled
    source: "[ds] PEM-FH-SELF-CLINCHING-STUDS.pdf, metric FH/FHS/FHA table: M3 length codes 6, 8, 10 ... (+-0.4); 8 taken (FHA-M3-8), its head flush in the panel's front face"
  stud_hole_d:
    value: 3.0
    status: settled
    source: "[ds] PEM-FH-SELF-CLINCHING-STUDS.pdf, metric table, M3: hole size in sheet 3 (+0.08)"
  stud_head_d:
    value: 4.6
    status: settled
    source: "[ds] PEM-FH-SELF-CLINCHING-STUDS.pdf, metric table, M3: head H 4.6 - flush in the front face, so it SHOWS on the panel"
  stud_edge_min:
    value: 5.6
    status: settled
    source: "[ds] PEM-FH-SELF-CLINCHING-STUDS.pdf, metric table, M3: min. distance hole C/L to edge 5.6"
  stud_sheet_min:
    value: 1.0
    status: settled
    source: "[ds] PEM-FH-SELF-CLINCHING-STUDS.pdf, metric table, M3: min. sheet thickness 1; FHA (aluminium) for aluminium sheet of HRB 50 or less"

# The M3 pan-head screw, DIN 7985: the panel's four (MECH-PANEL-SCREW-MOD) and
# the standoffs' six (MECH-STANDOFF-SCREW-MOD): one each side of each standoff
# between the boards, one from the main board's rear into each panel standoff.
m3:
  head_d:
    value: 6.0
    status: settled
    source: "[ds] ASPEN-DIN7985-ISO7045-PAN-HEAD-DIMENSION-TABLE.pdf: DIN 7985 M3 dk nominal max 6.0 (min 5.7) - the head MECH-PANEL-SCREW-MOD buys. The ISO 7045 head is smaller; the table banked is the DIN one"
  head_k:
    value: 2.52
    status: settled
    source: "[ds] as head_d: DIN 7985 M3 k max 2.52 (nominal 2.4)"

# The 2 x 10 header soldered through both boards (J-B2B-MOD).
b2b:
  rows:
    value: 2
    status: settled
    source: "[repo] J-B2B-MOD: 2 x 10, 2.54 mm"
  pins:
    value: 10
    status: settled
    source: "[repo] J-B2B-MOD"
  pitch:
    value: 2.54
    status: settled
    source: "[repo] J-B2B-MOD"
  insulator_h:
    value: 2.54
    status: settled
    source: "[ds 3D] KICAD-PinHeader_2x10_P2.54mm_Vertical-3D.step: insulator z 0..2.54"
  pad_d:
    value: 1.7
    status: nominal
    source: "[repo] KiCad PinHeader_2x10_P2.54mm_Vertical pad (1.7 round) [from memory]"
  protrude:
    value: 1.5
    status: nominal
    source: "[adr 0024] how far the posts stand out of the jack board's front face, for a solder fillet"
  tail:
    value: 1.5
    status: nominal
    source: "[adr 0024] how far the tails stand out of the main board's rear face"
  # centre (x, y) and orientation: long axis along y, between the jack columns
  at:
    value: [25.25, 77.0]
    status: nominal
    source: "[adr 0024] between the two jack columns, near the middle jack row; 1.5 above it (2026-09-30) so its tails clear U-ISO's body on the main board's rear face (iso.at)"

# J-PWR-EURO, the 2 x 8 shrouded header, on the main board's REAR face.
power:
  l:
    value: 27.97
    status: settled
    source: "[ds] XFCN-BH254V-16P-2x8-BOX-HEADER.pdf: B = 27.97 for 2x08"
  w:
    value: 8.8
    status: settled
    source: "[ds] XFCN BH254V: body width 8.8"
  h:
    value: 9.05
    status: settled
    source: "[ds] XFCN BH254V: height above board 9.05"
  floor:
    value: 2.55
    status: settled
    source: "[calc] 9.05 height - 6.5 cavity depth [ds XFCN BH254V] = where a seated socket's face stops"
  socket_h:
    value: 14.35
    status: settled
    source: "[ds] TE-IDC-SOCKET-CATALOG-82012.pdf p.52: 622/636 socket height after crimping WITH strain relief 14.35 (the taller build; 10.5 without)"
  socket_w:
    value: 6.1
    status: settled
    source: "[ds] TE 82012 p.52: body width 6.10 max"
  socket_l:
    value: 24.82
    status: settled
    source: "[calc] TE 82012 p.53: A = B + 7.04 (12-position: 19.74 = 12.70 + 7.04); 16-position B = 7 x 2.54 = 17.78, so A = 24.82"
  ribbon_t:
    value: 1.0
    status: tbd
    source: "[from memory] 1.27 mm-pitch flat cable, ~0.9 thick"
    decided_by: "CBL-PWR-EURO's cable (the case's supplied ribbon)"
  ribbon_w:
    value: 20.32
    status: settled
    source: "[calc] 16 conductors x 1.27 mm pitch"
  # centre (x, y) on the rear face; long axis along y, pin 1 (-12 V, red
  # stripe) at the BOTTOM - Doepfer: 'the coloured marking on the ribbon
  # cable is at the bottom of the module's connector' [ds a100m_e.html]
  at:
    value: [42.5, 35.0]
    status: nominal
    source: "[adr 0024] low on the right, clear of the NE8FAV's tails (the NE8FAV is on the bottom row, centred) and of the lower right panel standoff's screw head; the ribbon folds down to the bus board behind the NE8FAV"
  drop:
    value: 10.0
    status: nominal
    source: "[adr 0024] how far below the panel's bottom edge the ribbon's envelope is drawn - toward the bus board, which the model does not draw"

# Tall parts on the main board's rear face (envelopes for the depth check).
tall:
  cap_d:
    value: 6.3
    status: settled
    source: "[repo] C-BULK-RAIL 100 uF: CP_Radial_D6.3mm (the tallest of the four)"
  cap_h:
    value: 11.0
    status: tbd
    source: "[from memory] a 6.3 x 11 25 V 100 uF can; the banked KiCad model is a generic 6.3 tall"
    decided_by: "C-BULK-RAIL's MPN"
  trim:
    value: [9.53, 4.83, 10.03]
    status: settled
    source: "[ds] BOURNS-3296-TRIMPOT.pdf via R26: 3296W body 9.53 x 4.83 x 10.03"
  trim_smd:
    value: [4.8, 3.9, 5.3]
    status: nominal
    source: "[ds] BOURNS-3224-TRIMPOT.pdf p.1, 3224W Top Adjust: 4.8 x 3.9 over the terminals in plan, 5.3 tall including the terminals' bend, its adjustment slot (D1.5) on top, facing away from the board. TRIM-RESP (RV4, 3224W-1-103E). Read off the drawing's three views, whose projection is not labelled: the slot view is taken as the top"
    decided_by: "the part in hand"
  # Each: [x, y, kind] on the rear face - an envelope for the depth and
  # clash checks, NOT a placement; the layout places them.
  at:
    value: [[36.0, 88.0, "cap"], [44.5, 88.0, "cap"], [36.0, 103.5, "cap"], [44.5, 103.5, "cap"],
            [25.25, 95.0, "trim"], [14.0, 95.0, "trim"], [36.5, 95.0, "trim"], [46.0, 95.0, "trim_smd"]]
    status: nominal
    source: "[adr 0024] representative spots for the three 3296 trimmers, TRIM-RESP's 3224W (trim_smd) and four bulk caps, so the depth check sees them; the layout moves them. Every trimmer is on the rear face and adjusted from behind with the module out of the rack (mechanical/module/drc.echo 'trimmers adjustable from behind'). The caps sit on the right, in two columns either side of the trimmers' row (2026-10-03): the iso board (iso_board) is behind the main board's middle, up to iso_board.y1, and a 6.3 x 11 can does not fit under it"

# U-ISO, the instrument's isolated supply (ADR 0027): RECOM RPA20-2412SAW and
# its filter on THE ISO BOARD (iso_board below; ADR 0023 point 2, amended
# 2026-10-03), on that board's REAR face, its pins' tails out of the iso
# board's front face into the gap toward the main board. Positions are in the
# panel frame, like every other leaf here.
iso:
  body:
    value: [25.4, 25.4, 10.2]
    status: settled
    source: "[ds] RECOM-RPA20-AW.pdf PD-7, PD-8: 25.4 x 25.4 x 10.2 mm without heat sink"
  pin_l:
    value: 5.6
    status: settled
    source: "[ds] RECOM-RPA20-AW.pdf PD-8: pins 5.60 below the body"
  pin_d:
    value: 1.0
    status: settled
    source: "[ds] RECOM-RPA20-AW.pdf PD-8: pin d1.0 +/-0.1"
  # The fitted pins (plain RPA20 SAW: 1, 2, 4, 5, 6), offsets from the body's
  # centre in the panel frame, in that order. The footprint's pattern
  # (woody:Converter_DCDC_RECOM_RPA20-RP20-xxxxSAW_THT) turned so the input pins
  # (1, 2) face UP and the 4/5/6 row runs across the BOTTOM, beside J-B2B-ISO:
  # the output, which leaves the iso board, has the short way to the header,
  # and the input comes round from L-CM-ISO on the right (2026-10-03; on the
  # main board it was turned the other way, to clear SW-POWER's lugs).
  pins:
    value: [[2.54, 10.16], [-2.54, 10.16], [-10.16, -10.16], [0.0, -10.16], [10.16, -10.16]]
    status: settled
    source: "[ds] RECOM-RPA20-AW.pdf PD-8 recommended footprint: columns 20.32 apart, the 3/4 row 2.54 inside the body's edge; 2 and 1 at 7.62 and 12.70 from it, 4/5/6 at 0/10.16/20.32 [calc: offsets from the centre, turned 270 degrees]"
  at:
    value: [14.45, 63.0]
    status: nominal
    source: "[calc] on the iso board's rear face, at its left: the body's left edge 0.5 inside the board's (boards.side_margin + 0.5 + 12.7 = 14.2, taken as 14.45 for the courtyard's 0.25), its bottom above J-B2B-ISO and the iso board's lower strip (63.0 - 12.7 = 50.3). The layout places it; module.scad DRCs it on the iso board"
  # U-ISO's filter parts that stand tall: [x, y, kind, diameter or side, height, refdes]
  filter:
    value: [[16.0, 79.8, "can", 6.3, 7.7, "C-ISO-BULK"], [19.0, 44.0, "can", 6.3, 5.8, "C-ISO-OUT"], [33.9, 47.9, "box", 6.0, 2.8, "L-ISO-IN"],
            [38.75, 63.0, "toroid", 21.6, 11.43, "L-CM-ISO", 17.78, 4.0, 45]]
    status: nominal
    source: "[repo] the rows' packages: C-ISO-BULK SMD can 6.3 x 7.7, C-ISO-OUT 6.3 x 5.8, L-ISO-IN 6.0 x 6.0 x 2.8 (hardware/module/power-entry/bom.csv); on the iso board's rear face, where the layout will want them - an envelope, not a placement: C-ISO-BULK across U-ISO's input pins at the top, C-ISO-OUT beside the output row and J-B2B-ISO at the bottom, L-ISO-IN between J-B2B-ISO's input pins and L-CM-ISO (and inside the ribbon fold's height, mechanical/module/drc.echo). L-CM-ISO (Bourns PM3700-40-RC, owner 2026-10-01): [x, y, 'toroid', span over the terminals, height, refdes, body diameter, terminal width, rotation] = 21.6 +/-0.3 over the terminals, body D17.78, 11.43 max tall, terminals 4.0 wide [ds BOURNS-PM3700-CM-CHOKE.pdf p.1, Product Dimensions]. Right of U-ISO its 21.6 span leaves nothing either side, so it is TURNED 45 degrees: the terminals then reach (10.8 + 2.0) / sqrt 2 = 9.05 each way [calc], and the body 8.89. The layout keeps the turn or finds other room; mechanical/module/drc.echo checks either"

# THE ISO BOARD (PCB-MODULE-ISO; ADR 0023 point 2, amended 2026-10-03 by the
# owner: "3 boards for module is correct"): U-ISO and its filter on a board of
# their own, parallel to the main board and BEHIND it, so the main board's
# middle - where the DAC meets the mod channels - is not shared with a 25 mm
# converter's pins, its isolation gap and its return pour. Held off the main
# board's rear face by stock spacers (the gap is standoff.stock_l, uncut) and
# joined to it by J-B2B-ISO, soldered through both like J-B2B-MOD. Its outline
# is derived in module.scad from the boards' side edges, the NE8FAV's tails
# (its bottom edge) and J-PWR-EURO (the notch at its lower right, which the
# header and its mated socket stand in); only its top edge is a leaf.
iso_board:
  y1:
    value: 84.0
    status: nominal
    source: "[adr 0023, amended 2026-10-03] the iso board's top edge: below the rear trimmers (tall.at, y 95) so each stays adjustable from behind with nothing taller over it, and below the bulk caps' envelopes (tall.at, moved above it). mechanical/module/drc.echo 'trimmers adjustable from behind' counts the iso board as a taller part"
  # The spacers between the main board's rear face and the iso board's front:
  # [x, y], the panel frame. Three, so U-ISO's 20 g is held at both ends.
  standoff_at:
    value: [[11.5, 41.8], [4.8, 80.1], [45.7, 80.1]]
    status: nominal
    source: "[adr 0023, amended 2026-10-03] placed by hand: the lower one in the strip under U-ISO, right of CBL-LED-PANEL's run down the main board's front (its screw head is there); the upper two in the strip above U-ISO and L-CM-ISO. module.scad DRCs each against both faces"
  # The most the main board's rear-face parts may stand under the iso board,
  # and the iso board's front-face parts over it: the gap is shared.
  under_h:
    value: 3.0
    status: nominal
    source: "[adr 0023, amended 2026-10-03] SMD only under the iso board (a SOIC is 1.75, an SMA diode 2.4 [from memory]); with U-ISO's tails out of the iso board's front (iso.pin_l less boards.t) the DRC 'iso board gap' wants tail + under_h + boards.part_clear inside the gap"

# J-B2B-ISO, the 2 x 5 header soldered through the main board and the iso
# board: its insulator on the main board's rear face, its posts through the iso
# board. Pin k is one conductor through both, so both boards take the same
# unmirrored map (as J-B2B-MOD).
b2b_iso:
  rows:
    value: 2
    status: settled
    source: "[repo] J-B2B-ISO: 2 x 5, 2.54 mm (hardware/module/bom.csv)"
  pins:
    value: 5
    status: settled
    source: "[repo] J-B2B-ISO: four nets on two pins each, one pair left unfitted between the input and the output for the isolation gap (hardware/boards/module-iso/README.md)"
  # centre (x, y); long axis along x
  at:
    value: [30.25, 42.0]
    status: nominal
    source: "[adr 0023, amended 2026-10-03] at the iso board's lower right, under U-ISO's output row and left of J-PWR-EURO: its insulator on the main board's rear face, inside the power ribbon's fold, which clears it (mechanical/module/drc.echo)"

# ----------------------------------------------------------- panel parts ----
# PJ398SM (J-CV) - QingPu / Thonk drawing and the banked community STEP.
jack:
  hole_d:
    value: 6.3
    status: nominal
    source: "[ds] PJ398SM-drawing.jpg: bushing D6; +0.3 clearance [repo J-CV: '6.2-6.5 in practice']"
    decided_by: "the first panel's test-fit"
  body_w:
