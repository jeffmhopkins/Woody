# Key layout — single source of truth (ADR 0010)
#
# Consumed by:
#   - mechanical: key positions generate plate DXF cutout geometry
#                 (tools/cad.py -> mechanical/cad/generated/params.scad)
#   - firmware:   key ids generate the shift-register bit mapping and fingering table
#
# When a key moves, both stay in sync by construction. Do not hand-edit the
# generated plate or the firmware mapping.
#
# STATUS: key count and grouping are decided. Physical positions are NOT —
# they come out of ergonomic iteration at M2/M3. Every x/y below is null on
# purpose; the first laser-cut plate is generated from this file once they
# are filled in.

meta:
  units: mm
  # Instrument envelope (ADR 0009).
  envelope:
    # DERIVED since 2026-09-26 (owner: "minimize total length"). The body CAD
    # computes it from the key layout, the underside and the tail connector
    # and prints it in mechanical/drc.echo ("overall length"). Not a number
    # here: a stated length would go stale with every key move.
    length: null
    thickness: 39   # `body-thickness`, config/figures.yaml - stated in ADR 0009
    width: 57       # 2.25 in
  origin: top-left of key plate, +x right, +y down
  switch: gateron-ks33
  keycap: mt165-mx
  # 14.0 x 14.0 mm — the same as standard MX. Measured from a working KS-33
  # build; see docs/reference/ks33-geometry.md. An earlier revision of this
  # file claimed it was NOT the MX figure, which was wrong.
  # The *achieved* cutout may differ by the cutter's kerf: M1 coupon decides.
  plate_cutout: 14.0
  # SETTLED at 1.20 mm - the tracked figure is `plate-thickness`, read off
  # Gateron's banked drawing. Do not restate the number here; this field
  # exists so the generator has it, and `plate-thickness` is where it is
  # argued.
  #
  # This said `null` and "OPEN, and it blocks M4/M5" while the register
  # said settled, and cluster-boards.md cited THIS FILE as the authority
  # for calling it open. The citation chain was intact and both ends agreed
  # with each other - just not with the register. No forbidden pattern can
  # ever catch that shape: the register protects against a superseded
  # VALUE, and `null` is the absence of one.
  plate_thickness: 1.20

counts:
  left_hand: 5
  right_hand: 6
  left_thumb: 4
  right_thumb: 4
  total: 19
  by_role:
    note: 15      # LH1-5, RH1-6, LT1-4 — fingering inputs
    control: 4    # RT1-4 — modulation, IMU gating, hold/preset

# Physical switch positions.
#
#   id:       stable identifier, referenced by firmware and fingering table
#   face:     top | bottom | side   (ADR 0009)
#   x, y:     position on the plate, mm — filled in at M3
#   rotation: degrees, for keys angled to the finger
#   hand:     left | right
#   finger:   thumb | index | middle | ring | little — assign at M2
#   cluster:  groups keys onto a shift register
#   role:     note | control
#             note    - participates in the fingering table
#             control - modulation, IMU gating, mode. NOT a fingering input
#
# Left hand is upper (nearer the mouthpiece), right hand lower.
#
# Top keys run in a SINGLE LINE down the body, flute-style (ADR 0010).
# Spacing along that line is deliberately NON-UNIFORM: comfortable pitch under
# index/middle/ring, tighter grouping for the keys the little finger reaches.
# That is why keys carry explicit x/y rather than a pitch parameter.

keys:
  # --- Left hand, top face -------------------------------------------------
  - { id: LH1, face: top,    x: null, y: null, rotation: 0, hand: left,  finger: null, cluster: left_hand, role: note }
  - { id: LH2, face: top,    x: null, y: null, rotation: 0, hand: left,  finger: null, cluster: left_hand, role: note }
  - { id: LH3, face: top,    x: null, y: null, rotation: 0, hand: left,  finger: null, cluster: left_hand, role: note }
  - { id: LH4, face: top,    x: null, y: null, rotation: 0, hand: left,  finger: null, cluster: left_hand, role: note }
  - { id: LH5, face: top,    x: null, y: null, rotation: 0, hand: left,  finger: null, cluster: left_hand, role: note }

  # --- Left thumb, bottom face (inset — ADR 0009) --------------------------
  # Marked `note` on the assumption these are octave/register keys, as on a
  # conventional woodwind. Confirm at M2.
  - { id: LT1, face: bottom, x: null, y: null, rotation: 0, hand: left,  finger: thumb, cluster: left_thumb, role: note }
  - { id: LT2, face: bottom, x: null, y: null, rotation: 0, hand: left,  finger: thumb, cluster: left_thumb, role: note }
  - { id: LT3, face: bottom, x: null, y: null, rotation: 0, hand: left,  finger: thumb, cluster: left_thumb, role: note }
  - { id: LT4, face: bottom, x: null, y: null, rotation: 0, hand: left,  finger: thumb, cluster: left_thumb, role: note }

  # --- Right hand, top face ------------------------------------------------
  - { id: RH1, face: top,    x: null, y: null, rotation: 0, hand: right, finger: null, cluster: right_hand, role: note }
  - { id: RH2, face: top,    x: null, y: null, rotation: 0, hand: right, finger: null, cluster: right_hand, role: note }
  - { id: RH3, face: top,    x: null, y: null, rotation: 0, hand: right, finger: null, cluster: right_hand, role: note }
  - { id: RH4, face: top,    x: null, y: null, rotation: 0, hand: right, finger: null, cluster: right_hand, role: note }
  - { id: RH5, face: top,    x: null, y: null, rotation: 0, hand: right, finger: null, cluster: right_hand, role: note }
  - { id: RH6, face: top,    x: null, y: null, rotation: 0, hand: right, finger: null, cluster: right_hand, role: note }

  # --- Right thumb, bottom face, offset from the thumb rest ----------------
  # Control switches, not fingering. Modulation and IMU gating (ADR 0007).
  # The right thumb normally rests; these sit offset from the rest position,
  # reachable without giving up support. FOUR, as two rows across the body
  # either side of the rest, like the left thumb (owner, 2026-09-26: "let's
  # go consistent"). RT4 takes the bit reserved for the hold/preset spare.
  - { id: RT1, face: bottom, x: null, y: null, rotation: 0, hand: right, finger: thumb, cluster: right_thumb, role: control }
  - { id: RT2, face: bottom, x: null, y: null, rotation: 0, hand: right, finger: thumb, cluster: right_thumb, role: control }
  - { id: RT3, face: bottom, x: null, y: null, rotation: 0, hand: right, finger: thumb, cluster: right_thumb, role: control }
  - { id: RT4, face: bottom, x: null, y: null, rotation: 0, hand: right, finger: thumb, cluster: right_thumb, role: control }

# Shift register chain. One U-KEYS per cluster, ON THE BOARD ITS SWITCHES ARE
# ALREADY ON: 4 devices, 32 bits, 19 used, 13 spare. The two thumb registers
# are on the main board; each key board's register reaches it by one 12-way
# IDC ribbon carrying its SER in and QH out (ADR 0017,
# hardware/interfaces/key-chain-loom/).
#
# THE ORDER BELOW IS A CHAIN DECISION, not a layout detail. ADR 0001 requires
# serial data to flow TOWARD the clock source so that propagation skew eats
# SETUP margin (recoverable by clocking slower) rather than HOLD margin (not
# recoverable at any speed). The MCU is at the tail, so right_thumb is nearest
# and reads out first; left_hand takes the chain's SER end.
#
# BIT 0 IS THE FIRST BIT CLOCKED OUT - the device nearest the MCU. That
# definition was ambiguous once and the ambiguity is what got the order wrong.
#
# Honest magnitude: adjacent-cluster skew is ~0.5ns against the register's tens of
# nanoseconds of propagation delay (SN74HCS165 CLK->QH, its datasheet p.7),
# so the wrong order costs a few percent of hold margin rather than violating
# it. An earlier version of this comment said it would put "hold-margin
# violations" into a bonded body; that was an honesty marker pointing the
# wrong way. Follow the rule anyway - it is free.
chain:
  - cluster: right_thumb  # bits 0-7   — 4 used, 4 spare — nearest the MCU
  - cluster: right_hand   # bits 8-15  — 6 used, 2 spare
  - cluster: left_thumb   # bits 16-23 — 4 used, 4 spare
  - cluster: left_hand    # bits 24-31 — 5 used, 3 spare — SER end of the chain

# Spare chain bits: 13 total, but NOT all available.
#   8 are claimed by the marker pattern (ADR 0001) - wiring-only, and they
#   are wiring-only, so adding one later means opening the body and
#   reworking the board (ADR 0017). DECIDED 2026-09-21: eight, not
#   the 4-6 this file used to say. Two per device, one wired high and one
#   wired low, so any device that is dead, unclocked, stuck high or stuck low
#   fails its own marker whichever way it broke. See
#   hardware/cluster/key-marker-and-bits/key-marker-and-bits.md §4 for the
#   bit assignment.
#   2 are reserved for spare switches: octave up, octave down. (The third,
#   hold/preset, became RT4 on 2026-09-26.)
#   The 3 genuinely free bits are FLOATING CMOS INPUTS and must be pulled -
#   the exact fault R-KEY-PU exists to fix (ADR 0001).
#   They have NO CUTOUTS (owner, 2026-09-26, ADR 0010): the right thumb is
#   only its three, the left thumb its four in a line. Fitting one later
#   means recutting the thumb plate and oak bottom; the body opens on six
#   fasteners (ADR 0009), so that is work, not impossible.
# The 2021 firmware triggered mode changes from key combinations (A[1], A[7],
# A[8]); dedicated inputs are better and these bits are already paid for.
spare_bits: 13
spare_bits_marker: 8      # DECIDED 2026-09-21, ADR 0001 - was 6
spare_bits_switches: 2    # reserved, networks fitted, no cutouts (2026-09-26)
spare_bits_free: 3        # was 5; two went to the marker. A free bit has no
                          # network and no cutout. Still must be
                          # pulled - floating CMOS input (ADR 0001 fix 6)

# Fingering table lives in NVS and is editable at runtime, not compiled in
# (ADR 0010). This file defines the physical layout only.
