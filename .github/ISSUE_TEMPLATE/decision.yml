name: Decision
description: A choice the owner has to make. Closing it produces an ADR or ADR amendment.
labels: ["kind: decision", "status: needs owner decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations: {required: true}
  - type: textarea
    id: options
    attributes:
      label: Options and trade-offs
      description: One per option. Mark provenance on every claim ([repo], [calc], [web] URL, [from memory]).
    validations: {required: true}
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
  - type: textarea
    id: record
    attributes:
      label: Recorded in
      description: Filled at close — the ADR or amendment that records the answer, and the owner's words quoted.
