    - K
    note: 'Between the buck and the dev board''s 5V pin: the OR node is that pin, and USB can back-feed it'
  L-BUCK-IN:
    value: 22uH
    pins:
    - 1
    - 2
    note: One inductor, one buck input capacitor, one buck
  NT-AGND:
    value: net tie
    pins:
    - 1
    - 2
    note: 'The analog star''s single tie to PWR_GND: copper only, under U-ADC between its VSS and its digital pins
