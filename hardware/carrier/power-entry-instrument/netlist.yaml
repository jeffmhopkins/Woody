  C-INRUSH-GD:
    value: 22nF 50V X7R
    pins:
    - 1
    - 2
    note: 'The Miller capacitor: gate to drain, through R-INRUSH-GD. It sets the ramp: dV/dt = I(R-INRUSH-G) / C,
      about 400 V/s, 0.23 A into the instrument''s 570 uF'
  C-INRUSH-GS:
    value: 1uF 50V X7R
    pins:
    - 1
    - 2
    note: 'Gate to source, AT LEAST 45x C-INRUSH-GD: when the plug makes contact the source jumps 12 V in microseconds,
      and the gate must follow it or the Miller capacitor turns the FET on hard. 1 uF against 22 nF holds the jump
      in V_GS to -0.26 V, under the 0.5 V minimum threshold'
  C-STRIP-BULK:
    value: 470uF 25V
    pins:
    - 1
    - 2
    note: 'At the LED row''s 12 V feed end. Bulk belongs where the current swings: the row''s PWM steps its whole
      current at once, and each LED''s own 100 nF (C-LED) takes only the edges (ADR 0028)'
