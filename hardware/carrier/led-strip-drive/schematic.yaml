# PLACEMENT for the generated schematic sheet - tools/sch.py.
#
# netlist.yaml beside this file is AUTHORITATIVE for connectivity; this file
# only says which KiCad symbol draws each part, which pin NUMBER each named
# pin is, and where things sit. Coordinates are mm on the sheet, y DOWN, on
# the 1.27 mm grid; `at` is [x, y, rotation]. `tools/sch.py build` proves the
# sheet's connectivity equals netlist.yaml, so a wrong pin map or a misplaced
# wire fails the build rather than drawing a plausible lie.

name: led-strip-drive
paper: A4
title:
  title: "LED strip drive (carrier/led-strip-drive)"
  comment: "ADR 0014, ADR 0016 - one WS2815 strip on the main board"

# Nets drawn as power symbols. The symbol's VALUE is set to the net name, so
# KiCad names the net after this repository's net, not after the symbol.
power:
  PWR_GND: GND
  INST_5V_A: +5V
  UMBILICAL_POS12: +12V

ports:
  IO1: {shape: input}

components:
  U-LVLSHIFT:
    symbol: "74xx:74LS125"          # same pinout and symbol; value says what is fitted
    value: "74AHCT125"
    # Package pin numbers, SOIC-14 [ds datasheets/logic/SN74AHCT125.pdf p.1,
    # pin-out drawing: 1OE 1, 1A 2, 1Y 3, 2OE 4, 2A 5, 2Y 6, GND 7, 3Y 8,
    # 3A 9, 3OE 10, 4Y 11, 4A 12, 4OE 13, VCC 14]
    pins: {1OE: 1, 1A: 2, 1Y: 3, 2OE: 4, 2A: 5, 2Y: 6, GND: 7, 3Y: 8, 3A: 9, 3OE: 10, 4Y: 11, 4A: 12, 4OE: 13, VCC: 14}
    units:
      1: [116.84, 58.42, 0]         # gate A - the one that drives the strip
      2: [116.84, 124.46, 0]        # gates B, C, D - spare, tied off
      3: [149.86, 124.46, 0]
      4: [182.88, 124.46, 0]
      5: [60.96, 116.84, 0]         # power unit
  C-DECOUPLE-LED:
    symbol: "Device:C"
    value: "100nF"
    at: [88.9, 116.84, 0]
  R-LED-PD:
    symbol: "Device:R"
    value: "10k 1%"
    at: [91.44, 68.58, 0]
  R-LED-SER:
    symbol: "Device:R"
    value: "330R"
    at: [142.24, 58.42, 90]
  J-LED:
    symbol: "Connector_Generic:Conn_01x04"
    value: "WS2815 strip"
    # Pin order is OPEN until the connector is chosen (J-LED row, M4). This
    # order puts the supply and ground at the ends and the two data lines
    # together, matching the tape's own wire order [from memory].
    pins: {POS12: 1, DI: 2, BI: 3, GND: 4}
    at: [185.42, 58.42, 0]

wires:
  - [[66.04, 58.42], [91.44, 58.42], U-LVLSHIFT.1A]
  - [[91.44, 58.42], R-LED-PD.1]
  - [U-LVLSHIFT.1Y, R-LED-SER.1]
  - [R-LED-SER.2, J-LED.DI]
  - [J-LED.BI, [177.8, 60.96], [177.8, 63.5]]
  - [J-LED.GND, [177.8, 63.5], [177.8, 66.04]]

labels:
  - {net: IO1, at: [66.04, 58.42], dir: left}
  - {net: GATE_A_OUT, at: [127.0, 58.42], dir: right}
  - {net: LED_DI, at: [157.48, 58.42], dir: right}

power_symbols:
  - {net: PWR_GND, at: [177.8, 66.04]}

notes:
  - at: [20.32, 142.24]
    text: "R-LED-PD holds the input low through the bootloader window: GPIO1 floats, OE is tied low,\nand a floating AHCT input would put clean 5 V edges into the strip before firmware runs.\nBI is grounded at the head of the strip; from the second pixel on, BI comes from inside the tape.\nGates B-D are spare: inputs and enables tied low (an enabled CMOS gate never floats)."
