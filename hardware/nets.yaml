# THE MASTER NET LIST. Authoritative for every net that crosses a circuit
# boundary.
#
# WHY IT IS AT THIS LEVEL. A per-circuit netlist.yaml can only declare its own
# side of a boundary-crossing net. Across 23 circuits that is up to 23
# half-declarations with NOBODY OWNING THE NET - so two circuits can spell it
# differently, two can both claim to drive it, and one can name a peer that
# never names it back. None of that is visible from inside either circuit. It
# is the same shape as every other defect here: a fact stated in several
# places and owned in none.
#
# SEEDED FROM THE 23 `## Interfaces` TABLES, which are the prose version of
# this file: 164 rows, 114 distinct node spellings, 29 nets named by more than
# one circuit. Those tables stay - they carry the reasoning - but this file is
# what a tool reads.
#
# THE RULES, enforced by tools/check-netlist.py:
#   - every `ports:` entry in a circuit netlist must name a net here
#   - dir `out` must come from this net's `driver`; `in` from `receivers`;
#     `ref` from `reference`
#   - every net needs exactly one driver unless `multi_driver` or `undriven`
#   - every circuit named here must declare the matching port
# The last rule is the bidirectional half, and it is what made the `circuit:`
# dependency edges trustworthy when it was applied to them.
#
# VALUES LIVE IN config/figures.yaml. `figure:` cites; it does not restate.
# A NET HERE ASSERTS A CONNECTION. Do not add one speculatively - an asserted
# connection the board does not have is worse than a missing one.

version: 1

nets:

  # ======================================================================
  # INSTRUMENT: the key chain, carrier to cluster boards
  # ======================================================================

  V3V3_CHAIN:
    kind: power
    carries: "3V3 to the cluster boards, J-CHAIN pin 10"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register, cluster/key-switch-network, cluster/key-marker-and-bits]

  GND_CHAIN:
    kind: reference
    carries: "Chain return, five alternating grounds on J-CHAIN pins 1/3/5/7/9"
    figure: chain-conductors
    origin: interfaces/key-chain-loom
    reference: [cluster/key-register, cluster/key-switch-network, cluster/key-marker-and-bits]

  CHAIN_SCK:
    kind: signal
    domain: digital
    carries: "Shift clock to the 74HC165 chain"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]

  CHAIN_SHLD:
    kind: signal
    domain: digital
    carries: "Shift/load to the 74HC165 chain"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]

  CHAIN_SER:
    kind: signal
    domain: digital
    carries: "Serial in at the far end of the chain. POINT TO POINT, not a bus - which is why the connector count is 8 and not one per board"
    figure: chain-connectors
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]

  CHAIN_QH:
    kind: signal
    domain: digital
    carries: "Serial out, back toward the MCU. Point to point, like SER"
    driver: cluster/key-register
    receivers: [interfaces/key-chain-loom]

  KEY_BITS:
    kind: signal
    domain: digital
    carries: "The parallel switch bits into the shift registers, within a cluster board"
    driver: cluster/key-switch-network
    receivers: [cluster/key-register]

  MARKER_BITS:
    kind: signal
    domain: digital
    carries: "Board-identity bits wired high or low at each cluster"
    figure: marker-bits
    driver: cluster/key-marker-and-bits
    receivers: [cluster/key-register]

  # ======================================================================
  # INSTRUMENT: breath front end and the carrier
  # ======================================================================

  SENSOR_BUFFERED_OUT:
    kind: signal
    domain: analog
    carries: "The MPXV4006DP output, buffered by half an OPA2197 on the carrier"
    figure: sensor-full-scale
    driver: carrier/breath-excitation-reference
    receivers: [carrier/breath-adc, interfaces/breath-sense-link]

  AGND_INST:
    kind: reference
    carries: "Instrument analog star. Carries no power current - that is the whole point of it"
    figure: dig-gnd-topology
    origin: carrier/power-entry-instrument
    reference: [carrier/breath-adc, carrier/breath-excitation-reference]

  BREATH_SENSE:
    kind: signal
    domain: analog
    carries: "The sensor's buffered output down the umbilical, through the instrument-side R1"
    figure: sensor-full-scale
    driver: interfaces/breath-sense-link
    receivers: [module/breath-receive-stage]

  AGND_SENSE:
    kind: signal
    domain: analog
    carries: >
      The instrument's analog star arriving through the instrument-side R1b.
      A SIGNAL, NOT A GROUND - it drives the in-amp's IN+ through R2 and is
      what makes the measurement differential. DO NOT MERGE IT WITH AGND_MOD.
    figure: umbilical-pinmap
    driver: interfaces/breath-sense-link
    receivers: [module/breath-receive-stage]

  # ======================================================================
  # UMBILICAL: SPI and power
  # ======================================================================

  SCLK:
    kind: signal
    domain: digital
    carries: "SPI clock, instrument to module, through R-SPI-SER"
    figure: spi-series-r
    driver: interfaces/spi-link
    receivers: [module/digital-and-supervision]

  MOSI:
    kind: signal
    domain: digital
    carries: "SPI data, instrument to module"
    driver: interfaces/spi-link
    receivers: [module/digital-and-supervision]

  CS_MOD:
    kind: signal
    domain: digital
    carries: "Module chip select"
    driver: interfaces/spi-link
    receivers: [module/digital-and-supervision]

  DIG_GND:
    kind: reference
    carries: "Digital return, instrument to module"
    figure: dig-gnd-topology
    origin: module/power-entry
    reference: [interfaces/spi-link, module/digital-and-supervision]

  UMBILICAL_POS12:
    kind: power
    carries: "The +12 V exported to the instrument, downstream of the load switch"
    figure: umbilical-current
    driver: module/umbilical-load-switch
    receivers: [carrier/power-entry-instrument, module/link-supervision]

  PWR_GND:
    kind: reference
    carries: "Power return for the exported rail"
    origin: module/power-entry
    reference: [module/umbilical-load-switch, carrier/power-entry-instrument]

  # ======================================================================
  # MODULE: power
  # ======================================================================

  BUS_POS12_RAW:
    kind: power
    carries: "Eurorack +12 V as it arrives, ahead of D1/D2"
    driver: module/power-entry
    receivers: [module/umbilical-load-switch]

  MODULE_ANALOG_POS12:
    kind: power
    carries: "Module analog +12 V, downstream of D1 and FB1"
    driver: module/power-entry
    receivers:
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/mod-channels
      - module/pitch-stage
      - module/panel-led
    proposed: [module/breath-response-shaper]

  MODULE_ANALOG_NEG12:
    kind: power
    carries: "Module analog -12 V, downstream of D3 and FB3"
    driver: module/power-entry
    receivers:
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/mod-channels
      - module/pitch-stage
    proposed: [module/breath-response-shaper]

  BUS_5V:
    kind: power
    carries: "Eurorack +5 V after FB4/C4. The level shifter only - the one rail with no local regulation"
    driver: module/power-entry
    receivers: [module/digital-and-supervision]
    note: "interfaces/spi-link names this rail in its Interfaces table with Dir '-' and says it 'reaches no part of this circuit'. A '-' row is context, not a connection, and it was seeded here as one"

  DAC_AVDD:
    kind: power
    carries: "Local LM317 rail. Decouples DAC full scale from the rack's +/-5% +5 V"
    figure: dac-rail
    driver: module/power-entry
    receivers:
      - module/dac8568
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/digital-and-supervision   # the DAC-side SYNC pull-up returns here, not to bus +5V

  AGND_MOD:
    kind: reference
    carries: "Module analog star"
    figure: dig-gnd-topology
    origin: module/power-entry
    reference:
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/dac8568
      - module/mod-channels
      - module/pitch-stage
    proposed: [module/breath-response-shaper]
    note: >
      Where AGND_MOD and DIG_GND meet is the tracked figure dig-gnd-topology
      and is DISPUTED. This file records which circuits reference the net; it
      does NOT settle the topology and must not be read as settling it.

  # ======================================================================
  # MODULE: DAC and CV
  # ======================================================================

  # THREE NETS, NOT ONE BUNDLE. They were one entry, SPI_DAC, with a note
  # saying to split them when a page needed them separately; the DAC netlist
  # is that page - each lands on its own pin and they cannot share a net.
  # interfaces/spi-link is a receiver on all three because the DAC-side three
  # of the six R-SPI-PULL sit on them and are that circuit's rows.

  SCLK_DAC:
    kind: signal
    domain: digital
    carries: "Buffered serial clock, level shifter to DAC"
    driver: module/digital-and-supervision
    receivers: [module/dac8568]
    note: "NOT SCLK, which is the umbilical conductor on the buffer's input side"

  DIN:
    kind: signal
    domain: digital
    carries: "Buffered serial data, level shifter to DAC"
    driver: module/digital-and-supervision
    receivers: [module/dac8568]

  SYNC:
    kind: signal
    domain: digital
    carries: "Buffered frame sync (the DAC's chip select), level shifter to DAC"
    driver: module/digital-and-supervision
    receivers: [module/dac8568]

  CLR:
    kind: signal
    domain: digital
    carries: "DAC asynchronous clear, active low"
    undriven: true
    pull: "R-CLR-PU holds it inactive"
    receivers: [module/dac8568]
    note: >
      NOTHING DRIVES THIS NET. The watchdog that once did is deleted, and the
      DAC page says so. It is listed because four other pages name CLR in
      their Interfaces tables to record that it reaches no part of them -
      which is a real fact about the design and the reason the net is here.

  VREFOUT:
    kind: signal
    domain: analog
    carries: "The DAC's own reference output, buffered before use"
    driver: module/dac8568
    receivers: [module/pitch-stage]

  DAC_CH1:
    kind: signal
    domain: analog
    carries: "Pitch channel"
    figure: dac-rail
    driver: module/dac8568
    receivers: [module/pitch-stage]

  # FOUR NETS, NOT ONE. They were one entry, DAC_CH2_5, which no layout could
  # have used: each channel drives its own mod channel's R-OPAMP-IN.

  DAC_CH2:
    kind: signal
    domain: analog
    carries: "Mod 1 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH3:
    kind: signal
    domain: analog
    carries: "Mod 2 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH4:
    kind: signal
    domain: analog
    carries: "Mod 3 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH5:
    kind: signal
    domain: analog
    carries: "Mod 4 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH7:
    kind: signal
    domain: analog
    carries: "Shared mod offset reference"
    figure: mod-reference
    driver: module/dac8568
    receivers: [module/mod-channels]

  BREATH_INAMP_OUT:
    kind: signal
    domain: analog
    carries: "In-amp output, the receiver's recovered breath signal"
    figure: inamp-full-scale
    driver: module/breath-receive-stage
    receivers: [module/breath-output-stage]
    proposed: [module/breath-response-shaper]
    note: >
      `proposed:` means DRAWN BUT NOT ADOPTED. That circuit reads this node in
      its drawing and every one of its BOM rows is `open`, so it declares the
      port and this file does NOT claim the board has the connection. Move it
      into receivers when it is fitted, not before.

  # ======================================================================
  # MODULE: panel
  # ======================================================================

  BREATH_JACK:
    kind: signal
    domain: analog
    carries: "Breath CV at the panel jack"
    driver: module/breath-output-stage
    receivers: [module/panel]

  PITCH_JACK:
    kind: signal
    domain: analog
    carries: "Pitch CV at the panel jack"
    driver: module/pitch-stage
    receivers: [module/panel]

  # FOUR JACKS, FOUR NETS. MOD_JACKS was one entry for four panel outputs,
  # which is a drawing convention rather than a connection.

  MOD1_JACK:
    kind: signal
    domain: analog
    carries: "Mod 1 CV at the panel jack"
    driver: module/mod-channels
    receivers: [module/panel]

  MOD2_JACK:
    kind: signal
    domain: analog
    carries: "Mod 2 CV at the panel jack"
    driver: module/mod-channels
    receivers: [module/panel]

  MOD3_JACK:
    kind: signal
    domain: analog
    carries: "Mod 3 CV at the panel jack"
    driver: module/mod-channels
    receivers: [module/panel]

  MOD4_JACK:
    kind: signal
    domain: analog
    carries: "Mod 4 CV at the panel jack"
    driver: module/mod-channels
    receivers: [module/panel]

# ----------------------------------------------------------------------
# RETIRED. Kept so that a page naming one of these is understood rather than
# treated as a missing net, and so nobody re-adds it from an old drawing.
# ----------------------------------------------------------------------
retired:
  OE_MOD:
    was: "Four buffer enables, gated by a presence comparator"
    why: >
      NOT FITTED. The comparator is deleted - its threshold sat inside the
      breath signal's own range, it locked out every standalone-module
      milestone, and it failed toward 'present'. OE is tied enabled. What it
      was protecting against is what R-SPI-PULL's six resistors are for.
    named_by: [module/link-supervision, module/digital-and-supervision, interfaces/spi-link]
