# THE MASTER NET LIST. Authoritative for every net that crosses a circuit
# boundary.
#
# WHY IT IS AT THIS LEVEL. A per-circuit netlist.yaml can only declare its own
# side of a boundary-crossing net. Across 23 circuits that is up to 23
# half-declarations with NOBODY OWNING THE NET - so two circuits can spell it
# differently, two can both claim to drive it, and one can name a peer that
# never names it back. None of that is visible from inside either circuit. It
# is the same shape as every other defect here: a fact stated in several
# places and owned in none.
#
# SEEDED FROM THE 23 `## Interfaces` TABLES, which are the prose version of
# this file: 164 rows, 114 distinct node spellings, 29 nets named by more than
# one circuit. Those tables stay - they carry the reasoning - but this file is
# what a tool reads.
#
# THE RULES, enforced by tools/check-netlist.py:
#   - every `ports:` entry in a circuit netlist must name a net here
#   - dir `out` must come from this net's `driver`; `in` from `receivers`;
#     `ref` from `reference`
#   - every net needs exactly one driver unless `multi_driver` or `undriven`
#   - every circuit named here must declare the matching port
# The last rule is the bidirectional half, and it is what made the `circuit:`
# dependency edges trustworthy when it was applied to them.
#
# VALUES LIVE IN config/figures.yaml. `figure:` cites; it does not restate.
# A NET HERE ASSERTS A CONNECTION. Do not add one speculatively - an asserted
# connection the board does not have is worse than a missing one.

version: 1

nets:

  # ======================================================================
  # INSTRUMENT: the key chain, main board to the two key boards (ADR 0017)
  # ======================================================================

  V3V3_CHAIN:
    kind: power
    carries: "The chain's 3V3 as the replicated cluster schematics name it. On the main board it IS DEV_3V3 - right_thumb and left_thumb by trace, with no fuse (ADR 0018); each key board's instance is on V3V3_CHAIN_RH or V3V3_CHAIN_LH, past its ribbon's bead"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register, cluster/key-switch-network, cluster/key-marker-and-bits]

  # Each key board's 3V3, past the FB-CHAIN bead on its ribbon's conductor 10.
  # `per_board:` like the hop nets below: the replicated schematic declares
  # only the generic V3V3_CHAIN, so which instance sits on which is the key
  # chain's to say.
  V3V3_CHAIN_RH:
    kind: power
    carries: "right_hand key board's 3V3: FB-CHAIN on the main board, then conductor 10 of its ribbon (main-board J-CHAIN pin 10, key-board pin 3)"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register, cluster/key-switch-network, cluster/key-marker-and-bits]
    per_board: true

  V3V3_CHAIN_LH:
    kind: power
    carries: "left_hand key board's 3V3: FB-CHAIN on the main board, then conductor 10 of its ribbon (main-board J-CHAIN pin 10, key-board pin 3)"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register, cluster/key-switch-network, cluster/key-marker-and-bits]
    per_board: true

  GND_CHAIN:
    kind: reference
    carries: "Chain return: the main board's ground, and five alternating grounds on each ribbon: main-board J-CHAIN pins 1/3/5/7/9, key-board pins 4/6/8/10/12"
    figure: chain-conductors
    origin: interfaces/key-chain-loom
    note: "It is the main board's ground pour, carried to each key board by its ribbon's five grounds - a separate name for those conductors, not a separate node"
    reference: [cluster/key-register, cluster/key-switch-network]

  CHAIN_SCK:
    kind: signal
    domain: digital
    carries: "Shift clock to all four U-KEYS registers - one net, two by trace and two over the ribbons"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]

  CHAIN_SHLD:
    kind: signal
    domain: digital
    carries: "Shift/load to all four U-KEYS registers, one net like CHAIN_SCK"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]

  # --- SER and QH: point to point, one hop per net ------------------------
  #
  # cluster/key-register is ONE schematic built four times, so it declares a
  # generic CHAIN_SER in and CHAIN_QH out. WHICH INSTANCE SITS ON WHICH HOP is
  # the hop map, and it lives in interfaces/key-chain-loom/netlist.yaml, which
  # declares one port per instance pin (the _RT/_RH/_LT/_LH nets below) and
  # joins them hop by hop. Neither side can be checked against the other while
  # the register is one replicated schematic, so all ten are `per_board:` and
  # the checker prints them by name. Chain order MCU <- RT <- RH <- LT <- LH.

  CHAIN_SER:
    kind: signal
    domain: digital
    carries: "A register's serial input - generic, one per instance; resolved per instance by the CHAIN_SER_* nets"
    figure: chain-connectors
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]
    per_board: true

  CHAIN_QH:
    kind: signal
    domain: digital
    carries: "A register's serial output - generic, one per instance; resolved per instance by the CHAIN_QH_* nets"
    figure: chain-connectors
    driver: cluster/key-register
    receivers: [interfaces/key-chain-loom]
    per_board: true

  CHAIN_SER_RT:
    kind: signal
    domain: digital
    carries: "right_thumb's SER, on the main board: right_hand's QH arriving on the right_hand ribbon's conductor 8"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]
    per_board: true

  CHAIN_SER_RH:
    kind: signal
    domain: digital
    carries: "right_hand's SER: left_thumb's QH, out on the right_hand ribbon's conductor 6"
    figure: chain-connectors
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]
    per_board: true

  CHAIN_SER_LT:
    kind: signal
    domain: digital
    carries: "left_thumb's SER, on the main board: left_hand's QH arriving on the left_hand ribbon's conductor 8"
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]
    per_board: true

  CHAIN_SER_LH:
    kind: signal
    domain: digital
    carries: "left_hand's SER, the chain end: IO33 through R-CHAIN-SER, held high by R-SER-TERM, out on the left_hand ribbon's conductor 6"
    figure: chain-connectors
    driver: interfaces/key-chain-loom
    receivers: [cluster/key-register]
    per_board: true

  CHAIN_QH_RT:
    kind: signal
    domain: digital
    carries: "right_thumb's QH - bit 0 onward, a main-board trace to the MCU (IO40). Reaches no connector"
    driver: cluster/key-register
    receivers: [interfaces/key-chain-loom]
    per_board: true

  CHAIN_QH_RH:
    kind: signal
    domain: digital
    carries: "right_hand's QH, back on its ribbon's conductor 8 (key-board J-CHAIN pin 5, main-board pin 8) to right_thumb's SER"
    figure: chain-connectors
    driver: cluster/key-register
    receivers: [interfaces/key-chain-loom]
    per_board: true

  CHAIN_QH_LT:
    kind: signal
    domain: digital
    carries: "left_thumb's QH, on the main board, out through R-HOP-SER to the right_hand ribbon's conductor 6"
    driver: cluster/key-register
    receivers: [interfaces/key-chain-loom]
    per_board: true

  CHAIN_QH_LH:
    kind: signal
    domain: digital
    carries: "left_hand's QH, back on its ribbon's conductor 8 (key-board J-CHAIN pin 5, main-board pin 8) to left_thumb's SER"
    figure: chain-connectors
    driver: cluster/key-register
    receivers: [interfaces/key-chain-loom]
    per_board: true

  KEY_BITS:
    kind: signal
    domain: digital
    carries: "The parallel switch bits into the shift registers, on the board each register is on - the main board for right_thumb and left_thumb, a key board for right_hand and left_hand"
    driver: cluster/key-switch-network
    receivers: [cluster/key-register]
    per_board: true
    note: >
      EIGHT NETS PER DEVICE, NOT ONE, and which of the eight is a switch is
      different for each of the four register instances -
      key-marker-and-bits.md's allocation table has four different rows
      against one schematic. So no port assignment on the shared register
      netlist is true of every instance, and key-register's netlist declares
      the eight inputs as unasserted endpoints. Resolving it means four
      instance variants - two register placements on the main board
      (right_thumb, left_thumb) and two key-board variants (right_hand,
      left_hand) - which is a real decision and not a transcription job.

  MARKER_BITS:
    kind: signal
    domain: digital
    carries: "Board-identity bits wired high or low at each cluster"
    figure: marker-bits
    driver: cluster/key-marker-and-bits
    receivers: [cluster/key-register]
    per_board: true
    note: "Two per device, one high and one low, and they sit on different inputs on every device - see KEY_BITS. They are traces, not parts, drawn on each board's sheet; key-marker-and-bits holds only the free-bit pull-up since 2026-09-27"

  FREE_BIT:
    kind: signal
    domain: digital
    carries: "A free register input, held high by its own R-KEY-PU (three: left_thumb B and A, left_hand A)"
    figure: free-bits
    driver: cluster/key-marker-and-bits
    receivers: [cluster/key-register]
    per_board: true
    note: "Which input is free differs per register - allocation.yaml - so the far end is per board, like KEY_BITS"

  # --- the dev board's pins that drive the chain ------------------------

  # SHARED HOST. The same clock and data reach the MCP3202 on this board and
  # the DAC8568 two metres away; only the chip selects differ, IO34 for the
  # module and IO39 for the ADC. IO34 is not here because it crosses no
  # boundary: it runs from the MCU pin to a series resistor that
  # carrier/carrier also owns.

  IO35:
    kind: signal
    domain: digital
    carries: "SPI2 SCK at the MCU pin, to the ADC and to the umbilical's series resistor"
    driver: carrier/carrier
    receivers: [carrier/breath-adc]

  IO36:
    kind: signal
    domain: digital
    carries: "SPI2 MOSI at the MCU pin, to the ADC and to the umbilical's series resistor"
    driver: carrier/carrier
    receivers: [carrier/breath-adc]

  IO37:
    kind: signal
    domain: digital
    carries: "SPI2 MISO - the MCP3202's DOUT, and it never leaves the board"
    driver: carrier/breath-adc
    receivers: [carrier/carrier]

  IO39:
    kind: signal
    domain: digital
    carries: "The MCP3202's own chip select. NOT CS_MOD, which leaves on J-UMB"
    driver: carrier/carrier
    receivers: [carrier/breath-adc]

  IO38:
    kind: signal
    domain: digital
    carries: "SPI3 SCK out of the MCU, into the chain's series resistor"
    driver: carrier/carrier
    receivers: [interfaces/key-chain-loom]

  IO7:
    kind: signal
    domain: digital
    carries: "SH/LD latch out of the MCU. A GLITCH HERE RELOADS ALL FOUR REGISTERS mid-shift and corrupts the whole 32-bit word"
    driver: carrier/carrier
    receivers: [interfaces/key-chain-loom]

  IO33:
    kind: signal
    domain: digital
    carries: "SER out of the MCU to the chain end - left_hand's serial input, over its ribbon - for the self-test"
    driver: carrier/carrier
    receivers: [interfaces/key-chain-loom]

  IO40:
    kind: signal
    domain: digital
    carries: "MISO into the MCU: right_thumb's QH, the nearest register, by a main-board trace"
    driver: interfaces/key-chain-loom
    receivers: [carrier/carrier]

  DEV_3V3:
    kind: power
    carries: "The dev board's own LDO, the only 3V3 on the instrument"
    figure: key-pullup-qty
    driver: carrier/carrier
    receivers: [interfaces/key-chain-loom, carrier/breath-adc]
    note: "IT IS ALSO THE MCP3202'S REFERENCE, which is what makes the 24 pull-ups' static draw a live trade rather than a free one"

  # ======================================================================
  # INSTRUMENT: breath front end and the carrier
  # ======================================================================

  # --- the carrier board's own supply tree -------------------------------

  # --- the dev board's GPIO, where it leaves carrier/carrier ------------

  IO1:
    kind: signal
    domain: digital
    carries: "LED data to the main board's LED row (13 x WS2815B-V1, ADR 0028), ESP32 GPIO1 to the level shifter"
    driver: carrier/carrier
    receivers: [carrier/led-strip-drive]
    note: "HIGH-IMPEDANCE THROUGH THE BOOTLOADER WINDOW, which is why R-LED-PD exists: OE is tied low, so a floating AHCT input becomes clean 5 V edges into the LED row before any firmware runs"

  U0TXD:
    kind: signal
    domain: digital
    carries: "The real-time board's console transmit, IO43, to HDR-SERVICE"
    driver: carrier/carrier
    receivers: [carrier/service-uart]

  U0RXD:
    kind: signal
    domain: digital
    carries: "The real-time board's console receive, IO44, from HDR-SERVICE"
    external_driver: "whatever is plugged into the service header"
    receivers: [carrier/carrier, carrier/service-uart]

  EN:
    kind: signal
    domain: digital
    carries: "The Matrix's EN (its RESET net, CHIP_PU), from Key1's RESET-side terminal down CBL-MCU-RIBBON (J-MCU pin 24) to HDR-SERVICE pin 4 (ADR 0018)"
    external_driver: "whatever is plugged into the service header, pulling to ground only"
    receivers: [carrier/carrier, carrier/service-uart]
    note: "Held up on the Matrix by R8, 10k to its 3V3, with no capacitor on it; Key1 pulls it to GND. Nothing in series"

  IO0:
    kind: signal
    domain: digital
    carries: "The Matrix's GPIO0 (boot strap), from Key2's IO0-side terminal down CBL-MCU-RIBBON (J-MCU pin 23) to HDR-SERVICE pin 5 (ADR 0018)"
    external_driver: "whatever is plugged into the service header, pulling to ground only"
    receivers: [carrier/carrier, carrier/service-uart]
    note: "Held up on the Matrix by R10, 10k to its 3V3; Key2 (BOOT) pulls it to GND. Nothing in series"

  INST_5V_A:
    kind: power
    carries: "Buck A, through D-USBOR onto the dev board's 5 V pin"
    figure: matrix-led-current
    driver: carrier/power-entry-instrument
    receivers: [carrier/led-strip-drive, carrier/carrier]
    note: "It reaches the 8x8 matrix through the dev board, so carrier/carrier is where it lands, through J-MCU and three conductors of CBL-MCU-RIBBON (two on the 5V pad, one on TP2)"

  VS:
    kind: signal
    domain: analog
    carries: "The sensor's excitation, 5.000 V through R-ISO-REF"
    figure: riso-ref-topology
    driver: carrier/breath-excitation-reference
    receivers: [interfaces/breath-sense-link]
    note: "DC FEEDBACK IS TAKEN HERE, at the far side of R-ISO-REF, which is what makes the DC error across it zero"

  SENSOR_RAW:
    kind: signal
    domain: analog
    carries: "The MPXV4006DP's own output, before the buffer"
    figure: sensor-full-scale
    driver: interfaces/breath-sense-link
    receivers: [carrier/breath-excitation-reference]

  SENSOR_BUFFERED_OUT:
    kind: signal
    domain: analog
    carries: "The MPXV4006DP output, buffered by half an OPA2197 on the carrier"
    figure: sensor-full-scale
    driver: carrier/breath-excitation-reference
    receivers: [carrier/breath-adc, interfaces/breath-sense-link]

  AGND_INST:
    kind: reference
    carries: "Instrument analog star. Carries no power current - that is the whole point of it"
    figure: dig-gnd-topology
    origin: carrier/power-entry-instrument
    reference:
      - carrier/breath-adc
      - carrier/breath-excitation-reference
      - interfaces/breath-sense-link

  BREATH_SENSE:
    kind: signal
    domain: analog
    carries: "The sensor's buffered output down the umbilical, through the instrument-side R1"
    figure: sensor-full-scale
    driver: interfaces/breath-sense-link
    receivers: [module/breath-receive-stage, interfaces/spi-link]

  AGND_SENSE:
    kind: signal
    domain: analog
    carries: >
      The instrument's analog star arriving through the instrument-side R1b.
      A SIGNAL, NOT A GROUND - it drives the in-amp's IN+ through R2 and is
      what makes the measurement differential. DO NOT MERGE IT WITH AGND_MOD.
    figure: umbilical-pinmap
    driver: interfaces/breath-sense-link
    receivers: [module/breath-receive-stage, interfaces/spi-link]

  # ======================================================================
  # UMBILICAL: SPI and power
  # ======================================================================

  SCLK:
    kind: signal
    domain: digital
    carries: "SPI clock, instrument to module, through R-SPI-SER"
    figure: spi-series-r
    driver: carrier/carrier
    receivers: [interfaces/spi-link, module/digital-and-supervision]
    note: "THE DRIVER IS THE DEV BOARD, not the link. R-SPI-SER and U-TVS-SPI are drawn on carrier.md and placed by carrier/carrier, and interfaces/spi-link is the connector and the cable in between - a pass-through, which this schema records as a receiver"

  MOSI:
    kind: signal
    domain: digital
    carries: "SPI data, instrument to module"
    figure: spi-series-r
    driver: carrier/carrier
    receivers: [interfaces/spi-link, module/digital-and-supervision]

  CS_MOD:
    kind: signal
    domain: digital
    carries: "Module chip select"
    figure: spi-series-r
    driver: carrier/carrier
    receivers: [interfaces/spi-link, module/digital-and-supervision]

  DIG_GND:
    kind: reference
    carries: "Digital return, instrument to module - J-UMB pin 8, CS_MOD's pair partner"
    figure: dig-gnd-topology
    origin: module/power-entry
    reference: [interfaces/spi-link, module/digital-and-supervision, carrier/carrier]
    note: >
      AT THE INSTRUMENT END IT IS THE MAIN BOARD'S GROUND: tied to PWR_GND at
      J-UMB (ADR 0018), which carrier/carrier declares by putting this port on
      its PWR_GND net. The name is kept because at the module end conductor 8
      is its own net: a layer-2 plane that meets PWR_GND at the etherCON
      (NT-UMB-MOD, the mirror of the instrument's NT-DIG) and the module's star
      through NT-DIG-MOD, and nothing else (dig-gnd-topology, ADR 0027).

  UMBILICAL_POS12:
    kind: power
    carries: "The +12 V exported to the instrument, downstream of the load switch, as far as Q-INRUSH's source at J-UMB"
    figure: umbilical-current
    driver: module/umbilical-load-switch
    receivers:
      - carrier/power-entry-instrument
      - interfaces/spi-link
      - module/panel-led
    note: >
      module/link-supervision was a receiver here and is not one: its page says
      "Not fitted" against every row, including the presence detect that gated
      OE_MOD from this node. A deleted circuit is not a receiver.

      At the instrument this node is J-UMB pin 3, D-REVSHUNT, D-TVS-PWR and
      Q-INRUSH's source and gate network, and nothing that stores charge: the
      LED row and the analog block are on INST_POS12, behind Q-INRUSH.

  INST_POS12:
    kind: power
    carries: "The instrument's +12 V behind Q-INRUSH, the hot-plug inrush limiter: C-STRIP-BULK, L-BUCK-IN, the LED row and the REF5050/OPA2197 analog block. ONE NODE from Q-INRUSH's drain to all of them"
    figure: umbilical-current
    driver: carrier/power-entry-instrument
    receivers:
      - carrier/led-strip-drive
      - carrier/breath-excitation-reference
    note: >
      The carrier's "+12V LED row feed" and "+12V analog" are not separate nets:
      nothing is in series between Q-INRUSH's drain and either tap. Everything
      that holds charge on the instrument's 12 V is on this node, so a plug-in
      charges it only through Q-INRUSH's ramp (power-entry-instrument.md,
      Hot-plug inrush).

  PWR_GND:
    kind: reference
    carries: "Power return for the exported rail - U-ISO's isolated 0V at the module (ADR 0027) - and the carrier's whole pour"
    origin: module/power-entry
    reference:
      - module/umbilical-load-switch
      - carrier/power-entry-instrument
      - interfaces/spi-link
      - carrier/service-uart
      - carrier/led-strip-drive
      - carrier/carrier
      - interfaces/breath-sense-link
    note: >
      The bottom plate bonds to this net through the main board's mounts
      (ADR 0022), each at its own stud. The aluminium key plate bonds to it
      through the cassette's columns, whose standoffs stand on the same
      plated mounts (ADR 0025); no key board's GND_CHAIN touches either plate.
      Neither plate ever bonds to AGND.
      IT DOES NOT LIST THE TWO ANALOG CIRCUITS. power-entry-instrument.md's
      Interfaces table names carrier/breath-adc and
      carrier/breath-excitation-reference as returning to the pour, and both of
      those pages say their return is AGND_INST - which reaches PWR_GND on the
      single tie and is a different node everywhere else. The circuits' own
      declarations win, because that distinction is the entire point of having
      an instrument analog star.

  # ======================================================================
  # MODULE: power
  # ======================================================================

  ISO_POS12:
    kind: power
    carries: "The isolated +12 V U-ISO makes for the instrument (ADR 0027), ahead of the load switch; returns on PWR_GND"
    driver: module/power-entry
    receivers: [module/umbilical-load-switch]
    note: >
      Until 2026-09-30 the load switch took the Eurorack +12 V as it arrives
      (BUS_POS12_RAW, now a net inside module/power-entry). It takes the
      converter's output instead, so the instrument's current is drawn from
      the rack rail to rail and none of it returns through the rack's ground.

  MODULE_ANALOG_POS12:
    kind: power
    carries: "Module analog +12 V, downstream of D1 and FB1"
    driver: module/power-entry
    receivers:
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/mod-channels
      - module/pitch-stage
      - module/breath-response-shaper

  MODULE_ANALOG_NEG12:
    kind: power
    carries: "Module analog -12 V, downstream of D3 and FB3"
    driver: module/power-entry
    receivers:
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/mod-channels
      - module/pitch-stage
      - module/breath-response-shaper

  LOGIC_5V:
    kind: power
    carries: "The module's own 5 V, U-REG-LOGIC from the analog +12 V. The SPI receiver U-RX-MOD and R-PULL-CS only; the level shifter U-LVL-MOD is on DAC_AVDD"
    driver: module/power-entry
    receivers: [module/digital-and-supervision]
    note: "Replaces BUS_5V (2026-09-30): the bus +5 V is not used, and J-PWR-EURO's +5 V pins are no-connects"

  DAC_AVDD:
    kind: power
    carries: "Local LM317L rail for the DAC8568, its SPI buffer U-LVL-MOD and the breath stages' ratiometric pots. For headroom: the DAC's 5.000 V full scale is set by its reference and needs AVDD above it (ADR 0005)"
    figure: dac-rail
    driver: module/power-entry
    receivers:
      - module/dac8568
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/digital-and-supervision   # U-LVL-MOD's VCC (C-DEC-LVL) and R-PULL-SYNC: nothing driving the DAC's pins sits above its supply

  AGND_MOD:
    kind: reference
    carries: "Module analog star"
    figure: dig-gnd-topology
    origin: module/power-entry
    reference:
      - module/breath-output-stage
      - module/breath-receive-stage
      - module/dac8568
      - module/mod-channels
      - module/panel-led
      - module/pitch-stage
      - module/breath-response-shaper
    note: >
      AGND_MOD meets the Eurorack ground (BUS_GND, the star, inside
      module/power-entry) only through NT-AGND-MOD, and DIG_GND and PWR_GND
      only by way of the star - the tracked figure dig-gnd-topology.
      This file records which circuits reference the net.

  # ======================================================================
  # MODULE: DAC and CV
  # ======================================================================

  # THREE NETS, NOT ONE BUNDLE. They were one entry, SPI_DAC, with a note
  # saying to split them when a page needed them separately; the DAC netlist
  # is that page - each lands on its own pin and they cannot share a net.
  # interfaces/spi-link is a receiver on all three because the DAC-side three
  # of the five R-SPI-PULL sit on them and are that circuit's rows.

  SCLK_DAC:
    kind: signal
    domain: digital
    carries: "Buffered serial clock, level shifter to DAC"
    driver: module/digital-and-supervision
    receivers: [module/dac8568]
    note: "NOT SCLK, which is the umbilical conductor on the buffer's input side"

  DIN:
    kind: signal
    domain: digital
    carries: "Buffered serial data, level shifter to DAC"
    driver: module/digital-and-supervision
    receivers: [module/dac8568]

  SYNC:
    kind: signal
    domain: digital
    carries: "Buffered frame sync (the DAC's chip select), level shifter to DAC"
    driver: module/digital-and-supervision
    receivers: [module/dac8568]

  VREFOUT:
    kind: signal
    domain: analog
    carries: "The DAC's own reference output, buffered before use"
    driver: module/dac8568
    receivers: [module/pitch-stage]

  DAC_CH1:
    kind: signal
    domain: analog
    carries: "Pitch channel"
    figure: dac-rail
    driver: module/dac8568
    receivers: [module/pitch-stage]

  # FOUR NETS, NOT ONE. They were one entry, DAC_CH2_5, which no layout could
  # have used: each channel drives its own mod channel's R-OPAMP-IN.

  DAC_CH2:
    kind: signal
    domain: analog
    carries: "Mod 1 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH3:
    kind: signal
    domain: analog
    carries: "Mod 2 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH4:
    kind: signal
    domain: analog
    carries: "Mod 3 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH5:
    kind: signal
    domain: analog
    carries: "Mod 4 channel"
    driver: module/dac8568
    receivers: [module/mod-channels]

  DAC_CH7:
    kind: signal
    domain: analog
    carries: "Shared mod offset reference"
    figure: mod-reference
    driver: module/dac8568
    receivers: [module/mod-channels]

  BREATH_INAMP_OUT:
    kind: signal
    domain: analog
    carries: "In-amp output, the receiver's recovered breath signal"
    figure: inamp-full-scale
    driver: module/breath-receive-stage
    receivers: [module/breath-response-shaper]

  BREATH_SHAPED:
    kind: signal
    domain: analog
    carries: "The in-amp output after the response shaper - equal to it at POT-RESP's centre detent - into POT-GAIN"
    driver: module/breath-response-shaper
    receivers: [module/breath-output-stage]
    note: >
      Crosses to the jack board on J-B2B-MOD pin 1. The shaper is fitted
      (2026-09-30): it sits between the in-amp and the gain attenuator, where
      the scale is fixed, so POT-GAIN cannot move its knee.

  # ======================================================================
  # MODULE: panel
  # ======================================================================
  #
  # THERE ARE NO PANEL NETS. BREATH_JACK, PITCH_JACK and MOD1..4_JACK were
  # six entries here with module/panel as their receiver, and panel.md says
  # plainly of every one of them: "A panel cutout. The net is that circuit's."
  # The far end of each is a J-CV, which is a PART - so the net ends inside
  # the circuit that drives it, and the six jacks are now placed in
  # pitch-stage, breath-output-stage and mod-channels. The panel owns holes.

# ----------------------------------------------------------------------
# RETIRED. Kept so that a page naming one of these is understood rather than
# treated as a missing net, and so nobody re-adds it from an old drawing.
# ----------------------------------------------------------------------
retired:
  BUS_5V:
    was: "Eurorack +5 V after FB4/C4, for the level shifter"
    why: >
      The module makes its own 5 V (LOGIC_5V, U-REG-LOGIC) and does not use the
      bus +5 V (owner, 2026-09-30); J-PWR-EURO's +5 V pins are no-connects.
  OE_MOD:
    was: "Four buffer enables, gated by a presence comparator"
    why: >
      NOT FITTED. The comparator is deleted - its threshold sat inside the
      breath signal's own range, it locked out every standalone-module
      milestone, and it failed toward 'present'. OE is tied enabled. What it
      was protecting against is what the five R-SPI-PULL and R-PULL-CS are for.
    named_by: [module/link-supervision, module/digital-and-supervision, interfaces/spi-link]
