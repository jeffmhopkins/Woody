# THE LIMITS THE MATRIX CARRIER IS HELD TO, and where its fixed parts come from - tools/pcb.py
# check, `kind: main` (the main board's kind, which reads its places from the body CAD's
# pcb-geometry.echo by cluster). The copper is laid out by hand: carrier_layout.py, beside this
# file, writes out every track and says why each is where it is (issue #48, ADR 0030). No
# router runs on this board.
#
# THE MATRIX CARRIER (owner, 2026-10-03: option (c), "SEPARATE SMALL MATRIX CARRIER", and
# "Hang from the lid"; ADR 0021 amendment 2026-10-03). FROM THE BODY CAD, NOT HERE
# (mechanical/export/pcb-geometry.echo, cluster "matrix"; the outline matrix-carrier.dxf):
# the outline with its USB-C notch and its arm, J-MCU-C's place (beside J-MCU, not over
# it: config/body.yaml boards.mcu_conn_c_shift), HDR-MATRIX's two rows, the three hanging mounts and the
# room on the top face under the Matrix. Coordinates are the body frame (x along the body
# from the mouth, y across, seen from above), as the key boards' and the main board's.

kind: main
cluster: matrix
outline: matrix-carrier.dxf
layers: 2

# The key boards' rules and board house, so one order makes them and this board.
rules:
  track: 0.25
  track_min: 0.2
  clearance: 0.2
  via: 0.7
  via_drill: 0.3
  via_min: 0.66
  drill_min: 0.3
  edge_clearance: 0.3
  power_track: 0.4

fab:
  house: JLCPCB
  hole_clearance: 0.28
  hole_to_hole: 0.45
  annular_min: 0.18
  silk_text_min: 1.0
  silk_line_min: 0.15
  silk_to_pad: 0.15
  finish: "HAL lead-free"
  mask: White               # ADR 0028: the instrument's boards are white; under the Matrix it is unseen
  silk: Black
  copper_oz: 1

# The three hanging mounts (config/body.yaml hardware.mx_*, boards.matrix_mount_corners): plated holes on PWR_GND, pads
# both faces; what bears on each face (the spacer on top, the washer under the screw's head
# below) keeps other copper off (pcb-geometry.echo 'matrix' 'standoff').
mounts:
  footprint: "MountingHole:MountingHole_2.7mm_M2.5_Pad_TopBottom"
  net: PWR_GND

# J-MCU-C (J1), standing straight down from the carrier's arm, on the bottom face (ADR 0018,
# Amendment of 2026-11-21): its pad row nearer the near edge 2.29 in from the insulator's
# near face [calc: half the envelope's width, boards.mcu_conn_w, less half the row spacing],
# the pads centred along the echo's box. The echo's 90 is the way the ribbon leaves its
# socket, toward the far side. TURNED HALF A TURN (rot: 180; owner, 2026-11-22; pre-fab review
# F3): its key toward the far side, facing J-MCU, and its pin k carries J-MCU's pin k.
connectors:
  J-MCU-C: {row: J-MCU-C, rot: 180, back_row_from: x0, back_row_at: 2.29, bottom: true}

# Parts whose courtyard is MEANT to lie off the board (pcb.py check_courtyards).
courtyard_overhang:
  J2:
    reason: "HDR-MATRIX's insulator is ten pitches long, 25.4, under a Matrix 25.0 square whose pad rows it follows, so its mouth end stands 0.2 past the Matrix's edge - and the carrier's mouth edge is flush with the Matrix's, behind the extension's USB-C plug (owner, 2026-10-03, option A). The overhang is plastic over air, beside the plug, with no pad off the board"
    source: "config/body.yaml boards.matrix_carrier_past (the mouth edge flush), openings.usb_ext_overmold_w; pcb-geometry.echo matrix pins (pin 1 1.07 in from the Matrix's edge); datasheets/connectors/HANXIA-HX-PZ2.54-1x10P-TP-YQ.pdf (B - 0.2 = 25.20 for 10 pins)"
  J3:
    reason: "as J2: the other pad row's header, its mouth end 0.2 past the carrier's mouth edge"
    source: "as J2"
  J1:
    reason: "J-MCU-C's insulator overhangs the arm's mouth end by a third of a millimetre: the arm stops boards.matrix_carrier_past short of the right-hand key board's tail end, which stands just over it, and the insulator hangs under the carrier, clear of that board. Plastic over air; no pad off the board"
    source: "config/body.yaml boards.matrix_carrier_past; mechanical/cad/woody_body.scad mx_arm and the outline's corner radius kb_corner_r"

# Top-face parts' heights (pcb.py check_heights), against the one room the echo gives: under
# the Matrix, HDR-MATRIX's plastic (config/body.yaml boards.matrix_hdr_h). Its posts go on
# through the Matrix and are cut flush; the plastic is what stands on this board.
heights:
  PinHeader_1x10: 2.5            # [ds connectors/HANXIA-HX-PZ2.54-1x10P-TP-YQ.pdf, the insulator]
underside_rows: [J-MCU-C]

# HDR-MATRIX, pin 1 at the Matrix's USB-C edge (pcb-geometry.echo 'matrix' 'pins'): the
# 5V..IO1 row on the near side, the IO33..RX row on the far side, on top, pins along +x.
# SURFACE MOUNT (hanxia TP-YQ): nothing comes through to the underside, where J-MCU-C's
# insulator lies under the 5V..IO1 row's first pins, and the bottom face is one whole plane.
parts:
  J2: [276.655, 17.07, 90]        # HDR-MATRIX, the 5V..IO1 row
  J3: [276.655, 39.93, 90]        # HDR-MATRIX, the IO33..RX row

# PWR_GND poured on the bottom face only, whole: J-MCU-C's grounds and the mounts join it
# there, and the Matrix's pad-row GND reaches it through the board's one via. The top face
# carries every line and has no pour (ADR 0030).
planes:
  - {layer: B.Cu, net: PWR_GND}

silk:
  at: [[252.5, 17.8], [262.0, 17.8]]   # the arm's top face beside J-MCU-C's tails (it hangs underneath)
  search: true
  title: "WOODY Matrix carrier"
  rev: "E"
  date: "2026-11-22"
  # which way round the Matrix sits: the end pins of each of its two rows (tools/pcb_silk.py, #54)
  pins:
    J2: {1: "5V", 10: "IO1"}
    J3: {1: "IO33", 10: "RX"}

# THE ONE PAD WHOSE LINE CANNOT LEAVE IT STRAIGHT (tools/pcb.py check_joints, the exit rule): the pad, and the reason.
joints_exempt:
  J2.8: >-
    IO3 enters on one 45. The near mount's pad is 0.37 mm under the pad and IO1 stands 0.34 mm
    from its mouth side, between it and pad 7, so no line reaches it with a straight run before the pad.

# No router: `route: false` keeps tools/pcb.py from running one on this board
# (carrier_layout.py, ADR 0030).
route: false
