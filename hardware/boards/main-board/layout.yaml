# THE BREATH PAIR (same page: "crosses the moat as a pair"): BREATH_SENSE's
# source SENSOR_BUFFERED_OUT and the AGND leg, taken at the sensor's own GND pin
# (U-BREATH pin 3), side by side on layer 1 over the plane to their series
# resistors at J-UMB. Routed before everything else (pcb_route.route_pair).
pairs:
  # THE BREATH CORRIDOR (owner, 2026-10-03: "the analog path should just be routed along
  # the top" - the far edge, the top of the board's plots - "Not the bottom is crossing the
  # board twice. Unneedingly"; README, The breath corridor). ONE pair, the sensor's output
  # and its AGND leg, along the FAR EDGE on layer 4 from the mouth to J-UMB: a short hop up
  # from the buffer (U3, mid-board) to the edge where the sensor stands, the run along the
  # edge stepping inboard round the far column mounts H2, H4, H6 and H8, and one hop down
  # into R38 / R39 at J-UMB. No crossing of the LED row. Layer 4, not 1: the far-row keys'
  # T networks stand on layer 1 between the edge and their switch pins. Its reference is an
  # AGND_INST strip cut out of layer 3 under it (islands: above). Its legs reach the
  # layer-1 pads at each end through a via each (the autorouter's).
  - nets: [/SENSOR_BUFFERED_OUT, AGND_INST]
    from: [U3.7, U10.3]
    to: [R38.1, R39.1]
    layer: B.Cu
    width: 0.25
    gap: 0.25
    # #8-4: every other net's tracks and vias kept 0.55 + the 0.2 clearance = 0.75 mm (3W)
    # off both legs as the router lays them (pcb_route.Obstacles)
    guard: 0.55
    # ...and a ground track each side of the coupled run, one clearance off its legs,
    # stitched into the AGND strip under it at least every 5 mm (pcb_route.guard_traces);
    # left out only where another net's copper leaves no room - README lists the spans
    guard_traces: {net: AGND_INST, every: 5.0}
    # DRAWN, not searched (pcb_route.route_pair_smooth): straight along the far edge, and
    # round each far column mount ONE concentric arc, r 5 mm about its centre, entered and
    # left by 3 mm fillets (owner, 2026-10-04: "curve around standoffs much better and be
    # mirrored around them", then "reduce all of them down to the same size ... unless
    # they're asymmetric"). The legs and guards are the same path offset: concentric
    # arcs, one spacing all the way. 5 mm clears the mount's bearing keep-out with the
    # guards (its corner 3.8 mm from the centre). At H2 and H6 the far-row switch's leg
    # pad (SW2, SW6 pin 1, 3.4 mm) stands 6.2 mm from the mount, on its tail side: the
    # detour goes on round it, r 3 mm about the pad (`then:`), joined by a 1.5 mm fillet -
    # the same arc at every mount, asymmetric only there
    through: [[19.5, 47.3], [289.5, 47.3], [289.5, 33.0]]
    fillet: 3.0
    fillet_mid: 1.5
    # each leg's end to its pad on layer 1, drawn (pcb_route: the autorouter could not
    # reach them through the guards): along layer 4 to a via, then a short track to the pad
    tails:
      - {net: /SENSOR_BUFFERED_OUT, pad: U3.7, path: [[19.5, 47.05], [18.6, 46.15]], via: [18.6, 27.9]}
      - {net: AGND_INST, pad: U10.3, path: [[19.5, 47.55], [12.88, 47.55]], via: [12.88, 45.6]}
      - {net: /SENSOR_BUFFERED_OUT, pad: R38.1, path: [[289.25, 33.0]], via: [288.3, 32.5]}
      - {net: AGND_INST, pad: R39.1, path: [[289.75, 33.0]], via: [289.75, 32.3]}
    detours:
      - {at: [40.0, 45.9], r: 5.0, then: [{at: [45.6, 43.2], r: 3.0}]}     # H2, then SW2 pin 1
      - {at: [121.7, 45.9], r: 5.0}                                        # H4
      - {at: [148.0, 45.9], r: 5.0, then: [{at: [153.6, 43.2], r: 3.0}]}   # H6, then SW6 pin 1
      - {at: [247.7, 45.9], r: 5.0}                                        # H8

# Net classes (the rest are the Default class, rules: track): the rails as
# tracks. [calc] IPC-2221 outer layer, 1 oz, 10 C rise: I = 0.048 dT^0.44 A^0.725
# -> 1.0 A (U-BUCK's rating, the most its 5 V path can carry; power-entry-
# instrument.md "Regulator loading") needs 16.3 mil2 = 0.30 mm; 0.5 mm leaves
# the drop along the 5 V path at 10 mV per 10 mm [calc: 0.5 mOhm/sq x 10/0.5
# x 1.0 A = 10 mV]. UMBILICAL_POS12, J-UMB to Q-INRUSH, carries the whole
# instrument, bounded by the module's LT1641 worst-case trip (power-entry-
# instrument.md §1a, 1.10 A): 18.6 mil2 = 0.34 mm [calc: (1.10 / (0.048 x
# 10^0.44))^(1/0.725) = 18.6 mil2; / 1.378 mil (1 oz) = 13.5 mil], so 0.5 mm
# too. DEV_3V3 is the registers, the ADC and the chain's pull-ups
# (the Matrix's regulator is on the Matrix), tens of mA: 0.3 mm.
#
# #8-6 (single 0.3 mm vias in series on the power paths): the rails that are tracks run
# on LAYER 1 wherever they can - layer 4 costs them twenty times as much (layer_cost) -
# and where one must change layers it does so through ONE via sized for it, 1.0 over a
# 0.6 drill (a class's via:), not a signal's 0.3: J-UMB's +12 V to the clamps and
# Q-INRUSH's source, the buck's input and output, and the 5 V to J-MCU's pins. Since
# the regulator block went to the far edge (2026-10-03) the 5 V has to cross the breath
# pair, which runs the board's length on layer 1 (pairs: below): layer 1 alone left it
# open. Where a power part meets a plane it does so by more than one via (fanout_count:).
net_classes:
  power5:
    nets: [INST_5V_A, BUCK_IN, /power-entry-instrument/BUCK_A_OUT]
    track: 0.5
    layer_cost: {B.Cu: 20.0}
    via: [1.0, 0.6]
  power12_in:
    nets: [UMBILICAL_POS12]
    track: 0.5
    layer_cost: {B.Cu: 20.0}
    via: [1.0, 0.6]
  rail3v3:
    nets: [DEV_3V3]
    track: 0.3
  # THE ANALOG BLOCK'S NETS ON LAYER 1 (#8-5): routed over the AGND_INST island on layer 2,
  # not on layer 4, whose reference is layer 3's INST_POS12 - the LEDs' supply, which their
  # PWM modulates. A step on layer 4 costs them six times one on layer 1
  # (pcb_route.complete, a class's layer_cost:), so they take it only for the hops the
  # block's density leaves no other way for: VS across the feedback ring stacked down the
  # mouth edge (laid out to: "VS from R8's foot to R7's head down layer 4"), REF_5V round
  # U4. Layer 1 only was tried first and left SENSOR_RAW, REF_MINUS, REF_5V and VS
  # unroutable. (That was the first layout; the board as it now stands routes all but VS
  # wholly on layer 1, by hand - README.md, The analog block, #33.)
  # ADC_VDD is U-ADC's supply AND its reference (breath-adc.md); the supplies
  # and references as wide as DEV_3V3
  analog_supply:
    nets: [/breath-adc/ADC_VDD, REF_VIN, /breath-excitation-reference/REF_5V, VS]
    track: 0.3
    layer_cost: {B.Cu: 6.0}
  analog:
    nets: [/SENSOR_RAW, /breath-adc/ADC_IN, /breath-excitation-reference/REF_MINUS,
           /breath-excitation-reference/BUF_OUT, /breath-excitation-reference/AC_FB_MID]
    track: 0.25
    layer_cost: {B.Cu: 6.0}
  plane_nets:
    # stubs from a pad to its plane via, and the pair's AGND leg (pairs:)
    nets: [PWR_GND, INST_POS12, AGND_INST]
    track: 0.4

# Every SMD pad on a plane net gets its own via into the plane beside it, a
# short stub away (pcb_route.fanout); a through-hole pad meets the plane itself.
fanout: [PWR_GND, INST_POS12, AGND_INST]
# ...and a power pad by more than one (#8-6) [calc: a 0.3 mm via in 1 oz plating carries
# about 1 A at a modest rise (the review's figure, judgment); the instrument's whole draw is
# bounded by the module's 1.10 A trip, power-entry-instrument.md §1a]: Q-INRUSH's drain into
# the INST_POS12 plane, the clamps' and the bulk caps' returns, the buck's input inductor
# and its caps
fanout_count:
  Q1.3: 3        # Q-INRUSH drain -> INST_POS12: the whole instrument
  D2.2: 2        # D-REVSHUNT's anode to PWR_GND: a reversed supply's fault current
  D3.2: 2        # D-TVS-PWR to PWR_GND: the clamp's surge
  C10.1: 2       # C-STRIP-BULK (two cans) + on INST_POS12: the LED row's pulse current
  C10.2: 2
  C44.1: 2
  C44.2: 2
  L1.1: 2        # L-BUCK-IN from INST_POS12: the buck's input current
  C11.2: 2       # C-BUCK-IN's return
  C43.2: 2       # C-BUCK-OUT's return

# Parts the sheets carry that this board does not: A1 is the Matrix, on its lid-hung carrier
# (on the sheet for its pad-to-pin map, reached through J-MCU); SW9 and SW10 are
# the spare positions' switches, not fitted (config/key-layout.yaml
# spare_bits_switches) and given no place by the body CAD. check reports each
# as a note, not an error; anything else missing from the board is an error.
not_on_board:
  A1: "the Matrix: on its carrier hung from the lid (#23), no footprint here; J-MCU is its connector"
  SW9: "sw+ spare switch: not fitted, no place in the body CAD"
  SW10: "sw- spare switch: not fitted, no place in the body CAD"

# The mounts: every one plated on PWR_GND, pads on both faces (ADR 0022 point 6,
# ADR 0025; the README's Open table: not _Pad_Via, whose ring of vias breaks the
# board house's hole-to-hole rule).
mounts:
  footprint: "MountingHole:MountingHole_2.7mm_M2.5_Pad_TopBottom"
  net: PWR_GND

# The U-bolt legs' holes are the DXF's (unplated, routed). On the outer layers no
# copper within 0.5 mm of what bears there (the washer and nut above, the spacer
# below), the margin the body CAD's neck rule takes (mechanical/cad/woody_body.scad,
# "main board neck at the U-bolt station"); the planes run on past the holes.
ubolt:
  copper_keepout: 0.5

# J-MCU and J-UMB, from the echo's insulator extent (x0, x1) and centre y. Each is
# placed by its pad row farthest from the mouth - the connectors' mouths face the
# tail - at `back_row_at` from x0 or x1. Both are the woody.pretty footprints
# (hardware/lib/README.md). J-MCU: the body 5.40 along the body and its far tail
# row 2.60 behind the body's back [ds XKB-X1270WR-2x12A-9TV01.pdf rev A1 side
# view; config/body.yaml boards.mcu_conn_w], so 8.00 in front of the mouth face x1
# [calc: 5.40 + 2.60]. J-UMB: the Hanxia header's pin row 1.80 in front of its
# insulator [ds HANXIA-HX-PZ2.54-1x8P-WZ.pdf; calc: 4.30 mating face to tail - 2.50].
connectors:
  J-MCU: {row: J-MCU, rot: 0, back_row_from: x1, back_row_at: -8.00}
  J-UMB: {row: J-UMB, rot: 0, back_row_from: x0, back_row_at: -1.80}

# Parts whose courtyard is MEANT to lie off the board (pcb.py check_courtyards).
courtyard_overhang:
  J6:
    reason: "J-UMB is a right-angle header standing at the tail edge: its insulator's mating face and the umbilical adapter's plug in it reach past the board's tail edge into the etherCON adapter, which is what carries them (the footprint's courtyard takes in the mated plug)"
    source: "ADR 0021 (the adapter carries J-UMB against its rear face); pcb-geometry.echo main connector J-UMB (insulator x0 297.4 to x1 299.9, the board's edge); hardware/lib/README.md (woody PinHeader_1x08_P2.54mm_Horizontal_Hanxia_PZ2.54-WZ); datasheets/connectors/HANXIA-HX-PZ2.54-1x8P-WZ.pdf"
  U10:
    reason: "U-BREATH's courtyard takes in its two barbed ports, which stand out of the sensor's tail face over the board; the lower barb reaches the board's surface, so the body CAD cuts the sensor-port slot under it, 1 mm clear of the barb all round - the courtyard lies over that cut-out by design, with nothing of the part below the board's top face"
    source: "mechanical/cad/woody_body.scad (sensor_c, port_slot_sz: 'The lower barb reaches the board's surface (p.7), so the board has a slot in front of it'); config/body.yaml boards.sensor_port_l, sensor_port_d, sensor_port_z; datasheets/analog/MPXV4006DP.pdf p.7 (case 1351-01, ports 6.10-6.60 long, lower port centre 1.4 above the seating plane)"

# Parts the echo places by centre: U-BREATH, its pads centred there, turned so its
# ports point to the tail (+x), as the body CAD and breath-sense-link.md
# (Mounting) put them: the footprint's ports are at its -y, so 270. That puts
# pins 1-4 (VS, GND, Vout) toward the far edge (high y), not the analog block;
# the island reaches round them (islands: below).
cad_parts:
  U-BREATH: {row: U-BREATH, rot: 270}

# Each LED's 100 nF (C-LED), 4.5 mm across the body from its LED's centre (4.6 until the
# row moved under the regulator block's edge, 2026-10-03), over
# its VDD and GND pads (ADR 0028). LED n is the nth along the data chain.
led_caps: {row: C-LED, offset: [0.0, 4.5], rot: 0}

# The key networks: the key boards' T, relative to each thumb switch. The far row
# (at 0 deg): the junction 8.5 mm outboard of the switch centre, past its pins,
# S toward pin 1. The near row is turned 180 deg (ADR 0022 point 5), and its T
# turns with it. The spare positions (sw+, sw-) have no switch: their T's stand
# beside REG-RT, the same shape.
networks:
  pattern: {offset: [-0.1, 8.5], axis: x, leg: -1, c: -1}
  except:
    LT1: {at: [50.1, 10.0], leg: 1, c: 1}     # switch at 180 deg: the pattern turned with it
    LT3: {at: [90.1, 10.0], leg: 1, c: 1}
    RT1: {at: [158.1, 10.0], leg: 1, c: 1}
    RT3: {at: [198.1, 10.0], leg: 1, c: 1}
  spare:
    sw+: {at: [168.4, 20.2], leg: 1, c: -1}
    sw-: {at: [168.4, 11.2], leg: 1, c: 1}

# Keep-outs from the body CAD (no footprint on the top face there): under each
# chain ribbon's plug and fold but its own header; the regulator block but U-BUCK.
keepouts:
  "ribbon left_hand": {except_rows: [J-CHAIN]}
  "ribbon right_hand": {except_rows: [J-CHAIN]}
  "regulator block": {part: REGULATOR-BLOCK, except_rows: [U-BUCK, C-BUCK-OUT]}
  # J-MCU's mated plug and the Matrix ribbon's rise over it (pcb-geometry.echo): no part there but J-MCU itself
  "Matrix ribbon": {except_rows: [J-MCU]}

# How tall each footprint family stands on the top face, for the height rooms
# (pcb_main.check_heights): under the key boards, elsewhere, and under the Matrix
# ribbon. Each with where it comes from.
heights:
  CP_Elec_6.3x7.7: 7.7         # [ds JIERR-MA-SERIES-MA25V220M6X8.pdf p.3, case 6.3 x 7.7]
  CP_Elec_6.3x5.8: 5.8         # [ds UCM1E101MCL1GS]
  SWPA6028: 2.8                # [ds SWPA6028S220MT]
  D_SMC: 2.62                  # [from memory: DO-214AB max]
  D_SMA: 2.3                   # [from memory: DO-214AC max]
  RECOM_R-78E: 10.4            # [repo power-entry-instrument.md, U-BUCK upright]
  SOIC: 1.75                   # [from memory: JEDEC MS-012 max]
  SOT-23: 1.45                 # [from memory]
  SOD-323: 1.1                 # [from memory]
  SOD-123: 1.35                # [from memory]
  C_1206: 1.8                  # [from memory: thickest 10 uF 1206]
  C_0805: 1.45                 # [ds datasheets/discrete-and-power/SAMSUNG-CL21A106KAYNNNE-SPECSHEET.pdf: 1.25 +-0.20 thick, the tallest 0805 case]
  R_1206: 0.7                  # [from memory]
  R_0805: 0.6                  # [from memory]
  R_0603: 0.55                 # [from memory]
  L_0805: 1.0                  # [from memory]
  NetTie: 0.05                 # copper only
  NXP_Case1351: 9.9            # [ds MPXV4006DP p.7, with its ports]
  PinHeader_1x03_P2.54mm_Vertical: 8.5   # [from memory: the header's pins above the board; the service lead's plug goes on with the lid off]
  # the two 1.27 mm IDC headers by name - the lookup takes the FIRST key a footprint's name
  # contains, so the specific ones come before anything they would also match (#19 F5: a bare
  # IDC-Header key gave both 4.9, under the Samtec's real height)
  IDC-Header_2x06_P1.27mm_Samtec: 5.59   # [repo config/body.yaml boards.chain_hdr_h; ds SAMTEC-SHF-1XX-01-X-D-XX-PRINT.pdf sheet 1, .220 REF]
  IDC-Header_2x12_P1.27mm_XKB: 5.1       # [repo config/body.yaml boards.mcu_conn_h; ds XKB-X1270WR-2x12A-9TV01.pdf]
  LED_WS2815B: 1.65            # [repo pcb-geometry.echo led height]
  PinHeader_1x08: 2.5          # [repo config/body.yaml boards.umb_joint_h]

# The only parts the UNDERSIDE may carry (pcb_main.check_heights, #19 F2): it faces the
# grounded bottom plate with no room for a part (mechanical/drc.echo "main board underside
# room over the bottom plate"); the thumb switches hang through the thumb plates instead.
underside_rows: [SW1-n]

# SOLDERING-IRON ROOM round hand-soldered pads (#34; pcb.check_iron): each rows: part's pads
# on the face it is soldered on (a through-hole part's far face), grown 0.25 as a courtyard
# is, kept min mm from every other part's courtyard on that face. 2.0 for the thumb
# switches' pins (the module boards' iron_min: a 1.5-2 mm conical tip set on the pad at
# ~45 degrees without touching the neighbour [from memory]); 1.5 for the sensor's gull-wing
# pads (the coordinator's #34 C7 figure). except: a pair that cannot have it, and why.
iron_room:
  rules:
    - {rows: [SW1-n], min: 2.0}
    - {rows: [U-BREATH], min: 1.5}
  except:
    - {part: SW2, near: H2, reason: "both placed by the body CAD: the far column mount's nut 1.32 mm off the switch's leg pin. Owner 2026-10-04: key layout final for rev A - accepted for rev A, check on the boards in hand"}
    - {part: SW6, near: H6, reason: "as SW2 / H2 (1.32 mm). Accepted for rev A, check on the boards in hand"}
    - {part: SW8, near: J5, reason: "both placed by the body CAD (J5 the right-hand chain header): 0.01 mm. Accepted for rev A, check on the boards in hand"}
    - {part: U10, near: R7, reason: "owner 2026-10-04: accepted; hand-solder U10 first with a fine tip (its Fit field). Pad to pad 0.80 mm, U10 pin 5 (no-connect) to R7 pad 2; courtyards 0.28 mm"}
    - {part: U10, near: U3, reason: "owner 2026-10-04: accepted; hand-solder U10 first with a fine tip (its Fit field). Pad to pad 1.59 mm, U10 pins 5-8 (no-connect) to U3's pin-1 row; courtyards 0.86 mm"}

# Placement: TOP face, body coordinates, [x, y, rot] (rot CCW seen from above).
parts:
  # --- the analog island, at the mouth end. U-BREATH (the echo) at the top left; the
  # buffer beside its pins 2-4, the reference under it, their feedback network down
  # the mouth edge; U-ADC at the island's tail end with its input network in front of
  # it and NT-AGND under it on the moat.
  U3:  [14.0, 26.4, 0]   # U-BUF OPA2197: A = the reference buffer, B = the breath buffer
  U4:  [16.4, 18.6, 0]   # U-REF-BREATH REF5050
  # VS's decoupling (MPXV4006DP Fig. 3, breath-sense-link.md): beside the sensor's pins at
  # the far edge, just past its leads' courtyard, the smallest nearest pin 2 (VS)
  # each turned so its VS pad is on top: the three VS pads in one row, one straight track
  C202: [21.7, 47.4, 270]   # 10 nF on VS, nearest pin 2 (the nearest place U10's own courtyard leaves)
  C8:  [26.1, 47.4, 270]   # 100 nF on VS
  C201: [23.9, 47.4, 270]   # 1 uF on VS, next
  # SENSOR_RAW's 470 pF: pin 4 (Vout) is the leads' mouth-end corner, walled by the
  # sensor's own courtyard, so it stands at the other end of the net, at U-BUF's input
  C203: [22.6, 23.6, 0]   # 470 pF, SENSOR_RAW to AGND_INST, at U3 pin 5 (INB+): U10's pin 4 is its own courtyard's corner at two board edges, so this end of the net is the nearest place (README)
  C204: [19.2, 25.6, 270]   # 100 nF, U3's V+ (pin 8, INST_POS12) to AGND_INST
  # the feedback network is a ring (BUF_OUT - R7 - VS - R8 - REF_MINUS - C9 - AC_FB_MID
  # - R9 - BUF_OUT): stacked so each pair of neighbouring pads shares its net and joins
  # without a track round anything; VS from R8's foot to R7's head down layer 4
  R7:  [8.9, 28.0, 90]      # R-ISO-REF: BUF_OUT (foot) -> VS (head)
  R9:  [8.9, 24.55, 270]    # R-FBX-REF, AC feedback: BUF_OUT (head) -> AC_FB_MID (foot)
  C9:  [8.9, 21.1, 90]      # C-FB-REF: REF_MINUS (foot) -> AC_FB_MID (head)
  R8:  [8.9, 17.65, 90]     # R-FB-REF, DC feedback: VS (foot) -> REF_MINUS (head)
  C5: [21.4, 20.3, 90]   # C-REF-OUT on REF_5V
  C7:  [21.2, 16.1, 90]   # 100 nF on REF_5V
  C4:  [15.0, 22.54, 0]   # C-REF-OUT on REF_VIN, above U4 by pin 2 (#8-7), between U4 and U3
  C6:  [11.65, 17.97, 270]   # 100 nF on REF_VIN across U4's pins 2 and 4 (REF_VIN up, AGND down)
  D1:  [22.5, 12.8, 0]      # D-REF-CLAMP on REF_VIN
  R6:  [27.5, 12.8, 0]      # R-REF-IN from +12 V
  U2:  [38.5, 20.6, 0]   # U-ADC MCP3202, wholly on the island; its digital pins 5-7 cross the moat at NT2
  NT2: [44.6, 19.9, 0]   # NT-AGND on the island's tail-side edge: pad 1 (AGND_INST) on it, pad 2 (PWR_GND) past the moat
  C1:  [31.2, 19.6, 90]   # C-AA-ADC, at CH0
  R5:  [29.1, 19.6, 90]   # R-ADCDIV-L
  R4:  [27.0, 19.6, 90]   # R-ADCDIV-U, from the breath buffer's output
  C2: [33.6, 25.9, 90]   # C-ADC-BULK 10 uF on ADC_VDD, ADC_VDD pad down on the bus, AGND up into the island
  C3:  [41.5, 24.4, 0]   # C-DECOUPLE-CARRIER 100 nF: ADC_VDD pad straight over pin 8, AGND pad into the island
  C42: [36.2, 25.9, 90]   # C-ADC-VDD 22 uF on ADC_VDD (owner, 2026-10-03), between C2 and C3, the same way round
  R47: [31.0, 25.4, 270]    # R-ADC-VDD 10R: DEV_3V3 (top) into the ADC_VDD bus (bottom), at its far end from pin 8
  R45: [32.4, 22.4, 0]      # R-CS-PULL-ADC: CS_ADC (IO39) to 3V3, its IO39 pad a straight stub from pin 1
  # --- at J-UMB (pin row x 295.9): the clamps and the breath pair's resistors in
  # two columns in front of it; the tongue's end mounts (x 278.3, y 13 / 30) behind
  # (config/body.yaml boards.umb_parts_d), D-TVS-PWR between them
  D5:  [292.6, 31.3, 90]   # D-TVS-BREATH on BREATH_SENSE (pin 1)
  D6:  [292.6, 27.55, 90]   # D-TVS-BREATH on AGND_SENSE (pin 2)
  R38: [288.95, 30.39, 0]   # R-SER-BREATH-INST in BREATH, at J-UMB pin 1, where the pair comes down from the far edge
  R39: [288.95, 27.85, 0]   # R-SER-BREATH-INST in AGND_SENSE, at pin 2
  NT1: [293.0, 13.4, 90]    # NT-DIG at J-UMB pin 8 (ADR 0018)
  D2:  [286.4, 18.7, 90]    # D-REVSHUNT, across pins 3 / 6, ahead of L-BUCK-IN
  D3:  [291.6, 21.8, 270]   # D-TVS-PWR at J-UMB's pins 3 (+12 V, its cathode) and 6 (PWR_GND), #8-9
  # --- Q-INRUSH and its gate network (power-entry-instrument.md §1a) in the tail strip
  # above the LED row, between LED2 and LED1 (the full-width tail's corner, which the
  # corner LED held until 2026-10-03): its source from J-UMB pin 3 past D-REVSHUNT and
  # D-TVS-PWR, its drain into the INST_POS12 plane
  Q1:  [279.0, 36.5, 0]   # Q-INRUSH AO3401A, by J-UMB under the breath pair's far run
  C39: [282.5, 36.5, 90]   # C-INRUSH-GS, source to gate
  R41: [284.8, 36.5, 90]   # R-INRUSH-GS, source to gate
  R42: [287.0, 36.5, 90]   # R-INRUSH-G, gate to ground
  C40: [278.0, 41.0, 90]   # C-INRUSH-GD, the Miller leg's capacitor
  R43: [280.3, 41.0, 90]   # R-INRUSH-GD, the Miller leg's damping, to the drain
  D21: [283.0, 41.0, 90]   # D-INRUSH-RST, gate reset after an unplug
  # --- the SPI and chain series resistors at their driving end, past J-MCU's mouth in
  # the LED row's gap between LED3 and LED2, under the Matrix ribbon (each under its
  # 2.15 mm room)
  R1:  [274.7, 18.8, 90]   # R-SPI-SER SCLK, between J-MCU and J-UMB, away from the breath pair
  R2:  [277.0, 18.8, 90]   # R-SPI-SER MOSI
  R3:  [279.3, 18.8, 90]   # R-SPI-SER CS_MOD
  R40: [281.6, 18.8, 90]   # R-CS-PULL-INST, IO34 to 3V3 beside R-SPI-SER CS
  # the service UART at J-MCU (service-uart.md): R46 in TXD between J-MCU pin 22 and J2
  R46: [275.3, 8.9, 0]   # R-TXD-SER past J-MCU's plug box, U0TXD pad toward pin 22, TXD_HDR on to J2
  # U-TVS-SPI clamps the pad side of R-SPI-SER (IO35, IO36, IO34 - spi-link), so it
  # stands on the J-MCU side of the resistors, below the chain's, clear of the column mount
  U1:  [278.5, 24.3, 0]
  R34: [232.5, 36.5, 90]   # R-CHAIN-SER SCK, on the far side of the LED row where the block used to stand
  R35: [235.1, 36.5, 90]   # R-CHAIN-SER SH/LD
  R36: [237.7, 36.5, 90]   # R-CHAIN-SER SER (the chain's end)
  J2:  [284.0, 9.3, 90]   # HDR-SERVICE at config/body.yaml boards.service_hdr_at (pin 1), in the tail corner by J-UMB, off the LEDs' cone; reached with the lid off
  # --- the regulator block (the echo's REGULATOR-BLOCK) holds U-BUCK alone; the
  # buck's input LC and C-STRIP-BULK where their height fits (README, Open)
  U5:  [226.1, 14.75, 180]   # U-BUCK in the block against the near edge (boards.tall_side), its pins ALONG the body
  # #8-7: the module's own caps at the module - C11 beside pin 1 (VIN) between L1 and U5,
  # C43 (owner, 2026-10-03, RECOM's application) at pin 3 (OUT), returned to pin 2 (GND)
  C11: [237.0, 12.5, 90]   # C-BUCK-IN 100 uF (5.8 mm) at pin 1 (VIN), on the block's tail side
  L1:  [247.8, 18.5, 0]   # L-BUCK-IN 22 uH, above H7, INST_POS12 into C11
  C43: [220.0, 18.3, 0]   # C-BUCK-OUT 10 uF at pin 3 (OUT), returned to its own via
  D4:  [237.0, 20.0, 0]   # D-USBOR, between C-BUCK-IN and the LED row, toward J-MCU's 5 V pins
  C10: [212.2, 11.5, 0]   # C-STRIP-BULK-1 220 uF polymer (7.7 mm), against the near edge on the mouth side of the regulator block
  C44: [212.2, 18.7, 0]   # C-STRIP-BULK-2, its pair, inboard of it
  U6:  [270.9, 30.0, 0]   # U-LVLSHIFT 74AHCT125, on the LED row's tail side of the breath crossing, by LED 1
  C12: [270.9, 36.6, 90]   # its 100 nF, at VCC (pin 14)
  R10: [268.3, 37.0, 90]   # R-LED-PD
  R11: [265.9, 23.9, 90]   # R-LED-SER, into LED 1's DI
  # --- the thumb registers, each in the near band between its hand's switches
  U7:  [70.0, 19.2, 90]     # REG-LT
  R44: [76.9, 21.7, 0]      # R-HOP-SER, at U7's QH (pin 9): its pad 1 to the pin, pad 2 on toward J5 pin 6
  C13: [65.6, 24.2, 0]      # REG-LT's 100 nF, at VCC (pin 16) and GND (pin 15)
  C206: [69.3, 24.2, 0]     # REG-LT's second 100 nF (key-register C-DECOUPLE-165-VCC, #6-5), beside C13
  R32: [63.2, 21.2, 90]     # FREE1 pull-up
  R33: [63.2, 17.3, 90]     # FREE2 pull-up
  U8:  [186.0, 19.2, 90]    # REG-RT
  C14: [181.6, 24.2, 0]     # REG-RT's 100 nF, at VCC (pin 16) and GND (pin 15)
  C205: [185.3, 24.2, 0]    # REG-RT's second 100 nF (key-register C-DECOUPLE-165-VCC, #6-5), beside C14
  # --- the key chain's parts beside their J-CHAIN
  U9:  [64.6, 44.2, 0]      # U-TVS-CHAIN on SCK, SH/LD, SER_LH
  FB1: [66.4, 39.8, 90]     # FB-CHAIN, the LH ribbon's 3V3
  R37: [62.0, 39.8, 90]     # R-SER-TERM on the LH ribbon's SER
  FB2: [167.3, 41.5, 90]    # FB-CHAIN, the RH ribbon's 3V3
  U11: [175.6, 44.2, 0]     # U-TVS-CHAIN at J5 (key-chain-loom.md): SCK, SH/LD, HOP_LT_RH, HOP_RH_RT; pin 2 its own via

silk:
  at: [105.5, 37.0]         # mid-board between the switch pairs; the old place, [100.0, 45.5], is the breath pair's since #8 (#33)
  title: "WOODY main board"
  rev: "A"                  # owner, 2026-10-03: rev A on the first board fabricated (README, Revisions)
  date: "2026-10-03"

# Routing: pcb_route.fanout and route_pair first (above), then every other
# connection on layers 1 and 4 (directions: below); what is left gets a rip-up
# (pcb.rescue). A connection still left is reported by name and check fails on it.
route: astar

# THE ROUTING POLICY (owner, 2026-10-03, docs/reference/tooling.md "The routing policy"):
# "the horizontal vertical should only be used when required, and maybe even just in
# portions or sections of the board that is necessary". Wave 3 routes the whole board
# FREE - short, direct paths at 45 degrees on both outer layers, the planes on layers 2
# and 3, a via only where a crossing needs one - with no layer direction anywhere: no
# region of this board is a bus crossing that needs one (README, "Routing"). Layers 1
# and 4 were directed along and across the whole board from 2026-10-01 until this
# re-layout. route: astar - every signal connection by pcb_route.complete, shortest
# first. A connection with no way through takes up the nets in its way and they are
# routed again, each net at most this many times.
rip_up: 10
# The rails that are layer-1 tracks (#8-6, net_classes: layers) cannot hop a via, so
# they route before the signals do: routed last, the 5 V from J-MCU to D-USBOR and
# J-UMB's +12 V to Q-INRUSH's gate divider found layer 1 already crossed by the bus
# running the board's length (the first wave-3 route left both open).
route_first: [INST_5V_A, /power-entry-instrument/BUCK_A_OUT, BUCK_IN, UMBILICAL_POS12, DEV_3V3]
directions:
  # each right-angle corner cut to two 45-degree bends, up to this far back (pcb_route.chamfer)
  chamfer: 0.6
