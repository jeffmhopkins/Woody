# THE LIMITS THIS BOARD IS HELD TO, and what its silkscreen says - tools/pcb.py check,
# `kind: main` (tools/pcb_main.py).
#
# The board is laid out by hand: main_layout.py, beside this file, places every part and
# writes out every track and via, and says why each is where it is (issue #48, ADR 0030).
# No router runs on it, so this file no longer carries a placement or a routing order.
#
# FROM THE BODY CAD, NOT HERE (mechanical/export/pcb-geometry.echo, `main`
# lines; the outline from mechanical/export/main-board.dxf): the thumb switches
# (on the UNDERSIDE - they come in from below), both J-CHAIN headers, J-MCU,
# J-UMB, U-BREATH, the LEDs (lighting.led_count), the eleven mounts, the two U-bolt legs,
# the keep-outs and the board's thickness. Body coordinates throughout (x along the
# body from the mouth, y across, mm, seen from above); parts on the TOP face (ADR 0017).

kind: main
cluster: main
outline: main-board.dxf
layers: 4

# The key boards' rules and the same board house, so one order makes all three.
rules:
  track: 0.25
  track_min: 0.2
  clearance: 0.2
  via: 0.7                  # 0.4 over the 0.3 drill, as the key boards' (their layout.yaml)
  via_drill: 0.3
  via_min: 0.66
  drill_min: 0.3
  edge_clearance: 0.3
  power_track: 0.4

fab:
  house: JLCPCB
  hole_clearance: 0.28
  hole_to_hole: 0.45
  annular_min: 0.18
  silk_text_min: 1.0
  silk_line_min: 0.15
  silk_to_pad: 0.15
  finish: "HAL lead-free"
  mask: White               # ADR 0028 point 7: the top face is the LED row's first reflector; both faces, one order
  silk: Black               # white legend does not read on white mask
  copper_oz: 1

# FOUR LAYERS (ADR 0017 amendment 2026-09-29): signal / ground / power / signal,
# 1.6 mm. JLCPCB's standard 4-layer 1.6 mm stack JLC04161H-7628 [ds
# datasheets/fab/JLCPCB-IMPEDANCE-STACKUPS.pdf, "4-Layer Impedance Control
# Stackup", 1.6 mm, 1 oz outer, 0.5 oz inner]: its layers as the Gerber job file
# reports them (pcb.py set_stackup). The finished thickness is the body CAD's
# (switch.pcb_t), which check holds; these add to 1.586 mm of copper and
# dielectric [calc: 2 x 0.035 + 2 x 0.2104 + 2 x 0.0152 + 1.065], the mask the rest.
stackup:
  name: JLC04161H-7628
  outer_cu: 0.035
  inner_cu: 0.0152
  prepreg: {thickness: 0.2104, material: "7628", epsilon_r: 4.4}
  core: {thickness: 1.065, material: FR4, epsilon_r: 4.6}

# THE PLANES (hardware/carrier/power-entry-instrument/power-entry-instrument.md §2):
# layer 2 is PWR_GND, one plane from J-UMB to the mouth end under every SPI,
# chain and LED-data trace; layer 3 carries the rails. The rail that visits the
# whole board is the +12 V behind Q-INRUSH (INST_POS12, power-entry-instrument.md
# §1a: every LED and its cap, C-STRIP-BULK, L-BUCK-IN, the reference's
# input and the buffer's supply), so it is the layer-3 plane, and a signal on
# layer 4 has one unbroken plane over it. The +12 V ahead of Q-INRUSH
# (UMBILICAL_POS12, J-UMB pin 3 to the clamps and Q-INRUSH's source) and the
# lighter rails (DEV_3V3, INST_5V_A, BUCK_IN) are tracks: net_classes below.
planes:
  - {layer: In1.Cu, net: PWR_GND}
  - {layer: In2.Cu, net: INST_POS12}

# THE ANALOG ISLAND (same page, §2): AGND_INST on layer 2 under the analog block
# only, a moat round it, bridged at ONE point by NT-AGND (NT2), which sits under
# U-ADC (U2) between its VSS (pin 4, the island side) and its digital pins (5-8,
# the plane side): the moat runs along U2's centreline. The outline (body mm)
# keeps off the mouth-end mount H9 and the column mount at x 40 (both PWR_GND,
# ADR 0025), and out of the LED row's band (the LEDs return to PWR_GND). pcb.py check holds: every AGND_INST pad on the island but
# the pair's far end, no other plane net's pad on it, one tie.
islands:
  - net: AGND_INST
    layer: In1.Cu
    tie: NT2
    moat: 0.5
    # layer-1 tracks may cross the moat only here (a disc round the tie: U2's CS and
    # its supply) and as the breath pair (pairs: below); anywhere else a layer-1 track
    # over the moat is a signal crossing a split in its reference plane
    tie_window: 5.0
    # its bottom edge stands off the board's (y 10.0, not 7.5): the strip of plane
    # left along the edge is what joins H9's corner to the rest of layer 2 - an
    # island down to the edge cut it off, and H9 with it
    # the top corner reaches past the sensor's leads, over the strip above the sensor
    # slot: C8 on VS, and the room kept for the datasheet's supply and output
    # decoupling (MPXV4006DP Fig. 3: 1 uF + 10 nF on VS, 470 pF on Vout; README, Open)
    # WAVE 3 (issue #8-3, owner's filter 2026-10-03, breath-adc.md "The reference's filter"):
    # the island now takes ALL of U-ADC and the pocket above it between LED13 and LED12,
    # where ADC_VDD's three capacitors stand (C3 at pin 8, C42 and C2 beside it), so each
    # returns into AGND_INST under the ADC, a few mm from pin 4's own via. The moat runs down
    # U2's tail side, where NT2 ties it, and the digital pins (5-7) cross it there, inside
    # the tie's window. It used to run along U2's centreline, which put pin 8's capacitors on
    # the far side of the split from pin 4 (C3 was 7.7 mm away behind four vias).
    # #48 (the board laid out afresh, by hand): the island takes the whole analog block as it
    # stands now - the sensor and its capacitors up the mouth edge, the buffer, the reference
    # with its input parts, the ADC and its row - and stops at U-ADC's tail side, where NT2
    # stands astride its edge and the ADC's three SPI lines cross beside it. CS and the ADC's
    # 3V3 arrive on the bottom face and come up inside the island, so neither crosses its edge.
    outline: [[7.5, 15.6], [15.6, 15.6], [15.6, 10.0], [31.9, 10.0], [31.9, 15.6], [49.4, 15.6],
              [49.4, 25.7], [21.2, 25.7],
              [21.2, 45.0], [30.6, 45.0], [30.6, 49.5], [7.5, 49.5]]
    # its one pad off the island: the breath pair's AGND leg ends at R-SER-BREATH-INST
    # beside J-UMB (breath-sense-link.md)
    off_island: [R39.1]
  # THE BREATH CORRIDOR'S REFERENCE (pairs: below): an AGND_INST strip in layer 3 under the
  # whole far-edge run, its two legs at the mouth and its hop into R38 / R39 - carved out
  # of INST_POS12, the LEDs' supply, which keeps its copper inboard of it; its own zone
  # with a moat, joined to the island through the pair's AGND leg, whose via at each end
  # stands on it (strip: true, no tie of its own)
  - net: AGND_INST
    layer: In2.Cu
    strip: true
    moat: 0.5
    tie_window: 0.0
    # WRITTEN BY main_layout.py from the pair's own points (breath_strip): do not edit
    outline: [[278.9, 35.96], [280.01, 34.85], [278.6, 33.44], [276.9, 35.14], [276.9, 40.09], [270.89, 46.1],
              [254.54, 46.1], [249.64, 41.2], [245.76, 41.2], [240.86, 46.1], [152.64, 46.1], [147.74, 41.2],
              [143.86, 41.2], [138.96, 46.1], [128.54, 46.1], [123.64, 41.2], [119.76, 41.2], [114.86, 46.1],
              [44.64, 46.1], [39.74, 41.2], [35.86, 41.2], [30.96, 46.1], [18.1, 46.1], [18.1, 29.81],
              [18.9, 29.01], [18.9, 26.41], [16.9, 26.41], [16.9, 27.4], [15.6, 27.4], [15.6, 47.71],
              [16.49, 48.6], [31.98, 48.6], [36.88, 43.7], [38.72, 43.7], [43.62, 48.6], [115.88, 48.6],
              [120.78, 43.7], [122.62, 43.7], [127.52, 48.6], [139.98, 48.6], [144.88, 43.7], [146.72, 43.7],
              [151.62, 48.6], [241.88, 48.6], [246.78, 43.7], [248.62, 43.7], [253.52, 48.6], [272.42, 48.6],
              [279.6, 41.42], [279.6, 36.39], [278.9, 36.39]]

# THE BREATH PAIR (same page: "crosses the moat as a pair"; owner, 2026-10-03: "the analog
# path should just be routed along the top" - the far edge, the top of the board's plots):
# BREATH_SENSE's source SENSOR_BUFFERED_OUT and its AGND leg, side by side on layer 4 from
# the buffer along the FAR EDGE to their series resistors at J-UMB, stepping inboard at 45
# degrees under each far column mount. The signal is the far-side line, so the AGND leg
# lies between it and every key. Its reference is the AGND_INST strip cut out of layer 3
# under it (islands: above). main_layout.py breath_pair() draws it and locks its tracks.
pairs:
  - nets: [/SENSOR_BUFFERED_OUT, AGND_INST]
    layer: B.Cu
    width: 0.25
    gap: 0.25
    # #8-4: every other net's tracks on that layer, and every via, kept 0.55 + the 0.2
    # clearance = 0.75 mm (3W) off both lines (pcb.py check_pair_guard, against the locked
    # tracks). No guard tracks beside the pair: the far band it runs in carries nothing else
    # on that layer.
    guard: 0.55

# Net classes (the rest are the Default class, rules: track): the rails as
# tracks. [calc] IPC-2221 outer layer, 1 oz, 10 C rise: I = 0.048 dT^0.44 A^0.725
# -> 1.0 A (U-BUCK's rating, the most its 5 V path can carry; power-entry-
# instrument.md "Regulator loading") needs 16.3 mil2 = 0.30 mm; 0.5 mm leaves
# the drop along the 5 V path at 10 mV per 10 mm [calc: 0.5 mOhm/sq x 10/0.5
# x 1.0 A = 10 mV]. UMBILICAL_POS12, J-UMB to Q-INRUSH, carries the whole
# instrument, bounded by the module's LT1641 worst-case trip (power-entry-
# instrument.md §1a, 1.10 A): 18.6 mil2 = 0.34 mm [calc: (1.10 / (0.048 x
# 10^0.44))^(1/0.725) = 18.6 mil2; / 1.378 mil (1 oz) = 13.5 mil], so 0.5 mm
# too. DEV_3V3 is the registers, the ADC and the chain's pull-ups
# (the Matrix's regulator is on the Matrix), tens of mA: 0.3 mm.
#
# #8-6 (single 0.3 mm vias in series on the power paths): the rails that are tracks run
# on LAYER 1 from end to end - J-UMB's +12 V to the clamps and Q-INRUSH's source, the
# buck's input and output, the 5 V to J-MCU's pins - with no via in them. Where a power
# part meets a plane it does so by more than one via: three at Q-INRUSH's drain, two at
# each bulk capacitor's pads, the buck's capacitors' returns, L-BUCK-IN and D-TVS-PWR
# (main_layout.py power(), planes_in()). D-REVSHUNT's anode is a track to J-UMB's own pin.
net_classes:
  power5:
    nets: [INST_5V_A, BUCK_IN, /power-entry-instrument/BUCK_A_OUT]
    track: 0.5
  power12_in:
    nets: [UMBILICAL_POS12]
    track: 0.5
  rail3v3:
    nets: [DEV_3V3]
    track: 0.3
  # THE ANALOG BLOCK'S NETS (#8-5) run on layer 1 over the AGND_INST island on layer 2, not
  # on layer 4, whose reference is layer 3's INST_POS12 - the LEDs' supply, which their PWM
  # modulates (main_layout.py analog()).
  # ADC_VDD is U-ADC's supply AND its reference (breath-adc.md); the supplies
  # and references as wide as DEV_3V3
  analog_supply:
    nets: [/breath-adc/ADC_VDD, REF_VIN, /breath-excitation-reference/REF_5V, VS]
    track: 0.3
  analog:
    nets: [/SENSOR_RAW, /breath-adc/ADC_IN, /breath-excitation-reference/REF_MINUS,
           /breath-excitation-reference/BUF_OUT, /breath-excitation-reference/AC_FB_MID]
    track: 0.25
  plane_nets:
    # tracks from a pad to its plane via
    nets: [PWR_GND, INST_POS12, AGND_INST]
    track: 0.4

# Parts the sheets carry that this board does not: A1 is the Matrix, on its lid-hung carrier
# (on the sheet for its pad-to-pin map, reached through J-MCU); SW9 and SW10 are
# the spare positions' switches, not fitted (config/key-layout.yaml
# spare_bits_switches) and given no place by the body CAD. check reports each
# as a note, not an error; anything else missing from the board is an error.
not_on_board:
  A1: "the Matrix: on its carrier hung from the lid (#23), no footprint here; J-MCU is its connector"
  SW9: "sw+ spare switch: not fitted, no place in the body CAD"
  SW10: "sw- spare switch: not fitted, no place in the body CAD"
  J8: "J-MIDI-OUT, the TRS jack: panel-mounted through the tail cap (#45), wired to CBL-MIDI; J-MIDI (J7) is its connector here"

# The mounts: every one plated on PWR_GND, pads on both faces (ADR 0022 point 6,
# ADR 0025; the README's Open table: not _Pad_Via, whose ring of vias breaks the
# board house's hole-to-hole rule).
mounts:
  footprint: "MountingHole:MountingHole_2.7mm_M2.5_Pad_TopBottom"
  net: PWR_GND

# The U-bolt legs' holes are the DXF's (unplated, routed). On the outer layers no
# copper within 0.5 mm of what bears there (the washer and nut above, the spacer
# below), the margin the body CAD's neck rule takes (mechanical/cad/woody_body.scad,
# "main board neck at the U-bolt station"); the planes run on past the holes.
ubolt:
  copper_keepout: 0.5

# J-MCU and J-UMB, from the echo's insulator extent (x0, x1) and centre y. Both are the
# woody.pretty footprints (hardware/lib/README.md). J-MCU stands straight up, its rows
# along the body (ADR 0018, Amendment of 2026-11-21): the echo gives the way its ribbon
# leaves, and its near pad row stands `back_row_at` inside the insulator's near face, as
# J-MCU-C's does on the Matrix carrier (hardware/boards/matrix-carrier/layout.yaml).
# J-UMB's mouth faces the tail: its pin row 1.80 in front of its insulator
# [ds HANXIA-HX-PZ2.54-1x8P-WZ.pdf; calc: 4.30 mating face to tail - 2.50].
connectors:
  J-MCU: {row: J-MCU, rot: 0, back_row_from: x0, back_row_at: 2.29}
  J-UMB: {row: J-UMB, rot: 0, back_row_from: x0, back_row_at: -1.80}

# Parts whose courtyard is MEANT to lie off the board (pcb.py check_courtyards).
courtyard_overhang:
  J6:
    reason: "J-UMB is a right-angle header standing at the tail edge: its insulator's mating face and the umbilical adapter's plug in it reach past the board's tail edge into the etherCON adapter, which is what carries them (the footprint's courtyard takes in the mated plug)"
    source: "ADR 0021 (the adapter carries J-UMB against its rear face); pcb-geometry.echo main connector J-UMB (insulator x0 297.4 to x1 299.9, the board's edge); hardware/lib/README.md (woody PinHeader_1x08_P2.54mm_Horizontal_Hanxia_PZ2.54-WZ); datasheets/connectors/HANXIA-HX-PZ2.54-1x8P-WZ.pdf"

# Parts the echo places by centre: U-BREATH, its pads centred there, turned so its
# ports point to the tail (+x), as the body CAD and breath-sense-link.md
# (Mounting) put them: the footprint's ports are at its -y, so 270. That puts
# pins 1-4 (VS, GND, Vout) toward the far edge (high y), not the analog block;
# the island reaches round them (islands: above).
cad_parts:
  U-BREATH: {row: U-BREATH, rot: 270}

# Keep-outs from the body CAD (no footprint on the top face there): under each
# chain ribbon's plug and fold but its own header; the regulator block but U-BUCK.
keepouts:
  "ribbon left_hand": {except_rows: [J-CHAIN]}
  "ribbon right_hand": {except_rows: [J-CHAIN]}
  "regulator block": {part: REGULATOR-BLOCK, except_rows: [U-BUCK, C-BUCK-OUT]}
  # J-MCU's own body, with its socket standing on it (pcb-geometry.echo): no part there but J-MCU itself.
  # The ribbon's fold beyond it is high enough for parts to stand under.
  "Matrix ribbon": {except_rows: [J-MCU]}

# How tall each footprint family stands on the top face, for the height rooms
# (pcb_main.check_heights): under the key boards, elsewhere, and under the Matrix
# ribbon. Each with where it comes from.
heights:
  CP_Elec_6.3x7.7: 7.7         # [ds JIERR-MA-SERIES-MA25V220M6X8.pdf p.3, case 6.3 x 7.7]
  CP_Elec_6.3x5.8: 5.8         # [ds UCM1E101MCL1GS]
  SWPA6028: 2.8                # [ds SWPA6028S220MT]
  D_SMC: 2.62                  # [from memory: DO-214AB max]
  D_SMA: 2.3                   # [from memory: DO-214AC max]
  RECOM_R-78E: 10.4            # [repo power-entry-instrument.md, U-BUCK upright]
  SOIC: 1.75                   # [from memory: JEDEC MS-012 max]
  SOT-23: 1.45                 # [from memory]
  SOD-323: 1.1                 # [from memory]
  SOD-123: 1.35                # [from memory]
  C_1206: 1.8                  # [from memory: thickest 10 uF 1206]
  C_0805: 1.45                 # [ds datasheets/discrete-and-power/SAMSUNG-CL21A106KAYNNNE-SPECSHEET.pdf: 1.25 +-0.20 thick, the tallest 0805 case]
  R_1206: 0.7                  # [from memory]
  R_0805: 0.6                  # [from memory]
  R_0603: 0.55                 # [from memory]
  L_0805: 1.0                  # [from memory]
  NetTie: 0.05                 # copper only
  NXP_Case1351: 9.9            # [ds MPXV4006DP p.7, with its ports]
  PinHeader_1x03_P2.54mm_Vertical: 6.0   # [ds connectors/HANXIA-HX-PZ2.54-1x3P-TP-YQ.pdf: posts 6.00 +/-0.2 from the board; config/body.yaml boards.service_hdr_h] the service lead goes on with the lid off
  # the two 1.27 mm IDC headers by name - the lookup takes the FIRST key a footprint's name
  # contains, so the specific ones come before anything they would also match (#19 F5: a bare
  # IDC-Header key gave both 4.9, under the chain header's real height)
  IDC-Header_2x05_P1.27mm_CNCTech: 5.4   # [repo config/body.yaml boards.chain_hdr_h; ds CNCTECH-3220-XX-0100-00-1.27MM-BOX-HEADER-VERTICAL.pdf]
  IDC-Header_2x12_P1.27mm_Vertical: 5.4  # [repo config/body.yaml boards.mcu_conn_h]
  LED_WS2815B: 1.65            # [repo pcb-geometry.echo led height]
  JST_PH_S3B-PH-SM4-TB: 5.5    # [repo config/body.yaml midi.hdr_sz, its height: side entry, the plug lies inside it (midi.hdr_plug_l)]
  PinHeader_1x08: 2.5          # [repo config/body.yaml boards.umb_joint_h]

# The only parts the UNDERSIDE may carry (pcb_main.check_heights, #19 F2): it faces the
# grounded bottom plate with no room for a part (mechanical/drc.echo "main board underside
# room over the bottom plate"); the thumb switches hang through the thumb plates instead.
underside_rows: [SW1-n]

# SOLDERING-IRON ROOM round hand-soldered pads (#34; pcb.check_iron): each rows: part's pads
# on the face it is soldered on (a through-hole part's far face), grown 0.25 as a courtyard
# is, kept min mm from every other part's courtyard on that face. 2.0 for the thumb
# switches' pins (the module boards' iron_min: a 1.5-2 mm conical tip set on the pad at
# ~45 degrees without touching the neighbour [from memory]); 1.5 for the sensor's gull-wing
# pads (the coordinator's #34 C7 figure). except: a pair that cannot have it, and why.
iron_room:
  rules:
    - {rows: [SW1-n], min: 2.0}
    - {rows: [U-BREATH], min: 1.5}

# The hand parts' tails, cut after soldering (issue #8-11; owner, 2026-10-04: "Trim
# length", over an insulating sheet on the plate): pcb.py render writes each one's
# maximum into fab/main-board-hand-assembly.csv's Fit column, computed from the named
# config/body.yaml figures, so the sheet follows them. Over the grounded bottom plate the
# board's bottom face stands hardware.kb_spacer_l above it (the spacer at every mount);
# a tail and its solder may reach that, less boards.tail_clear, the body's own least air
# between a tail and what is under it - the margin is that figure, not a new one
# [calc: kb_spacer_l - tail_clear]. drc.echo 'through-hole tails under the main board
# clear of the bottom plate' holds the parts as supplied to the same tail_clear, so this
# is the limit on what the solder and an uncut tail add after it. Applies to the three
# hand parts whose tails are over the plate: J-MCU (J1) and J-CHAIN x2 (J4, J5). U-BUCK
# (U5) is cut to boards.tht_trim, its own figure (over a window to the oak). J-UMB (J6,
# past the plate's end) stands over oak, not the grounded plate, and clears it as
# supplied (drc.echo, the same line): no trim. HDR-SERVICE (J2) is surface mount since
# 2026-10-06 (owner): no tails. The
# thumb switches enter from below, so their tails are on the top face.
hand_trim:
  J1: {max: "hardware.kb_spacer_l - boards.tail_clear", why: "J-MCU, over the grounded bottom plate (#8-11)"}
  J4: {max: "hardware.kb_spacer_l - boards.tail_clear", why: "J-CHAIN (LH), over the grounded bottom plate (#8-11)"}
  J5: {max: "hardware.kb_spacer_l - boards.tail_clear", why: "J-CHAIN (RH), over the grounded bottom plate (#8-11)"}
  U5: {max: "boards.tht_trim", why: "U-BUCK, over its window to the oak: as supplied its pins reach the oak (drc.echo, through-hole tails)"}

silk:
  at: [105.5, 37.0]         # mid-board between the switch pairs; the old place, [100.0, 45.5], is the breath pair's since #8 (#33)
  title: "WOODY main board"
  rev: "A"                  # owner, 2026-10-03: rev A on the first board fabricated (README, Ordering it, Revision)
  date: "2026-11-21"
  # what plugs in, beside each connector (tools/pcb_silk.py, #54). J2, the service header, has
  # room for its reference and pin 1 mark only: from pin 1, TX, RX, GND (the service-uart sheet)
  names: {J1: "J-MCU", J4: "J-CHAIN LH", J5: "J-CHAIN RH", J6: "J-UMB", J7: "J-MIDI"}

# No router: `route: false` keeps tools/pcb.py from running one on this board
# (main_layout.py, ADR 0030).
route: false
