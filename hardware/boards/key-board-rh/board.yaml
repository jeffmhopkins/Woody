# One physical board. tools/board.py assembles board-netlist.yaml from this
# and the circuit netlists; tools/sch.py draws schematic.yaml's placement of it.
name: key-board-rh
title: "Right-hand key board (right_hand cluster, PCB-CLUSTER)"
pcb: PCB-CLUSTER
cluster: right_hand                 # its row in hardware/cluster/key-marker-and-bits/allocation.yaml
suffix: RH                  # appended to every refdes: R-KEY-PU-RH1 is key RH1's pull-up
connector: J-CHAIN-KEY-RH   # its pins and nets come from hardware/interfaces/key-chain-loom/netlist.yaml

# What key-register's ports are called on this board: the ribbon's own net
# names, so this board's nets read the same as the key-chain page's.
register_nets:
  CHAIN_SCK: CHAIN_SCK
  CHAIN_SHLD: CHAIN_SHLD
  CHAIN_SER: HOP_LT_RH          # SER in, ribbon conductor 6
  CHAIN_QH: HOP_RH_RT           # QH out, ribbon conductor 8
  V3V3_CHAIN: V3V3_CHAIN_RH  # after the main board's FB-CHAIN-RH
  GND_CHAIN: GND_CHAIN
