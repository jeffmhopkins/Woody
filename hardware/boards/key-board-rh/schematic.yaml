# PLACEMENT for the generated sheet of this board - tools/sch.py.
# Connectivity is board-netlist.yaml (itself generated by tools/board.py);
# this file says which symbol draws each part, which pin number each named pin
# is, and where it sits. Coordinates mm, y DOWN, [x, y, rotation].

name: key-board-rh
netlist: board-netlist.yaml
paper: A3
title:
  title: "Right-hand key board (PCB-CLUSTER, right_hand)"
  comment: "ADR 0001, ADR 0017 - one 74HC165, six key networks, two marker straps; ribbon to the main board"

power:
  V3V3_CHAIN_RH: +3V3
  GND_CHAIN: GND

# Both rails arrive over the ribbon from the main board (FB-CHAIN-RH), so on
# this sheet alone nothing drives them: PWR_FLAGs say where they come from.
supplied: [V3V3_CHAIN_RH, GND_CHAIN]
flags_at: [40.64, 210.82]

components:
  U-KEYS-RH:
    symbol: "74xx:74HC165"
    # Package pins, SOIC-16 [ds datasheets/logic/74HC165-ti-scls116e.pdf p.1,
    # D package pin-out], with the library's own name for each pin, which
    # tools/sch.py checks: the TI names (A..H, SH/LD, CLK INH) are the
    # library's D0..D7, ~PL, ~CE.
    pins:
      SHLD: [1, "~{PL}"]
      CLK: [2, "CP"]
      E: [3, "D4"]
      F: [4, "D5"]
      G: [5, "D6"]
      H: [6, "D7"]
      QH_BAR: [7, "~{Q7}"]
      GND: [8, "GND"]
      QH: [9, "Q7"]
      SER: [10, "DS"]
      A: [11, "D0"]
      B: [12, "D1"]
      C: [13, "D2"]
      D: [14, "D3"]
      CLKINH: [15, "~{CE}"]
      VCC: [16, "VCC"]
    at: [124.46, 132.08, 0]
  C-DECOUPLE-165-RH:
    symbol: "Device:C"
    at: [149.86, 99.06, 0]
  J-CHAIN:
    symbol: "Connector_Generic:Conn_01x12"
    value: "12-way FFC ZIF"
    # Key-board numbering: conductor k lands on pin 13-k (the part is mounted
    # upside down) - hardware/interfaces/key-chain-loom/key-chain-loom.md.
    at: [58.42, 132.08, 0]

wires:
  - [U-KEYS-RH.VCC, [124.46, 99.06], [149.86, 99.06], C-DECOUPLE-165-RH.1]

power_symbols:
  - {net: V3V3_CHAIN_RH, at: [124.46, 99.06]}

# One key network, written once. Node at the block origin: pull-up above,
# filter cap below, series resistor to the right, the switch after it.
repeat:
  - for: [RH1, RH2, RH3, RH4, RH5, RH6]
    at: [182.88, 132.08]
    step: [38.1, 0]
    components:
      "R-KEY-PU-{k}":  {symbol: "Device:R", at: [0, -10.16, 0]}
      "C-KEY-{k}":     {symbol: "Device:C", at: [0, 10.16, 0]}
      "R-KEY-SER-{k}": {symbol: "Device:R", at: [7.62, 0, 90]}
      "SW-{k}":        {symbol: "Switch:SW_Push", at: [19.05, 7.62, 270]}
    wires:
      - ["R-KEY-PU-{k}.2", [0, 0], "C-KEY-{k}.1"]
      - [[-7.62, 0], [0, 0], "R-KEY-SER-{k}.1"]
      - ["R-KEY-SER-{k}.2", [19.05, 0], "SW-{k}.1"]
    labels:
      - {net: "KEY_{k}", at: [-7.62, 0], dir: left}
      - {net: "SW_{k}", at: [12.7, 0], dir: right}

notes:
  - at: [40.64, 243.84]
    text: "Every key: R-KEY-PU pulls the register input to 3V3, C-KEY and R-KEY-SER filter it, the switch pulls it to ground.\nInputs B and A are the marker straps (0 and 1): tied straight to the rails, no parts.\nThe register's inputs, allocation and marker levels: hardware/cluster/key-marker-and-bits/allocation.yaml."
