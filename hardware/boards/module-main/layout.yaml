  at: [27.0, 112.0]
  title: "WOODY module main board"
  rev: "A"
  date: "2026-10-02"

# Routing as the controller's main board, on three layers: the pair, the guard's via,
# every plane net's fanout and connect_first: first (pcb_route.prepare); then every
# signal connection by pcb_route.complete, one preferred direction per layer - layer 1
# along the board (the module's long axis, vertical in KiCad), layer 3 across it,
# layer 4 along it - a via at each turn, a step against a layer's direction costing
# against_cost; rip-up where it is boxed in. Freerouting (route: astar) takes no
# layer direction in batch: an autoroute_settings scope with per-layer directions made
# it route nothing on this board (2026-10-02, as on the controller's, tooling.md §4).
route: astar
rip_up: 0
directions:
  layers: {F.Cu: vertical, In2.Cu: horizontal, B.Cu: vertical}
  against_cost: 6.0
  chamfer: 0.6
no_rescue: true
