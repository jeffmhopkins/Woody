# FIRST-LAYOUT INPUT for the module main board's PCB - tools/pcb.py layout, `kind: module`
# (tools/pcb_module.py). Once the .kicad_pcb exists it is the source; this file
# records how the first layout was made.

kind: module
cluster: module-main
outline: main-board.dxf
layers: 4

rules:
  track: 0.25
  track_min: 0.2
  clearance: 0.2
  via: 0.7
  via_drill: 0.3
  via_min: 0.66
  drill_min: 0.3
  edge_clearance: 0.5
  power_track: 0.4

fab:
  house: JLCPCB
  hole_clearance: 0.28
  hole_to_hole: 0.45
  annular_min: 0.18
  silk_text_min: 1.0
  silk_line_min: 0.15
  silk_to_pad: 0.15
  finish: "HAL lead-free"
  mask: Green
  silk: White
  copper_oz: 1

stackup:
  name: JLC04161H-7628
  outer_cu: 0.035
  inner_cu: 0.0152
  prepreg: {thickness: 0.2104, material: "7628", epsilon_r: 4.4}
  core: {thickness: 1.065, material: FR4, epsilon_r: 4.6}

not_on_board:
  D16: "LED-PANEL: panel-mounted, its lead plugs into J-LED-PANEL (J4); no footprint"

mounts:
  footprint: "MountingHole:MountingHole_3.2mm_M3_Pad"
  net: null

connectors:
  J-UMBILICAL: {row: J-UMBILICAL}
  J-B2B-MOD: {row: J-B2B-MOD}
  J-LED-PANEL: {row: J-LED-PANEL}
  J-PWR-EURO: {row: J-PWR-EURO, side: rear, odd_column: -1}

cad_tall:
  U-ISO: {row: U-ISO, pins: ["1", "2", "4", "5", "6"]}

b2b:
  other: hardware/boards/module-jack

parts:
  L2:  [38.15, 61.6, 0, rear]
  RV1: [14.0, 95.0, 0, rear]
  RV2: [25.25, 95.0, 0, rear]
  RV3: [36.5, 95.0, 0, rear]
  RV4: [46.0, 95.0, 0, rear]
  SW1: [20.0, 44.6, 0]
  C44: [14.2, 43.2, 0]
  C46: [8.9, 40.44, 180]
  U3:  [6.0, 50.0, 90]
  U4:  [15.0, 52.5, 90]
  U15: [30.0, 18.0, 0, rear]
  U2:  [8.0, 24.0, 0, rear]
  Q1:  [15.0, 31.0, 0, rear]
  C2:  [40.5, 52.0, 0]
  U6:  [9.0, 71.0, 0, rear]
  U5:  [9.0, 81.0, 0, rear]
  U11: [5.5, 67.5, 0]
  U10: [14.5, 67.5, 0]
  U7:  [14.5, 79.5, 0]
  U12: [36.0, 67.0, 0]
  RN1: [34.0, 80.0, 0]
  U9:  [42.0, 80.0, 0]
  U8:  [38.0, 104.0, 0, rear]
  U1:  [40.0, 104.0, 0]
