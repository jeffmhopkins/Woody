# THE LAYERS (hardware/module/power-entry/power-entry.md, Grounding): "Layers 1 and 3
# carry parts and signals; the analog rails route on layer 3 over the analog region."
# Layer 2 is the one plane: AGND_MOD under the analog block, with DIG_GND as an island.
# Layer 3 is a routing layer - signals, and the analog +12 V and -12 V as tracks
# (net_classes:). Layer 4 carries the rear parts, signals, and PWR_GND, the isolated
# return, as its own copper (pours: below). (Laid out first with +12 V as a layer-3
# plane, two routing layers did not complete the board: 2026-10-02, 50-60 connections
# left by both routers.)
planes:
  - {layer: In1.Cu, net: AGND_MOD}

# DIG_GND on layer 2: the lower left of the board (frame mm) - under the etherCON's
# contacts and the receiver on the rear, the isolated load switch on the rear, and
# up the left under U-LVL-MOD to the DAC, whose moat runs across U-DAC between its
# digital pins (1, 2, 15, 16, toward the island) and its analog ones, GND (14) on
# AGND_MOD: the datasheet's split [ds DAC8568CIPW.pdf p.49]. Its right edge stops
# short of J-PWR-EURO, where the star is: NT-DIG-MOD (NT2) straddles the moat there,
# NT-AGND-MOD (NT1) beside it on the AGND side, both to the bus ground pins. Its
# other tie is NT-UMB-MOD (NT3) at the etherCON's pins 6 and 8, to PWR_GND (ADR 0027).
islands:
  - net: DIG_GND
    layer: In1.Cu
    ties: [NT2, NT3]
    moat: 0.5
    tie_window: 4.5
    # U-DAC straddles the moat (its digital pins on the island, GND on AGND_MOD): the
    # moat's 0.5 mm is wider than the 0.21 mm between its pin rows' pads, so the layer-1
    # keep-out over the moat is opened round it for its pins' escapes, as round a tie
    windows: [[9.1, 56.5, 4.5]]
    outline: [[1.0, 10.0], [38.5, 10.0], [38.5, 37.6], [24.0, 37.6], [24.0, 56.25], [1.0, 56.25]]
    # J-LED-PANEL's pin 2 is the LED's return to AGND_MOD (panel-led.md: the module CAD
    # puts the header here, over the island); its pad stands in the island's copper with
    # its own clearance, joined to AGND_MOD by a track
    foreign_ok: {J4.2: "the panel LED's return: AGND_MOD by design (panel-led.md); J-LED-PANEL's place is the module CAD's"}

# PWR_GND on layer 4 (power-entry.md, Grounding): under U-ISO's body and round the
# load switch on the rear, joined by a strip at the board's left edge that keeps the
# isolation gap (isolation:, below) from U-ISO's input pins.
pours:
  - {net: PWR_GND, layer: B.Cu, outline: [[1.0, 17.0], [16.0, 17.0], [16.0, 37.6], [8.5, 37.6], [8.5, 43.6], [27.0, 43.6], [27.0, 63.6], [1.0, 63.6]]}

# U-ISO's barrier (ADR 0027): its input side - the filter after L-ISO-IN and the
# converter's input pins - and its output side - the isolated +12 V, its return and
# the load switch - keep this far apart on every layer. 2.0 mm is a FUNCTIONAL gap,
# not a safety rating [from memory]: both sides are SELV (+-12 V), and they are
# DC-tied at the etherCON and the star (NT3, NT2); what it keeps small is the stray
# capacitance across the converter that L-CM-ISO and C-ISO-Y exist to manage.
# C-ISO-Y (C46) bridges it by design.
isolation:
  gap: 2.0
  input: [ISO_VIN_POS, ISO_VIN_NEG, ISO_FILT_POS, ISO_FILT_NEG]
  output: [ISO_POS12, PWR_GND, UMBILICAL_POS12, ON, ON_SW, FB, GATE_DRIVE, GATE_NODE, SENSE_NODE, TIMER, GATE_COMP_MID]
  bridge: [C46]

# THE BREATH PAIR (breath-receive-stage.md: the in-amp's input pair symmetric):
# BREATH_SENSE and AGND_SENSE from the etherCON's pins 1 and 2 side by side on the
# rear to the receive stage's series resistors, up the board's left edge.
pairs:
  - nets: [/BREATH_SENSE, /AGND_SENSE]
    from: [J3.1, J3.2]
    to: [R17.1, R16.1]
    layer: B.Cu
    width: 0.25
    gap: 0.25
    through: [[18.5, 31.0], [2.3, 40.0], [2.3, 96.0]]

# Net classes [calc, as the controller's main board, IPC-2221 outer 1 oz 10 C]: the
# instrument's supply - ISO_POS12, PWR_GND, UMBILICAL_POS12, up to the LT1641's
# 1.10 A worst-case trip (umbilical-load-switch.md) - 0.34 mm, so 0.5; U-ISO's input
# (~0.37 A per rail, clamp-legal, power-entry.md) and the bus rails 0.5; -12 V to the
# analog block (module-own-draw, tens of mA) 0.4; DAC_AVDD and LOGIC_5V (a few mA) 0.3.
net_classes:
  supply:
    nets: [ISO_POS12, PWR_GND, /UMBILICAL_POS12, /umbilical-load-switch/SENSE_NODE,
           /power-entry/BUS_POS12_RAW, /power-entry/BUS_NEG12_RAW,
           /power-entry/POS12_PTC1, /power-entry/POS12_PTC2, /power-entry/NEG12_PTC3,
           /power-entry/POS12_D1, /power-entry/POS12_D2, /power-entry/NEG12_D4, /power-entry/NEG12_FB,
           /power-entry/ISO_FB2, /power-entry/ISO_FILT_POS, /power-entry/ISO_FILT_NEG,
           /power-entry/ISO_VIN_POS, /power-entry/ISO_VIN_NEG]
    track: 0.5
  rail12:
    nets: [MODULE_ANALOG_POS12, MODULE_ANALOG_NEG12]
    track: 0.4
  rails_low:
    nets: [/DAC_AVDD, LOGIC_5V]
    track: 0.3
  plane_nets:
    nets: [AGND_MOD, DIG_GND]
    track: 0.4

fanout: [AGND_MOD, DIG_GND, PWR_GND]

# The fine-pitch parts (pcb_route.escape): a stub out of each pad before the grid
# router, which cannot start from inside a 0.5 or 0.65 mm row - U-REG-DAC (MSOP-10),
# U-DAC (TSSOP-16), R-PRECISION (MSOP-8).
escape: [U1, U3, RN1]

# Each by its own track, routed first and held by check (power-entry.md, The DAC rail,
# Layout): OUTS Kelvin to C-REG-OUT; R-SET-DAC's and C-SET-DAC's grounds to
# C-REG-OUT's; U-LVL-MOD's DAC_AVDD on its own branch from C-REG-OUT, not through the
# DAC's pin (The DAC rail's load); the DAC's own.
connect_first:
  - {pads: [U1.9, C6.1], max_mm: 6, why: "OUTS Kelvin to C-REG-OUT (power-entry.md)"}
  - {pads: [R1.2, C6.2], max_mm: 8, why: "R-SET-DAC's ground to C-REG-OUT's (power-entry.md)"}
  - {pads: [C5.2, C6.2], max_mm: 8, why: "C-SET-DAC's ground to C-REG-OUT's (power-entry.md)"}
  - {pads: [U2.8, R3.1], max_mm: 8, why: "LT1641 VCC Kelvin to R-ILIM's pad (umbilical-load-switch.md, 164112fc p.10)"}
  - {pads: [U2.7, R3.2], max_mm: 8, why: "LT1641 SENSE Kelvin to R-ILIM's pad (umbilical-load-switch.md, 164112fc p.10)"}
  - {pads: [C6.1, U3.3], max_mm: 120, why: "the DAC's AVDD on its own branch from C-REG-OUT (power-entry.md, The DAC rail's load)"}
  - {pads: [C6.1, U4.14], max_mm: 120, why: "U-LVL-MOD's VCC on its own branch from C-REG-OUT, not through the DAC's pin (power-entry.md)"}

# THE SET GUARD (power-entry.md, The DAC rail, Layout: "a guard ring round SET at
# OUT's potential, both sides"): DAC_AVDD copper round R-SET-DAC (R1), C-SET-DAC (C5)
# and U-REG-DAC's SET pin on both outer layers, filled round the SET node with the
# clearance and joined to OUT/OUTS (pins 9, 10) on the front and by its via behind.
guards:
  - net: /DAC_AVDD
    layers: [F.Cu, B.Cu]
    outline: [[27.4, 98.6], [33.4, 98.6], [33.4, 105.4], [27.4, 105.4]]
    vias: [[32.9, 105.0]]

# How tall each footprint family stands (pcb_module.check_heights), each with its
# source. Rooms: the front face is the main board's setback behind the panel, 18.3
# [repo mechanical/module/drc.echo, stack depths]; the rear, the case's 45.5
# [repo config/module.yaml case.depth_max] less the board's rear face at 19.9 = 25.6
# [calc]. The module CAD's keep-outs with a height (under the jack board, under the
# toggle's lugs and the LED, over the ribbon's fold) are tighter where they apply.
rooms: {front: 18.3, rear: 25.6}
heights:
