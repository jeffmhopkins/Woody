# FIRST-LAYOUT INPUT for the module main board's PCB - tools/pcb.py layout, `kind: module`
# (tools/pcb_module.py). Once the .kicad_pcb exists it is the source; this file
# records how the first layout was made.

kind: module
cluster: module-main
outline: main-board.dxf
layers: 4

rules:
  track: 0.25
  track_min: 0.2
  clearance: 0.2
  via: 0.7
  via_drill: 0.3
  via_min: 0.66
  drill_min: 0.3
  edge_clearance: 0.5
  power_track: 0.4

fab:
  house: JLCPCB
  hole_clearance: 0.28
  hole_to_hole: 0.45
  annular_min: 0.18
  silk_text_min: 1.0
  silk_line_min: 0.15
  silk_to_pad: 0.15
  finish: "HAL lead-free"
  mask: Green
  silk: White
  copper_oz: 1

stackup:
  name: JLC04161H-7628
  outer_cu: 0.035
  inner_cu: 0.0152
  prepreg: {thickness: 0.2104, material: "7628", epsilon_r: 4.4}
  core: {thickness: 1.065, material: FR4, epsilon_r: 4.6}

not_on_board:
