# AUTHORITATIVE for connectivity - and this circuit is mostly COPPER.
#
# The marker straps are traces to a rail: two per device, one high and one
# low, eight across the four boards, and not one of them is a part. The free
# bits are an R-KEY-PU and nothing else - no switch, no series resistor, no
# capacitor. So there are three components here and eight strap connections
# with no component to hang on.
#
# AND THEIR FAR ENDS ARE PER BOARD. Which of a device's A..H carries a marker
# is different on every board - the allocation table on this page has four
# different rows - so the strap ends and the pull-up ends cannot be named in a
# file shared by all four. hardware/nets.yaml marks MARKER_BITS and KEY_BITS
# `per_board:` and check-netlist prints both on every run.

circuit: cluster/key-marker-and-bits
title: Marker straps and free bits
page: key-marker-and-bits.md

ports:
  V3V3_CHAIN: {dir: in,  from: interfaces/key-chain-loom, figure: key-pullup-qty}

# NO GND_CHAIN PORT, and that is a correction. This file used to declare one and
# use it in a net called MARKER_LOW whose only endpoint WAS that port - a second
# name for a node, not a net, and the same for MARKER_HIGH against V3V3_CHAIN.
# The four low straps really do join GND_CHAIN to a register input, but the
# input is per-board and unassertable, so the connection lives inside the
# KEY_BITS/MARKER_BITS `per_board:` gap that check-netlist prints on every run
# rather than being a second, separate omission here.

components:

  R-KEY-PU-FREE1:
    of: R-KEY-PU
    value: "2k2 1%"
    pins: [1, 2]
    note: "One of the three FREE bits. The same part the key networks use, and the reason 'free' bits are not free: each one costs the same static draw as a key"

  R-KEY-PU-FREE2:
    of: R-KEY-PU
    value: "2k2 1%"
    pins: [1, 2]

  R-KEY-PU-FREE3:
    of: R-KEY-PU
    value: "2k2 1%"
    pins: [1, 2]

nets:

  V3V3_CHAIN:
    - port: V3V3_CHAIN
    - R-KEY-PU-FREE1.1
    - R-KEY-PU-FREE2.1
    - R-KEY-PU-FREE3.1

  # THE EIGHT STRAPS ARE NOT HERE. Four join V3V3_CHAIN and four join
  # GND_CHAIN to a register input, they are copper with no part, and the input
  # they land on is per-board - so there is nothing this file can name. What
  # makes them a framing check rather than a second opinion about the same
  # parts is that they touch the rails DIRECTLY and share no component with the
  # key networks they vouch for; and the fact that distinguishes all four
  # boards is the marker LEVEL map, not the input map.

  FREE_BIT_1:
    - R-KEY-PU-FREE1.2
  FREE_BIT_2:
    - R-KEY-PU-FREE2.2
  FREE_BIT_3:
    - R-KEY-PU-FREE3.2

external_endpoints:
  - FREE_BIT_1
  - FREE_BIT_2
  - FREE_BIT_3
