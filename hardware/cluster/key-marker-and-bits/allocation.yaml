# THE 32-BIT ALLOCATION AS DATA - what each 74HC165 parallel input carries.
#
# Owned by this circuit (key-marker-and-bits.md §4 argues it; its table is a
# REPRESENTATION of this file, and tools/board.py fails if the two disagree).
# tools/board.py reads it to assemble each board's netlist, so a key moved
# here moves on the generated board schematics too.
#
# One row per register in chain order (config/key-layout.yaml `chain`), each
# row listed H G F E D C B A - H is the first bit out of each device.
#
#   RH1 ...   a switch position: a full R-KEY-PU / R-KEY-SER / C-KEY network
#             and the switch (key ids from config/key-layout.yaml)
#   sw+ sw-   a reserved spare-switch position: the full network, switch not
#             fitted (config/key-layout.yaml spare_bits_switches)
#   M0 M1     a marker strap, straight to GND (0) or to the chain's 3V3 (1)
#   FREEn     a free bit: R-KEY-PU-FREEn only (key-marker-and-bits/netlist.yaml)

order: [H, G, F, E, D, C, B, A]

registers:
  right_thumb: [RT1, RT2, RT3, RT4, sw+, sw-, M1, M0]
  right_hand:  [RH1, RH2, RH3, RH4, RH5, RH6, M0, M1]
  left_thumb:  [LT1, LT2, LT3, LT4, M0, M1, FREE1, FREE2]
  left_hand:   [LH1, LH2, LH3, LH4, LH5, M0, M1, FREE3]
