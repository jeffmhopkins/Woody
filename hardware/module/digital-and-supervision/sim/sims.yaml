# The module's logic power: LOGIC_5V (U-REG-LOGIC, this circuit's supply) against DAC_AVDD
# (U-REG-DAC, the DAC8568's), at rack power-on and power-off, and what the SPI buffer's
# SYNC output does to the DAC's SYNC pin while the two rails disagree. Values from the
# three netlists the path runs through: module/power-entry (both regulators and their
# parts), this circuit (R-PULL-CS, R-RX-CS, C-RX-CS, R-PULL-SYNC) and module/dac8568. Run:
#   python3 tools/sim.py run hardware/module/digital-and-supervision/sim
#
# THE QUESTION. The DAC8568's datasheet: "No device pin should be brought high before power
# is applied to the device" [ds DAC8568CIPW.pdf p.31], and its absolute maximum for a
# digital input is AVDD + 0.3 V [p.2]. SYNC idles HIGH - CS_MOD is pulled up at both ends,
# and U-LVL-MOD (74AHCT125) drives it from LOGIC_5V - while the DAC's supply is a separate
# regulator with a slower start (C-REG-ADJ) and a 1.7 V larger dropout. Nothing in the
# corpus states the order the two rails arrive or leave in.
title: Module logic power - LOGIC_5V against DAC_AVDD, and SYNC at the DAC
values:
  netlist:
    - hardware/module/power-entry/netlist.yaml
    - hardware/module/digital-and-supervision/netlist.yaml
    - hardware/module/dac8568/netlist.yaml
models:
  - datasheets/discrete-and-power/LM317L-ti-pspice-snvmaw3.lib
# the bus, the 1N5817 fit, the PTC, the bead, the module's analog load and the DAC's supply
# current are module/power-entry/sim's, stated once there
params_from: [hardware/module/power-entry/sim/sims.yaml]
spiceinit: [set ngbehavior=psa]

params:
  t_off:      {value: 60.0e-3, source: "the bus switches off here: DAC_AVDD has settled by ~15 ms (power-entry/sim, as-netlisted, t_avdd_floor)"}
  t_fall:     {value: 1.0e-3, source: "the bus falling at switch-off [assumption]. Not swept: once the bus is below the module's +12 V node D1 blocks, and the node decays on C1 and the module's own load whatever the bus does"}
  t_end:      {value: 90.0e-3, source: "30 ms after switch-off the +12 V node is near 2.7 V, under every threshold in question; TI's LM317L model stops converging a few ms later, with its input near 2 V"}
  # --- U-REG-LOGIC, ADP7118AUJZ-5.0, BEHAVIOURAL [datasheets/discrete-and-power/ADI-ADP7118.pdf]
  v_out_ldo:  {value: 5.0, source: "the fixed 5.0 V option [ds p.1, ordering guide]"}
  v_uvlo:     {value: 2.69, source: "UVLO rising, max 2.69 V [ds p.3]; falling 2.2 V min - the hysteresis is left out, so the model turns off 0.5 V late on the way down (the conservative side here: LOGIC_5V stays up longer)"}
  t_ss:       {value: 380.0e-6, source: "start-up time, EN rising to 90 % of VOUT, 380 us typ at VOUT = 5 V with SS open; the TSOT package has no SS pin [ds p.3, p.15]. A linear soft start over t_ss (vary)"}
  i_lim:      {value: 0.25, source: "current limit, 250 mA min (360 typ) [ds p.3]"}
  v_do:       {value: 0.06, source: "dropout, 60 mV max at 10 mA [ds p.3]"}
  gm_ldo:     {value: 10.0, source: "the pass element's error gain, A/V [assumption: stiff; the regulation loop's dynamics are not the question]"}
  r_logic:    {value: 770.0, source: "LOGIC_5V's load, about 6.5 mA at 5 V [repo, power-entry.md 'The logic 5 V', the Load row: 5.0 / 6.5 mA]; a resistance so it is off until the rail arrives (tooling.md section 5)"}
  # --- U-LVL-MOD (74AHCT125), BEHAVIOURAL
  r_oh:       {value: 50.0, source: "the 74AHCT125's high-side output resistance: (4.5 - 3.94) V / 8 mA = 70 ohm at 25 C, (4.5 - 3.8) / 8 mA = 87 ohm over temperature [calc, ds SN74AHCT125.pdf p.3]; less at typical (vary 25-87)"}
  k_avdd:     {value: 0, source: "0: U-LVL-MOD's VCC on LOGIC_5V, as netlisted; 1: a WHAT-IF with it on DAC_AVDD (its supply current, part of the logic load, is not moved with it)"}
  r_ser:      {value: 1.0e-3, source: "a WHAT-IF series resistor at the DAC's SYNC pin; 1 mohm is none, as netlisted"}
  # --- the DAC8568's SYNC pin, BEHAVIOURAL
  c_pin:      {value: 3.0e-12, source: "DAC8568 logic input pin capacitance, 3 pF max [ds DAC8568CIPW.pdf p.4]"}
  is_esd:     {value: 1.0e-14, source: "the pin's ESD diode to AVDD: NOT PUBLISHED. A small on-chip junction [assumption] (vary over three decades): it sets how far over AVDD the pin sits while it conducts, not whether it conducts"}
  rs_esd:     {value: 10.0, source: "its series resistance [assumption]"}

derived:
  t_up_end: "1e-6 + v['t_rise']"
  t_off_end: "v['t_off'] + v['t_fall']"
  i_ss: "v['v_out_ldo'] * 1e-9 / v['t_ss']"

vary:
  r_oh:   {tol: [-0.5, 0.74]}
  t_ss:   {tol: [-0.5, 1.0]}
  is_esd: {tol: [-0.9, 99.0]}

sims:
  - name: rails-and-sync
    # As netlisted, no instrument on the cable (CS_MOD held up by R-PULL-CS alone; with an
    # instrument it is also held up, to 3.3 V, so SYNC is high either way). Power-on, a
    # 60 ms hold, power-off.
    deck: seq.cir
    measures: [t_l5_up, t_avdd_up, over_on, over_off, i_esd_on, i_esd_off, t_over_on, avdd_on_lift, l5_final, avdd_final]
    post:
      # when each rail reaches 4.5 V on the way up (the 74AHCT parts' VCC minimum)
      t_l5_up: "cross(w['l5'], 4.5, 0)"
      t_avdd_up: "cross(w['avdd'], 4.5, 0)"
      # SYNC's excursion over DAC_AVDD, on and off; the DAC's abs max is +0.3 V
      over_on: "peak(w['over'], 0, p['t_off'])"
      over_off: "peak(w['over'], p['t_off'], p['t_end'])"
      i_esd_on: "peak(w['iesd'], 0, p['t_off'])"
      i_esd_off: "peak(w['iesd'], p['t_off'], p['t_end'])"
      # how long SYNC sits more than 0.3 V over DAC_AVDD at power-on
      t_over_on: "(cross(w['over'], 0.3, cross(w['over'], 0.3, 0) + 1e-6) - cross(w['over'], 0.3, 0)) if cross(w['over'], 0.3, 0) < p['t_off'] else 0.0"
      # DAC_AVDD while SYNC is back-feeding it, against the rail it would otherwise be: the
      # largest value it reaches before U-REG-DAC alone could have put it there is not
      # separable in one run, so this is DAC_AVDD at the moment LOGIC_5V is first at 4.5 V
      avdd_on_lift: "at(w['avdd'], cross(w['l5'], 4.5, 0))"
      l5_final: "at(w['l5'], p['t_off'] - 1e-3)"
      avdd_final: "at(w['avdd'], p['t_off'] - 1e-3)"
    asserts:
      - expr: "min['l5_final'] > 4.9 and max['l5_final'] < 5.1 and min['avdd_final'] >= 5.0"
        why: "both rails settle where their pages say: LOGIC_5V at the ADP7118's 5.0 V, DAC_AVDD at or over dac-rail's 5.00 V floor, at every corner"
      - expr: "max['t_l5_up'] < min['t_avdd_up']"
        why: "RECORDED FINDING (2026-10-01): LOGIC_5V arrives first at every corner - the ADP7118's 380 us soft start against the LM317L's C-REG-ADJ start of milliseconds"
      - expr: "min['over_on'] > 0.3 and min['over_off'] > 0.3"
        why: "RECORDED FINDING, OPEN FOR THE OWNER (2026-10-01): at power-on SYNC is driven high from LOGIC_5V while DAC_AVDD is still rising, and the DAC's SYNC pin sits past its AVDD + 0.3 V absolute maximum [ds DAC8568CIPW.pdf p.2] at every corner, conducting into DAC_AVDD through its input protection (tens of mA, i_esd_on) for most of 10 ms; and again at power-off, where the LM317L's larger dropout lets DAC_AVDD fall first - the datasheet's 'no device pin should be brought high before power is applied' [p.31]. digital-and-supervision.md, 'Still open'. When the design changes this assertion fails, and is rewritten as the requirement"
  - name: what-if-lvl-on-avdd
    # A WHAT-IF, not the netlist: U-LVL-MOD's VCC moved to DAC_AVDD. Its outputs can then
    # never sit over the DAC's supply; U-RX-MOD stays on LOGIC_5V (the 74AHCT125's inputs
    # have no clamp to VCC, so a 5 V high into it while DAC_AVDD is low is in its rating)
    deck: seq.cir
    set: {k_avdd: 1}
    measures: [over_on, over_off, i_esd_on, i_esd_off]
    post: &wpost
      over_on: "peak(w['over'], 0, p['t_off'])"
      over_off: "peak(w['over'], p['t_off'], p['t_end'])"
      i_esd_on: "peak(w['iesd'], 0, p['t_off'])"
      i_esd_off: "peak(w['iesd'], p['t_off'], p['t_end'])"
    asserts:
      - expr: "max['over_on'] < 0.3 and max['over_off'] < 0.3"
        why: "WHAT-IF: with the buffer on the DAC's own rail SYNC stays inside the DAC's AVDD + 0.3 V at every corner, on and off - one option that closes the finding"
  - name: what-if-series-2k2
    # A WHAT-IF: 2.2 kohm in series at the DAC input, the rails as netlisted. Limits the
    # current the pin's protection takes; does not keep the pin under AVDD + 0.3 V
    deck: seq.cir
    set: {r_ser: 2200}
    measures: [over_on, over_off, i_esd_on, i_esd_off]
    post: *wpost
