# The panel LED: its current across U-ISO's output tolerance and the LED's forward-voltage
# spread, how it comes on as the load switch's output rises, and what its return does to the
# pitch reference while the instrument's current follows the breath. Values from this
# circuit's netlist (R-LED-PANEL) and module/umbilical-load-switch's (R-ILIM); the
# instrument's current and the breath are module/power-entry/sim's (params_from). Run:
#   python3 tools/sim.py run hardware/module/panel-led/sim
#
# THE CLAIMS. panel-led.md: about 4.1-4.5 mA, (12.0 - 3.0 V) / 2.2 kohm to (12.0 - 2.0 V) /
# 2.2 kohm across the two catalogues' V_F, and the LED lights as the output passes 2-3 V.
# power-entry.md, grounding: what NT-DIG-MOD carries is "constant and the module's own - ...
# the panel LED's current the other way". The LED is NOT on the -12 V rail: it hangs on
# UMBILICAL_POS12 and returns to the MAIN board's AGND_MOD through J-LED-PANEL (ADR 0024
# point 16: a panel-mount indicator on a lead), so its return does not cross J-B2B-MOD.
title: Panel LED - its current and its start
values:
  netlist:
    - hardware/module/panel-led/netlist.yaml
    - hardware/module/umbilical-load-switch/netlist.yaml
params_from: [hardware/module/power-entry/sim/sims.yaml]

params:
  v_set:    {value: 12.0, source: "U-ISO's output, 12 V, +-3.1 % over 40 K: accuracy 2.0 %, line 0.2 %, load 0.1 %, 0.02 %/K [repo, power-entry.md U-ISO table; ds RECOM-RPA20-AW.pdf PD-2, PD-5] (vary)"}
  r_fet:    {value: 0.002, source: "Q-LOADSW (PSMN2R0-30YLE) on-resistance, 2 mohm max at VGS 10 V, 25 C [ds NEXPERIA-PSMN2R0-30YLE.pdf p.1]"}
  # LED-PANEL, Dialight 605-2211-110F, green, BEHAVIOURAL. NEITHER BANKED CATALOGUE GIVES A
  # CURVE: 2 V at 15 mA [ds DIALIGHT-605-SERIES-PMI-CATALOG-2021-EXCERPT.pdf] and 3 V at 20 mA
  # [ds DIALIGHT-605-SERIES-PMI-CATALOG-2026-EXCERPT.pdf p.2], one typical figure each. So the
  # SHAPE is a GaP green junction's, kept from this circuit's previous LED: n = 2, Rs and Is
  # fitted to 2.1 V at 20 mA and a ~0.2 V rise from 5 to 20 mA [calc: nVt = 0.0514 V;
  # 0.2 = 0.0514 ln 4 + 0.015 Rs -> Rs = 8.6 ohm; 2.1 = 0.0514 ln(0.02/Is) + 0.02 x 8.6 ->
  # Is = 1.0e-18 A] - and vf20 SHIFTS it across both catalogues' V_F.
  led_n:    {value: 2.0}
  led_rs:   {value: 8.6}
  led_is:   {value: 1.0e-18}
  vf20:     {value: 3.0, source: "VF at 20 mA: 3 V typ in the 2026 catalogue, 2 V at 15 mA in the 2021 one, no maximum in either [ds Dialight 605 pages]. Applied as a shift of the fitted curve (vary 2.0-3.4 V: the older figure, to the newer plus 0.4 V for a maximum neither gives)"}
  t_b:      {value: 1.0}

derived:
  v_iso_out: "v['v_set']"
  r_switch: "v['R-ILIM'] + v['r_fet']"
  vf_shift: "v['vf20'] - 2.1"

vary:
  v_set:  {tol: [-0.031, 0.031]}
  vf20:   {tol: [-0.333, 0.133]}
  R-LED-PANEL: {tol: from-value}

sims:
  - name: led
    deck: led.cir
    sweep: {i_swing: [0.195, 0.367]}
    measures: [i_led, i_led_pp, v_on_100u, v_on_1m]
    post:
      i_led: "at(w['iled'], 0.0)"
      i_led_pp: "peak(w['iled'], 0, p['t_b']) - trough(w['iled'], 0, p['t_b'])"
      # the start: the output voltage at which the LED passes 0.1 mA (just visible) and 1 mA
      v_on_100u: "cross(w['start'], 1e-4, 0)"
      v_on_1m: "cross(w['start'], 1e-3, 0)"
    asserts:
      - expr: "min['i_led'] > 3.5e-3 and max['i_led'] < 5.0e-3"
        why: "panel-led.md's 4.1-4.5 mA holds over U-ISO's +-3.1 %, R-LED-PANEL's 1 % and both catalogues' V_F: under 0.6 % of the 940 mA umbilical limit, and inside either catalogue's operating current (15 or 20 mA) [ds Dialight 605 pages]"
      - expr: "min['v_on_100u'] > 1.5 and max['v_on_100u'] < 3.6"
        why: "panel-led.md 'lights as the output passes 2-3 V': the LED reaches 0.1 mA with the output between 1.5 and 3.6 V at every corner"
  # The return across J-B2B-MOD is not simulated: the LED's current returns through
  # J-LED-PANEL to the main board's AGND_MOD and never crosses that header (ADR 0024 points 15
  # and 16). What it does to NT-DIG-MOD is power-entry/sim's.
