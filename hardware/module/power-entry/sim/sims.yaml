# Rack power-on at the module: the rails, the DAC's supply, and the pitch jack while
# they come up - "five power-on claims across three pages, no transient anywhere in the
# corpus" (docs/reference/pcb-pipeline.md, section 2, ranked sim 4). Values from the
# netlists of the two circuits the deck spans. Run:
#   python3 tools/sim.py run hardware/module/power-entry/sim
title: Module power-on - rails, DAC_AVDD and the pitch jack
values:
  netlist:
    - hardware/module/power-entry/netlist.yaml
    - hardware/module/pitch-stage/netlist.yaml
    - hardware/module/mod-channels/netlist.yaml
    - hardware/module/breath-output-stage/netlist.yaml
    - hardware/module/umbilical-load-switch/netlist.yaml
    - hardware/carrier/power-entry-instrument/netlist.yaml
    # the LEDs' count (n:D-LED), for ledpwm.cir
    - hardware/carrier/led-strip-drive/netlist.yaml
# ledpwm.cir runs the instrument's side as power-entry-instrument/sim does: its cable, load
# switch, U-ISO output resistance and capacitor ESRs are that sim's params (and the load
# switch's, which it imports), not restated here
params_from: [hardware/module/umbilical-load-switch/sim/sims.yaml, hardware/carrier/power-entry-instrument/sim/sims.yaml]
models:
  - datasheets/analog/OPAx197-ti-pspice-sboma34d.lib
include: [hardware/module/pitch-stage/sim/pitch-stage.lib, lt3042.lib]
spiceinit: [set ngbehavior=psa]

params:
  v_bus:      {value: 12.0}
  v_bus_neg:  {value: -12.0}
  t_rise:     {value: 2.0e-3, source: "the bus rising [assumption: a rack PSU's soft start is slower]"}
  dt_neg:     {value: 0.0, source: "the -12 V rail's delay behind +12 V, negative if it leads (swept: a PSU brings its rails up in no promised order)"}
  t_end:      {value: 100.0e-3, source: "C-SET-DAC's soft start makes DAC_AVDD settle over tens of ms"}
  r_fb:       {value: 0.1, source: "FB-IN's DC resistance [assumption: the netlist value '600R @ 100MHz' is not a DC figure]"}
  r_load_pos: {value: 200.0, source: "the module's +12 V analog load, 60 mA [assumption: no figure registers it]"}
  r_load_neg: {value: 200.0, source: "the -12 V analog load, 60 mA [assumption]"}
  r_vco:      {value: 100.0e3, source: "one VCO input [assumption, as pitch-stage/sim]"}
  # 1N5817, BEHAVIOURAL: n = 1.1 chosen, Rs and Is fitted to the two points the D-REVPOL
  # row digitised off the banked curve (0.24 V at 245 mA, 0.36 V at 612 mA) [calc:
  # nVt = 0.0284 V; 0.12 = 0.0284 ln(612/245) + 0.367 Rs -> Rs = 0.256 ohm;
  # 0.24 = 0.0284 ln(0.245/Is) + 0.245 x 0.256 -> Is = 4.8e-4 A]
  d_n:        {value: 1.1}
  d_rs:       {value: 0.256}
  d_is:       {value: 4.8e-4}
  d3_flip:    {value: 1, source: "1 = D3 as netlisted since 2026-09-30 (K at the bus, A at the module - hardware/module/power-entry/netlist.yaml); 0 = the reversed drawing it replaced"}
  t_neg_rise: {value: 2.0e-3}
  # --- poweroff.cir: the rails coming down (pre-layout review A3-14) ----------------------
  t_off:      {value: 30.0e-3, source: "the rails up and settled before the bus goes"}
  t_fall:     {value: 1.0e-3, source: "the bus falling to 0 V [assumption: a PSU's output collapsing into the rack's load]"}
  dt_neg_off: {value: 0.0, source: "the -12 V rail's fall behind +12 V, negative if it leads (swept, as dt_neg)"}
  t_end_off:  {value: 230.0e-3, source: "long enough for both rails to reach a few hundred mV on their bulk"}
  t_gain:     {value: 0.5, source: "pitch-stage.lib: TRIM-GAIN at mid-travel (hardware/module/pitch-stage/sim)"}
  w_offset:   {value: 0.5, source: "pitch-stage.lib: TRIM-OFFSET at mid-travel"}

  # --- PTC-POS12 / PTC-NEG12 in the power-on deck (ADR 0027) ----------------------------
  r_ptc:      {value: 0.4, source: "MF-MSMF020/60: Rmin 0.40 ohm, a fitted part's resistance [datasheets/discrete-and-power/BOURNS-MF-MSMF.pdf p.1]. R1max, 6.0 ohm an hour after a trip, is the sim ptc-tripped"}
  # --- groundshift.cir: the rack's copper and the instrument's current -------------------
  v_rail:     {value: 12.0}
  v_rail_neg: {value: -12.0}
  r_rib_gnd:  {value: 0.017, source: "the power ribbon's six ground conductors: 28 AWG 0.232 ohm/m x 0.3 m / 6 + IDC contacts 2 x 15 mohm / 6 [calc, docs/review/2026-09-21-hardware-and-standards-review/A7-module-power.md]"}
  r_rib_rail: {value: 0.050, source: "one rail's two ribbon conductors: 0.232 x 0.3 / 2 + 2 x 15 mohm / 2 [calc, same basis]"}
  r_bus_rail: {value: 0.031, source: "a bus-board trace, 1 oz, 4 mm wide, 0.25 m: 1.72e-8 x 0.25 / (0.004 x 35e-6) [calc, docs/review/2026-09-21-hardware-and-standards-review/B3-power-entry-practice.md]"}
  r_bus_seg:  {value: 0.031, source: "the bus-board ground between this module's tap and the receiver's: 0 (the next slot - 1 mohm, since ngspice will not take 0) to the whole 0.25 m trace [calc, as r_bus_rail] (swept)"}
  i_mod_pos:  {value: 0.032, source: "the module's own +12 V analog load, module-own-draw (power-entry.md, 'Fuses on the rails')"}
  i_mod_neg:  {value: 0.020, source: "the module's own -12 V analog load, module-own-draw (power-entry.md, 'Fuses on the rails')"}
  i_q:        {value: 0.212, source: "the instrument at rest, 212 mA [repo, ADR 0005 load table, quiescent - an upper bound since ADR 0015]"}
  i_swing:    {value: 0.195, source: "the breath-correlated swing: 0.195 A, every WS2815B-V1 on the main board at full white (lighting.led_count, n:D-LED), the top of led-row-current (a register range: sim.py cites only its first number, so the top is written here and moves with it by hand) (blocked on E6's measurement); 0.367 A, ADR 0005's quiescent-to-clamp-legal-worst swing, the one the 7-18 cent estimate used [repo] (swept)"}
  f_b:        {value: 2.0, source: "one breath 0 -> full -> 0 in 0.5 s [assumption: the frequency does not enter a resistive result]"}
  eta:        {value: 0.82, source: "U-ISO at ~21 % load (umbilical-current x 12 V = 4.3 W of 20 W, 0.36 A of 1.67 A): ~81 % off the RPA20-2412SAW's efficiency curve at 24 V in and ~0.95 W off its dissipation curve (4.3 / 5.26 = 0.82) [datasheets/discrete-and-power/RECOM-RPA20-AW.pdf PD-3]"}
  v_iso:      {value: 12.0, source: "U-ISO's output [ds PD-1]"}
  c_iso:      {value: 1.1e-9, source: "U-ISO's isolation capacitance, 1100 pF typ [ds PD-5]"}
  r_tie:      {value: 0.001, source: "NT-UMB-MOD, NT-DIG-MOD and the DIG_GND plane between them, lumped [assumption]"}
  topo:       {value: 1, source: "0 before, 1 isolated (the design), 2 ground sense, 3 balanced load - groundshift.cir's header"}
  bal_frac:   {value: 0.01, source: "topo 3: a dummy load that holds the instrument's total to 1 % of the swing [assumption]"}
  t_gs:       {value: 1.0}
  # --- the DAC rail, U-REG-DAC (LT3042): precision-set, no trim (owner, 2026-10-01) -------
  v_dac_set:  {value: {fig: dac-rail}, source: "the rail's nominal: I_SET x R-SET-DAC"}
  v_dac_lo:   {value: 5.0, source: "dac-rail's floor: the DAC8568 C grade is specified for AVDD 5.0-5.5 V only, because its 0-5 V output range at the internal reference x 2 needs AVDD >= 5 V [datasheets/analog/DAC8568CIPW.pdf p.3, p.4]"}
  v_dac_hi:   {value: 5.5, source: "the same window's top [same, p.4]"}
  v_margin:   {value: 0.05, source: "the margin asked of every corner inside that window (owner's brief, F8)"}
  i_set:      {value: 100.0e-6, source: "the LT3042's SET current, 98/100/102 uA over 2-20 V in, 0-15 V out, 1-200 mA and temperature [datasheets/discrete-and-power/ADI-LT3042.pdf p.3] (vary)"}
  k_vos:      {value: 1.0, source: "OUT - SET, the offset: v_os = 2 mV x (k_vos - 1), +-2 mV over the same conditions [same, p.3] (vary: 0 to 2)"}
  k_leak:     {value: 1.0, source: "leakage at the SET node, out of it positive: i_leak = 100 nA x (k_leak - 1) [assumption: the datasheet's own example, 100 nA = 0.1 % (p.14); C-SET-DAC's 5 Gohm minimum is 1 nA of it, WALSIN-MLCC-GENERAL-NP0-X7R.pdf p.13; the rest is the board, guarded] (vary: 0 to 2)"}
  v_in_dac:   {value: 12.0, source: "U-REG-DAC's input, the protected analog +12 V (vary: 10.8 V, a tripped PTC-POS12 and D1 - power-entry.md, Fuses - to 12.6 V, the bus maximum)"}
  v_uvlo_dac: {value: 2.0, source: "the LT3042's input UVLO, rising, 2 V max (1.78 typ); EN/UV on IN trips first, 1.18-1.32 V [ds ADI-LT3042.pdf p.3]"}
  v_do_dac:   {value: 0.3, source: "its dropout, 300 mV max at 1-50 mA over temperature [same, p.3]"}
  i_lim_dac:  {value: 0.22, source: "its internal current limit, 220 mA min at VIN 2 V (300 typ at 12 V) [same, p.4]"}
  i_gnd_dac:  {value: 3.5e-3, source: "its GND pin current, 3.5 mA max at 1 mA load, 5 mA max at 50 mA [same, p.3]"}
  gm_dac:     {value: 10.0, source: "the pass element's error gain, A/V [assumption: stiff; the loop's dynamics are not the question]"}
  rset_fault: {value: 0, source: "0 none; 1 R-SET-DAC open; 2 C-SET-DAC shorted (SET to ground)"}
  v_dac_absmax: {value: 6.0, source: "the DAC8568's absolute maximum, AVDD to GND -0.3 to +6 V [datasheets/analog/DAC8568CIPW.pdf p.2]"}
  r_dac_load: {value: 1300.0, source: "DAC_AVDD's load, ~4 mA (power-entry.md, The DAC rail's load) as a resistance [calc: 5.2 / 4.0e-3] (vary: 585 ohm, ~9 mA, the ceiling with U-LVL-MOD's inputs at their Delta-I_CC bound, to 2.6 kohm, ~2 mA). The one load every deck puts on DAC_AVDD since #5: poweron.cir and digital-and-supervision's seq.cir used the DAC8568's 1.25 mA alone (4 kohm)"}
  # --- cm.cir / isoin.cir: U-ISO's input, common mode and differential (A4-1) -------------
  l_leak:     {value: 3.9e-6, source: "L-CM-ISO's leakage inductance, 3.9 uH typ [datasheets/discrete-and-power/BOURNS-PM3700-CM-CHOKE.pdf p.1]: the pair's differential inductance"}
  r_cm_dcr:   {value: 0.020, source: "its DCR per winding, 0.020 ohm max [same]"}
  r_cm_core:  {value: 1800.0, source: "its core loss at 550 kHz as a resistance across each winding [assumption: the datasheet gives only '20 dB attenuation, 500 kHz - 40 MHz', which in a 50 ohm common-mode test is ~900 ohm of common-mode impedance, ~1.8 kohm per winding] (vary: 500 ohm to 3.6 kohm)"}
  c_cm_w:     {value: 10.0e-12, source: "its winding capacitance [assumption: a toroid this size, 5-20 pF]"}
  l_trace:    {value: 10.0e-9, source: "each copper segment PWR_GND - NT-UMB-MOD - DIG_GND - NT-DIG-MOD - star - NT-AGND-MOD [assumption: ~10 mm of plane path; the loop of docs/review/2026-10-01-pre-layout-review/F3-u-iso-cm-loop/]"}
  l_esl_cer:  {value: 1.0e-9, source: "an 0805/1206 ceramic's ESL with its pads [assumption]"}
  l_esl_el:   {value: 10.0e-9, source: "an SMD electrolytic's ESL [assumption]"}
  esr_c2:     {value: 0.34, source: "C2 (UCM1H101MCL1GS): 0.34 ohm impedance at 100 kHz [datasheets/discrete-and-power/NICHICON-UCM-SERIES-UCM1E101MCL1GS.pdf p.3] (vary: a third of it, to 1.33 ohm, tan d 0.10 at 120 Hz [calc: 0.10 / (2 pi 120 x 100 uF)])"}
  esr_c1:     {value: 0.4, source: "C1's ESR [assumption: a 100 uF 25 V radial electrolytic]"}
  esr_c3:     {value: 0.7, source: "C3's ESR [assumption: a 47 uF 25 V radial electrolytic]"}
  l_fb_light: {value: 2.2e-6, source: "FB1 / FB3 at tens of mA, below their peak: ~2.2 uH [datasheets/discrete-and-power/MI1206K601R-10-ferrite-bead.pdf, the 0 A curve, as F3-u-iso-cm-loop read it]"}
  l_fb_iso:   {value: 0.85e-6, source: "FB2 / FB4 at ~0.22 A: ~0.85 uH [same, the 250 mA curve]"}
  r_fb_peak:  {value: 650.0, source: "the beads' resistive peak [same]"}
  r_fb_dcr:   {value: 0.05, source: "the beads' DC resistance, 0.080 ohm max (FB-IN's row) [assumption: typical]"}
  r_d_light:  {value: 3.2, source: "D1 / D3's small-signal resistance at the analog rails' ~32 mA: diode-split-rationale"}
  r_d_iso:    {value: 0.55, source: "D2 / D4's at U-ISO's ~0.22 A input: diode-split-rationale"}
  r_ptc_rail: {value: 0.4, source: "PTC-POS12 / PTC-NEG12 fitted, Rmin 0.40 ohm [datasheets/discrete-and-power/BOURNS-MF-MSMF.pdf p.1]"}
  r_ptc_iso:  {value: 0.11, source: "PTC-ISO fitted, Rmin 0.11 ohm [same]"}
  r_liso:     {value: 0.05, source: "L-ISO-IN's DCR [assumption]"}
  c_liso_par: {value: 3.0e-12, source: "L-ISO-IN's self-capacitance [assumption: SRF near 20 MHz]"}
  l_rib:      {value: 0.3e-6, source: "one power-ribbon conductor, ~0.3 m [assumption: ~1 uH/m] (vary: 0.1 to 1 uH)"}
  c_rack:     {value: 100.0e-6, source: "the PSU's and the other modules' decoupling at the far end of the ribbon, per rail [assumption]"}
  esr_rack:   {value: 0.1, source: "its ESR [assumption]"}
  l_esl_rack: {value: 20.0e-9, source: "its ESL [assumption]"}
  r_psu:      {value: 0.05, source: "the rack PSU's output resistance below a few kHz, per rail [assumption: a regulated Eurorack supply, tens of milliohms] (vary: 10 to 200 mohm)"}
  p_iso_in:   {value: 5.26, source: "U-ISO's input power at typical play (power-entry.md, The instrument's supply)"}
  v_iso_in:   {value: 23.4, source: "U-ISO's input voltage at typical play (same)"}
  cm_bound:   {value: 10.0, source: "the owner's bound, 2026-10-01: under 10 % of the converter's common-mode current crosses the star"}
  # --- ledpwm.cir: the LED row's PWM through U-ISO onto the rails (pre-layout review A4-13) ---
  f_pwm:      {value: 2000.0, source: "the WS2815B-V1's PWM: 'scan frequency is of 2KHz' and 'Refresh Frequency updates to 4KHz' [datasheets/led/WS2815B-V1.pdf p.1]; no tolerance on its internal oscillator is published, so the sims sweep 2-4 kHz and the input LC's peak inside it (sweep)"}
  d_led:      {value: 0.5, source: "the pulse's duty, brightness / 256 (256 levels per channel [ds p.1]); 0.5 puts the most current in the fundamental (sweep)"}
  n_lit:      {value: 13, source: "how many of the LEDs (n:D-LED) pulse; the rest sit blanked (sweep)"}
  spread:     {value: 0.0, source: "the LEDs' pulses' starts, spread x k/n of a period apart (n = n:D-LED): 0 in phase, the worst; each WS2815B-V1 runs its own oscillator [ds p.1, 'precision internal oscillator'], so in phase is a bound, not a promise (sweep)"}
  i_q_led:    {value: 2.0e-3, source: "one WS2815B-V1 blanked, 'Quiescent Current < 2mA' [ds p.3]: its maximum"}
  t_edge:     {value: 1.0e-6, source: "the pulse's edges [assumption: the datasheet gives none usable for the 12 V LED current; C-STRIP-BULK takes everything this fast]"}
  k_row:      {value: 1, source: "1 the row at its feed, behind the instrument's C-STRIP-BULK and the umbilical, as built; 0 the row's current straight out of U-ISO, the review's bound (A4-13)"}
  c_uiso_in:  {value: 4.7e-6, source: "U-ISO's own input capacitance [assumption: RECOM does not publish it (RECOM-RPA20-AW.pdf PD-1 to PD-8); a 1 x 1 inch 20 W converter carries a few uF of ceramic. Beside C2's 100 uF it moves nothing at 2-4 kHz]"}
  v_knee_iso: {value: 18.0, source: "below this U-ISO's input draws as a resistor, above it constant power: a solver aid only, under the ~23.4 V every run sits at (power-entry.md, The instrument's supply)"}
  v_knee_buck: {value: 9.0, source: "the same for the instrument's buck, under the 11.4-11.8 V it sits at (power-entry-instrument/sim, v_nom)"}
  psrr_ldo:   {value: 80.0, source: "U-REG-DAC's (LT3042) ripple rejection at 2-4 kHz, dB [assumption, below every typical curve: 100-118 dB at 1-10 kHz with C_SET 0.47 uF (datasheets/discrete-and-power/ADI-LT3042.pdf p.9-10, read off the curves); C-SET-DAC is 0.1 uF, which moves the low-frequency corner up ~4.7x; the only minimum is 95 dB at 120 Hz with C_SET 4.7 uF (p.3)]"}
  k_dac:      {value: 1.0, source: "DAC_AVDD's ripple at the DAC8568's outputs and VREFOUT, V/V: the datasheet publishes no AC PSRR (DAC8568CIPW.pdf; the internal reference's line regulation, under 10 uV/V, is DC), so 0 dB - all of it - is the bound"}
  v_refout:   {value: 2.5, source: "the DAC8568's internal reference, VREFOUT [datasheets/analog/DAC8568CIPW.pdf p.4], as pitch-stage/sim's v_refout"}
  v_dac_pitch: {value: 1.25, source: "the pitch DAC channel at jack 0 V, the operating point TI's OPA2197 model converges from (pitch-stage/sim, v_dac0)"}
  v_dac_mod:  {value: {fig: mod-reference}, source: "mod channel 1 and channel 7 both at mod-reference: the jack at 0 V"}
  v_breath_in: {value: 1.0, source: "the breath stage's buffer input held steady mid-range [assumption: a steady breath; the rail paths do not depend on it]"}
  w_boff:     {value: 0.0, source: "POT-OFFSET's wiper from its DAC_AVDD (CCW) end: 0, the wiper on DAC_AVDD, couples DAC_AVDD's ripple fully [breath-output-stage.md]"}
  t_ramp_pwm: {value: 1.0e-3, source: "every supply's ramp from 0 V in ledpwm.cir; U-ISO's output follows over the next t_ramp_pwm, and the instrument's loads and the row start once it is up [a solver's start, not a claim about the power-on: poweron.cir has that]"}
  t_end_pwm:  {value: 35.0e-3, source: "long enough for the instrument's bulk, the input LC and the module's rails to settle after the ramp (a few ms) before the window"}
  t_win_pwm:  {value: 10.0e-3, source: "the window the ripple is read over: 20 periods at 2 kHz"}
  t_step_pwm: {value: 2.0e-6, source: "the step: 125 points per period at 4 kHz"}
  rail_bound_mv: {value: 13.0, source: "the review's bound on the case's +-12 V, '~13 mV p-p of 2-4 kHz on the case's rails' (docs/review/2026-10-01-pre-layout-review/A4-instrument-power-lighting-grounds.md, A4-13), carried into ADR 0027's residual table"}
  pitch_bar_cents: {value: 0.01, source: "ADR 0027's residual section: 'Residual breath-correlated pitch error: under 0.01 cents', which the LED PWM's share must keep (it reaches ~0.001 cents at the worst corner, led-pwm-rail-ripple)"}
  bench_bar_cents: {value: 0.01, source: "ADR 0027, What the bench checks: the pitch jack with the lights sweeping full scale, 'under a hundredth of a cent'"}
  breath_bar_mv: {value: 1.0, source: "0.01 % of the breath jack's 10 V span [assumption: a tenth of the breath-frequency rail term breath-output-stage.md accepts under Offset]"}
  mod_lsb_uv: {value: 305.0, source: "one LSB of a mod channel: the op-amp output's 20 V span (mod-jack-range's derivation) over 2^16 codes [calc: 20 / 65536 = 305 uV]"}

derived:
  t_pos0: "max(-v['dt_neg'], 0) + 1e-6"
  t_pos_end: "max(-v['dt_neg'], 0) + 1e-6 + v['t_rise']"
  t_neg0: "max(v['dt_neg'], 0) + 1e-6"
  t_neg_end: "max(v['dt_neg'], 0) + 1e-6 + v['t_neg_rise']"
  d3_as_net: "1e-6 if v['d3_flip'] else 1.0"
  d3_flipped: "1.0 if v['d3_flip'] else 1e-6"
  k_direct: "1.0 if v['topo'] in (0, 2, 3) else 0.0"
  k_iso: "1.0 if v['topo'] == 1 else 0.0"
  k_sense: "1.0 if v['topo'] == 2 else 0.0"
  swing_frac: "v['bal_frac'] if v['topo'] == 3 else 1.0"
  dc_extra: "v['i_swing'] if v['topo'] == 3 else 0.0"
  t_off_e: "v['t_off'] + v['t_fall']"
  t_off_n: "v['t_off'] + max(v['dt_neg_off'], 0) + 1e-6"
  t_off_ne: "v['t_off'] + max(v['dt_neg_off'], 0) + 1e-6 + v['t_fall']"
  r_own_pos: "v['v_bus'] / v['i_mod_pos']"
  r_own_neg: "-v['v_bus_neg'] / v['i_mod_neg']"
  r_trim_gain: "max(v.get('TRIM-GAIN', 0) * v['t_gain'], 1e-3)"
  r_toff_cw: "max(v.get('TRIM-OFFSET', 0) * (1 - v['w_offset']), 1e-3)"
  r_toff_ccw: "max(v.get('TRIM-OFFSET', 0) * v['w_offset'], 1e-3)"
  k_cm: "(1.0 - v['l_leak'] / (2.0 * v['L-CM-ISO'])) if 'L-CM-ISO' in v else 0.0"
  r_neg_iso: "v['v_iso_in']**2 / v['p_iso_in']"
  v_os: "2.0e-3 * (v['k_vos'] - 1.0)"
  i_leak: "100.0e-9 * (v['k_leak'] - 1.0)"
  # (the guards: sims that import these params without this circuit's netlist - panel-led/sim - never use them)
  r_set_eff: "(1.0e12 if v['rset_fault'] == 1 else v['R-SET-DAC']) if 'R-SET-DAC' in v else 0.0"
  r_cset_eff: "1.0e-3 if v['rset_fault'] == 2 else 1.0e12"
  # ledpwm.cir (guarded the same way: an importing sim without these netlists never uses them)
  t_pwm: "1.0 / v['f_pwm']"
  t_on: "min(v['d_led'] / v['f_pwm'] - v['t_edge'], 1.0 / v['f_pwm'] - 2.0 * v['t_edge'])"
  n_led: "v.get('n:D-LED', 0.0)"
  i_pix: "v['i_swing'] / max(v.get('n:D-LED', 1.0), 1.0) - v['i_q_led']"
  i_row_q: "v.get('n:D-LED', 0.0) * v['i_q_led']"
  i_other: "max(v.get('i_12', 0.0) - v['i_swing'], 0.0)"
  r_sel_row: "1.0e-3 if v['k_row'] else 1.0e7"
  r_sel_iso: "1.0e7 if v['k_row'] else 1.0e-3"
  t_ramp2_pwm: "2.0 * v['t_ramp_pwm']"
  k_ldo: "10.0 ** (-v['psrr_ldo'] / 20.0)"
  r_boff_cw: "max(v.get('POT-OFFSET', 0.0) * (1.0 - v['w_boff']), 1e-3)"
  r_boff_ccw: "max(v.get('POT-OFFSET', 0.0) * v['w_boff'], 1e-3)"

vary:
  i_set:      {tol: [-0.02, 0.02], source: "98 and 102 uA about 100"}
  k_vos:      {tol: [-1.0, 1.0], source: "-2 and +2 mV"}
  k_leak:     {tol: [-1.0, 1.0], source: "100 nA into and out of SET"}
  R-SET-DAC:  {tol: [-0.002, 0.002], source: "+-0.1 % initial and +-25 ppm/C over 40 C of drift from 25 C, 0.1 % [calc: 25e-6 x 40]; the ARG05's [datasheets/discrete-and-power/VIKING-ARG-THIN-FILM-RESISTOR.pdf p.3]"}
  C-SET-DAC:  {tol: [-0.05, 0.05], source: "NP0 +-5 % [WALSIN-MLCC-GENERAL-NP0-X7R.pdf p.2]"}
  v_in_dac:   {tol: [-0.1, 0.05], source: "10.8 to 12.6 V about 12"}
  r_dac_load: {tol: [-0.55, 1.0], source: "585 ohm to 2.6 kohm about 1.3 kohm"}
  r_cm_core:  {tol: [-0.7222, 1.0], source: "500 ohm to 3.6 kohm about 1.8 kohm"}
  L-CM-ISO:   {tol: [-0.3, 0.3], source: "1.0 mH MINIMUM at 1 kHz [BOURNS-PM3700-CM-CHOKE.pdf p.1]; at 550 kHz the ferrite's permeability falls [assumption: -30 %], and the core loss carries the rest"}
  l_rib:      {tol: [-0.6667, 2.3333], source: "0.1 to 1 uH about 0.3"}
  esr_c2:     {tol: [-0.6667, 2.9], source: "0.11 to 1.33 ohm about 0.34"}
  r_psu:      {tol: [-0.8, 3.0], source: "10 to 200 mohm about 50"}
  C-ISO-Y:    {tol: [-0.05, 0.05], source: "C0G +-5 %"}

sims:
  - name: d3-reversed
    # WHAT-IF: D3 fitted the wrong way round (anode at the bus), as the sheet drew it until
    # 2026-09-30. Kept so the failure it causes stays on record.
    deck: poweron.cir
    set: {d3_flip: 0}
    vary: []
    measures: [v_pos12, v_neg12, avdd_final, avdd_peak, t_avdd_floor, jack_peak, jack_trough]
    post:
      v_pos12: "at(w['p12'], p['t_end'])"
      v_neg12: "at(w['n12'], p['t_end'])"
      avdd_final: "at(w['avdd'], p['t_end'])"
      avdd_peak: "peak(w['avdd'], 0, p['t_end'])"
      t_avdd_floor: "cross(w['avdd'], 5.0, 0)"
      jack_peak: "peak(w['jack'], 0, p['t_end'])"
      jack_trough: "trough(w['jack'], 0, p['t_end'])"
    asserts:
      - expr: "nom['v_neg12'] > -1.0"
        why: "WHAT-IF: D3 with its anode at the bus -12 V pin is reverse-biased by the rail it is meant to pass, so MODULE_ANALOG_NEG12 never arrives - which is why the netlist has it cathode to the bus"
  - name: as-netlisted
    # D3 anode at the module, cathode at the bus (the netlist): the orientation that passes
    # -12 V and blocks a reversed ribbon. Run at the -12 V rail arriving early, together and late.
    deck: poweron.cir
    sweep: {dt_neg: [-1.0e-3, 0.0, 5.0e-3]}
    vary: []
    measures: [v_pos12, v_neg12, avdd_final, avdd_peak, t_avdd_floor, jack_peak, jack_trough, i_dac_pin]
    post:
      v_pos12: "at(w['p12'], p['t_end'])"
      v_neg12: "at(w['n12'], p['t_end'])"
      avdd_final: "at(w['avdd'], p['t_end'])"
      avdd_peak: "peak(w['avdd'], 0, p['t_end'])"
      t_avdd_floor: "cross(w['avdd'], 5.0, 0)"
      jack_peak: "peak(w['jack'], 0, p['t_end'])"
      jack_trough: "trough(w['jack'], 0, p['t_end'])"
      i_dac_pin: "max(abs(peak(w['iin'], 0, p['t_end'])), abs(trough(w['iin'], 0, p['t_end'])))"
    asserts:
      - expr: "min['avdd_final'] >= 5.0 and max['avdd_peak'] < 6.0"
        why: "DAC_AVDD settles at or above dac-rail's hard 5.00 V floor and never reaches the DAC8568's 6 V absolute maximum on the way (SBAS430, AVDD to GND -0.3 to +6 V)"
      - expr: "max['jack_peak'] < 0.1 and min['jack_trough'] > -0.1"
        why: "pitch-stage.md 'Power-on is 0.000 V': with the DAC at its reset zero scale and V_ref at 0 V the jack stays within 100 mV of 0 V through the whole power-up, whichever rail arrives first"

  # ---- ADR 0027: the breath-correlated pitch error, before and after ------------------------
  # groundshift.cir. The error is the pitch jack's reference moving against the receiving
  # module's ground, peak to peak over one breath, in cents at 1 V/oct (1 cent = 1/1200 V).
  # Each runs at the receiver in the next slot (r_bus_seg 0) and at the PSU end of the bus, and
  # at both breath-correlated swings.
  - name: gnd-before
    # the design until 2026-09-30: the instrument's current returns through the star, the
    # ribbon and the bus. Reproduces power-entry.md's old 7-18 cent table.
    deck: groundshift.cir
    set: {topo: 0}
    sweep: {r_bus_seg: [0.001, 0.031], i_swing: [0.195, 0.367]}
    vary: []
    measures: [err_cents, err_mv, rail_mv]
    post:
      err_cents: "(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs'])) * 1200"
      err_mv: "1000*(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs']))"
      rail_mv: "1000*(peak(w['railp'], 0.05, p['t_gs']) - trough(w['railp'], 0.05, p['t_gs']))"
    asserts:
      - expr: "min['err_cents'] > 3.0"
        why: "the problem ADR 0027 exists for: several cents of breath-correlated pitch error even with the receiver in the next slot"
  - name: gnd-isolated
    # the design: U-ISO draws the instrument's power rail to rail
    deck: groundshift.cir
    set: {topo: 1}
    sweep: {r_bus_seg: [0.001, 0.031], i_swing: [0.195, 0.367]}
    vary: []
    measures: [err_cents, err_mv, tie_ua, rail_mv]
    post:
      err_cents: "(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs'])) * 1200"
      err_mv: "1000*(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs']))"
      rail_mv: "1000*(peak(w['railp'], 0.05, p['t_gs']) - trough(w['railp'], 0.05, p['t_gs']))"
      tie_ua: "1e6*max(abs(peak(w['itie'], 0.05, p['t_gs'])), abs(trough(w['itie'], 0.05, p['t_gs'])))"
    asserts:
      - expr: "max['err_cents'] < 0.01 and max['tie_ua'] < 1.0"
        why: "ADR 0027: with the converter no breath-correlated current reaches the rack's ground - under a hundredth of a cent, and under a microamp in the tie to the star (what is left is the isolation capacitance)"
  - name: gnd-sense
    # option (b): the pitch reference on a current-free ribbon conductor
    deck: groundshift.cir
    set: {topo: 2}
    sweep: {r_bus_seg: [0.001, 0.031], i_swing: [0.195, 0.367]}
    vary: []
    measures: [err_cents, err_mv, rail_mv]
    post:
      err_cents: "(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs'])) * 1200"
      err_mv: "1000*(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs']))"
      rail_mv: "1000*(peak(w['railp'], 0.05, p['t_gs']) - trough(w['railp'], 0.05, p['t_gs']))"
    asserts:
      - expr: "nom['err_cents'] < 0.5 or nom['err_cents'] > 3.0"
        why: "option (b) removes the ribbon's share only: next to nothing is left with the receiver at this module's tap (the rails' drop is common-mode), the whole bus-board share with it at the PSU end - the reason ADR 0027 does not choose it"
  - name: gnd-balanced
    # option (c): a dummy load holding the instrument's total current constant to bal_frac
    deck: groundshift.cir
    set: {topo: 3}
    sweep: {r_bus_seg: [0.001, 0.031], i_swing: [0.195, 0.367]}
    vary: []
    measures: [err_cents, err_mv, rail_mv]
    post:
      err_cents: "(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs'])) * 1200"
      err_mv: "1000*(peak(w['ref'], 0.05, p['t_gs']) - trough(w['ref'], 0.05, p['t_gs']))"
      rail_mv: "1000*(peak(w['railp'], 0.05, p['t_gs']) - trough(w['railp'], 0.05, p['t_gs']))"
    asserts:
      - expr: "max['err_cents'] < 0.5"
        why: "option (c) at 1 % balance leaves a fraction of a cent - at the cost of burning the whole swing as heat all the time (ADR 0027)"
  - name: poweroff
    # the bus goes; each analog rail decays on its bulk into its own load. Which collapses
    # first, and what the pitch jack does meanwhile (pre-layout review A3-14).
    deck: poweroff.cir
    sweep: {dt_neg_off: [-2.0e-3, 0.0, 2.0e-3]}
    vary: []
    measures: [t_pos_half, t_neg_half, jack_peak_off, jack_trough_off]
    post:
      t_pos_half: "cross(w['p12'], 6.0, p['t_off']) - p['t_off']"
      t_neg_half: "cross(w['n12'], -6.0, p['t_off']) - p['t_off']"
      jack_peak_off: "peak(w['jack'], p['t_off'], p['t_end_off'])"
      jack_trough_off: "trough(w['jack'], p['t_off'], p['t_end_off'])"
    asserts:
      - expr: "max['jack_peak_off'] < 0.1 and min['jack_trough_off'] > -0.1"
        why: "the pitch jack stays within 100 mV of 0 V while the analog rails come down, whichever falls first: C-BULK-RAIL's 100 uF / 47 uF split keeps the two decays close (each rail reaches half in 16-23 ms), and the jack only moves once the op-amps are out of supply. The rails' order itself is recorded, not asserted"

  # ---- U-ISO's input: the common-mode choke and C-ISO-Y (pre-layout review A4-1; owner, 2026-10-01)
  - name: cm-loop
    # cm.cir: the converter's 550 kHz common-mode current, through its isolation capacitance,
    # home beside it through C-ISO-Y or round the module's grounds and the star. At the
    # fundamental and two harmonics, across the choke's core loss and inductance, the ribbon's
    # inductance and C-ISO-Y's tolerance.
    deck: cm.cir
    vary: [r_cm_core, L-CM-ISO, l_rib, C-ISO-Y]
    measures: [star_550k, star_1650k, star_5500k, y_550k, agnd_550k, star_peak]
    post:
      star_550k: "at(w['star'], 550e3)"
      star_1650k: "at(w['star'], 1.65e6)"
      star_5500k: "at(w['star'], 5.5e6)"
      y_550k: "at(w['yshare'], 550e3)"
      agnd_550k: "at(w['agnd'], 550e3)"
      star_peak: "peak(w['star'], 500e3, 30e6)"
    asserts:
      - expr: "max['star_550k'] < p['cm_bound'] and max['star_1650k'] < p['cm_bound'] and max['star_5500k'] < p['cm_bound']"
        why: "the owner's bound: under 10 % of U-ISO's common-mode current crosses the star at its 550 kHz fundamental and its 3rd and 10th harmonics, at every corner of the choke's core loss and inductance, the ribbon and C-ISO-Y - L-CM-ISO holds the loop off and C-ISO-Y takes the current home beside the converter"
      - expr: "max['star_peak'] < p['cm_bound']"
        why: "and nowhere from 500 kHz to 30 MHz: C-ISO-Y does not resonate with what is left of the loop (without the choke, 10-47 nF did - docs/review/2026-10-01-pre-layout-review/F3-u-iso-cm-loop/)"
  - name: cm-loop-y-1n
    # WHAT-IF: the choke with the 1 nF C-ISO-Y the sheet carried until 2026-10-01. Recorded:
    # why the capacitor moved with the choke.
    deck: cm.cir
    set: {C-ISO-Y: 1.0e-9}
    vary: [r_cm_core, L-CM-ISO, l_rib]
    measures: [star_550k, y_550k]
    post:
      star_550k: "at(w['star'], 550e3)"
      y_550k: "at(w['yshare'], 550e3)"
    asserts:
      - expr: "max['star_550k'] > p['cm_bound']"
        why: "WHAT-IF: at 1 nF (289 ohm at 550 kHz) C-ISO-Y is not low enough against a lossy core's few hundred ohms, and more than the bound crosses the star at the core-loss corner - which is why it is 22 nF with the choke"
  - name: iso-input-z
    # isoin.cir: the impedance U-ISO sees looking back into its input filter, now with
    # L-CM-ISO's leakage in series with L-ISO-IN, against the converter's negative input
    # resistance; and how much of its reflected current reaches the rack.
    deck: isoin.cir
    vary: [esr_c2, l_rib, L-CM-ISO, r_psu]
    measures: [z_peak, f_peak, z_edge, margin, rack_550k, rack_band, f_rack_band, rack_edge, rack_low]
    # WINDOW EDGES (#5 minor): a maximum read on an AC sweep's first or last point is that
    # end of the curve, not a resonance - *_edge says which (1 = the maximum IS an end
    # point). The sweep reaches toward DC so that a peak below the old 100 Hz edge shows.
    post:
      z_peak: "peak(w['zmag'], 1, 2e6)"
      f_peak: "argpeak(w['zmag'], 1, 2e6)"
      z_edge: "1.0 if argpeak(w['zmag'], 1, 2e6) in (w['zmag'][0][0], w['zmag'][0][-1]) else 0.0"
      margin: "p['r_neg_iso'] / peak(w['zmag'], 1, 2e6)"
      rack_550k: "at(w['rack'], 550e3)"
      rack_band: "peak(w['rack'], 1e3, 1e4)"
      f_rack_band: "argpeak(w['rack'], 1e3, 1e4)"
      # the band's maximum at its own 1 kHz edge is the curve still rising towards DC, where
      # all of the current comes from the rack (100 %); rack_low is the most below the band
      rack_edge: "1.0 if argpeak(w['rack'], 1, 2e6) in (w['rack'][0][0], w['rack'][0][-1]) else 0.0"
      rack_low: "peak(w['rack'], 1, 1e3)"
    asserts:
      - expr: "min['margin'] > 20"
        why: "the input filter stays damped with the choke's leakage added: its impedance peak is over 20x (26 dB) below the converter's -V^2/P at every ESR, ribbon and choke corner, the bar power-entry-instrument/sim holds the instrument's own input LC to"
      - expr: "max['rack_550k'] < 1.0"
        why: "under 1 % of the converter's reflected current at its 550 kHz fundamental reaches the rack's +12 V conductor"
      - expr: "max['rack_low'] <= 100.0 and max['rack_band'] <= 100.0"
        why: "NO GAIN IN THE LED ROW'S BAND: from 1 to 10 kHz the share of U-ISO's input current that reaches the rack's +12 V conductor never exceeds 100 % at any corner. L-ISO-IN and L-CM-ISO's leakage with C2 have their corner at ~3.1 kHz (power-entry.md), but D2, D4, PTC-ISO, the beads and the ribbon are in series in the same loop and hold it under critical damping - the premise of the review's '~13 mV' bound (A4-13: Q up to 1.35 on C2's ESR alone) does not hold. led-pwm runs the row's current through it"

  # ---- DAC_AVDD: U-REG-DAC, the LT3042, precision-set (owner, 2026-10-01) ------------------
  # dacrail.cir, DC, behavioural (lt3042.lib): every corner of the datasheet's guaranteed SET
  # current and offset, R-SET-DAC's tolerance and drift, SET leakage, the input and the load.
  - name: dac-rail-spread
    deck: dacrail.cir
    vary: [i_set, k_vos, k_leak, R-SET-DAC, v_in_dac, r_dac_load]
    measures: [v_avdd]
    asserts:
      - expr: "min['v_avdd'] >= p['v_dac_lo'] + p['v_margin'] and max['v_avdd'] <= p['v_dac_hi'] - p['v_margin']"
        why: "NOTHING TO TRIM: at every corner of the LT3042's guaranteed SET current (98-102 uA) and offset (+-2 mV) over line, load and temperature, R-SET-DAC's 0.1 % and its drift, 100 nA of SET leakage either way, the input from a tripped fuse to the bus maximum and the rail's whole load range, DAC_AVDD sits inside the DAC8568 C grade's 5.00-5.50 V with 50 mV or more to spare at both ends"
      - expr: "abs(nom['v_avdd'] - p['v_dac_set']) < 0.005"
        why: "and its nominal is dac-rail"
  - name: dac-rail-aged
    # R-SET-DAC at its endurance limit, +-0.5 % after 1000 h at full rated power and 70 C
    # [VIKING-ARG-THIN-FILM-RESISTOR.pdf p.4], on top of its 0.1 % and its drift (0.2 %) -
    # it runs at 0.4 % of its rating [calc: 5.23^2 / 52.3k = 0.52 mW of 1/8 W]
    deck: dacrail.cir
    set: {}
    vary: [i_set, k_vos, k_leak, R-SET-DAC]
    tol: {R-SET-DAC: [-0.007, 0.007]}
    measures: [v_avdd]
    asserts:
      - expr: "min['v_avdd'] >= p['v_dac_lo'] and max['v_avdd'] <= p['v_dac_hi']"
        why: "even with R-SET-DAC aged to its endurance limit as well, at every corner of the LT3042's limits, DAC_AVDD stays inside 5.00-5.50 V"
  - name: dac-rail-open-rset
    # FAILURE: R-SET-DAC open. The SET current charges the SET node until it runs out of input
    deck: dacrail.cir
    set: {rset_fault: 1}
    vary: [i_set, v_in_dac]
    measures: [v_avdd]
    asserts:
      - expr: "min['v_avdd'] > p['v_dac_absmax']"
        why: "RECORDED, NOT FAIL-SAFE: an open R-SET-DAC drives DAC_AVDD UP to the input less the dropout, over the DAC8568's 6 V absolute maximum. It is the one single failure that does, and the owner accepted it 2026-10-01 with no clamp, mitigated by its placement on the board and E7 measuring the rail before U-DAC is fitted (power-entry.md, The DAC rail, Its failures)"
  - name: dac-rail-short-cset
    # FAILURE: C-SET-DAC shorted (or R-SET-DAC shorted): SET at ground
    deck: dacrail.cir
    set: {rset_fault: 2}
    vary: [k_vos]
    measures: [v_avdd]
    asserts:
      - expr: "max['v_avdd'] < 0.5"
        why: "FAIL-SAFE: a shorted C-SET-DAC or R-SET-DAC puts SET at ground and DAC_AVDD goes DOWN, to the offset - the DAC simply stops"
  - name: dac-rail-startup
    # poweron.cir across the soft start's spread: how DAC_AVDD arrives, and the pitch jack
    deck: poweron.cir
    vary: [i_set, R-SET-DAC, C-SET-DAC]
    measures: [avdd_final, avdd_peak, t_avdd_floor, t_avdd_45, jack_peak, jack_trough]
    post:
      avdd_final: "at(w['avdd'], p['t_end'])"
      avdd_peak: "peak(w['avdd'], 0, p['t_end'])"
      t_avdd_floor: "cross(w['avdd'], 5.0, 0)"
      t_avdd_45: "cross(w['avdd'], 4.5, 0)"
      jack_peak: "peak(w['jack'], 0, p['t_end'])"
      jack_trough: "trough(w['jack'], 0, p['t_end'])"
    asserts:
      - expr: "max['avdd_peak'] <= p['v_dac_hi'] and min['avdd_final'] >= p['v_dac_lo']"
        why: "the soft start does not overshoot: DAC_AVDD rises to its set point and never above the C grade's 5.5 V on the way, at every corner of the SET current, R-SET-DAC and C-SET-DAC"
      - expr: "max['t_avdd_floor'] < 0.05"
        why: "and it is over the 5.00 V floor within 50 ms of the bus at every corner (R-SET-DAC x C-SET-DAC, ~5 ms, sets the pace). The instrument's own supply comes through U-ISO and the load switch, whose start alone takes 42 ms or more (umbilical-load-switch/sim, cold-start t_up), and firmware re-writes the DAC's reference-enable and clear-code registers periodically (firmware/README.md); the SPI pins' order against LOGIC_5V is digital-and-supervision/sim's"
      - expr: "max['jack_peak'] < 0.1 and min['jack_trough'] > -0.1"
        why: "and the pitch jack stays within 100 mV of 0 V through the power-up at every corner"
  - name: ptc-tripped
    # PTC-POS12 and PTC-NEG12 at R1max, 6.0 ohm an hour after a trip [BOURNS-MF-MSMF.pdf p.1]
    deck: poweron.cir
    set: {r_ptc: 6.0}
    vary: []
    measures: [v_pos12, avdd_final, avdd_peak, jack_peak, jack_trough]
    post:
      v_pos12: "at(w['p12'], p['t_end'])"
      avdd_final: "at(w['avdd'], p['t_end'])"
      avdd_peak: "peak(w['avdd'], 0, p['t_end'])"
      jack_peak: "peak(w['jack'], 0, p['t_end'])"
      jack_trough: "trough(w['jack'], 0, p['t_end'])"
    asserts:
      - expr: "nom['avdd_final'] >= p['v_dac_lo'] and nom['avdd_peak'] <= p['v_dac_hi']"
        why: "with both rail fuses at their worst an hour after a trip, U-REG-DAC still has its headroom and DAC_AVDD comes up inside the window (the LM317L model it replaced would not converge here)"
      - expr: "nom['jack_peak'] < 0.1 and nom['jack_trough'] > -0.1"
        why: "and the pitch jack stays within 100 mV of 0 V"


  # ---- the LED row's PWM through U-ISO onto the rack's rails (pre-layout review A4-13) ------
  # ledpwm.cir: every WS2815B-V1 on the main board pulsing, reflected through the instrument's bulk, the
  # umbilical and U-ISO into its input filter and the rack. Peak to peak over the last
  # t_win_pwm: the rails at this module's header (hdr_*) and at its bus tap, where a module
  # in the next slot sees them (tap_*); the module's analog rails (rail_*); DAC_AVDD; the
  # pitch jack in cents at 1 V/oct, mod 1 in uV, breath in mV; U-ISO's input and output
  # current. Corners: C2's ESR (its damping), the PSU's output resistance, and C-STRIP-BULK's
  # ESR (how much of the row's current the instrument keeps).
  - name: led-pwm
    # every LED in phase at half duty, the most current in the fundamental, across the
    # datasheet's 2-4 kHz and at L-ISO-IN's corner with C2 (power-entry.md, f0 = 3.1 kHz)
    deck: ledpwm.cir
    sweep: {f_pwm: [2000.0, 2500.0, 3100.0, 3500.0, 4000.0]}
    vary: [esr_c2, r_psu, esr_strip]
    measures: &pwm_measures [hdr_pos_mv, hdr_neg_mv, tap_pos_mv, tap_neg_mv, rail_pos_mv, rail_neg_mv, avdd_uv, pitch_cents, mod_uv, breath_mv, iuin_ma, iuout_ma]
    post: &pwm_post
      hdr_pos_mv: "1000*(peak(w['hp'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['hp'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      hdr_neg_mv: "1000*(peak(w['hn'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['hn'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      tap_pos_mv: "1000*(peak(w['tapp'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['tapp'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      tap_neg_mv: "1000*(peak(w['tapn'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['tapn'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      rail_pos_mv: "1000*(peak(w['p12'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['p12'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      rail_neg_mv: "1000*(peak(w['n12'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['n12'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      avdd_uv: "1e6*(peak(w['avdd'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['avdd'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      pitch_cents: "1200*(peak(w['jackp'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['jackp'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      mod_uv: "1e6*(peak(w['jackm'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['jackm'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      breath_mv: "1000*(peak(w['jackb'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['jackb'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      iuin_ma: "1000*(peak(w['iuin'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['iuin'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
      iuout_ma: "1000*(peak(w['iuout'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']) - trough(w['iuout'], p['t_end_pwm']-p['t_win_pwm'], p['t_end_pwm']))"
    asserts: &pwm_asserts
      - expr: "max['hdr_pos_mv'] < p['rail_bound_mv'] and max['hdr_neg_mv'] < p['rail_bound_mv'] and max['tap_pos_mv'] < p['rail_bound_mv'] and max['tap_neg_mv'] < p['rail_bound_mv']"
        why: "the review's bound holds: the row's PWM puts under 13 mV p-p on the case's +12 V and -12 V, at this module's header and at its bus tap, at every corner (A4-13's arithmetic took C2's ESR as the input LC's only damping; D2, D4, PTC-ISO and the beads are in the same loop, and the instrument's own bulk keeps most of the row's current)"
      - expr: "max['pitch_cents'] < p['pitch_bar_cents']"
        why: "ADR 0027's residual for the LED PWM: under its 0.01 cents on the pitch jack, by about ten times - through the OPA2197s' supply rejection (TI's model), and DAC_AVDD's ripple passed whole to VREFOUT and the DAC's output"
      - expr: "max['mod_uv'] < p['mod_lsb_uv']"
        why: "under one LSB of a mod channel (20 V / 2^16) on mod 1's jack"
      - expr: "max['breath_mv'] < p['breath_bar_mv']"
        why: "under 0.01 % of the breath jack's 10 V span, through R-BREATH-OFFNEG from -12 V (40.2k/95.3k) and POT-OFFSET from DAC_AVDD, behind R-OUT-PROT and C-OUT-BREATH"
  - name: led-pwm-duty
    # the brightness: every duty from one level of 256 to all but one, every LED in phase,
    # at the band's bottom, where the instrument's bulk keeps the least of the row's current
    deck: ledpwm.cir
    sweep: {d_led: [0.0039, 0.1, 0.25, 0.75, 0.9, 0.9961]}
    vary: [esr_c2, r_psu, esr_strip]
    measures: *pwm_measures
    post: *pwm_post
    asserts: *pwm_asserts
  - name: led-pwm-pattern
    # n_lit: seven of the thirteen lit, the rest blanked; spread 1: all of them, their pulses
    # spread evenly over the period, as free-running oscillators would land
    deck: ledpwm.cir
    sweep: {n_lit: [7, 13], spread: [0.0, 1.0]}
    vary: [esr_c2, r_psu, esr_strip]
    measures: *pwm_measures
    post: *pwm_post
    asserts: *pwm_asserts
  - name: led-pwm-at-iso
    # WHAT-IF, the review's own premise: the row's whole current straight out of U-ISO, with
    # no instrument bulk keeping any of it. Recorded, not a requirement
    deck: ledpwm.cir
    set: {k_row: 0}
    sweep: {f_pwm: [2000.0, 3100.0, 4000.0]}
    vary: [esr_c2, r_psu]
    measures: *pwm_measures
    post: *pwm_post
    asserts:
      - expr: "max['hdr_neg_mv'] > p['rail_bound_mv']"
        why: "RECORDED WHAT-IF: on the review's own premise - no instrument bulk - its 13 mV is not a bound: with a 200 mohm rack PSU the header reaches 14-18 mV p-p across the band, though the input LC has no gain there (iso-input-z rack_band). What holds the design well under it is C-STRIP-BULK keeping half or more of the row's current in the instrument (led-pwm's iuout_ma against this run's)"
      - expr: "max['pitch_cents'] < p['bench_bar_cents']"
        why: "and the pitch jack under the hundredth of a cent ADR 0027 tells the bench to expect (it reaches ~0.004 cents here, against the as-built runs' ~0.001)"
