      why: 'THE JACK''S NOISE IS THE SENSOR''S (breath-receive-stage.md, Noise at the jack): every electronic term together
        is under a tenth of the sensor''s, in both bands, at every curve setting and level - on AN1646''s figure, an assumption
        (sims.yaml); E11 measures it. Except where BREATH_OUT is clipped (r_b, the curve''s slope there over its slope at
        rest, under 0.2): POT-RESP fully clockwise at noon gain clips a hard blow (breath-chain-curve-clip), and a jack on
        its rail passes no breath noise at all'
      pass: true
    - expr: nom['n_adc_lsb'] < 1
