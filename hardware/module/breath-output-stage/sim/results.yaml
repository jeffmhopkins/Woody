      why: 'THE JACK''S NOISE IS THE SENSOR''S (breath-receive-stage.md, Noise at the jack): every electronic term together
        is under a tenth of the sensor''s in the control band, and under 0.15 of it in the audio band, at every bandwidth
        mode, curve setting and level. The audio band''s bound was a tenth until #32: with the jack''s RC at 15.9 kHz this
        stage''s own noise reaches 20 kHz unfiltered (about 12 uV rms, -118 dB of 10 V), and at POT-RESP fully counter-clockwise
        on a hard blow in the 500 Hz mode, where the curve is flattest and the sensor''s share smallest, it is 0.12 of the
        sensor''s - on AN1646''s figure, an assumption (sims.yaml); E11 measures it. Except where BREATH_OUT is clipped (r_b,
        the curve''s slope there over its slope at rest, under 0.2): POT-RESP fully clockwise at noon gain clips a hard blow
        (breath-chain-curve-clip), and a jack on its rail passes no breath noise at all'
      pass: true
    - expr: nom['n_adc_lsb'] < 1
      why: the instrument's own copy (ADC_IN behind C-AA-ADC) carries under 1 LSB rms of the MCP3202 at 3.3 V from the sensor
        and the electronics together
      pass: true
