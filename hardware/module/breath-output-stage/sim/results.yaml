      why: 'and without the R_NOISELESS lists it is off by two orders of magnitude (ngspice 42 ignores PSpice''s T_ABS): the
        lists are why the chain''s numbers mean anything'
      pass: true
    - expr: nom['ina_eno_1k'] > 0.6 * 90 and nom['ina_eno_1k'] < 90 and nom['ina_eni_1k'] > 0.6 * 7 and nom['ina_eni_1k']
        < 7
      why: 'RECORDED: TI''s INA828 model reads UNDER its datasheet''s typicals, e_NO 90 nV/rtHz and e_NI 7 nV/rtHz at 1 kHz
        [datasheets/analog/INA828IDR.pdf p.5] - by about a quarter and an eighth. The chain''s in-amp term is that much optimistic;
        the sensor assertion in `noise` has more margin than that'
      pass: true
