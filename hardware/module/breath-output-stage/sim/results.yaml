        catalogues'' ratings (15 and 20 mA)'
      pass: true
    - expr: max['i_ovs_pct'] < 10
      why: 'the driver''s own loop (U-REF-BUF B through D-LEDB and Q-LEDB''s emitter follower) settles a 2 us edge with under
