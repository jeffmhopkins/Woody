# The breath gain and offset stage, simulated as netlisted with TI's OPA2197 model:
# the offset knob's transfer at its ends, centre and the page's zero; the gain knob's
# ends; the clip; a step and the summer's loop into a passive mult; and what the -12 V
# rail's breath-following movement reaches the jack as. Values from the netlists: this
# circuit's, and for a passive mult the other outputs' jack parts (pitch-stage's
# C-FILT-PITCH, mod-channels' C-FILT-MOD-1 and R-OUT-PROT-1). Run:
#   python3 tools/sim.py run hardware/module/breath-output-stage/sim
# `mult`: 0 a module input alone, 1 a passive mult to the PITCH jack, 2 to a MOD jack.
title: Breath output stage - offset, gain, clip, step, loop and rail
# `chain` runs the response shaper ahead of this stage: its diode model, its ramp,
# POT-RESP's rotation (p_resp, r_pot_cw, r_pot_ccw) and TRIM-RESP's commissioning (trimmed,
# g_trim, t_comm, p_trim, r_trim) come from its sims.yaml.
params_from: [hardware/module/breath-response-shaper/sim/sims.yaml]
values:
  netlist:
    - hardware/module/breath-output-stage/netlist.yaml
    - hardware/module/breath-response-shaper/netlist.yaml
    - hardware/module/pitch-stage/netlist.yaml
    - hardware/module/mod-channels/netlist.yaml
    # the noise sims' chain, sensor to in-amp, and the DAC rail's SET parts
    - hardware/module/breath-receive-stage/netlist.yaml
    - hardware/interfaces/breath-sense-link/netlist.yaml
    - hardware/carrier/breath-excitation-reference/netlist.yaml
    - hardware/carrier/breath-adc/netlist.yaml
    - hardware/module/power-entry/netlist.yaml
models:
  - datasheets/analog/OPAx197-ti-pspice-sboma34d.lib
  - datasheets/analog/INA828-ti-pspice-sbomag5c.lib
  - datasheets/analog/REF5050-ti-pspice-slim175a.lib
spiceinit: [set ngbehavior=psa]

params:
  v_pos:    {value: 12.0,  source: "MODULE_ANALOG_POS12 (netlist rails)"}
  v_neg:    {value: -12.0, source: "MODULE_ANALOG_NEG12"}
  v_avdd:   {value: {fig: dac-rail}, source: "DAC_AVDD, POT-OFFSET's CCW end (dac-rail); its CW end is AGND_MOD, so clockwise is positive at the jack"}
  r_load:   {value: 100.0e3, source: "one module input on the jack, 100 kohm [assumption: typical Eurorack, as pitch-stage/sim]"}
  p_gain:   {value: 0.47, source: "POT-GAIN's rotation from CCW; 0.47 is the page's working gain, 2.16x (breath-output-stage.md, 'Settled 2026-09-30')"}
  p_off:    {value: 0.5, source: "POT-OFFSET's rotation from CCW (0, DAC_AVDD: -4.89 V) to CW (1, AGND_MOD: +5.06 V)"}
  v_in0:    {value: 0.0}
  v_in1:    {value: 0.0}
  v_hard:   {value: -4.64, source: "the in-amp column's hard blow (breath-output-stage.md, 'What it has to do'): breath-working-point's 2.8 kPa candidate, disputed until E2; BREATH_SHAPED at POT-RESP's centre"}
  t_step:   {value: 0.2e-3}
  t_edge:   {value: 1.0e-6, source: "a fast breath edge [assumption: far harder than breath]"}
  t_end:    {value: 1.0e-3}
  t_stepsize: {value: 1.0e-6}
  mult:     {value: 0}
  real_mult: {value: 0, source: "1: the other output's R-OUT-PROT to its driver at 0 V is on the jack too"}
  r_open:   {value: 1.0e12}
  rail:     {value: 0}
  rail_mv:  {value: 9.7e-3, source: "the +-12 V rails' movement at the header as U-ISO's input current follows breath (ADR 0027, residual table, [sim, rail_mv])"}
  # --- the noise sims (noise.cir, noise-amps.cir, noise-ref.cir)
  v_inst:   {value: 12.0, source: "INST_POS12, U-BUF's supply and the REF5050's input (breath-excitation-reference netlist); the instrument's +12 V nominal"}
  i_sensor: {value: 10.0e-3, source: "MPXV4006DP supply current, 10 mAdc max [datasheets/analog/MPXV4006DP.pdf, operating characteristics], as breath-excitation-reference/sim"}
  vs_nom:   {value: 5.0, source: "REF5050 VOUT nominal [datasheets/analog/REF5050.pdf]; VS follows it through U-BUF A"}
  k_off:    {value: 0.053, source: "the sensor's transfer V_out = V_S x (0.1533 P + 0.053) [datasheets/analog/MPXV4006DP.pdf p.4; sensor-full-scale's derivation]: its ratio at rest, the typical 0.265 V pedestal at 5 V"}
  level:    {value: 0, source: "0: breath at rest; 1: a hard blow, the in-amp at v_hard (breath-working-point's 2.8 kPa candidate, disputed until E2)"}
  # THE SENSOR'S NOISE IS AN ASSUMPTION. No MPXV4006DP datasheet states one. NXP's AN1646,
  # measured on the MPX5006 (the same die family): its noise 'extends from 500 Hz to 1 MHz' and
  # is '4 or 5 counts on a 10-bit A/D' at 5 V [datasheets/analog/MPXV4006-AN1646.pdf p.1].
  # Taken as 5 counts peak-to-peak, Gaussian (pk-pk = 6.6 x rms), spread evenly over that band,
  # and white below it too: an upper bound in the breath band, where AN1646 says there is less
  an_counts: {value: 5.0, source: "AN1646 p.1, '4 or 5 counts on a 10-bit A/D' (the larger)"}
  an_crest:  {value: 6.6, source: "peak-to-peak over rms for Gaussian noise read off a scope trace [assumption: the usual 6.6, 0.1 % of the time outside]"}
  an_f_lo:   {value: 500.0, source: "AN1646 p.1, the noise band's lower end"}
  an_f_hi:   {value: 1.0e6, source: "AN1646 p.1, its upper end"}
  # the REF5050's noise, white at its datasheet's in-band figure (TI's model reads 5x that: noise-ref)
  ref_en_rel: {value: 0.9e-6, source: "REF5050 High grade output noise 0.9 uVrms/V, 10 Hz to 1 kHz [datasheets/analog/REF5050.pdf, Electrical Characteristics, e_n]"}
  ref_f_lo:  {value: 10.0, source: "that figure's band"}
  ref_f_hi:  {value: 1.0e3, source: "that figure's band"}
  # the LT3042's SET pin: its reference current's noise, white, into R-SET-DAC
  i_set_rms: {value: 6.0e-9, source: "LT3042 reference current RMS output noise, 6 nA rms over 10 Hz to 100 kHz [datasheets/discrete-and-power/ADI-LT3042.pdf p.3]"}
  set_f_lo:  {value: 10.0, source: "that figure's band"}
  set_f_hi:  {value: 1.0e5, source: "that figure's band"}
  v_jack_fs: {value: 10.0, source: "the jack at a hard blow at the commissioned setting, about 10 V (breath-output-stage.md, 'What it has to do'; chain-centre): the full scale a player's noise is measured against"}
  v_adc_ref: {value: 3.3, source: "the MCP3202's reference is its VDD, DEV_3V3 (breath-adc netlist)"}
  f_au_lo:  {value: 20.0, source: "the audio band, 20 Hz to 20 kHz: what reaches a VCA or a filter's cutoff as hiss"}
  f_au_hi:  {value: 2.0e4}
  f_cb_lo:  {value: 1.0, source: "the control band's lower end: below 1 Hz is drift, the zero's (breath-receive-stage.md, Commissioning)"}
  f_adc_hi: {value: 1.0e6, source: "everything the converter samples folds into its 2 kHz: integrated to AN1646's 1 MHz, far past C-AA-ADC's pole"}
  n_dec:    {value: 20, source: "points per decade of noise.cir's AC and noise analyses (integrated by the trapezoid rule)"}
  # the INA828 at G = 1001 for noise-amps: the datasheet's e_NI is specified at G = 100 and up
  r_g_1001: {value: 49.95, source: "50 kohm / 1001 [ds INA828 p.5, gain equation]"}

  # --- led.cir: the breath LED's driver (#32)
  v_led_in0: {value: 0.75, source: "the buffered gain input at the ramp's start: the summer (x -4.02) puts BREATH_OUT near -3 V, the LED dark"}
  v_led_in1: {value: -3.2, source: "the ramp's end: BREATH_OUT past its positive clip (clip)"}
  v_led_in2: {value: -1.24, source: "the step's end: BREATH_OUT near +5 V"}
  t_led_ramp: {value: 20.0e-3, source: "a slow ramp: 15 V in 20 ms, quasi-static for the driver"}
  t_led_hold: {value: 21.0e-3}
  t_led_step: {value: 21.002e-3, source: "a 2 us edge from the clip to +5 V: the driver's own loop, out of saturation"}
  t_led_end: {value: 23.0e-3}
  t_led_stepsize: {value: 2.0e-6}
  q_bf: {value: 100.0, source: "Q-LEDB's current gain: hFE 100 min, 300 max at 10 mA, 80 min at 1 mA [ds datasheets/discrete-and-power/NEXPERIA-MMBT3904.pdf Table 7] (vary to 300). The rest of the transistor model is the generic 2N3904 Gummel-Poon [from memory: Is 6.7 fA, Vaf 74 V]: in the loop only beta matters, as the emitter-to-collector ratio. D-LEDB likewise a generic switching diode [assumption: Is 2.5 nA, N 1.8], inside the loop"}
  led_is: {value: 7.0e-28, source: "LED-BREATH as a diode, N 2: 7e-28 A puts 2.95 V at 5 mA, the 2026 catalogue's InGaN die (3 V at 20 mA) [calc; ds DIALIGHT-605-SERIES-PMI-CATALOG-2026-EXCERPT.pdf p.2]; the sweep's 7e-20 is the 2021 catalogue's 2 V part [ds DIALIGHT-605-SERIES-PMI-CATALOG-2021-EXCERPT.pdf]"}
  led_n: {value: 2.0, source: "the same fit [assumption: a typical LED's ideality]"}
  # --- noise.cir, the receive stage's bandwidth mode (#32): 0 wide, 1 1.5 kHz, 2 500 Hz
  bw: {value: 2, source: "SW-BREATH-BW: 2 = Down, 500 Hz (BW1 and BW0); 1 = Center, 1.5 kHz (BW1); 0 = Up, WIDE"}

derived:
  t_step_e: "v['t_step'] + v['t_edge']"
  r_gain_cw: "max(v['POT-GAIN'] * (1 - v['p_gain']), 1e-3)"
  r_gain_ccw: "max(v['POT-GAIN'] * v['p_gain'], 1e-3)"
  r_off_cw: "max(v['POT-OFFSET'] * (1 - v['p_off']), 1e-3)"
  r_off_ccw: "max(v['POT-OFFSET'] * v['p_off'], 1e-3)"
  c_mult: "[1e-15, v['C-FILT-PITCH'], v['C-FILT-MOD-1']][round(v['mult'])]"
  r_mult: "v['R-OUT-PROT-1'] if v['real_mult'] and v['mult'] else v['r_open']"
  inj: "0 if v['rail'] else 1"
  r_close: "1e-3 if v['rail'] else 1e12"
  l_brk: "1e-9 if v['rail'] else 1e9"
  c_inj: "1e-15 if v['rail'] else 1e9"
  # chain.cir's commissioning step: a hard blow as this stage's v_hard (negative) gives it
  v_hard_mag: "-v['v_hard']"
  t_hard_c: "-v['v_hard'] * v['t_ramp'] / v['v_mag']"
  t_hard_c_run: "-v['v_hard'] * v['t_ramp'] / v['v_mag'] + 20e-6"
  # --- the noise sims
  kt4: "4 * 1.380649e-23 * (273.15 + v['temp_c'])"
  # the in-amp's effective gain: 1 + 50k/R_G [ds INA828 p.5] times the bias divider R4/(R4 + R2 + R1b)
  g_eff: "(1 + 50e3 / v['R-GAIN-INAMP']) * v['R4'] / (v['R4'] + v['R2'] + v['R1b'])"
  k_op: "v['k_off'] + (v['v_hard_mag'] / (v['g_eff'] * v['vs_nom']) if v['level'] else 0.0)"
  # TRIM-BREATH-ZERO's wiper where it nulls the pedestal (breath-zero-ref), as two resistors
  r_z_ccw: "v['g_eff'] * v['vs_nom'] * v['k_off'] * (v['R-ZERO-TOP'] + v['TRIM-BREATH-ZERO']) / v['v_avdd']"
  r_z_cw: "v['TRIM-BREATH-ZERO'] - v['g_eff'] * v['vs_nom'] * v['k_off'] * (v['R-ZERO-TOP'] + v['TRIM-BREATH-ZERO']) / v['v_avdd']"
  r_shaper_in: "1 / (1 / v['R-RESP-IN'] + 1 / (v['R-RESP-DIV-HI'] + v['R-RESP-DIV-LO']))"
  # white generators: a 1 kohm resistor's thermal noise times the gain that makes it the density
  # wanted (a 1 kohm node, so rshunt's 10 Gohm cannot load it: an 826 Mohm generator read 8 % low)
  e_sensor: "v['an_counts'] * v['vs_nom'] / 1024 / v['an_crest'] / math.sqrt(v['an_f_hi'] - v['an_f_lo'])"
  g_n_sensor: "v['e_sensor'] / math.sqrt(v['kt4'] * 1e3)"
  e_vs: "v['ref_en_rel'] * v['vs_nom'] / math.sqrt(v['ref_f_hi'] - v['ref_f_lo'])"
  g_n_ref: "v['e_vs'] / math.sqrt(v['kt4'] * 1e3)"
  g_n_set: "v['i_set_rms'] / math.sqrt(v['set_f_hi'] - v['set_f_lo']) * v['R-SET-DAC'] / math.sqrt(v['kt4'] * 1e3)"
  # the link's differential pole, the control band's top: 2 x 11 kohm against C_diff + C_cm/2
  # the switched C_diff in circuit for the mode (U-BW-SW's R_ON, 120-210 ohm, is left out: it moves no
  # corner by 1 %, breath-receive-stage/sim)
  c_diff_mode: "v['C-DIFF-BREATH'] + (v['C-DIFF-BW-1K5'] if v['bw'] >= 1 else 0.0) + (v['C-DIFF-BW-500'] if v['bw'] >= 2 else 0.0)"
  f_cb_hi: "1 / (2 * math.pi * (v['R1'] + v['R3'] + v['R1b'] + v['R2']) * (v['c_diff_mode'] + v['C-CM-IN+'] * v['C-CM-IN-'] / (v['C-CM-IN+'] + v['C-CM-IN-'])))"
  v_adc_lsb: "v['v_adc_ref'] / 4096"
  # the ramp for piece B's slope: at rest (0 to -0.1 V) and +-0.05 V about a hard blow
  v_ramp_end: "-v['v_mag']"
  v_in_r0: "0.0"
  v_in_r1: "-0.1"
  v_in_h0: "-(v['v_hard_mag'] - 0.05)"
  v_in_h1: "-(v['v_hard_mag'] + 0.05)"
  t_r0: "0.0"
  t_r1: "0.1 * v['t_ramp'] / v['v_mag']"
  t_h0: "(v['v_hard_mag'] - 0.05) * v['t_ramp'] / v['v_mag']"
  t_h1: "(v['v_hard_mag'] + 0.05) * v['t_ramp'] / v['v_mag']"
  t_inc_run: "(v['v_hard_mag'] + 0.05) * v['t_ramp'] / v['v_mag'] + 20e-6"

vary:
  R-BREATH-FB:     {tol: from-value}
  R-BREATH-OFF:    {tol: from-value}
  R-BREATH-OFFNEG: {tol: from-value}
  R-BREATH-IN:     {tol: from-value}
  v_avdd:          {tol: [-0.03846, 0.05769], source: "dac-rail's floor 5.00 V to 5.50 V, the DAC8568 C grade's AVDD window (dac-rail's floor note)"}
  v_pos: {tol: [-0.1, 0.05], source: "the analog +12 V from 10.8 V (a tripped PTC-POS12 and D1) to 12.6 V (the bus maximum), as module/power-entry/sim's v_in_dac and pitch-stage/sim; only the *-supply sims name it (#5 finding 6)"}
  v_neg: {tol: [-0.1, 0.05], source: "the analog -12 V, -10.8 to -12.6 V"}

sims:
  - name: offset
    # breath at rest (BREATH_SHAPED 0 V); POT-OFFSET at its ends, its centre and the
    # page's zero (p = 0.432); the op-amp output, and the jack behind R-OUT-PROT
    deck: bos.cir
    set: {t_end: 0.2e-3, t_stepsize: 2.0e-6}
    sweep: {p_off: [0.0, 0.5, 0.432, 1.0]}
    vary: [R-BREATH-FB, R-BREATH-OFF, R-BREATH-OFFNEG, v_avdd]
    measures: [out, jack, page_err]
    post:
      out: "at(w['out'], p['t_end'])"
      jack: "at(w['jack'], p['t_end'])"
      # the page's arithmetic at this corner, wiper source impedance R p (1 - p) included:
      # -R-BREATH-FB x (V_wiper/(R-BREATH-OFF + R p (1-p)) - 12/(2 R-BREATH-OFFNEG)), two halves since #32
      page_err: "at(w['out'], p['t_end']) + p['R-BREATH-FB'] * (p['v_avdd'] * (1 - p['p_off']) / (p['R-BREATH-OFF'] + p['POT-OFFSET'] * p['p_off'] * (1 - p['p_off'])) + p['v_neg'] / (2 * p['R-BREATH-OFFNEG']))"
    asserts:
      - expr: "max['page_err'] < 0.01 and min['page_err'] > -0.01"
        why: "the op-amp output agrees with the page's offset table and its derivation (-4.89 V CCW, +0.61 V at centre, 0 at p = 0.432, +5.06 V CW) within 10 mV at every corner - the wiper's own source impedance is the whole of the centre's offset"
  - name: gain
    # offset at the page's zero; a 1 V breath step (small enough that 4x does not clip);
    # the gain is the op-amp output's change over the input's
    deck: bos.cir
    set: {p_off: 0.432, v_in0: 0.0, v_in1: -1.0, t_end: 0.6e-3}
    sweep: {p_gain: [0.0, 0.47, 1.0]}
    vary: [R-BREATH-FB, R-BREATH-IN]
    measures: [gain]
    post:
      gain: "(at(w['out'], p['t_end']) - at(w['out'], p['t_step'])) / (p['v_in0'] - p['v_in1'])"
    asserts:
      - expr: "min['gain'] > 0.49 and max['gain'] < 4.11"
        why: "the page's 0.5x to 4x at POT-GAIN's ends (4.02 x R-GAIN-FLOOR's 0.125 and 4.02 x 1, R-BREATH-FB/R-BREATH-IN), and 2.16x at noon; 1 % resistors move each end by 2 %"
  - name: clip
    # the page's combination: offset +5 V (POT-OFFSET CW) and gain 4x (POT-GAIN CW), a hard blow
    deck: bos.cir
    set: {p_off: 1.0, p_gain: 1.0, v_in0: 0.0, v_in1: -4.64, t_end: 0.6e-3}
    vary: []
    measures: [out_max, out_min_neg]
    post:
      out_max: "peak(w['out'], 0.5e-3, p['t_end'])"
      out_min_neg: "at(w['out'], 0.19e-3)"
    asserts:
      - expr: "nom['out_max'] > 11.3 and nom['out_max'] < 12.0"
        why: "the page's rail clip: the combination it names stops near +11.5 V, a hard wall short of the rail"
  - name: clip-negative
    # offset -4.9 V (POT-OFFSET CCW) and full gain the other way is not reachable from breath (it only
    # moves the jack positive): the negative extreme is the offset alone, at CW
    deck: bos.cir
    set: {p_off: 0.0, p_gain: 1.0, t_end: 0.2e-3}
    vary: []
    measures: [out]
    post:
      out: "at(w['out'], p['t_end'])"
  - name: step-mult
    # a hard-blow step at the working gain into a passive mult: C-OUT-BREATH is outside
    # the loop behind R-OUT-PROT, so the jack is an RC, whatever it is joined to
    deck: bos.cir
    set: {p_off: 0.432, v_in0: 0.0, v_in1: -4.64, t_end: 3.0e-3}
    sweep: {mult: [0, 1, 2]}
    vary: []
    measures: [overshoot_pct, t_settle]
    post:
      overshoot_pct: "overshoot(w['jack'], p['t_step'], p['t_end'])"
      t_settle: "settling(w['jack'], p['t_step'], p['t_end'], 0.01)"
    asserts:
      - expr: "max['overshoot_pct'] < 1"
        why: "no overshoot into any passive mult: the loop never sees the jack's capacitance"
  - name: loop
    deck: bos-ac.cir
    set: {p_off: 0.432}
    sweep: {mult: [0, 1, 2]}
    vary: []
    measures: [pm, fc]
    post:
      pm: "phase_margin(w['tdb'], w['tph'])"
      fc: "crossover(w['tdb'])"
    asserts:
      - expr: "min['pm'] - 10 > 45"
        why: "the summer's phase margin clears 45 degrees after the +-10 degree screen at every load"
  - name: rail
    # the -12 V rail's movement at breath rates, through R-BREATH-OFFNEG and the summer
    deck: bos-ac.cir
    set: {p_off: 0.432, rail: 1}
    vary: [R-BREATH-FB, R-BREATH-OFFNEG]
    measures: [rail_gain, jack_mv]
    post:
      rail_gain: "at(w['railg'], 10.0)"
      jack_mv: "at(w['railg'], 10.0) * p['rail_mv'] * 1e3"
    asserts:
      - expr: "abs(nom['rail_gain'] / (0.99 * p['R-BREATH-FB'] / math.hypot(2 * p['R-BREATH-OFFNEG'], 2 * math.pi * 10.0 * p['R-BREATH-OFFNEG'] ** 2 * p['C-BREATH-OFFNEG'])) - 1) < 0.05 and max['jack_mv'] < 2.6"
        why: "since #32 the -12 V leg is two halves with C-BREATH-OFFNEG at the split (owner, 2026-10-04: 'Add RC filter (Recommended)'): at 10 Hz the rail reaches the jack by R-BREATH-FB / |2R + j w R^2 C| [calc: 0.236 V/V, 2.3 mV for ADR 0027's 9.7 mV], less the 1 % R-OUT-PROT drop, within 5 %. It was 0.42 V/V and 4.1 mV with the one 95.3k"
  - name: chain-centre
    # the shaper and this stage one after the other, POT-RESP at its centre click, GAIN at
    # noon and OFFSET at its zero: the commissioned setting (breath-output-stage.md,
    # 'Settled 2026-09-30'); TRIM-RESP commissioned (the shaper's sims.yaml)
    deck: chain.cir
    set: {p_resp: 0.5, p_gain: 0.47, p_off: 0.432}
    vary: []
    measures: [out_hard, clip_in]
    post:
      out_hard: "at(w['out'], (-p['v_hard']) * p['t_ramp'] / p['v_mag'])"
      clip_in: "-min(cross(w['out'], peak(w['out'], 0, p['t_ramp']) - 0.05, 0), p['t_ramp']) * p['v_mag'] / p['t_ramp']"
    asserts:
      - expr: "nom['out_hard'] > 9.8 and nom['out_hard'] < 10.2"
        why: "a hard blow reaches about 10 V at the commissioned setting (breath-output-stage.md, 'What it has to do'): the shaper is +1 at its click and GAIN at noon is the 2.16x the page derives"
  - name: chain
    # the same, at five POT-RESP settings with GAIN left at noon: how far a hard blow goes
    # and where BREATH_OUT clips when the curve knob is turned after commissioning.
    # No assertion: whether CW may clip inside real playing is the owner's (A1-1,
    # docs/review/2026-10-01-pre-layout-review/VERIFIED-F1.md). clip_in is the in-amp
    # output BREATH_OUT stops rising at; the in-amp's full scale where it never clips.
    # TRIM-RESP commissioned, as the module is built
    deck: chain.cir
    set: {p_gain: 0.47, p_off: 0.432}
    sweep: {p_resp: [0.0, 0.25, 0.5, 0.75, 1.0]}
    vary: []
    measures: [out_hard, ratio_hard, clip_in]
    post:
      out_hard: "at(w['out'], (-p['v_hard']) * p['t_ramp'] / p['v_mag'])"
      ratio_hard: "at(w['shaped'], (-p['v_hard']) * p['t_ramp'] / p['v_mag']) / p['v_hard']"
      clip_in: "-min(cross(w['out'], peak(w['out'], 0, p['t_ramp']) - 0.05, 0), p['t_ramp']) * p['v_mag'] / p['t_ramp']"
  - name: chain-trim
    # POT-RESP fully clockwise, GAIN at noon, with TRIM-RESP at either end of its travel
    # instead of where commissioning sets it: how far a mis-set trimmer moves the jack's clip
    # (p_trim 1: its end resistance, the strongest bend; 0: its whole track, which is also
    # what an open wiper gives). No assertion, as for chain: whether the exp end may clip
    # inside real playing at noon gain is the owner's (A1-1)
    deck: chain.cir
    set: {p_gain: 0.47, p_off: 0.433, p_resp: 1.0, trimmed: 0}
    sweep: {p_trim: [0.0, 1.0]}
    vary: []
    measures: [out_hard, ratio_hard, clip_in]
    post:
      out_hard: "at(w['out'], (-p['v_hard']) * p['t_ramp'] / p['v_mag'])"
      ratio_hard: "at(w['shaped'], (-p['v_hard']) * p['t_ramp'] / p['v_mag']) / p['v_hard']"
      clip_in: "-min(cross(w['out'], peak(w['out'], 0, p['t_ramp']) - 0.05, 0), p['t_ramp']) * p['v_mag'] / p['t_ramp']"
  # --- THE BREATH LED (#32, owner 2026-10-04): its driver reads BREATH_OUT inside this stage's loop
  - name: led
    # copy A of the stage carries the driver, copy B does not; one source drives both through a
    # slow ramp from the LED dark to the positive clip, then a step back to +5 V. OFFSET at its
    # zero; Q-LEDB's beta at the datasheet's ends; both catalogues' LEDs
    deck: led.cir
    set: {p_off: 0.432}
    sweep: {led_is: [7.0e-28, 7.0e-20]}
    vary: [q_bf, R-BREATH-FB, R-BREATH-IN]
    measures: [dj_max, dj_min, i_off, i_5, i_10, i_max, i_ovs_pct]
    post:
      # the driver's effect on the jack, unclipped (BREATH_OUT under 11 V)
      dj_max: "peak(w['dj'], 0, cross(w['outa'], 11.0))"
      dj_min: "trough(w['dj'], 0, cross(w['outa'], 11.0))"
      i_off: "peak(w['iled'], 0, cross(w['outa'], 0.0))"
      i_5: "at(w['iled'], cross(w['outa'], 5.0))"
      i_10: "at(w['iled'], cross(w['outa'], 10.0))"
      i_max: "peak(w['iled'], 0, p['t_led_hold'])"
      i_ovs_pct: "overshoot(w['iled'], p['t_led_step'], p['t_led_end'])"
    asserts:
      - expr: "abs(max['dj_max']) < 153e-6 and abs(min['dj_min']) < 153e-6"
        why: "THE CV'S BUDGET: the driver moves the jack by under 1 LSB of 10 V at 16 bits (153 uV, the yardstick breath-link-cmrr is held to) anywhere in the unclipped range, at every corner: it loads BREATH_OUT, inside the summer's loop, with 110 kohm and a pA input"
      - expr: "max['i_off'] < 1e-6"
        why: "dark at rest and below: under 1 uA wherever BREATH_OUT is at or under 0 V"
      - expr: "min['i_10'] > 4.5e-3 and max['i_10'] < 5.6e-3"
        why: "about the power LED's current at a 10 V jack: 10/11/180 ohm = 5.05 mA, within 10 % across beta and both LEDs (the emitter current is set; the collector loses I_B)"
      - expr: "max['i_max'] < 6.3e-3"
        why: "THE CAP: at the positive clip (BREATH_OUT at the OPA2197's swing) the LED takes no more than 6.3 mA, inside both catalogues' ratings (15 and 20 mA)"
      - expr: "max['i_ovs_pct'] < 10"
        why: "the driver's own loop (U-REF-BUF B through D-LEDB and Q-LEDB's emitter follower) settles a 2 us edge with under 10 % overshoot: it does not ring"
  # --- NOISE (pre-layout review A1-16: the jack's noise was an estimate)
  - name: noise
    # the whole chain, sensor to jack, GAIN at noon and OFFSET at its zero, TRIM-RESP
    # commissioned; POT-RESP at CCW, its centre click and CW; breath at rest and at a hard
    # blow. Measures in V rms over the audio band (n_au_*, 20 Hz-20 kHz) and the control band
    # (n_cb_*, 1 Hz to the link's pole, f_cb_hi), the total and each stage's share: sensor,
    # ref (VS's noise through the sensor's ratio), sbuf (U-BUF B), link (R1, R1b), recv (the
    # INA828, R_G, R2-R5), zero (TRIM-BREATH-ZERO, R-ZERO-TOP, U-REF-BUF), dac (DAC_AVDD by
    # both its paths), shaper, out (this stage and the 100 kohm load), rest (what no stage
    # claims); elec is everything but the sensor. db_* is 20 log(n / v_jack_fs), ppm_* the
    # same as parts per million of it. e_* are the jack's density, V/rtHz, at 100 Hz and 1 kHz.
    # n_adc_* is the instrument's ADC_IN, 1 Hz-1 MHz, total and in MCP3202 LSBs.
    deck: noise.cir
    set: {p_gain: 0.47, p_off: 0.432}
    sweep: {bw: [2, 1, 0], p_resp: [0.0, 0.5, 1.0], level: [0, 1]}
    vary: []
    measures: [g_set, g_inc_rest, g_inc_hard, r_b, ina_op, jack_op,
               n_au_total, n_au_sensor, n_au_elec, n_au_ref, n_au_sbuf, n_au_link, n_au_recv, n_au_zero, n_au_dac, n_au_shaper, n_au_out, n_au_rest, db_au, ppm_au,
               n_cb_total, n_cb_sensor, n_cb_elec, n_cb_ref, n_cb_sbuf, n_cb_link, n_cb_recv, n_cb_zero, n_cb_dac, n_cb_shaper, n_cb_out, n_cb_rest, db_cb, ppm_cb,
               e_100, e_1k, e_1k_elec, n_adc_total, n_adc_sensor, n_adc_lsb, e_sens_chk]
    post:
      e_100: "at(w['jackn'], 100.0)"
      e_1k: "at(w['jackn'], 1000.0)"
      e_1k_elec: "at(w['jackne'], 1000.0)"
    asserts:
      - expr: "nom['n_au_rest'] < 0.01 * nom['n_au_total'] and nom['n_cb_rest'] < 0.01 * nom['n_cb_total']"
        why: "the bookkeeping closes: every noise source in the deck is in a named stage (under 1 % of the total is unclaimed)"
      - expr: "abs(nom['e_sens_chk'] / p['e_sensor'] - 1) < 0.01"
        why: "the sensor's generator is the density sims.yaml derives, read back at the sensor's output within 1 %"
      - expr: "nom['r_b'] < 0.2 or (nom['n_cb_elec'] < 0.1 * nom['n_cb_sensor'] and nom['n_au_elec'] < 0.15 * nom['n_au_sensor'])"
        why: "THE JACK'S NOISE IS THE SENSOR'S (breath-receive-stage.md, Noise at the jack): every electronic term together is under a tenth of the sensor's in the control band, and under 0.15 of it in the audio band, at every bandwidth mode, curve setting and level. The audio band's bound was a tenth until #32: with the jack's RC at 15.9 kHz this stage's own noise reaches 20 kHz unfiltered (about 12 uV rms, -118 dB of 10 V), and at POT-RESP fully counter-clockwise on a hard blow in the 500 Hz mode, where the curve is flattest and the sensor's share smallest, it is 0.12 of the sensor's - on AN1646's figure, an assumption (sims.yaml); E11 measures it. Except where BREATH_OUT is clipped (r_b, the curve's slope there over its slope at rest, under 0.2): POT-RESP fully clockwise at noon gain clips a hard blow (breath-chain-curve-clip), and a jack on its rail passes no breath noise at all"
      - expr: "nom['n_adc_lsb'] < 1"
        why: "the instrument's own copy (ADC_IN behind C-AA-ADC) carries under 1 LSB rms of the MCP3202 at 3.3 V from the sensor and the electronics together"
  - name: noise-amps
    # TI's OPA2197 and INA828 models, quieted as noise.cir quiets them, against their datasheets
    deck: noise-amps.cir
    vary: []
    measures: [opa_1k, opa_1k_unquiet, ina_eno_1k, ina_eni_1k]
    asserts:
      - expr: "nom['opa_1k'] > 0.8 * 5.5 and nom['opa_1k'] < 1.25 * 5.5"
        why: "the quieted OPA2197 is its datasheet's 5.5 nV/rtHz at 1 kHz [datasheets/analog/OPA2197.pdf p.1] within 25 %"
      - expr: "nom['opa_1k_unquiet'] > 100"
        why: "and without the R_NOISELESS lists it is off by two orders of magnitude (ngspice 42 ignores PSpice's T_ABS): the lists are why the chain's numbers mean anything"
      - expr: "nom['ina_eno_1k'] > 0.6 * 90 and nom['ina_eno_1k'] < 90 and nom['ina_eni_1k'] > 0.6 * 7 and nom['ina_eni_1k'] < 7"
        why: "RECORDED: TI's INA828 model reads UNDER its datasheet's typicals, e_NO 90 nV/rtHz and e_NI 7 nV/rtHz at 1 kHz [datasheets/analog/INA828IDR.pdf p.5] - by about a quarter and an eighth. The chain's in-amp term is that much optimistic; the sensor assertion in `noise` has more margin than that"
  - name: noise-ref
    # TI's REF5050 model and U-BUF half A, as netlisted, alone: the excitation noise.cir replaces
    deck: noise-ref.cir
    vary: []
    measures: [vs_op, vs_rms_10_1k, vs_rms_au, e_vs_100, e_vs_1k]
    post:
      e_vs_100: "at(w['vsn'], 100.0)"
      e_vs_1k: "at(w['vsn'], 1000.0)"
    asserts:
      - expr: "abs(nom['vs_op'] - 5.0) < 2.5e-3"
        why: "the operating point is the running reference (the reference sims' ref-startup test), not a collapsed one"
      - expr: "nom['vs_rms_10_1k'] > 2 * p['ref_en_rel'] * p['vs_nom']"
        why: "RECORDED: TI's REF5050 model (2011; its notes claim the 0.1-10 Hz noise only) is several times NOISIER at VS than the datasheet's 0.9 uVrms/V over 10 Hz-1 kHz [datasheets/analog/REF5050.pdf], almost all of it one 1.6 Mohm resistor in the model. noise.cir uses the datasheet; the README says what the jack would carry at the model's level"
  # --- #5 finding 6: the rails at their ends, 10.8 to 12.6 V each way, not +-12.000 V.
  # Each sim below is one above with only the rails varied, so what moves is the supply's
  - name: offset-supply
    # breath at rest, POT-OFFSET at the page's zero: R-BREATH-OFFNEG's leg is ON -12 V, so the
    # rest level moves with that rail by R-BREATH-FB/R-BREATH-OFFNEG (breath-output-stage.md,
    # 'Why -12 V is acceptable here'). out is that rest level; POT-OFFSET trims it out
    deck: bos.cir
    set: {t_end: 0.2e-3, t_stepsize: 2.0e-6, p_off: 0.432}
    vary: [v_pos, v_neg]
    measures: [out, jack, page_err]
    post:
      out: "at(w['out'], p['t_end'])"
      jack: "at(w['jack'], p['t_end'])"
      page_err: "at(w['out'], p['t_end']) + p['R-BREATH-FB'] * (p['v_avdd'] * (1 - p['p_off']) / (p['R-BREATH-OFF'] + p['POT-OFFSET'] * p['p_off'] * (1 - p['p_off'])) + p['v_neg'] / (2 * p['R-BREATH-OFFNEG']))"
    asserts:
      - expr: "max['page_err'] < 0.01 and min['page_err'] > -0.01"
        why: "the page's offset arithmetic, -12 V's term included, holds within 10 mV at every rail corner: the rest level moves by exactly R-BREATH-FB/R-BREATH-OFFNEG times the -12 V rail's error, and nothing else"
      - expr: "max['out'] < 0.6 and min['out'] > -0.6"
        why: "the rest level stays inside +-0.6 V at every rail corner (0.42 x -1.2..+0.6 V of rail [calc]) - inside POT-OFFSET's +-5 V reach, so the player's own zero trim recovers it"
  - name: chain-centre-supply
    # the commissioned chain (as chain-centre) at the rails' ends: the span from rest to a
    # hard blow, and whether the low rail clips it
    deck: chain.cir
    set: {p_resp: 0.5, p_gain: 0.47, p_off: 0.432}
    vary: [v_pos, v_neg]
    measures: [out_hard, out_rest, span_hard, clip_in]
    post:
      out_hard: "at(w['out'], (-p['v_hard']) * p['t_ramp'] / p['v_mag'])"
      out_rest: "at(w['out'], 0.002 * p['t_ramp'])"
      span_hard: "at(w['out'], (-p['v_hard']) * p['t_ramp'] / p['v_mag']) - at(w['out'], 0.002 * p['t_ramp'])"
      clip_in: "-min(cross(w['out'], peak(w['out'], 0, p['t_ramp']) - 0.05, 0), p['t_ramp']) * p['v_mag'] / p['t_ramp']"
    asserts:
      - expr: "min['span_hard'] > 9.8 and max['span_hard'] < 10.2"
        why: "rest to a hard blow is still about 10 V at every rail corner: the rails move the rest level (offset-supply), not the span, and 10.8 V does not clip a hard blow"
