# The breath link's two ESD diodes, D-TVS-BREATH-SIG and D-TVS-BREATH-RET (PESD12VL1BA since #32, at
# J-UMB, to PWR_GND): the one part of this circuit breath-receive-stage/sim's CMRR deck
# leaves out. Values from both ends' netlists - this circuit (R1, R1b) and
# module/breath-receive-stage (the rest); the receive deck's operating point is taken from
# its sims.yaml (params_from). Run:
#   python3 tools/sim.py run hardware/interfaces/breath-sense-link/sim
#
# WHY IT IS A QUESTION. Each diode is 19 pF at 0 V and about 13 pF at 5 V
# [ds NEXPERIA-PESDXL1BA-SER.pdf Fig 6] (it was the PESD12VS1UA's 160 pF until #32). The return leg sits at 0 V and the signal leg
# anywhere in the sensor's span, so the two never match - a mismatched capacitance to a
# third ground (PWR_GND) behind a 1 kohm source is exactly the common-mode-to-differential
# converter breath-sense-link.md warns about for C_cm. And each leaks, up to 100 nA at
# 12 V, through R1 into the signal.
title: Breath link with its TVS diodes - CMRR, PWR_GND rejection, leakage
values:
  netlist:
    - hardware/interfaces/breath-sense-link/netlist.yaml
    - hardware/module/breath-receive-stage/netlist.yaml
models:
  - datasheets/analog/INA828-ti-pspice-sbomag5c.lib
  - datasheets/analog/OPAx197-ti-pspice-sboma34d.lib
params_from: [hardware/module/breath-receive-stage/sim/sims.yaml]
spiceinit: [set ngbehavior=psa]

params:
  tvs:      {value: 1, source: "1: both diodes fitted, as netlisted; 0: both out (the receive deck's circuit)"}
  cj_sig:   {value: 19.0e-12, source: "PESD12VL1BA Cd at 0 V, 19 pF typ, no min or max [ds NEXPERIA-PESDXL1BA-SER.pdf p.5, Table 8] (vary -25 % to +25 %, each diode on its own [assumption])"}
  cj_ret:   {value: 19.0e-12, source: "the same part on the return leg (vary on its own)"}
  tvs_vj:   {value: 1.20, source: "junction potential fitted to Fig 6 (typical, p.7): C = Cjo / (1 + V/Vj)^M through 19 pF at 0 V and the curve's ~16.3, 15, 13.7, 12.6, 11.7 and 10.7 pF at 1, 2, 4, 6, 8 and 12 V [calc: least squares, Vj 1.20 V, M 0.235; the fit gives 16.5, 15.1, 13.5, 12.5, 11.8, 10.8 pF]. A bidirectional part modelled as one junction: Fig 6 is the device's capacitance against its reverse voltage, which is what the deck needs"}
  tvs_m:    {value: 0.235, source: "grading coefficient, the same fit"}
  tvs_bv:   {value: 14.2, source: "V_BR min at 5 mA [ds p.5]"}
  i_rm:     {value: 50.0e-9, source: "reverse leakage, 50 nA max at V_RWM = 12 V, 25 C (under 1 nA typ) [ds p.5]: the signal leg's, taken whole at any voltage under it (conservative), to PWR_GND"}

derived:
  m_tvs: "1.0 if v['tvs'] else 1e-6"
  i_rm_on: "v['i_rm'] if v['tvs'] else 0.0"

vary:
  cj_sig: {tol: [-0.25, 0.25]}
  cj_ret: {tol: [-0.25, 0.25]}
  R1:     {tol: from-value}
  R1b:    {tol: from-value}

sims:
  # Since #32 the differential filter has three modes (SW-BREATH-BW through U-BW-SW, the receive
  # deck's switch block): each is run, and each is held to the requirement over its own band.
  - name: with-tvs-500
    # as netlisted, across the sensor's span (breath-sense-link.md, 'The gain, derived':
    # 0.265 V to 4.86 V). Its bottom is not run: TI's INA828 model finds no operating point
    # there (ngspice falls back to a transient op, which tools/sim.py refuses). It is the
    # benign end - at 0.265 V the signal diode is ~140 pF against the return's 160 pF, a
    # smaller mismatch than at 1 V (~123 pF) [calc, the fit below]
    deck: tvs.cir
    set: {en_1k5: 1, en_500: 1}
    sweep: {v_sensor: [1.0, 2.5, 4.86]}
    measures: &meas [cmrr_50, cmrr_60, cmrr_500, cmrr_1k5, cmrr_10k, pgrr_50, pgrr_500, pgrr_100k, pg_gain_max, pg_gain_f, pg_band_500, pg_band_1k5, pg_band_10k, pg_band_7k, dv_leak]
    post: &post
      # rejection, dB: the signal's gain over the excitation's, both to the INA828 output
      cmrr_50: "20 * math.log10(at(w['gdm'], 50) / at(w['gcm'], 50))"
      cmrr_60: "20 * math.log10(at(w['gdm'], 60) / at(w['gcm'], 60))"
      cmrr_500: "20 * math.log10(at(w['gdm'], 500) / at(w['gcm'], 500))"
      cmrr_1k5: "20 * math.log10(at(w['gdm'], 1500) / at(w['gcm'], 1500))"
      cmrr_10k: "20 * math.log10(at(w['gdm'], 1e4) / at(w['gcm'], 1e4))"
      pgrr_50: "20 * math.log10(at(w['gdm'], 50) / at(w['gpg'], 50))"
      pgrr_500: "20 * math.log10(at(w['gdm'], 500) / at(w['gpg'], 500))"
      pgrr_100k: "20 * math.log10(at(w['gdm'], 1e5) / at(w['gpg'], 1e5))"
      # PWR_GND to the in-amp output, V/V, at its worst frequency from 1 Hz to 1 MHz, and where
      pg_gain_max: "peak(w['gpg'], 1, 1e6)"
      pg_gain_f: "argpeak(w['gpg'], 1, 1e6)"
      # the same, inside each mode's band (#32), recorded: the diodes' mismatch converts PWR_GND
      # noise in proportion to frequency, which no receive filter undoes inside its own band
      pg_band_500: "peak(w['gpg'], 1, 500)"
      pg_band_1k5: "peak(w['gpg'], 1, 1500)"
      pg_band_10k: "peak(w['gpg'], 1, 1.0e4)"
      pg_band_7k: "peak(w['gpg'], 1, 7.0e3)"
    asserts: &asserts
      - expr: "min['cmrr_50'] > 58.5 and min['cmrr_60'] > 58.5"
        why: "with both diodes fitted, mismatched by their bias, the link still clears breath-sense-link.md's 58.5 dB at the mains fundamental, at every corner here"
      - expr: "max['pg_band_500'] < 1e-3"
        why: "noise on PWR_GND against the instrument's analog ground reaches the in-amp's output only through the diodes' mismatch, at under 1/1000 (-60 dB) everywhere inside this mode's band, DC to 500 Hz, at every corner: 10 mV on the plane is under 10 uV at the output. Scoped to the band since #32 (owner, 2026-10-04, ADR 0003 amendment: 'Accept (Recommended)'): above the band the peak is recorded, pg_gain_max, not held"
      - expr: "max['pg_gain_max'] > 1e-3"
        why: "RECORDED, not a requirement: out of band (~70 kHz to 1 MHz) the peak is over 1e-3 since C_cm went to 68 pF (#32), the common-mode pole ~213 kHz rather than ~9.6 kHz. The owner accepted it (2026-10-04, ADR 0003). If this starts failing the HF path has changed: re-read breath-receive-stage.md, Still open"
      - expr: "abs(max['dv_leak']) < 1e-3 and abs(min['dv_leak']) < 1e-3"
        why: "the signal diode's worst 25 C leakage, 50 nA through R1, moves the in-amp output by under 1 mV - inside what TRIM-BREATH-ZERO nulls; it grows with temperature [ds Figure 6]"
  - name: with-tvs-1k5
    deck: tvs.cir
    set: {en_1k5: 1, en_500: 0}
    sweep: {v_sensor: [1.0, 2.5, 4.86]}
    measures: *meas
    post: *post
    asserts:
      - expr: "min['cmrr_50'] > 58.5 and min['cmrr_1k5'] > 58.5"
        why: "in the 1.5 kHz mode the diodes leave the link above 58.5 dB at mains and at the mode's 1.5 kHz top, at every corner here"
      - expr: "max['pg_band_1k5'] < 1e-3"
        why: "PWR_GND to the in-amp output under -60 dB inside this mode's band, DC to 1.5 kHz, at every corner (scoped to the band, owner 2026-10-04: 'Accept (Recommended)', ADR 0003)"
  - name: with-tvs-wide
    deck: tvs.cir
    set: {en_1k5: 0, en_500: 0}
    sweep: {v_sensor: [1.0, 2.5, 4.86]}
    measures: *meas
    post: *post
    asserts:
      - expr: "min['cmrr_50'] > 58.5 and min['cmrr_10k'] > 58.5"
        why: "in the wide mode the diodes leave the link above 58.5 dB at mains and at the mode's 10 kHz top, at every corner here"
      - expr: "max['pg_band_7k'] < 1.9e-3"
        why: "RECORDED AND ACCEPTED, NOT THE -60 dB BAR (owner, 2026-10-04, ADR 0003 amendment: 'Accept (Recommended)' - 'In wide mode it's about 4x better with a lower-capacitance diode, so take that too'): inside WIDE's requirement band, DC to 7 kHz (the owner's 'Keep 10 kHz, accept', the same amendment), the 19 pF diodes' mismatch leaves about 1e-3 at the worst corner. Held under the 1.9e-3 the owner was shown for the lower-capacitance diode, so a worse part cannot slip in; pg_band_10k is recorded"
  - name: without-tvs
    # both diodes out: the receive deck's circuit, here for the difference
    deck: tvs.cir
    set: {tvs: 0, en_1k5: 0, en_500: 0}
    sweep: {v_sensor: [1.0, 2.5, 4.86]}
    vary: [R1, R1b]
    measures: [cmrr_50, cmrr_60, cmrr_500, cmrr_1k5, cmrr_10k]
    post: *post
