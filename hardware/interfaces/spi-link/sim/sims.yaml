# The SPI link over the umbilical: SCLK, MOSI and CS_MOD from the ESP32-S3's pads, with
# U-TVS-SPI on the pad side of R-SPI-SER, from J-UMB down 2 m of Cat5e to the module; at
# the module each line's pull at the cable node, then R-RX-MOD and C-RX-MOD into the first
# Schmitt gate of U-RX-MOD (74AHCT14), the link's receiver. Values from the netlists the
# link runs through: the carrier's (R-SPI-SER-*, R-CS-PULL-INST) and the module's
# digital-and-supervision (R-PULL-SCLK, R-PULL-MOSI, R-PULL-CS, R-RX-MOD, C-RX-MOD). The
# cable is Belden 1752A, a stranded 24 AWG Cat5e patch cable, banked (fragment R38). Run:
#   python3 tools/sim.py run hardware/interfaces/spi-link/sim
#
# THE CABLE IS TWO DIFFERENT LINES.
#  - CS_MOD shares pair 7/8 with DIG_GND, its own return: a single 100-ohm line, the
#    pair's differential impedance [ds].
#  - SCLK and MOSI share pair 4/5 with EACH OTHER, and their return is on other pairs
#    (DIG_GND, PWR_GND). They are two COUPLED lines over that return: the odd mode is
#    half the pair's differential impedance [ds]; the even mode (both conductors
#    together against the return, twice the pair's common-mode impedance) is in no
#    datasheet and is SWEPT over a stated range (z_cm). ngspice's CPL line carries both.
#
# THE RECEIVER IS A SCHMITT INPUT, and it is tested the way tools/sim.py's backswing()
# describes: its thresholds can sit anywhere in the datasheet's spread, so an edge must
# (1) swing back less than the smallest hysteresis while it is inside the threshold band,
# and (2) once past the band's far end, never come back to the band's near end. Together
# those rule out a second edge for every threshold pair the part can have [calc]. A
# static line must stay on its own side of the band's near end.
title: SPI link - SCLK, MOSI and CS_MOD over the umbilical, into U-RX-MOD
values:
  netlist:
    - hardware/carrier/netlist.yaml
    - hardware/module/digital-and-supervision/netlist.yaml

params:
  vdd:     {value: 3.3, source: "the ESP32-S3's IO supply, the Matrix's 3V3 [datasheets/logic/ESP32-S3-datasheet-v2.2.pdf p.65]"}
  v5:      {value: 5.0, source: "LOGIC_5V, U-REG-LOGIC's rail (the top of R-PULL-CS) [module/power-entry]"}
  r_drv:   {value: 35.0, source: "the ESP32-S3's GPIO at its default 20 mA setting (IO34-36 are not GPIO17-20: the pin table's note 5, p.17); 17 ohm at PAD_DRIVER 3 [calc: (3.3 - 2.64) V / 40 mA and 0.495 V / 28 mA, p.65]. Espressif publishes no IBIS (vary). The same model as key-chain-loom/sim"}
  tr_drv:  {value: 3.0e-9, source: "the GPIO's own edge, unpublished; 1-3 ns swept (vary) [UNVERIFIED], as key-chain-loom/sim"}
  c_tvs:   {value: 30.0e-12, source: "U-TVS-SPI (SP0504BAHT) capacitance per channel, typical at 2.5 V, 1 MHz [datasheets/discrete-and-power/SP0504BAHT.pdf p.2]; only a typical is given (vary)"}
  c_inst:  {value: 5.0e-12, source: "the main board's trace from R-SPI-SER to J-UMB and the adapter's to the etherCON [assumption: a few cm over the layer-2 plane]"}
  c_rx:    {value: 2.0e-12, source: "U-RX-MOD's input capacitance Ci, 2 pF typical, 10 pF max [datasheets/logic/SN74AHCT14.pdf p.5] (vary)"}
  c_mod:   {value: 5.0e-12, source: "the module board's trace from its etherCON to R-RX-MOD [assumption]"}
  len:     {value: 2.0, source: "the umbilical, 2 m (ADR 0004; CABLE-UMB row)"}
  z_diff:  {value: 100.0, source: "Belden 1752A input impedance 100 +/- 12 ohm, 1-20 MHz [datasheets/connectors/BELDEN-1752A-CAT5E-PATCH-24AWG-STRANDED.pdf p.1] (vary)"}
  nvp:     {value: 0.70, source: "Belden 1752A nominal velocity of propagation 70 % [same]; max delay 537.6 ns/100 m is 0.62 c"}
  r_per_m: {value: 0.09, source: "Belden 1752A max conductor DCR, 90 ohm/km at 24 AWG [same]. CABLE-UMB's gauge is open (26-28 AWG is 1.6-2.6x): immaterial here, 0.5 ohm against 100"}
  z_cm:    {value: 100.0, source: "pair 4/5's common-mode impedance against the other pairs (its two conductors together, returning on DIG_GND and PWR_GND). IN NO DATASHEET: estimated 70-140 ohm [calc: a two-wire line of the pair's equivalent radius, sqrt(0.25 x 0.9) = 0.47 mm, against one 0.25 mm return 1.8 mm away in epsilon_r = 1/0.70^2, is (60/1.43) ln(1.8^2/(0.47 x 0.25)) = 139 ohm, and lower with more returns in parallel]; swept 70, 100 and 140"}
  f_clk:   {value: 2.0e6, source: "SPI2's clock for the DAC, 2 MHz (spi-link.md, 'The two SPI hosts'; latency-budget.md)"}
  mosi_hi: {value: 0, source: "MOSI's level while SCLK toggles: 0 low, 1 high (each sim sets it)"}
  opp:     {value: 0, source: "1: MOSI changes on SCLK's rising edge, the other way (the DAC clocks data in on SCLK falling [ds DAC8568CIPW.pdf p.6], so a mode-1 host launches it on the rising edge)"}
  t_end:   {value: 1.1e-6}
  tvs_line: {value: 0, source: "0: U-TVS-SPI on the pad side of R-SPI-SER, as netlisted; 1: a WHAT-IF, the same part on the line side at J-UMB, where it was before 2026-09-30"}
  no_rc:   {value: 0, source: "0: R-RX-MOD and C-RX-MOD as netlisted; 1: a WHAT-IF with both taken out, U-RX-MOD's input straight on the cable node"}
  vil:     {value: 0.8, source: "a plain TTL input's V_IL max, the 74AHCT125's [SN74AHCT125.pdf p.3]: what the cable node is held to where no Schmitt stage is assumed"}
  vih:     {value: 2.0, source: "a plain TTL input's V_IH min [same]"}
  vtp_min: {value: 0.9, source: "U-RX-MOD's positive-going threshold V_T+, lowest: 0.9 V at VCC 4.5 V (1.0 V at 5.5 V) [SN74AHCT14.pdf p.5], -40 to 125 C"}
  vtp_max: {value: 2.1, source: "V_T+, highest: 2.1 V at VCC 5.5 V (1.9 V at 4.5 V) [same]"}
  vtm_min: {value: 0.5, source: "negative-going threshold V_T-, lowest: 0.5 V at VCC 4.5 V [same]"}
  vtm_max: {value: 1.7, source: "V_T-, highest: 1.7 V at VCC 5.5 V (1.5 V at 4.5 V) [same]"}
  hyst_min: {value: 0.4, source: "V_T+ - V_T-, least: 0.4 V at 4.5 and 5.5 V [same]"}

derived:
  c_tvs_line: "v['c_tvs'] if v['tvs_line'] else 1e-15"
  c_tvs_pad: "1e-15 if v['tvs_line'] else v['c_tvs']"
  r_rx: "1e-3 if v['no_rc'] else v['R-RX-MOD']"
  c_rxf: "1e-15 if v['no_rc'] else v['C-RX-MOD']"
  v_c: "299792458.0 * v['nvp']"
  z_o: "v['z_diff'] / 2"
  z_e: "2 * v['z_cm']"
  # coupled-line matrices from the two modes, for a homogeneous line [calc]:
  # Ls +- Lm = Z_e,o / v; Cs -+ Cm = 1 / (Z_e,o v)
  l_s: "(v['z_e'] + v['z_o']) / v['v_c'] / 2"
  l_m: "(v['z_e'] - v['z_o']) / v['v_c'] / 2"
  c_s: "(1/(v['z_e']*v['v_c']) + 1/(v['z_o']*v['v_c'])) / 2"
  c_m: "-(1/(v['z_o']*v['v_c']) - 1/(v['z_e']*v['v_c'])) / 2"
  # CS against DIG_GND in its own pair: one line of the pair's differential impedance
  l_1: "v['z_diff'] / v['v_c']"
  c_1: "1 / (v['z_diff'] * v['v_c'])"
  t_half: "0.5 / v['f_clk']"
  t_r1: "50e-9"
  t_f1: "50e-9 + 0.5 / v['f_clk']"
  t_r2: "50e-9 + 1.0 / v['f_clk']"
  t_f2: "50e-9 + 1.5 / v['f_clk']"
  t_per: "1.0 / v['f_clk']"
  t_hi: "0.5 / v['f_clk'] - v['tr_drv']"
  t_r2_e: "v['t_r2'] + v['tr_drv']"
  t_fall_e: "50e-9 + v['tr_drv']"
  t_rise_e: "600e-9 + v['tr_drv']"
  mosi0: "v['vdd'] * v['mosi_hi']"
  mosi1: "v['vdd'] * (1 - v['mosi_hi']) if v['opp'] else v['vdd'] * v['mosi_hi']"

vary:
  r_drv:  {tol: [-0.5, 0.0]}
  tr_drv: {tol: [-0.67, 0.0]}
  c_tvs:  {tol: [-0.33, 0.33]}
  c_rx:   {tol: [0.0, 4.0]}
  z_diff: {tol: [-0.12, 0.12]}
  C-RX-MOD: {tol: [-0.05, 0.05]}

sims:
  - name: cs-edges
    # CS_MOD falls (a frame starts) and rises (it ends), as netlisted
    deck: cs.cir
    measures: [line_fall_back, line_rise_back, fall_peak_margin, fall_band_bs, rise_trough_margin, rise_band_bs, in_min, in_max, line_max]
    post: &cs_post
      # at the cable node, against a plain TTL input's thresholds (recorded): what moving U-TVS-SPI and R-SPI-SER did there
      line_fall_back: "peak(w['rx'], cross(w['rx'], p['vil'], 40e-9), 540e-9) - p['vil']"
      line_rise_back: "p['vih'] - trough(w['rx'], cross(w['rx'], p['vih'], 590e-9), p['t_end'])"
      # at U-RX-MOD's input, against its whole threshold spread
      fall_peak_margin: "p['vtp_min'] - peak(w['cin'], cross(w['cin'], p['vtm_min'], 40e-9), 540e-9)"
      fall_band_bs: "backswing(w['cin'], p['vtm_max'], False, 40e-9, cross(w['cin'], p['vtm_min'], 40e-9))"
      rise_trough_margin: "trough(w['cin'], cross(w['cin'], p['vtp_max'], 590e-9), p['t_end']) - p['vtm_max']"
      rise_band_bs: "backswing(w['cin'], p['vtp_min'], True, 590e-9, cross(w['cin'], p['vtp_max'], 590e-9))"
      in_min: "trough(w['cin'], 0, p['t_end'])"
      in_max: "peak(w['cin'], 0, p['t_end'])"
      line_max: "peak(w['rx'], 0, p['t_end'])"
    asserts:
      - expr: "min['fall_peak_margin'] > 0 and max['fall_band_bs'] < p['hyst_min'] and min['rise_trough_margin'] > 0 and max['rise_band_bs'] < p['hyst_min']"
        why: "cs-fall-reentry, the owner's fix (2026-09-30): at U-RX-MOD's input neither CS_MOD edge can make a second one, for any threshold pair in the 74AHCT14's spread (sims.yaml header), at any corner. At the cable node the falling edge can still come back over a plain TTL V_IL at the worst corner (line_fall_back, recorded): the Schmitt stage and its RC are what close it, not U-TVS-SPI's move alone"
      - expr: "min['in_min'] > -0.5 and max['in_max'] < 5.5 and max['line_max'] < 5.5"
        why: "inside the Schmitt input's 0-5.5 V operating range less its -0.5 V clamp [SN74AHCT14.pdf p.4], at every corner"
  - name: cs-edges-tvs-line
    # A WHAT-IF, the link as it was before 2026-09-30: U-TVS-SPI on the line side of
    # R-SPI-SER, at 100 ohm, and no RC at the receiver. Recorded, not asserted
    deck: cs.cir
    set: {tvs_line: 1, no_rc: 1, R-SPI-SER-CS: 100}
    measures: [line_fall_back, line_rise_back]
    post: *cs_post
  - name: pair-mosi-low
    # SCLK toggles at 2 MHz; MOSI is held low by its own driver through its R-SPI-SER.
    # What reaches MOSI's receiver at SCLK's edges - including the falling edge, on which
    # the DAC clocks DIN in [ds DAC8568CIPW.pdf p.6]
    deck: pair.cir
    set: {mosi_hi: 0}
    sweep: {z_cm: [70, 100, 140]}
    measures: &pair_meas [mosi_in_peak, mosi_line_peak, mosi_margin, s_rise_trough, s_rise_bs, s_fall_peak, s_fall_bs, s_delay_min, s_delay_max, in_min, in_max]
    post: &pair_post
      mosi_in_peak: "peak(w['min'], 40e-9, p['t_end'])"
      mosi_line_peak: "peak(w['mrx'], 40e-9, p['t_end'])"
      mosi_margin: "(p['vtp_min'] - peak(w['min'], 40e-9, p['t_end'])) if p['mosi_hi'] < 0.5 else (trough(w['min'], 40e-9, p['t_end']) - p['vtm_max'])"
      s_rise_trough: "trough(w['sin'], cross(w['sin'], p['vtp_max'], p['t_r1']), p['t_f1']) - p['vtm_max']"
      s_rise_bs: "backswing(w['sin'], p['vtp_min'], True, p['t_r1'], cross(w['sin'], p['vtp_max'], p['t_r1']))"
      s_fall_peak: "p['vtp_min'] - peak(w['sin'], cross(w['sin'], p['vtm_min'], p['t_f1']), p['t_r2'])"
      s_fall_bs: "backswing(w['sin'], p['vtm_max'], False, p['t_f1'], cross(w['sin'], p['vtm_min'], p['t_f1']))"
      s_delay_min: "cross(w['sin'], p['vtp_min'], p['t_r1']) - p['t_r1']"
      s_delay_max: "cross(w['sin'], p['vtp_max'], p['t_r1']) - p['t_r1']"
      in_min: "min(trough(w['sin'], 0, p['t_end']), trough(w['min'], 0, p['t_end']))"
      in_max: "max(peak(w['sin'], 0, p['t_end']), peak(w['min'], 0, p['t_end']))"
    asserts: &pair_asserts
      - expr: "min['mosi_margin'] > 0"
        why: "spi-pair-crosstalk, the owner's fix (2026-09-30): a static MOSI at U-RX-MOD's input stays on its own side of the Schmitt band - under the lowest V_T+ held low, over the highest V_T- held high - at every common-mode impedance swept and every corner, through every SCLK edge"
      - expr: "min['s_rise_trough'] > 0 and max['s_rise_bs'] < p['hyst_min'] and min['s_fall_peak'] > 0 and max['s_fall_bs'] < p['hyst_min']"
        why: "and SCLK makes one edge per edge at the Schmitt input, for any threshold pair in the 74AHCT14's spread (sims.yaml header)"
      - expr: "min['in_min'] > -0.5 and max['in_max'] < 5.5"
        why: "inside the Schmitt input's 0-5.5 V operating range less its -0.5 V clamp [SN74AHCT14.pdf p.4]"
  - name: pair-mosi-high
    deck: pair.cir
    set: {mosi_hi: 1}
    sweep: {z_cm: [70, 100, 140]}
    measures: *pair_meas
    post: *pair_post
    asserts: *pair_asserts
  - name: pair-opposite-mosi-falls
    # MOSI falls as SCLK rises (a mode-1 host launches data on the rising edge): the odd
    # mode, SCLK's worst edge
    deck: pair.cir
    set: {opp: 1, mosi_hi: 1}
    sweep: {z_cm: [70, 100, 140]}
    measures: &opp_meas [s_rise2_trough, s_rise2_bs, m_fall_peak, m_fall_bs]
    post: &opp_post
      s_rise2_trough: "trough(w['sin'], cross(w['sin'], p['vtp_max'], p['t_r2']), p['t_f2']) - p['vtm_max']"
      s_rise2_bs: "backswing(w['sin'], p['vtp_min'], True, p['t_r2'], cross(w['sin'], p['vtp_max'], p['t_r2']))"
      m_fall_peak: "p['vtp_min'] - peak(w['min'], cross(w['min'], p['vtm_min'], p['t_r2']), p['t_end'])"
      m_fall_bs: "backswing(w['min'], p['vtm_max'], False, p['t_r2'], cross(w['min'], p['vtm_min'], p['t_r2']))"
    asserts:
      - expr: "min['s_rise2_trough'] > 0 and max['s_rise2_bs'] < p['hyst_min'] and min['m_fall_peak'] > 0 and max['m_fall_bs'] < p['hyst_min']"
        why: "when MOSI falls as SCLK rises, both make exactly one edge at U-RX-MOD's input, for any threshold pair in its spread"
  - name: pair-opposite-mosi-rises
    deck: pair.cir
    set: {opp: 1, mosi_hi: 0}
    sweep: {z_cm: [70, 100, 140]}
    measures: [s_rise2_trough, s_rise2_bs, m_rise_trough, m_rise_bs]
    post:
      s_rise2_trough: "trough(w['sin'], cross(w['sin'], p['vtp_max'], p['t_r2']), p['t_f2']) - p['vtm_max']"
      s_rise2_bs: "backswing(w['sin'], p['vtp_min'], True, p['t_r2'], cross(w['sin'], p['vtp_max'], p['t_r2']))"
      m_rise_trough: "trough(w['min'], cross(w['min'], p['vtp_max'], p['t_r2']), p['t_end']) - p['vtm_max']"
      m_rise_bs: "backswing(w['min'], p['vtp_min'], True, p['t_r2'], cross(w['min'], p['vtp_max'], p['t_r2']))"
    asserts:
      - expr: "min['s_rise2_trough'] > 0 and max['s_rise2_bs'] < p['hyst_min'] and min['m_rise_trough'] > 0 and max['m_rise_bs'] < p['hyst_min']"
        why: "and when both rise together, likewise"
  - name: pair-without-rc
    # A WHAT-IF, not the netlist: U-RX-MOD's input straight on the cable node, no R-RX-MOD
    # or C-RX-MOD. Recorded, not asserted: why the RC is there. The crosstalk on a static
    # MOSI held low reaches past the 74AHCT14's lowest V_T+ at every z_cm swept, and held
    # high dips past its highest V_T- at the top of the range - hysteresis alone does not
    # close it
    deck: pair.cir
    set: {no_rc: 1}
    sweep: {z_cm: [70, 140], mosi_hi: [0, 1]}
    measures: [mosi_margin, mosi_in_peak]
    post: *pair_post
