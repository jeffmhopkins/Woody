# The SPI link over the umbilical: SCLK, MOSI and CS_MOD from the ESP32-S3's pads,
# through R-SPI-SER and U-TVS-SPI at J-UMB, down 2 m of Cat5e, into the module's
# 74AHCT125 and its pulls. Values from both netlists the link runs through: the
# carrier's (R-SPI-SER-*, R-CS-PULL-INST) and the module's buffer page
# (R-PULL-SCLK, R-PULL-MOSI, R-PULL-CS). The cable is Belden 1752A, a stranded 24 AWG
# Cat5e patch cable, banked (fragment R38). Run:
#   python3 tools/sim.py run hardware/interfaces/spi-link/sim
#
# THE CABLE IS TWO DIFFERENT LINES, and the page models only one of them.
#  - CS_MOD shares pair 7/8 with DIG_GND, its own return: a single 100-ohm line, the
#    pair's differential impedance [ds]. That is the page's model, and it holds.
#  - SCLK and MOSI share pair 4/5 with EACH OTHER, and their return is on other pairs
#    (DIG_GND, PWR_GND). They are two COUPLED lines over that return: the odd mode is
#    half the pair's differential impedance [ds]; the even mode (both conductors
#    together against the return, twice the pair's common-mode impedance) is in no
#    datasheet and is SWEPT over a stated range (z_cm). ngspice's CPL line carries both.
title: SPI link - SCLK, MOSI and CS_MOD over the umbilical
values:
  netlist:
    - hardware/carrier/netlist.yaml
    - hardware/module/digital-and-supervision/netlist.yaml

params:
  vdd:     {value: 3.3, source: "the ESP32-S3's IO supply, the Matrix's 3V3 [datasheets/logic/ESP32-S3-datasheet-v2.2.pdf p.65]"}
  v5:      {value: 5.0, source: "LOGIC_5V, U-REG-LOGIC's rail (the top of R-PULL-CS) [module/power-entry]"}
  r_drv:   {value: 35.0, source: "the ESP32-S3's GPIO at its default 20 mA setting (IO34-36 are not GPIO17-20: the pin table's note 5, p.17); 17 ohm at PAD_DRIVER 3 [calc: (3.3 - 2.64) V / 40 mA and 0.495 V / 28 mA, p.65]. Espressif publishes no IBIS (vary). The same model as key-chain-loom/sim"}
  tr_drv:  {value: 3.0e-9, source: "the GPIO's own edge, unpublished; 1-3 ns swept (vary) [UNVERIFIED], as key-chain-loom/sim"}
  c_tvs:   {value: 30.0e-12, source: "U-TVS-SPI (SP0504BAHT) capacitance per channel, typical at 2.5 V, 1 MHz [datasheets/discrete-and-power/SP0504BAHT.pdf p.2]; only a typical is given (vary)"}
  c_inst:  {value: 5.0e-12, source: "the main board's trace from R-SPI-SER to J-UMB and the adapter's to the etherCON [assumption: a few cm over the layer-2 plane]"}
  c_rx:    {value: 4.0e-12, source: "the 74AHCT125's input capacitance Ci, 4 pF typical, 10 pF max [datasheets/logic/SN74AHCT125.pdf p.4] (vary)"}
  c_mod:   {value: 5.0e-12, source: "the module board's trace from its etherCON to U-LVL-MOD [assumption]"}
  len:     {value: 2.0, source: "the umbilical, 2 m (ADR 0004; CABLE-UMB row)"}
  z_diff:  {value: 100.0, source: "Belden 1752A input impedance 100 +/- 12 ohm, 1-20 MHz [datasheets/connectors/BELDEN-1752A-CAT5E-PATCH-24AWG-STRANDED.pdf p.1] (vary)"}
  nvp:     {value: 0.70, source: "Belden 1752A nominal velocity of propagation 70 % [same]; max delay 537.6 ns/100 m is 0.62 c"}
  r_per_m: {value: 0.09, source: "Belden 1752A max conductor DCR, 90 ohm/km at 24 AWG [same]. CABLE-UMB's gauge is open (26-28 AWG is 1.6-2.6x): immaterial here, 0.5 ohm against 100"}
  z_cm:    {value: 100.0, source: "pair 4/5's common-mode impedance against the other pairs (its two conductors together, returning on DIG_GND and PWR_GND). IN NO DATASHEET: estimated 70-140 ohm [calc: a two-wire line of the pair's equivalent radius, sqrt(0.25 x 0.9) = 0.47 mm, against one 0.25 mm return 1.8 mm away in epsilon_r = 1/0.70^2, is (60/1.43) ln(1.8^2/(0.47 x 0.25)) = 139 ohm, and lower with more returns in parallel]; swept 70, 100 and 140"}
  f_clk:   {value: 2.0e6, source: "SPI2's clock for the DAC, 2 MHz (spi-link.md, 'The two SPI hosts'; latency-budget.md)"}
  mosi_hi: {value: 0, source: "MOSI's level while SCLK toggles: 0 low, 1 high (each sim sets it)"}
  opp:     {value: 0, source: "1: MOSI changes on SCLK's rising edge, the other way (the DAC clocks data in on SCLK falling [ds DAC8568CIPW.pdf p.6], so a mode-1 host launches it on the rising edge)"}
  t_end:   {value: 1.1e-6}
  tvs_pad: {value: 0, source: "0: U-TVS-SPI at J-UMB, on the line side of R-SPI-SER, as netlisted; 1: a WHAT-IF, the same part on the pad side of R-SPI-SER"}
  c_rx_extra: {value: 1.0e-15, source: "a WHAT-IF capacitor at each module receiver input (none is netlisted)"}
  vil:     {value: 0.8, source: "74AHCT125 V_IL max [SN74AHCT125.pdf p.3]"}
  vih:     {value: 2.0, source: "74AHCT125 V_IH min [same]"}

derived:
  c_tvs_line: "1e-15 if v['tvs_pad'] else v['c_tvs']"
  c_tvs_pad: "v['c_tvs'] if v['tvs_pad'] else 1e-15"
  v_c: "299792458.0 * v['nvp']"
  z_o: "v['z_diff'] / 2"
  z_e: "2 * v['z_cm']"
  # coupled-line matrices from the two modes, for a homogeneous line [calc]:
  # Ls +- Lm = Z_e,o / v; Cs -+ Cm = 1 / (Z_e,o v)
  l_s: "(v['z_e'] + v['z_o']) / v['v_c'] / 2"
  l_m: "(v['z_e'] - v['z_o']) / v['v_c'] / 2"
  c_s: "(1/(v['z_e']*v['v_c']) + 1/(v['z_o']*v['v_c'])) / 2"
  c_m: "-(1/(v['z_o']*v['v_c']) - 1/(v['z_e']*v['v_c'])) / 2"
  # CS against DIG_GND in its own pair: one line of the pair's differential impedance
  l_1: "v['z_diff'] / v['v_c']"
  c_1: "1 / (v['z_diff'] * v['v_c'])"
  t_half: "0.5 / v['f_clk']"
  t_r1: "50e-9"
  t_f1: "50e-9 + 0.5 / v['f_clk']"
  t_r2: "50e-9 + 1.0 / v['f_clk']"
  t_f2: "50e-9 + 1.5 / v['f_clk']"
  t_per: "1.0 / v['f_clk']"
  t_hi: "0.5 / v['f_clk'] - v['tr_drv']"
  t_r2_e: "v['t_r2'] + v['tr_drv']"
  t_fall_e: "50e-9 + v['tr_drv']"
  t_rise_e: "600e-9 + v['tr_drv']"
  mosi0: "v['vdd'] * v['mosi_hi']"
  mosi1: "v['vdd'] * (1 - v['mosi_hi']) if v['opp'] else v['vdd'] * v['mosi_hi']"

vary:
  r_drv:  {tol: [-0.5, 0.0]}
  tr_drv: {tol: [-0.67, 0.0]}
  c_tvs:  {tol: [-0.33, 0.33]}
  c_rx:   {tol: [0.0, 1.5]}
  z_diff: {tol: [-0.12, 0.12]}

sims:
  - name: cs-edges
    # CS_MOD falls (a frame starts) and rises (it ends), as netlisted. One 100-ohm line:
    # the page's model
    deck: cs.cir
    measures: [fall_dwell, fall_back, rise_dwell, rise_back, v_max, v_min, step_first]
    post: &cs_post
      fall_dwell: "cross(w['rx'], p['vil'], 40e-9) - cross(w['rx'], p['vih'], 40e-9)"
      fall_back: "peak(w['rx'], cross(w['rx'], p['vil'], 40e-9), 540e-9) - p['vil']"
      rise_dwell: "cross(w['rx'], p['vih'], 590e-9) - cross(w['rx'], p['vil'], 590e-9)"
      rise_back: "p['vih'] - trough(w['rx'], cross(w['rx'], p['vih'], 590e-9), p['t_end'])"
      v_max: "peak(w['rx'], 0, p['t_end'])"
      v_min: "trough(w['rx'], 0, p['t_end'])"
      step_first: "at(w['rx'], cross(w['rx'], p['vil'], 590e-9) + 3e-9)"
    asserts:
      - expr: "max['fall_back'] > 0.3"
        why: "RECORDED HAZARD, not a requirement: CS_MOD's FALLING edge comes back up through V_IL after crossing it. Two causes, both in the netlist: R-SPI-SER plus the pad is more than the line's impedance, so the first step lands only just under V_IL (3.3 V x (135 - 100)/(135 + 100) = 0.49 V [calc]); and U-TVS-SPI's 30 pF on the LINE side of R-SPI-SER sends the returning wave back inverted. The page's first step is the rising edge's; the falling edge is the tight one, against 0.8 V. If this starts failing the hazard is gone - re-read spi-link.md"
      - expr: "max['fall_dwell'] < 24e-9 and max['rise_dwell'] < 24e-9"
        why: "each edge still crosses the band faster than the 74AHCT125's input transition limit, 20 ns/V x 1.2 V [SN74AHCT125.pdf p.3, recommended operating conditions]"
      - expr: "max['v_max'] < 5.5"
        why: "no overshoot past the buffer's 5.5 V rail"
  - name: cs-edges-fix
    # A WHAT-IF, not the netlist: U-TVS-SPI moved to the pad side of R-SPI-SER, and
    # R-SPI-SER-CS at 82 ohm (3.3 V / (82 + 17) = 33 mA into a short at PAD_DRIVER 3,
    # under the pad's 40 mA [calc])
    deck: cs.cir
    set: {tvs_pad: 1, R-SPI-SER-CS: 82}
    measures: [fall_dwell, fall_back, rise_dwell, rise_back, v_max, v_min, step_first]
    post: *cs_post
    asserts:
      - expr: "max['fall_back'] < 0 and max['rise_back'] < 0"
        why: "with the change CS_MOD never re-enters the band once through it, at any corner"
      - expr: "min['v_min'] > -0.5 and max['v_max'] < 5.5"
        why: "and stays inside the input's -0.5 V clamp and its rail"
  - name: pair-mosi-low
    # SCLK toggles at 2 MHz; MOSI is held low by its own driver through its R-SPI-SER.
    # What reaches MOSI's receiver at SCLK's edges - including the falling edge, on which
    # the DAC clocks DIN in [ds DAC8568CIPW.pdf p.6]
    deck: pair.cir
    set: {mosi_hi: 0}
    sweep: {z_cm: [70, 100, 140]}
    measures: &pair_meas [mosi_margin, mosi_peak, mosi_trough, sclk_rise_back, sclk_fall_back, sclk_rise_dwell, sclk_fall_dwell]
    post: &pair_post
      mosi_margin: "(p['vil'] - peak(w['mrx'], 40e-9, p['t_end'])) if p['mosi_hi'] < 0.5 else (trough(w['mrx'], 40e-9, p['t_end']) - p['vih'])"
      mosi_peak: "peak(w['mrx'], 40e-9, p['t_end'])"
      mosi_trough: "trough(w['mrx'], 40e-9, p['t_end'])"
      sclk_rise_back: "p['vih'] - trough(w['srx'], cross(w['srx'], p['vih'], p['t_r1']), p['t_f1'])"
      sclk_fall_back: "peak(w['srx'], cross(w['srx'], p['vil'], p['t_f1']), p['t_r2']) - p['vil']"
      sclk_rise_dwell: "cross(w['srx'], p['vih'], p['t_r1']) - cross(w['srx'], p['vil'], p['t_r1'])"
      sclk_fall_dwell: "cross(w['srx'], p['vil'], p['t_f1']) - cross(w['srx'], p['vih'], p['t_f1'])"
    asserts:
      - expr: "min['mosi_margin'] < 0"
        why: "RECORDED HAZARD, not a requirement: at every common-mode impedance swept, SCLK's edges couple across the pair into a LOW MOSI far enough to cross the 74AHCT125's V_IL at the worst corner, for about one cable round trip - including on SCLK's FALLING edge, the one the DAC clocks DIN in on. ADR 0004's 'lands at the moment nobody is looking' is not what the run shows. If this starts failing the hazard is gone - re-read spi-link.md"
  - name: pair-mosi-high
    # the same with MOSI held high: it crosses V_IH from z_cm = 100 up (recorded)
    deck: pair.cir
    set: {mosi_hi: 1}
    sweep: {z_cm: [70, 100, 140]}
    measures: *pair_meas
    post: *pair_post
  - name: pair-opposite-mosi-falls
    # MOSI falls as SCLK rises (a mode-1 host launches data on the rising edge): the odd
    # mode, SCLK's worst edge
    deck: pair.cir
    set: {opp: 1, mosi_hi: 1}
    sweep: {z_cm: [70, 100, 140]}
    measures: &opp_meas [sclk_rise2_back, sclk_rise2_dwell]
    post: &opp_post
      sclk_rise2_back: "p['vih'] - trough(w['srx'], cross(w['srx'], p['vih'], p['t_r2']), p['t_f2'])"
      sclk_rise2_dwell: "cross(w['srx'], p['vih'], p['t_r2']) - cross(w['srx'], p['vil'], p['t_r2'])"
    asserts:
      - expr: "max['sclk_rise2_back'] > 0.3"
        why: "RECORDED HAZARD, not a requirement: when MOSI falls as SCLK rises, SCLK's edge at the module climbs in round-trip steps (the odd mode, 50 ohm, behind 135 ohm of source) and at the worst corner swings back under V_IH by 0.4-0.5 V after reaching it - a runt that a buffer with no hysteresis can pass on as an extra SCLK edge. If this starts failing the hazard is gone"
  - name: pair-opposite-mosi-rises
    deck: pair.cir
    set: {opp: 1, mosi_hi: 0}
    sweep: {z_cm: [70, 100, 140]}
    measures: *opp_meas
    post: *opp_post
  - name: pair-fix
    # A WHAT-IF, not the netlist: cs-edges-fix's change on SCLK and MOSI too (U-TVS-SPI on
    # the pad side, R-SPI-SER at 82 ohm), and 68 pF at each receiver input. Recorded, not
    # asserted: it narrows MOSI's crossing and does not close it at the top of the range
    deck: pair.cir
    set: {tvs_pad: 1, R-SPI-SER-SCLK: 82, R-SPI-SER-MOSI: 82, c_rx_extra: 68.0e-12}
    sweep: {z_cm: [70, 140], mosi_hi: [0, 1]}
    measures: *pair_meas
    post: *pair_post
